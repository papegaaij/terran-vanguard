# The expected purchases of a typical medium player at each hangar visit, for Acts 1-3 (Act 3, Levels
# 15-21, from M7 part A: the Ion Beam's hand plan; a level without data yet earns budget(n), the absolute
# typical haul, user decision 2026-10-14).
# Read by the content tests BalanceTest (affordability, power load and DPS per visit) and
# ActPlaythroughTest (Acts 1-2 flown with these purchases on every difficulty), and printed by
# tools/balance.py as the balancing sheet; not a rule, and not read by the game. Every other number
# comes from the parts' data.yaml files. The free charges a special gives at its unlock (the
# Airstrike's first, at L04) come on top of the charges bought here.
#
# Key = the level that follows the visit. Actions:
#   start: the starting loadout (front weapon and level; core = index into the part's model list)
#   buy: [slot, weapon]   upgrade: [slot, level]   sell: [slot]   core: [kind, index into its list]
#   sell_owned: [slot, weapon]   sells an owned, unfitted weapon of the slot's kind after the visit's
#   buys (M7 part A: the front gun is never unfitted, so a replaced one is sold from the inventory)
#   (slot escort: Rook's gun by its id in wingmen/data.yaml, from Level 08 on)
#   utility: [module, level]   charges: [special, count]
#   fit: [slot, item]   fits an owned item again in place of the fitted one, which is kept (M5 part D);
#   (slot special: a special by name, M7 part A: the charges of the one it replaces stay owned)
# An optional `difficulties: {hard: {"NN": {...}}}` adds purchases to a visit on another
# difficulty (ActPlaythroughTest); none are needed today: Acts 1-2 are flown on every difficulty with
# the medium plan (M5 part I; on easy a charge the plan buys while the special carries its most is skipped).
# Hard (BalanceTest prints the sheet on hard too: income × 0.9, repairs 10 cr a point): where the
# credits after the plan's purchases do not pay the repairs, the shortfall is accepted, hard is meant
# to be tighter: a typical player there takes less damage or skips some repairs (user decision
# 2026-10-05, ../systems/economy/README.md); with the typical grade bonus (round 34, P3 = A) there is
# none in Acts 1-2 today.
difficulty: medium        # repair costs come from ../systems/difficulty/data.yaml
repair_points_per_level: 15
# Round 34, P3 = A (user, 2026-10-12; ../systems/economy/README.md): the sheet's typical player also
# earns a grade bonus (a B: +10 % of the level's credits; ../systems/scoring) and pays Rook's repairs,
# an estimate of his armour points lost per level flown with him (from Level 08, repaired at the next
# visit, after the ship's, at the difficulty's cost per point).
typical_grade_bonus: 0.1
escort_repair_points_per_level: 10
# The expert's bound (ActPlaythroughTest): the test autopilot collects about 0.9 of a perfect run and
# earns A / A+ grades (+25 %); its credits at each act's end lie within ±15 % of starting credits +
# Σ round(perfect × income × collection) × (1 + grade_bonus) − its purchases − its repairs.
expert: {collection: 0.9, grade_bonus: 0.25, tolerance: 0.15}
plan:
  "01":
    start: {front: [pulse-cannon, 1], generator: 0, shield: 0, armor: 0, engine: 0}
    upgrade: [[front, 2]]
  "02": {buy: [[wing_l, autocannon-pod]]}
  "03": {buy: [[wing_r, autocannon-pod]]}
  "04": {charges: [[Airstrike, 1]]}
  "05": {core: [[shield, 1]]}
  "06": {upgrade: [[front, 3]]}
  "07": {core: [[armor, 1]]}
  "08": {core: [[generator, 1]]}
  "09": {sell: [wing_l], buy: [[wing_l, bomb-rack], [escort, mortar]]}   # anti-ground for the hardened Hive Nodes (D8 = c of M5 part C)
  "10": {buy: [[rear, tail-gun]], fit: [[escort, autocannon]]}   # the Tail Gun moved from L09 (D8 = c of M5 part C) for the Wraiths (rear check, D7 = a of M5 part D); Rook's owned Autocannon again (the Mortar has nothing to hit in L10); the wing upgrades and L10's Airstrike charge moved later
  "11": {upgrade: [[front, 4]], fit: [[escort, mortar]]}   # M5 part E (stated default): Rook's owned Mortar again, for the rafts and the surfaced Kraken; no Torpedo Pod, it stays optional
  "12": {sell: [wing_l, wing_r], buy: [[wing_l, micro-missile-pod], [wing_r, micro-missile-pod]], charges: [[Airstrike, 1]], fit: [[escort, autocannon]]}  # M5 part F (stated default): Rook's owned Autocannon again (the Mortar from L11 has no ground target in L12); BalanceTest checks the rear gun against a latched Lamprey, Level12Test the drain on the autopilot
  "13": {core: [[armor, 2]], upgrade: [[wing_l, 2], [wing_r, 2]]}  # unchanged for M5 part G (pending the user's review): Rook keeps his Autocannon (the Skimmers and Scuttlers fall to standard shots); BalanceTest gets the Skimmer's time to kill and the relay outcome on the autopilot
  "14": {upgrade: [[rear, 2]], charges: [[Airstrike, 1]]}  # unchanged for M5 part H (pending the user's review): rear L2 for the Wraiths, one Airstrike, Rook's Autocannon; the measured Siege Spire fight re-checks the fit (BalanceTest: the boss share of the budget ≈ 30 %); with the free charge at L04 it carries its most, 4
  # Act 3 (M7 part A, re-planned in M7 part B for the user's decision of 2026-10-14: budget(n) is the
  # absolute typical haul, round 37 R.1's act-factor income reverted; Level 15's own data earns 1 800, the
  # levels after it budget(n), about 2 000 → 3 000 a visit with the B bonus). The Ion Beam's hand plan in
  # its order (design/player/weapons/ion-beam, Price and power), each item as soon as it is affordable:
  # one EMP charge, the Mk III generator, the beam at L2 (the Pulse Cannon sold), the beam at L3, the
  # Tail Gun L3, Composite III; at most 14 of 14 MW. Forward DPS 77 · 77 · 77 · 80 · 100 · 100 · 100
  # against the reference 76 → 100. The Airstrike stays fitted, the EMP charges wait in the inventory
  # until a level with machines.
  "15": {charges: [[EMP Burst, 1]], fit: [[special, Airstrike]]}   # one EMP charge on top of the free one; the Airstrike fitted again; the Mk III (4 000) is not yet affordable
  "16": {core: [[generator, 2]]}   # Mk III "Fusion" (14 MW): any beam needs it
  "17": {}                         # saving: the beam at L1 (5 000 less the Pulse Cannon's 1 260) is short, and an L1 beam (65) would be a downgrade from the Pulse L4's 77
  "18": {buy: [[front, ion-beam]], sell_owned: [[front, pulse-cannon]], upgrade: [[front, 2]]}   # the beam bought at L2 (6 250); the Pulse Cannon L4 it replaced sold: 12.5 of 14 MW
  "19": {upgrade: [[front, 3]]}    # beam L3 (2 500): 13.5 of 14 MW (M11)
  "20": {upgrade: [[rear, 3]]}     # Tail Gun L3 (600): 14 of 14 MW
  "21": {core: [[armor, 3]]}       # Composite III (3 000)
