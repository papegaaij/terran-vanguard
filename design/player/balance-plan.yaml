# The expected purchases of a typical medium player at each hangar visit, for Acts 1-4 (Act 3, Levels
# 15-21, from M7 part A: the Ion Beam's hand plan; every level earns its own typical haul, M7 part I: the
# budget(n) fallback for a level without data is gone; M8 part A: Act 4, Levels 22-28, from the generator's
# hand plan of round 48, with a TEMPORARY budget(n) fallback for the Act 4 levels that have no data yet,
# removed again in M8 part I).
# Read by the content tests BalanceTest (affordability, power load and DPS per visit) and
# ActPlaythroughTest (Acts 1-3 flown with these purchases on every difficulty), and printed by
# tools/balance.py as the balancing sheet; not a rule, and not read by the game. Every other number
# comes from the parts' data.yaml files. The free charges a special gives at its unlock (the
# Airstrike's first, at L04) come on top of the charges bought here.
#
# Key = the level that follows the visit. Actions:
#   start: the starting loadout (front weapon and level; core = index into the part's model list)
#   buy: [slot, weapon]   upgrade: [slot, level]   sell: [slot]   core: [kind, index into its list]
#   sell_owned: [slot, weapon]   sells an owned, unfitted weapon of the slot's kind after the visit's
#   buys (M7 part A: the front gun is never unfitted, so a replaced one is sold from the inventory)
#   (slot escort: Rook's gun by its id in wingmen/data.yaml, from Level 08 on)
#   utility: [module, level]   charges: [special, count]
#   fit: [slot, item]   fits an owned item again in place of the fitted one, which is kept (M5 part D);
#   (slot special: a special by name, M7 part A: the charges of the one it replaces stay owned)
# An optional `difficulties: {hard: {"NN": {...}}}` adds purchases to a visit on another
# difficulty (ActPlaythroughTest); none are needed today: Acts 1-3 are flown on every difficulty with
# the medium plan (M5 part I; on easy a charge the plan buys while the special carries its most is skipped).
# Hard (BalanceTest prints the sheet on hard too: income × 0.9, repairs 10 cr a point): where the
# credits after the plan's purchases do not pay the repairs, the shortfall is accepted, hard is meant
# to be tighter: a typical player there takes less damage or skips some repairs (user decision
# 2026-10-05, ../systems/economy/README.md); with the typical grade bonus (round 34, P3 = A) there is
# none in Acts 1-2 today.
difficulty: medium        # repair costs come from ../systems/difficulty/data.yaml
repair_points_per_level: 15
# Round 34, P3 = A (user, 2026-10-12; ../systems/economy/README.md): the sheet's typical player also
# earns a grade bonus (a B: +10 % of the level's credits; ../systems/scoring) and pays Rook's repairs,
# an estimate of his armour points lost per level flown with him (from Level 08, repaired at the next
# visit, after the ship's, at the difficulty's cost per point).
typical_grade_bonus: 0.1
escort_repair_points_per_level: 10
# The expert's bound (ActPlaythroughTest): the test autopilot collects about 0.9 of a perfect run and
# earns A / A+ grades (+25 %); its credits at each act's end lie within ±15 % of starting credits +
# Σ round(perfect × income × collection) × (1 + grade_bonus) − its purchases − its repairs. On hard the act's end
# may lie up to hard_under below it (the user, 2026-10-19: hard is tighter on purpose; over-earning stays capped).
expert: {collection: 0.9, grade_bonus: 0.25, tolerance: 0.15, hard_under: 0.25}
# M8 part A (temporary, until the Act 4 levels carry their `medium`, parts B-H): the levels flown under water. The
# sheet counts a weapon without the anti-sub trait (and Rook's guns) at the water's damage factor there
# (../world/europa/data.yaml); Level 22 is the dry ice surface, Level 28 breaks out at its end.
underwater: [23, 24, 25, 26, 27, 28]
