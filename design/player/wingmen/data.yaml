# Wingmen: Rook and the escort slot (README.md). Schema: ../../tech/architecture/README.md#data-file-schemas
rook:
  joins: 8                    # hired when the hangar opens with this level (or a later one) next
  side: left                  # a new campaign's side (hangar setting, saved)
  armour: 80
  size: [42, 42]              # sprite px
  hitbox: [11, 11]
  muzzle: [21, 3]             # his one muzzle at the nose, px from the sprite's top left
  speed: 250                  # px/s
  acceleration_seconds: 0.2
  min_distance: 40            # px from the player's centre
  edge_gap: 12                # px from the play field's edges
  ram_damage: 20              # dealt to an air enemy he collides with
  launch_warning: 0.5         # the hangar warns below this share of his armour
  glide_seconds: 0.6          # to a new formation slot
  swap_seconds: 1.0           # his own slot back inside the field this long before he returns to it
  formations: {wing: [64, 28], wide: [120, 10], trail: [40, 90]}   # [x, y] px, y down, x mirrored on the left
  flank_distance: 160         # px from his centre (plain distance): the Wide formation and target priority 2
  reaction_seconds: 0.25
  dodge: {interval: 0.1, look_ahead: 0.6, clearance: 14, step: 48, reacts: 0.7}   # reacts: share of the predicted bullets he dodges (user decision 2026-10-06)
  cone: 30                    # degrees (full width) ahead in which he fires
  range: 360                  # px
  recent_hit_seconds: 1.0     # target priority 1: an enemy the player damaged this recently
  eject: {explosion: medium, pod_speed: 120}
  missing: {after: 26, back: 30}   # M8 part A (round 48): shot down at L26's end (the save's story flag rook-missing from its win), MIA in the levels between, back from this level
# M8 part A (round 48): the Bulwark heavy drone, the escort slot's alternative to Rook from L22 (README, Heavy drone
# "Bulwark"); the slot holds one Bulwark on loan, free, while Rook is missing and none is owned.
bulwark:
  armour: 120
  size: [36, 36]              # sprite px (round 48, G4 a)
  hitbox: [14, 14]
  speed: 200                  # px/s top speed; the water's drag applies like Rook's
  slot: [56, 20]              # its wing slot, [x beside the player on the escort's side, y behind], px; no formation changes
  gun: {rate: 1, damage: 14, anti_sub: true}   # one shell a second straight ahead, not upgradable; anti-sub: full damage under water
  draw: {radius: 150, share: 0.3}   # while within radius px of the player, this share of the enemy's aimed bullets aimed at the player aim at it
  price: 6000
  available: L22
  repair: 8                   # cr per armour point, every difficulty; a destroyed Bulwark is rebuilt for the next level, a loaner repaired free
guns:
  price_factor: 0.6           # of the base weapon's price and upgrade base
  list:                       # the first is the starter: free, fitted when he joins; notes.scale follows the README's Scale cell
    - {id: autocannon, name: Autocannon, base: autocannon-pod, scale: 1.5, available: act 2}
    - {id: scatter, name: Scatter, base: scatter-vulcan, scale: 0.6, available: act 2, notes: {scale: (volley)}}
    - {id: missiles, name: Missiles, base: micro-missile-pod, scale: 1.5, available: act 2}
    - {id: mortar, name: Mortar, base: hammer-mortar, scale: 0.6, available: act 2, notes: {scale: '(aimed: lands on his ground target)'}}
barks:
  speaker: Rook
  spacing: 8                  # s between the start of a Rook line and the next bark
  triggers:                   # in priority order (first = highest); notes.trigger is the README's Trigger cell
    - trigger: boss-warning
      notes: {trigger: "Boss warning starts (an act boss's warning, a mid-boss's sting)"}
      expression: grim
      lines: ["Here comes the big one.", "Heads up. Something nasty's coming.", "Oh, I don't like the look of that.", "Big contact inbound. Stay loose, Lancer."]
    - trigger: rear-wave
      notes: {trigger: "A `rear` wave enters within {ahead} s"}
      ahead: 1.5              # s before the wave enters
      expression: fierce
      shout: true
      lines: ["Six o'clock, Lancer!", "Contacts on six! Why is it always six?", "Check six, check six!", "Behind us! They're on our tails!"]
      top_lines: ["Up top, Lancer! They're on our tails!", "Up top! Coming down on us!", "Contacts up top! Keep moving!"]   # M7 part G: in a reversed section (Level 20) "behind" is the top of the screen
    - trigger: sides-wave
      notes: {trigger: "A `sides` wave enters"}
      expression: fierce
      shout: true
      lines: ["Contacts on your flank!", "Bandits coming in from the side!", "Flank! Watch the edges, Lancer!"]
    - trigger: player-armour
      notes: {trigger: "The player's armour falls below {below} (again only after it was back at {below} or more)"}
      below: 0.3
      expression: grim
      lines: ["You're smoking, Lancer. Ease off!", "That hull won't take much more, Lancer!", "Lancer, you're coming apart. Get clear!"]
    - trigger: rook-armour
      notes: {trigger: "Rook's armour falls below {below} (once per attempt)"}
      below: 0.3
      expression: grim
      lines: ["Taking a beating over here!", "I'm hit. I'm okay. I'm mostly okay!", "Rook's hurting, Lancer. Hurting bad."]
    - trigger: rook-ejects
      notes: {trigger: "Rook ejects"}
      expression: fierce
      shout: true
      lines: ["Punching out! Give 'em hell!", "I'm out, I'm out! She's all yours, Lancer!", "Ejecting! Somebody owes me a ship."]
    - trigger: kill-streak
      notes: {trigger: "{kills} kills (the player's and his) within {seconds} s; the count starts over"}
      kills: 10
      seconds: 5
      expression: fierce
      lines: ["Nice shooting!", "Ha! Save some for me!", "Now that's how it's done.", "Look at you go, Lancer."]
    - trigger: overdrive
      notes: {trigger: "An overdrive pickup appears"}
      expression: fierce
      lines: ["Power-up! Grab it!", "Ooh, shiny. Grab that.", "Overdrive's up for grabs, Lancer!"]
