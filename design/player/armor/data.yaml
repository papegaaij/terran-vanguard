# Armour plating: rendered into README.md. Schema: ../../tech/architecture/schemas-player/README.md
plating:
  # max armour points, price cr (0 = starter), available
  - {name: Standard, max: 60, price: 0, available: start}
  - {name: Composite I, max: 80, price: 600, available: act 1}
  - {name: Composite II, max: 100, price: 1400, available: act 2}
  - {name: Composite III, max: 120, price: 3000, available: act 3}
  - {name: Composite IV, max: 140, price: 6000, available: act 5}
  - {name: Composite V, max: 160, price: 11000, available: L38}  # M10 part A (round 72, Q7 = b): from the L38 visit, one new item a visit

# The low-armour radio line (design/player/armor, Low-armour warnings): spoken once per attempt, as
# an urgent line, by the first armour hit that leaves the armour at or below 15 % of its maximum.
radio: {speaker: Okafor, expression: grim, line: "Lancer, your hull won't take much more. Fly careful."}
