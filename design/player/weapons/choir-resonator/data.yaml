# Choir Resonator: rendered into README.md (schema: ../../../tech/architecture/schemas-player/README.md). M11 part A.
# A wave front from the nose (hits: wave): an arc `nose` px wide at the nose, widening evenly to its level's
# `front_width` at its level's `reach` (px), flying straight up the screen at `speed` px/s and fading over the last fifth;
# every unit it sweeps is hit once, nearest first, each hull leaving `falloff` x the damage before it, the wave spent at
# its level's `hulls` (a body's parts are one hull; a unit that takes nothing still spends a step). Under water it is a
# gun (the Europa rules' damage x 0.7, not an energy weapon's).
