levels: [29, 35]

title_card:  # over the act's still (ui/act-5-the-belt-still.png, tools/art/act_stills.py act-5 from Level 29's backdrop): Ceres's curve under the belt's sunlit dust band, the hub's crust and docking arms, the dock canyon's mouth with its white lights, a black and gold Helix block among them
  act: ACT V
  name: THE BELT
  line: Ceres · August 2185

briefing:  # two pages by Commander Okafor, two by Chairman Vorne on the enemy channel (approved in round 60), each voiced and with its image (tools/art/briefing_images.py)
  - {speaker: Okafor, expression: grim, image: act-5-all-channels, line: "Ten days out of Europa, and he is on every channel at once: every station in the belt, every ship, every screen on Earth. I said we would hear it together, Aegis. Listen."}
  - {speaker: Vorne, channel: enemy, image: act-5-broadcast, line: "Citizens of the solar system. My name is Silas Vorne. From this hour the Jovian Ascendancy governs itself, and it does not stand alone: the Vrell are our partners. The old order is ending. I merely opened the door."}
  - {speaker: Vorne, channel: enemy, image: act-5-stations-choose, line: "No Ascendancy city has been touched. Ask yourselves why — then ask who you would rather stand beside. To the stations of the belt: choose the side that will still be here."}
  - {speaker: Okafor, expression: fierce, image: act-5-burn-for-ceres, line: "He did not ask Earth. He asked the belt, and if the stations choose him, every ship we have is cut off from Jupiter. We burn for Ceres, and we keep listening for Rook. Mission briefing follows. Aegis Actual out."}
