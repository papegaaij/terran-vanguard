backdrop:
  # Presentation only: Level 32's tunnels (tools/art/backdrop_l32.py, step ART-E, from the README and ART-E's terrain proposal (no data.yaml yet: re-run after E2)).
  # No deep layer (the ground is opaque; the walls' rims project beyond the field's edges). The walls and the
  # islands are the terrain's (WallProjection's ice path, CanyonProfile's convention): ice-wall (cut rock
  # with the lamp strings), ice-wall-glow (the lamps and the red running lights, additive), ice-wall-foot,
  # drift-rock-face/-top_0..2 and duct-rock-face/-top_0..2 (the islands' looks). A piece's -glow is added
  # over it at its placement. gallery-<side>-<depth> are drawn by the game at the terrain's notches (E4).
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}   # far unused, given as the loader asks
  ramp: 2
  haze_colour: 120e0a  # the refinery's smoke
  atmosphere:
    clear: {haze: 0.0}
  tile_sets:
    tunnel-floor: {layer: ground, height: 960}   # sections 1-2: cut rock, dust, old track grooves, a cable run
    fork-drift-seam: {layer: ground, height: 960}   # section 3: the old drift left (cold, rails, bore holes), the charge seam right (fresh cuts)
    pumping-hall: {layer: ground, height: 960}   # section 4: the hall's plates, pipe runs, drains
    fork-ducts-chute: {layer: ground, height: 960}   # section 5: the cooling ducts left, the ore chute's conveyors right
    furnace-floor: {layer: ground, height: 960}   # section 6: cast plates, the slag channel, the furnaces' orange light
  pieces:
    shaft-mouth: {layer: ground, size: [480, 2040]}
    shaft-mouth-glow: {layer: ground, size: [480, 2040]}
    seam-fork-drift-seam: {layer: ground, size: [480, 320]}
    seam-pumping-hall: {layer: ground, size: [480, 320]}
    seam-fork-ducts-chute: {layer: ground, size: [480, 320]}
    seam-furnace-floor: {layer: ground, size: [480, 320]}
    seam-mouth: {layer: ground, size: [160, 128]}
    seam-mouth-glow: {layer: ground, size: [160, 128]}
    drift-mouth: {layer: ground, size: [160, 128]}
    drift-mouth-glow: {layer: ground, size: [160, 128]}
    ducts-mouth: {layer: ground, size: [160, 128]}
    ducts-mouth-glow: {layer: ground, size: [160, 128]}
    conveyor-mouth: {layer: ground, size: [160, 128]}
    conveyor-mouth-glow: {layer: ground, size: [160, 128]}
    pump: {layer: ground, size: [112, 112]}
    pump-glow: {layer: ground, size: [112, 112]}
