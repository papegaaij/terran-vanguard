    crate: 100   # Act 1 terms: pays 655 with the act factor
    radio: {speaker: Varga, line: "A sealed store room. Consortium stamps. They never found it."}

pickups:
  - {pickup: shield cell, dropped_by: {wave: 36, enemy: strider, unit: last}}     # the second Strider of the first pair
  - {pickup: overdrive, dropped_by: {wave: 145.5, enemy: needler, unit: last}}   # the last Needler of the column before the crucible (a ground unit drops only as a group's: step E2)

vents:  # the refinery's furnace grates (Level 19's rules unchanged): a 1.2 s glow tell, a 44 px flame column for 1.0 s, heavy to the ship and Rook, rows rippling 0.4 s a grate, every 3.5 s
  width: 44
  tell: 1.2
  burn: 1.0
  period: 3.5
  ripple: 0.4
  bullet: heavy
  easy: {tell: 1.6, period: 5}
  hard: {tell: 0.9, period: 3, ripple: 0.3}
  rows:
    - {t: 141, xs: [110, 180, 300, 370]}   # the first row, alone: no wave reaches it
    - {t: 149, xs: [370, 300, 180, 110]}
    - {t: 157, xs: [140, 240, 340]}
    - {t: 165, xs: [110, 370]}             # either side of the gantry
    - {t: 173, xs: [340, 240, 140]}

radio:  # trigger: t or event; every line one radio page (three 22-character lines: 5 s); requires: escort = only while Rook flies
  - {t: 1, speaker: Okafor, line: "Kleopatra. The shaft runs straight to the refinery."}
  - {t: 9, speaker: Rook, requires: escort, line: "Tunnels again. I'll tuck in behind. You pick the turns."}
  - {t: 24.5, speaker: Varga, line: "Sentinel tower. It sweeps all round. Hit the emitter."}
  - {t: 36.5, speaker: Varga, line: "Striders. Shoot a leg and it falls on its neighbours."}
  - {event: topple-crush, speaker: Rook, requires: escort, line: "It fell on its own guns. I'll take that.", notes: {trigger: "First topple crush (`topple-crush`)"}}
  - {t: 48, speaker: Okafor, line: "Fork ahead. Left is quiet. Right has guns and a cache."}
  - {event: branch, fork: 1, side: right, speaker: Okafor, line: "The seam it is. Watch the charges.", notes: {trigger: "Fork one, the right channel taken (`branch`)"}}
  - {event: branch, fork: 1, side: left, speaker: Okafor, line: "The old drift. Quiet suits me.", notes: {trigger: "Fork one, the left channel taken (`branch`)"}}
  - {t: 75, speaker: Varga, line: "The pumping hall. Two towers, one each side."}
  - {t: 108, speaker: Okafor, line: "Second fork. The ducts left are guarded; the chute is clear."}
  - {t: 133, speaker: Okafor, line: "The refinery. It feeds the Sovereign. Burn through it."}
  - {t: 140.5, speaker: Varga, line: "Vents in the floor. Watch the grates glow, then go."}
  - {t: 162, speaker: Rook, requires: escort, line: "Hot in here. I mean that literally."}   # step E3: from t=158 (the secondary-met line after the crucible tower holds the radio ~6.8 s; RadioTimelineLevel32Test)
  - {t: 175, speaker: Okafor, line: "The ore chute. Out the way the rock goes, Lancer."}
  - {event: secondary-objective, speaker: Okafor, line: "Every tower down. That rock is blind now.", notes: {trigger: "Secondary met (the fourth tower down)"}}

objectives:
  primary: reach-end
  secondary: {kill_all: [sentinel-tower], label: TOWERS DOWN, credits: 100, name: Every tower down}   # all four Sentinel Towers (none stands in a fork's channel, so every route has the same four); 100 in Act 1 terms: pays 655

music:
  track: 12           # Act 5 A "Hollow Rock" (audio/music track list)
  start_section: 2    # section 1 the theme's intro reading (the static, the motif in cold brass) over the shaft mouth, as Levels 25, 27 and 29; the base stem through the galleries and the hall
  full_section: 6     # the full mix in the refinery (from t=136 the stem_times' last change says so too)
  stem_times:         # the conveyor stem (round 65 M.1) alone at the forks, 16 s from each choice, in and out over 2 s; then the base stem again, the full mix at the refinery
    - {t: 56, stems: conveyor, fade: 2}    # fork one's choice (the island's tip at the ship's row)
    - {t: 72, stems: base, fade: 2}
    - {t: 116, stems: conveyor, fade: 2}   # fork two's choice
    - {t: 132, stems: base, fade: 2}
    - {t: 136, stems: full, fade: 2}       # section 6, the refinery (a timed base would hold over full_section)
  motif: {from: 18, sections: {}}   # Vorne's motif "in the open" (music, Cues per level (Act 5): on): track 12's motif stem on top from the base stem's start (section 2, t=18) to the end
  ambience: belt-tunnel   # the tunnel bed (round 60 S.19 a)
  ambience_layers:
    - {ambience: mars-foundry, from: 136, to: 180, fade_in: 3, fade_out: 3}   # the refinery's furnace roar under section 6 (Level 19's), faded out at the chute's mouth
  end_jingle: mission-complete

difficulty: {}  # the stat blocks' hooks apply (the Sentinel's easy 100° arcs without the full turn every 5.5 s, hard 160° and every second sweep a full turn every 3.6 s; the Strider's easy fan every 3.0 s and single missiles every 6 s, hard a fan of 5 every 2.0 s and salvos of 3; the SAM Nest's easy 6 s at 65°/s, hard salvos of 3; the Talon's, the Dart's, the Needler's); the vents' easy and hard; the wall contact's easy 6 in terrain.contact; the formation lever sizes the popcorn

briefing:
  pages:
    - {speaker: Okafor, image: level-32-deep-core, line: "Kleopatra. The consortium's old mine, now the Ascendancy's refinery, and it feeds the Sovereign at Ceres. The Bellwether's crew gave us the shaft charts. Go in, burn through, come out the ore chute."}
    - {speaker: Varga, image: level-32-sentinel-sweep, line: "Rock overhead: no bombers, no Lance. The towers sweep all the way round; shoot the emitter or bomb the collar. A Strider falls when it loses a leg, on whatever stands beside it."}
  teaser: {speaker: Rook, line: "Tunnels again. I'll tuck in behind. You pick the turns."}

backdrop:
  # Presentation only: Level 32's tunnels (tools/art/backdrop_l32.py, step ART-E, adopted by step E2 from its proposal).
  # No deep layer (the ground is opaque; the walls' rims project beyond the field's edges). The walls and the
  # islands are the terrain's (WallProjection's ice path, CanyonProfile's convention): ice-wall (cut rock
  # with the lamp strings), ice-wall-glow (the lamps and the red running lights, additive), ice-wall-foot,
  # drift-rock-face/-top_0..2 and duct-rock-face/-top_0..2 (the islands' looks). A piece's -glow is added
  # over it at its placement. gallery-<side>-<depth> are drawn by the game at the terrain's notches (E4).
