    - {side: left, scroll: 10310, width: 140, depth: 16}   # 3: the hall Sentinel (t=79, x 54)
    - {side: right, scroll: 10531, width: 140, depth: 16}  # 4: the hall Sentinel (t=80.7, x 426)
    - {side: left, scroll: 19410, width: 140, depth: 26}   # 5: the crucible Sentinel (t=150, x 54)
  contact: {damage: {easy: 6, medium: 10, hard: 10}, push: 28, push_seconds: 0.12, cooldown: 0.5}   # Level 16's: 10 per touch (easy 6), a 28 px push, 0.5 s
  notes:   # the README's wall table, by row
    before: Open space before the shaft
    rows:
      520: 'The shaft''s lip: the walls begin at the field''s edges'
      1820: 'The galleries, 340 px; a launch bay left (t≈14.5), the Sentinel''s notch right (t≈24), a bay right (t≈41)'
      6240: Widening to fork one
      6838: 'Island one''s tip (the choice at t≈56): the old drift left, the charge seam right'
      9230: Rejoined
      9620: 'The pumping hall, 420 px; the Sentinel pair''s notches (t≈79, 81), the secret''s door (t≈100)'
      14300: Widening to fork two
      14638: 'Island two''s tip (the choice at t≈116): the cooling ducts left, the ore chute right'
      17225: 'Rejoined; the refinery''s gate'
      17680: 'The refinery, 400 px; the crucible gallery''s notch left (t≈150)'
      22480: 'The ore chute''s mouth: out into space'

