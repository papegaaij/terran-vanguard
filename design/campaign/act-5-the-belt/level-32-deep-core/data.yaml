    - name: fork one   # tip row 6838 (reaches the ship's row at t≈56, the bottom edge at t=56.75); channels 10–165 and 315–470 (155 px)
      look: drift-rock
      points: [[240, 6838], [282, 6852], [311, 6890], [315, 6948], [315, 9160], [307, 9206], [270, 9226], [240, 9230], [210, 9226], [173, 9206], [165, 9160], [165, 6948], [169, 6890], [198, 6852]]
