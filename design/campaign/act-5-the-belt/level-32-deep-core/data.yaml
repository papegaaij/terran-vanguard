  left:
    - [520, 0, 0]      # t=4: the shaft's lip, the walls begin at the field's edges, flat
    - [1820, 70]       # t=14: 340 px
    - [6240, 70]       # t=48
    - [6760, 10]       # t=52: widening to fork one
    - [9230, 10]       # t=71
    - [9620, 30]       # t=74: the pumping hall, 420 px
    - [14300, 30]      # t=110
    - [14638, 10]      # t=112.6: widening to fork two
    - [17225, 10]      # t=132.5
    - [17680, 40]      # t=136: the refinery, 400 px
    - [22480, 40]      # t=175.9
    - [23680, 0, 0]    # t=185.9: the chute's mouth, the walls leave the field, flat
  right:
    - [520, 480, 0]
    - [1820, 410]
    - [6240, 410]
    - [6760, 470]
    - [9230, 470]
    - [9620, 450]
    - [14300, 450]
    - [14638, 470]
    - [17225, 470]
    - [17680, 440]
    - [22480, 440]
    - [23680, 480, 0]
