      look: duct-rock
      points: [[240, 14638], [282, 14652], [311, 14690], [315, 14748], [315, 17155], [307, 17201], [270, 17221], [240, 17225], [210, 17221], [173, 17201], [165, 17155], [165, 14748], [169, 14690], [198, 14652]]
  forks: [{island: 0}, {island: 1}]   # fork 1: left the old drift (safer), right the charge seam (richer); fork 2: left the cooling ducts (richer), right the ore chute (safer)
  notches:   # 140 px along the wall; a cave wave names its notch by its index (0-based)
    - {side: left, scroll: 1890, width: 140, depth: 56}    # 0: the shaft mouth's launch bay (the Darts at t=15.5)
    - {side: right, scroll: 3160, width: 140, depth: 56}   # 1: the gallery Sentinel (t=24, x 426)
