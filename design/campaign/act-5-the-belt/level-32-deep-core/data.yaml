# Level 32 – Deep Core: the level script, rendered into README.md (briefing, threat profile, layout, wall table, waves,
# ground targets, radio). Times are seconds from the level start. M9 part E, step E2, from the README's approved hand
# tables (round 60) and ART-E's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block, sections' tiles,
# terrain with the forks and the six notches, and its ground targets adopted). Schema:
# ../../../tech/architecture/schemas-levels/README.md
# Keys new in M9 part E (flown from step E1; loaded and checked from step E1, mapped in step E2; drawn and played by
# step E4): the terrain's `forks` (an island each: the ship's side at its tip chooses the branch), a wave's and a ground
# target's `branch` (fork from 1, side: its own channel, flown or woken only when chosen), a ground target's `crate` (a
# blast door's lock freeing a cache without a secret) and `blast` (a mining charge's burst), the radio events `branch`
# (with its fork and side) and `topple-crush`; the Sentinel Tower's collar and ground sweep and the Strider's topple are
# in their stat blocks.
# Decided before E2 (m9e-gaps.md §5, pending round 65): QE-1 a (every tower's emitter and every lock at least 40 px
# inside the field: the notches 56/16/26 px deep, the hall pair's notches offset 221 rows), QE-2 a (the richer mouth's
# red lights and lit bulkhead: backdrop), not `vacuum` (air inside the base), a charge 80 in 64 px without a chain, the
# topple crushing ground units only, a branch's ground objects dormant unless chosen, TOWERS DOWN all four towers.
# Step E2's own placements (pending the user's review in round 65; logged in the README's Decisions): the branch items
# at or after the latest choice (fork 1 t≥56.75, fork 2 t≥116.75: E1's rule), the Striders entering 0.7 s before the
# nests they pass (a walker riding the scroll meets a nest only so: the hall pair at 91.3/92.8 by the t=92 nests, fork
# one's at 61.3 by the t=62 nests, the refinery's lone one at 161.4 by the gantry's trio, not the README's 166), the
# radio lines trimmed to one page each.
scroll_speed: 130     # the tunnels; the refinery 120
launch_seconds: 5
bounty_scale: 0.34    # every bounty × 0.34: the README's hand estimate 0.42, fitted in step E2 (levelReport per route: the four routes' mean typical haul on budget(32) 5,702)
control_prompts: []
underground: true     # inside rock: the Airstrike and the Orbital Lance greyed IN ROCK (design/player/specials, Act 5 specials)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The belt, Kleopatra
  layers: [ground, air]
  density: 4
  traits: [anti-ground, forward, piercing]
  hazards: [walls, beam sweeps, furnace vents]
  boss: none
  objective: REACH THE CHUTE   # the OBJECTIVE field from sensor L1
  varga:
    none: Tunnels inside a hollowed rock. No room to dodge wide.
    l1: "Two forks: one quiet, one rich. No bombers in the rock."
    l2: "New: towers that sweep all round, and walkers that topple."
    l3: Fork routes marked. Anti-ground for the towers' collars.
  notes:
    Dominant layers: '`ground` (the tunnel floors: Sentinel Towers, Strider pairs, SAM Nests), `air` (Talons, Dart streams, Skitters, Needlers, motes)'
    Attack directions: '{directions} (the Dart streams out of wall bays near the top edge count as front)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: 'Tunnel walls (terrain collision); Sentinel beams that sweep all round; furnace vents in the refinery'
    Boss / mid-boss: none
    Sensor-suite detail: 'none: the belt, tunnels, `ground` + `air`, front, the objective `{objective}`, the `IN ROCK` limits · L1: + density {density}, the hazards "walls", "beam sweeps" and "furnace vents", the secondary `TOWERS DOWN 4` · L2: + Sentinel Tower (new), Strider (new), SAM Nest, Talon, Dart Drone, Skitter, Needler, Mote Swarm portraits · L3: + the two forks and which channel is the richer on the threat map'

sections:  # back to back from t = 0; the refinery's speed eased over 2 s (ramp); the whole level inside rock (underground)
  - name: The Shaft Mouth
    end: 18
    atmosphere: clear
    tiles: [tunnel-floor]
    notes:
      layers:
        ground: 'Kleopatra''s sunlit face, the shaft''s lip and gantries, then the shaft walls closing in (t 4–14); a launch bay in the left wall (t≈14.5).'
      purpose: Popcorn and Talons; the first Darts out of a bay.
  - name: The Galleries
    end: 54
    atmosphere: clear
    tiles: [tunnel-floor]
    notes:
      layers:
        ground: 'rock walls with lamp strings, the first Sentinel''s gallery notch (t≈24), a launch bay right (t≈41); the tunnel widening to the fork from t≈48.'
      purpose: The first Sentinel alone, the first Strider pair (t≈36).
  - name: Fork One
    end: 74
    atmosphere: clear
    tiles: [fork-drift-seam]
    notes:
      layers:
        ground: 'island one; left the **old drift** (abandoned drill rigs, cold), right the **charge seam** (fresh cuts, mining charges, a Strider, SAM Nests, a lit blast door).'
      purpose: The first route choice (the ship's side at the island's tip, t≈56).
  - name: The Pumping Hall
    end: 114
    atmosphere: clear
    tiles: [pumping-hall]
    notes:
      layers:
        ground: 'a wide hall, pumps and pipe runs on the floor, the Sentinel pair''s shallow notches (t≈79, 81: offset, QE-1 a), the SAM pair and two charges (t≈92), the secret''s sealed blast door in the right wall (t≈100).'
      purpose: The Sentinel pair; the Strider pair and the SAM pair (a topple to aim).
  - name: Fork Two
    end: 136
    atmosphere: clear
    tiles: [fork-ducts-chute]
    notes:
      layers:
        ground: 'island two; left the **cooling ducts** (richer: four SAM Nests, charges, a lit blast door), right the **ore chute** (safer: conveyor belts, empty); the refinery''s gate (t≈134) with the repair crate.'
      purpose: The second route choice (t≈116).
  - name: The Refinery
    end: 186
    speed: 120
    ramp: 2   # eased from 130 over its first 2 s
    atmosphere: clear
    tiles: [furnace-floor]
    notes:
      layers:
        ground: 'furnace floor, vent grates, the crucible gallery (Sentinel, t≈150), the gantry (SAM trio and four charges, t≈162); the ore chute opening to space at t≈178.'
      purpose: Vents, Striders, the last waves; out into space.

# The tunnels (Level 16's terrain rules inside rock, design/campaign Level 32, The tunnels): the walls' collision lines
# (their foot) [scroll, x(, height)] with scroll the ground scroll at which the row reaches the top edge; the fork
# islands [x, scroll]; the notches {side, scroll: the row of the notch's middle, width along the wall, depth into it}.
# ART-E's proposal adopted unchanged: the shaft closing from the field's edges (t 4–14) to 340 px, the galleries,
# widening to fork one (two 155 px channels round island one, t 52.6–71), the hall at 420 px, fork two (island two,
# t 112.6–132.5), the refinery at 400 px, the chute's mouth opening to space (t 176–186). The notches per QE-1 a: the
# gallery Sentinel's 56 px deep, the hall pair's 16 px (offset 221 rows), the crucible's 26 px, the two launch bays 56 px.
