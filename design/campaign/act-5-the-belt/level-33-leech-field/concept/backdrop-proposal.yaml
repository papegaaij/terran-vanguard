sections:   # ART-F2's reading of the README's Layout (150 px/s, the ridge 130 with 2 s eases); F2 writes the real ones
  - {name: Field Edge, end: 24, atmosphere: clear, tiles: ['field-space', 'field-dust'], notes: {'layers': {'ground': 'the first small asteroid surfaces, bare sunlit rock.', 'air': 'drifting rocks, two carrying Asteroid Mites.', 'deep': 'the dust band, the Sun as a bright point.'}, 'purpose': 'Popcorn and Talons; the first leech stream from the rear (t=22.5), alone.'}}
  - {name: The Grown Rocks, end: 60, atmosphere: clear, tiles: ['field-space', 'field-dust'], notes: {'layers': {'ground': 'large asteroid surfaces overgrown with black-violet Vrell growth (leech sacs pulsing), the first Rail Bunker dug into a rock face (t=33.5).', 'low-air': 'smaller rocks.'}, 'purpose': 'The bunker taught alone; leeches from the sides and the rear.'}}
  - {name: Bunker Ridge, end: 95, speed: 130, ramp: 2, atmosphere: clear, tiles: ['field-space', 'field-dust'], notes: {'layers': {'ground': 'a long rock ridge with bunker pairs (t≈68, t≈86) whose lines cross with a safe column between; the growth on its flanks.'}, 'purpose': 'The first **prey** wing (t=62.5): the leeches feed on the Talons.'}}
  - {name: The Feeding Ground, end: 118, speed: 150, ramp: 2, atmosphere: clear, tiles: ['field-space', 'field-dust'], notes: {'layers': {'ground': "the growth at its thickest, the drifting wrecks of latched Talons (scenery), the prospector's claim shack *Claim 114* in the growth (t≈104, the secret)."}, 'purpose': 'The second prey wing; then the Choir (t=118).'}}
  - {name: The Swarm, end: 163, atmosphere: clear, tiles: ['field-space', 'field-dust'], notes: {'layers': {'ground': 'leech nests in the growth, a bunker pair (t≈132) and a single bunker (t≈150).', 'air': 'rocks thick with riders.'}, 'purpose': 'The leeches at their densest (at most 6 free on the screen), every 7.5 s from the rear or a side.'}}
  - {name: Clear Rock, end: 178, atmosphere: clear, tiles: ['field-space', 'field-dust'], notes: {'layers': {'ground': "the rocks thinning, the growth gone, bare rock lit gold; Ceres's light ahead in the deep layer."}, 'purpose': 'Release; the level ends at t=178.'}}
# rows: the end's bottom edge 26000 (ground px); low-air 35100
ground_targets:  # at: [t, x], when the target enters at the top edge and its x (on the faces' pads;
  # a bunker 72 px, Claim 114 48 px: the shack's sprite `claim-shack`, 20 HP, 28 on hard). The pads'
  # pairs stand at one row: their lines cross over the ship; the first delays' stagger (half the
  # interval) is F2's. Every bunker x is >= 84 px inside the 480 px field.
  - target: Rail Bunker single on grown-face-1
    section: 2
    enemy: rail-bunker
    count: 1
    at: [[33.5, 112]]
  - target: Rail Bunker pair on ridge-1
    section: 3
    enemy: rail-bunker
    count: 2
    at: [[68, 92], [68, 388]]
  - target: Rail Bunker pair on ridge-2
    section: 3
    enemy: rail-bunker
    count: 2
    at: [[86, 84], [86.15, 396]]
    hard: {at: [[86, 84], [86.15, 396], [86.1, 240]]}
  - target: Rail Bunker pair on nest-face-1
    section: 5
    enemy: rail-bunker
    count: 2
    at: [[132, 100], [132, 380]]
    hard: {at: [[132, 100], [132, 380], [132, 240]]}
  - target: Rail Bunker single on nest-face-2
    section: 5
    enemy: rail-bunker
    count: 1
    at: [[150, 320]]
  - target: Claim 114
    section: 4
    sprite: claim-shack
    size: [48, 48]
    at: [[104, 380]]
drops:   # the CDF nav buoy (tools/art/belt_units_f.py `nav-buoy`, BuoyLooks' frames: F4 adds it to MOORED)
  - {t: 160, x: 240, y: 380, pickup: armour patch, sprite: nav-buoy}
debris:
  # Proposal (ART-F2): the Leech Field's grown rocks (tools/art/belt_units_f.py); small ones break (6 HP,
  # part B's), large ones are walls (contact `large` 20, the belt's hazards). The Mites' rocks are the
  # waves' on_rocks (use the grown-a/b/c chunks). At most two big rocks on the screen; F2 checks the
  # waves (no rock line within 40 px of a spawn point, no big rock in the ship's lowest 120 px while a
  # rear leech wave enters).
