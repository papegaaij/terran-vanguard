backdrop:
  # Presentation only: Level 33's Leech Field (tools/art/backdrop_l33.py, step ART-F2, from the level's data.yaml).
  # A ground layer without a tile set: open space is the deep layer (the base); the ground holds the
  # asteroid faces (bare at the edge, overgrown in sections 2-5, gold-lit clear rock at the end) with the
  # bunkers' pads and Claim 114's ledge, and the pulsing leech sacs (the only animated pieces: at most two
  # on the screen). Low-air holds the leeched Talons' drifting wrecks (dimmed); high-air the close grit.
  scroll_factors: {deep: 0.12, far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}   # far unused
  ramp: 2
  haze_colour: 09090e
  atmosphere:
    clear: {haze: 0.0}
  tile_sets:
    field-space: {layer: deep, height: 1024}   # space, the sunlit dust band, stars
    field-dust: {layer: high-air, height: 960}   # close grit and dust motes (transparent)
  pieces:
    sun-point: {layer: deep, size: [96, 96]}
    far-rock-a: {layer: deep, size: [120, 100]}
    far-rock-b: {layer: deep, size: [84, 72]}
    ceres-ahead: {layer: deep, size: [300, 300]}
    edge-rock-a: {layer: ground, size: [260, 220]}
    edge-rock-b: {layer: ground, size: [200, 170]}
    grown-face-1: {layer: ground, size: [480, 460]}
    grown-face-2: {layer: ground, size: [480, 420]}
    ridge-1: {layer: ground, size: [480, 400]}
    ridge-2: {layer: ground, size: [480, 400]}
    feeding-face: {layer: ground, size: [480, 520]}
    nest-face-1: {layer: ground, size: [480, 460]}
    nest-face-2: {layer: ground, size: [480, 440]}
    nest-face-3: {layer: ground, size: [480, 420]}
    clear-face-a: {layer: ground, size: [480, 400]}
    clear-rock-b: {layer: ground, size: [260, 220]}
    leech-sacs: {layer: ground, size: [64, 48], frames: 4, fps: 2}
    talon-wreck-a: {layer: low-air, size: [64, 64]}
    talon-wreck-b: {layer: low-air, size: [64, 64]}
  placed:
