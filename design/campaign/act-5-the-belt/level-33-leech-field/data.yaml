ground_targets:  # at: [t, x], when it enters at the top edge and its x (ART-F2's places: the bunkers on the faces' pads, Claim 114 on its ledge)
  - target: First bunker
    section: 2
    enemy: rail-bunker
    count: 1
    at: [[33.5, 112]]   # grown-face-1's pad
    notes:
      target: '[Rail Bunker](../../../enemies/ground/rail-bunker/README.md) on a rock face (t≈33.5), alone'
      effect: 'Bounty {bounty}; hardened (only `anti-ground` weapons and the specials hurt it); its first line taught with no air wave until t=37'
  - target: Ridge pair 1
    section: 3
    enemy: rail-bunker
    count: 2
    staggered: true   # the right one's first line half the interval after the left one's
    at: [[68, 92], [68, 388]]   # ridge-1's pads
    notes:
      target: 'Rail Bunker pair on the ridge (t≈68), their lines crossing with a safe column between'
      effect: 'Bounty {bounty} each; their first lines half the interval apart; never more than 2 lines telegraphed at once (the bunker''s rule)'
  - target: Ridge pair 2
    section: 3
