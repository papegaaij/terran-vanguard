      target: 'The prospector''s shack *Claim 114* in the growth (a `ground` trigger, {hp} HP, t≈104, x 380)'
      effect: 'The secret: frees a crate worth 100 (655)'

secrets:
  - name: Claim 114
    crate: 100   # Act 1 terms: pays 655 with the act factor (the prospector's strongbox)
    radio: {speaker: Rook, requires: escort, line: "Claim 114. Someone staked this rock. The Vrell got here first."}   # Rook's line: only with him flying (step F4)

pickups:
  - {pickup: shield cell, dropped_by: {wave: 31, enemy: talon, unit: first}}    # the t=31 V-wing's leader (its tip)
  - {pickup: overdrive, dropped_by: {wave: 126, enemy: talon, unit: first}}     # the t=126 V-wing's leader, at the Swarm's start

drops:  # a CDF nav buoy (the low-air layer) opens and releases an armour patch at the Swarm's end
  - {t: 160, x: 240, y: 380, pickup: armour patch, sprite: nav-buoy}

radio:  # trigger: t or event; every timed line one radio page (three 22-character lines: 5 s), the Choir's two. Rook's lines need him flying (requires: escort; the secret's line has no requires key). The Choir: the HUD portrait's static 2 s before it, the music 6 dB under it (Level 26's).
  - {t: 1, speaker: Okafor, line: "Leech Field, Lancer. Bunkers on the rocks. Keep your power up."}
  - {t: 13, speaker: Rook, requires: escort, line: "Rocks with teeth. Lovely. Keep your tail clear, Lancer."}
  - {t: 23, speaker: Varga, line: "Leeches behind you! They drain power. Jink to throw them."}
  - {t: 34.5, speaker: Okafor, line: "Rail Bunker. A red line: it's locked on. Step off the line."}
  - {t: 46, speaker: Varga, line: "Rear and side guns hit a latched leech. Front guns can't."}
  - {t: 65, speaker: Varga, line: "They're on the Talons too. Feeding on their own allies."}   # step F2: t=63.5 → 65, at the first prey latch (the stream enters at t=63.5)
  - {t: 71.5, speaker: Okafor, line: "Some alliance. Don't count on it, Doctor. Keep firing."}
  - {t: 86.5, speaker: Rook, requires: escort, line: "Two red lines. I'll take the space between, thanks."}
  - {t: 97.5, speaker: Varga, line: "More Talons with leeches. They just drift."}   # step F2: t=96 → 97.5, at the second wing's first latch
  - {t: 118, speaker: The Choir, distorted: true, static_lead: 2, duck_db: 6, line: "…the one who opened… calls to us… we do not answer… the door is open… we are going…"}
  - {t: 130, speaker: Varga, line: "'The one who opened.' That's Vorne. They don't care about him."}   # t=128 → 130 (gap check §4): after the Choir's voiced line and its lead
  - {t: 137, speaker: Okafor, line: "Then he's alone in it. Good. Leeches from every side now."}
  - {t: 150, speaker: Rook, requires: escort, line: "Lancer, you've got passengers. Shake 'em loose!"}
  - {t: 164, speaker: Okafor, line: "Clear rock ahead. The graveyard next, then the Sovereign."}
  - {event: secondary-objective, not_before: 172.5, speaker: Okafor, line: "Field's clean. Not one leech left to follow us home.", notes: {trigger: "Secondary met, held to t=172.5: after the last leech, in the calm before the end (step FIX6, the user's choice)"}}

objectives:
  primary: reach-end
  secondary: {escapes: void-leech, allowed: 15, easy: {allowed: 10}, hard: {allowed: 18}, label: LEECHES, credits: 100, name: Purge the field}   # at least 48 of the 63 Void Leeches destroyed before they leave the screen (easy 30 of 40, hard 56 of 74: a quarter allowed away), failed by the sixteenth away (a shaken-off leech that flees, or one carried off on a prey Talon, counts as away); 100 in Act 1 terms: pays 655

music:
  track: 13           # Act 5 B "Gilded Cage" (audio/music track list)
  start_section: 1    # the base stem from the start
  full_section: 6     # (the full mix comes in at t=121 by its stem time, held to the end)
  stem_times:
    - {t: 121, stems: full, fade: 1}   # the full mix with the Swarm's first wave, after the Choir's line (t=118, ducked 6 dB by its radio line)
  ambience: belt-open   # the belt's open-space bed (hull creaks, distant impacts, radio hiss through the hull)
  end_jingle: mission-complete
  # no motif: Vorne's motif is muted all level (the Vrell's field, the Choir's level)

difficulty: {}  # the stat blocks' hooks apply (the leech's easy 2 slots and 160 px/s chase, hard 220 px/s and 200°/s; the Rail Bunker's easy 1.2 s telegraph every 6 s, hard 0.8 s every 3.6 s; the Talon's easy pair every 2.0 s, hard 1.3 s and a parting pair; the Mite's); the leech waves' easy and hard counts (easy streams of 3, ambushes of 2-3; hard ambushes of 5), the prey wings never cut, the bunker trios on hard; the formation lever sizes the rest

briefing:
  pages:
    - {speaker: Okafor, image: level-33-leech-field, line: "Between the deep core and Ceres lies a rock field the Vrell have grown over. The Ascendancy keeps rail bunkers on the big rocks. Cross it, Lancer. Rook flies your wing."}
    - {speaker: Varga, image: level-33-power-drain, line: "The growth is full of leeches. They latch on and feed on your generator: your shield stops regrowing, then your guns slow. Bring spare power, and shake them off."}
  teaser: {speaker: Rook, line: "Varga says bring spare power. I'm bringing spare jokes."}

