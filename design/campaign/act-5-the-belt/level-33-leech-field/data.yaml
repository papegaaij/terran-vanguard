# Level 33 – Leech Field: the level script, rendered into README.md (briefing, threat profile, layout, waves, ground
# targets, radio, credit budget). Times are seconds from the level start. M9 part F, step F2, from the README's approved
# hand tables (round 60) and ART-F2's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block, the
# bunkers' and Claim 114's places, the nav buoy's drop and the grown rocks adopted as they are).
# Schema: ../../../tech/architecture/schemas-levels/README.md (the Act 5 keys: schemas-act-4)
# Keys new in M9 part F (flown from step F1; loaded and checked from step F1, mapped in step F2; drawn and played by
# step F4): a wave's `prey` (QF-1 a, pending round 66: the wing's refuelling hold, `hold` s at `depth` px below the top
# edge, then out straight up; latched by a leech, a Talon leaves it and drifts down) and `hunts: prey` (its leeches
# steer at the nearest free prey, then the ship; the stream enters at the wing's height from its side by its route
# `paths`, timed after the wing has settled), a ground target's `staggered` (step F2: the i-th of n bunkers of a nest
# fires its first line i × interval / n later: a pair half the interval apart, hard's trio a third).
# Step F2's own placements (pending the user's review in round 66): the Skitter swarms fly as snakes of 5 from
# alternating edges (as Level 29's; a swarm needs a route), the leeches' rear ambushes as swarms from the rear (the
# Lamprey's; a rear ambush formation needs an ambush path), the rocks with riders drift at the scroll plus 30 px/s,
# the music's full mix by a stem time at t=121 (the Swarm's first wave; section 5 starts at t=118 under the Choir),
# hard's third bunker of the t≈86 and t≈132 nests at x 240 between the pads.
scroll_speed: 150     # the field; the bunker ridge 130 (eased over 2 s each way)
launch_seconds: 5
bounty_scale: 0.43    # every bounty × 0.43: the README's hand estimate 0.55 with the hardened bunkers at 0 %, fitted in step F2 with the offbeat Talon groups (levelReport with the bunkers at 0 %: typical haul on budget(33) 6,101)
control_prompts: []
medium: vacuum        # the belt: short flashes, debris rings, drifting wrecks (design/world/belt)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The belt, Leech Field
  layers: [air, ground]
  density: 4
  traits: [rear, side]
  hazards: [power drain, rail lines]
  boss: none
  objective: CROSS THE LEECH FIELD   # the OBJECTIVE field from sensor L1
  varga:
    none: A rock field full of leeches. Bring spare power, Lancer.
    l1: Leeches from behind and the sides. Bunkers on the rocks.
    l2: "New: Void Leeches drain your generator. Bunkers fire lines."
    l3: Rear and side guns throw a leech off. Keep 4 MW spare.
  notes:
    Dominant layers: '`air` (written `space` in the belt: the Talons, the Void Leeches, the Asteroid Mites on their rocks, the Vrell popcorn), `ground` (the Rail Bunkers on the large asteroid surfaces, judgement call J3)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits} (the roster''s `beam` replaced: a latched leech is hit only by rear and side fire, see *Decisions*)'
    Hazards: 'Generator drain (the leeches); the Rail Bunkers'' rail lines; drifting asteroids (small ones break, big ones block)'
    Boss / mid-boss: none
    Sensor-suite detail: 'none: the belt, Leech Field, `air` + `ground`, front, rear and sides · L1: + directions, density {density}, hazards "power drain" and "rail lines", the objective `{objective}` and the secondary `LEECHES` · L2: + Void Leech (new), Rail Bunker (new), Talon, Asteroid Mite, Stinger, Skitter, Mote Swarm portraits; the drain marked "power, not shield" · L3: + the rear and side entries on the threat arrows, `rear` and `side` highlighted'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); ART-F2's reading of the Layout table
  - name: Field Edge
    end: 24
    atmosphere: clear
    tiles: [field-space, field-dust]
    notes:
      layers:
        ground: the first small asteroid surfaces, bare sunlit rock.
        air: drifting rocks, two carrying Asteroid Mites.
        deep: the dust band, the Sun as a bright point.
      purpose: Popcorn and Talons; the first leech stream from the rear (t=22.5), alone.
  - name: The Grown Rocks
    end: 60
    atmosphere: clear
    tiles: [field-space, field-dust]
    notes:
      layers:
        ground: 'large asteroid surfaces overgrown with black-violet Vrell growth (leech sacs pulsing), the first Rail Bunker dug into a rock face (t=33.5).'
        low-air: smaller rocks.
      purpose: The bunker taught alone; leeches from the sides and the rear.
  - name: Bunker Ridge
    end: 95
    speed: 130
    ramp: 2   # eased from 150 over its first 2 s
    atmosphere: clear
    tiles: [field-space, field-dust]
    notes:
      layers:
        ground: 'a long rock ridge with bunker pairs (t≈68, t≈86) whose lines cross with a safe column between; the growth on its flanks.'
      purpose: 'The first **prey** wing (t=62.5): the leeches feed on the Talons.'
  - name: The Feeding Ground
    end: 118
    speed: 150
    ramp: 2   # eased from 130
    atmosphere: clear
    tiles: [field-space, field-dust]
    notes:
      layers:
        ground: 'the growth at its thickest, the drifting wrecks of latched Talons (scenery), the prospector''s claim shack *Claim 114* in the growth (t≈104, the secret).'
      purpose: The second prey wing; then the Choir (t=118).
  - name: The Swarm
    end: 163
    atmosphere: clear
    tiles: [field-space, field-dust]
    notes:
      layers:
        ground: 'leech nests in the growth, a bunker pair (t≈132) and a single bunker (t≈150).'
        air: rocks thick with riders.
      purpose: 'The leeches at their densest (at most 6 free on the screen), every 7.5 s from the rear or a side.'
  - name: Clear Rock
    end: 178
    atmosphere: clear
    tiles: [field-space, field-dust]
    notes:
      layers:
        ground: 'the rocks thinning, the growth gone, bare rock lit gold; Ceres''s light ahead in the deep layer.'
      purpose: Release; the level ends at t=178.

