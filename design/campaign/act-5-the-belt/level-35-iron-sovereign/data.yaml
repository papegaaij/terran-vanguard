# Level 35 – Iron Sovereign: the level script, rendered into README.md (briefing, threat profile, layout, waves, ground
# targets, radio, credit budget). Times are seconds from the level start. M9 part H, step H2, from the README's approved
# hand tables (round 60) and ART-H2's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block, its sections
# with the halt eased down over [85.5, 91.5] before the 1 s arena (the ground's scroll 13,788 at the halt, the
# README's 13,850; ART-H2's 0.5 s timed halt is a 1 px/s section here: the simulation allows a timed halt only with a
# defend primary), the hull guns' and the lifeboat's places on their pads, the beacon's drop and the light
# debris adopted as they are; the tenders on the far layer).
# Schema: ../../../tech/architecture/schemas-levels/README.md (the relay: M9 part H; the boss's rings: schemas-units)
# Keys new in M9 part H (flown from steps H1a-H1b, loaded and checked from step H1c and H2, drawn and played by step H4):
# the boss's `rings` (its own data), the level's `relay` (the mass-relay flash: once, a horizontal line through the
# ship), Vorne's `smug` and `rage` portraits (expressions of his only), `requires_not: escort` on Okafor's closing answer
# (the existing key; the gap check's `requires: no-escort`), the relay's quiet window and the halt boundary (content's
# RingChecks: no wave enters t 58.5-63.5, no line-firing unit on the field at the flash, nothing on the ground on the
# field when the arena starts).
# Decided before H2 (m9h-gaps.md §4-§5, pending round 68): every approach line one radio page and retimed; the t≈56
# bunker pair at t=55.5; the rear Talon V-wing on the plain rear entry; the serpent pincer as two `snake` waves; the
# kill ratio 65 % of what the simulation counts; the level ends 1 s after the last closing line (text model).
# Step H2's own placements (pending the user's review in round 68; logged in the README's Decisions): Rook's relay line
# right after the flash (t=63: "rail gun" is the relay), before the lifeboat's event line; Varga t=76.5, Okafor t=83.5;
# the skitter swarms as snakes of 4 from alternating edges (a swarm needs a route, as Levels 29, 33 and 34), the motes on
# Level 31's two paths at 200 px/s; hard's fourth SAM Nest in each group on the hull's open plating (no pad).
scroll_speed: 160     # the escort screen; the outer hull 150, eased to the halt over the rings' edge
launch_seconds: 5
bounty_scale: 0.59    # every bounty × 0.59: the README's hand estimate 0.56, fitted in step H2 with the boss at 24 % and its 52 Darts (levelReport: typical haul on budget(35) 6,985)
control_prompts: []
medium: vacuum        # the belt: short flashes, debris rings, drifting wrecks (design/world/belt)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The belt, Ceres orbit
  layers: [air, ground]
  density: 5
  traits: [piercing, anti-ground]
  hazards: [mass relay, rail lines]
  boss: Iron Sovereign
  objective: DESTROY THE IRON SOVEREIGN   # the OBJECTIVE field from sensor L1
  varga:
    none: Ceres orbit. One huge contact. Vorne's battle station.
    l1: An escort screen, then the station. From every side.
    l2: Talons, Gunships, Hornets, Serpents. The Iron Sovereign.
    l3: Piercing for the rings, anti-ground for the batteries.
  notes:
    Dominant layers: '`air` (written `space`: the Talons, Gunships and their Darts, Hornets, the Rail Serpents, the Shard Drones, the Vrell popcorn), `ground` (the outer hull''s SAM Nests and Rail Bunkers; the Sovereign itself, seen from above)'
    Attack directions: '{directions} (the approach by its waves; the station''s batteries in the fight fire from all round the arena and are not in the numbers)'
    Density: '{density}'
    Recommended traits: '{traits} (the boss''s columns of batteries and its `ground` layer; `homing` helps on the batteries in the arc)'
    Hazards: 'The mass-relay flash (once, t=61); SAM homing diamonds and rail lines on the hull; the Sovereign''s batteries, its core''s fan, spiral, rail and Dart streams'
    Boss / mid-boss: 'Act boss [Iron Sovereign](../../../enemies/bosses/iron-sovereign/README.md)'
    Sensor-suite detail: '**none**: the belt, Ceres orbit, `air` + `ground`, all directions. **L1**: + the directions, density {density}, hazards "mass relay" and "rail lines", the objective `{objective}`. **L2**: + Talon, Gilded Gunship, Hornet, Rail Serpent, Shard Drone, Dart Drone, SAM Nest, Rail Bunker portraits; the boss''s name and silhouette (`iron-sovereign`). **L3**: + `piercing` and `anti-ground` highlighted; the timeline strip marks the mass-relay flash (61 s) and the boss (92 s); 1 secret.'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); ART-H2's reading of the Layout table (the halt eased over 6 s before the arena: 150 px/s until 85.5, ≈ 0 at 91.5)
  - name: Ceres Orbit
    end: 20
    atmosphere: clear
    tiles: [orbit-space, orbit-dust]
    notes:
      layers:
        deep: 'Ceres''s curve, Ceres Hub''s lights (red since Level 29), the dust band.'
        low-air: loyalist wrecks and a dead Ceres patrol boat drifting.
      purpose: Talons and popcorn; Ceres Hub Control comes on the radio.
  - name: The Escort Screen
    end: 50
    atmosphere: clear
    tiles: [orbit-space, orbit-dust]
    notes:
      layers:
        far: the Sovereign's tenders and docking spars far below.
        air: the escort.
      purpose: 'The Gunships'' Dart streams (t=20), the Rail Serpent pincer (t=35), the Hornets; Talon pincers from the sides.'
  - name: The Outer Hull
    end: 80
    speed: 150
    ramp: 2   # eased from 160 over its first 2 s
    atmosphere: clear
    tiles: [orbit-space, sovereign-hull, orbit-dust]
    notes:
      layers:
        ground: 'the station''s outer hull (black plating, gold trim, red lights): SAM Nest groups (t≈52, 64, 74), Rail Bunker pairs (t≈55.5, 70, 78), a Ceres garrison lifeboat clamped to the hull (t≈66, the secret). **The mass-relay flash** at t=61.'
      purpose: The hull's guns; the flash once; a rear V-wing (t=68.5).
  - name: The Rings' Edge
    end: 85.5
    speed: 150
    atmosphere: clear
    tiles: [orbit-space, orbit-dust]
    notes:
      layers:
        ground: 'the outer ring''s rim rolls into view, then the middle and inner rings and the core.'
      purpose: The last wave (t=83.5); the pre-boss pause begins (t≈84).
  - name: The Halt
    end: 92
    speed: 1
    ramp: 6   # eased from 150 down to 1 px/s over [85.5, 91.5] (a speed change's ease; the simulation allows a timed halt of speed 0 only with a defend primary), then the arena's 1 s ease to rest
    atmosphere: clear
    tiles: [orbit-space, orbit-dust]
    notes:
      layers:
        ground: 'the station''s centre reaching its place (240, 160 on the screen) as the scroll comes to rest.'
      purpose: The pre-boss pause (t≈84-92); nothing on the ground is left on the field.
  - name: The Sovereign
    end: 93   # the level clock halts here while the Sovereign lives; the kill resumes it after hold_after_boss
    speed: 0
    arena: true
    hold_after_boss: 6   # s the clock stays halted after the kill: the 5 s death chain (its `death_seconds`; the flash and the credit shower over the core, collectable), one second more: the clock reads 87 + K from then (K+6 = t=93)
    atmosphere: clear
    tiles: [orbit-space, orbit-dust]
    notes:
      layers:
        ground: 'the station filling the field, its centre at (240, 160) ([arena](../../../enemies/bosses/iron-sovereign/README.md#arena)).'
        deep: Ceres far below.
      purpose: The boss fight (≈ 145 s at medium); the scroll halted and the clock stopped while the station lives.
  - name: The Wreck
    end: 131.5   # K+44.5: the closing queue's last line (Ceres Control) ends ≈ K+43.4 by the radio's text model, then 1 s
    speed: 60
    ramp: 2   # eased up from the halt over 2 s
    atmosphere: clear
    tiles: [orbit-space, orbit-dust]
    notes:
      layers:
        ground: 'the broken rings drifting apart, slowly turning, the core''s crater glowing.'
      purpose: 'The closing lines (K+5 to ≈ K+43): Okafor, Vorne''s offer, the answer, Varga''s data, Ceres Control; no enemies (the level''s outro for the pacing checks).'

debris:  # the belt's small rocks (design/world/belt, hazards; Level 03's rules): they break and pay nothing; ART-H2's two in section 1 (no large rock in orbit)
  chunks:
    belt-a: {size: [40, 36], hp: 6}
    belt-b: {size: [36, 32], hp: 6}
  clearance: 120        # px: a chunk never enters closer to the ship than this (it moves sideways)
  max_large: 0
  placed:               # t it enters at the top edge, its x, the chunk, its drift [x, y] px/s (y up)
    - {t: 8.8, x: 330, chunk: belt-a, drift: [-14, -170]}
    - {t: 16.2, x: 140, chunk: belt-b, drift: [18, -185]}

relay:  # the mass-relay flash (design/world/belt, Hazards; Level 35's Layout): at t=59.8 a line locked through the ship's y, telegraphed from the right edge; the flash at t=61 (easy 61.3), 16 px, live 0.2 s, 20 damage (two `heavy`), the ship only (Rook and the enemies untouched)
  t: 59.8
  telegraph: 1.2
  live: 0.2
  band: 16
  damage: 20
  from: right
  easy: {telegraph: 1.5}

