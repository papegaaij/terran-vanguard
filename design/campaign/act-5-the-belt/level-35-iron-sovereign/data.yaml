  - {pickup: overdrive, dropped_by: {wave: 35, enemy: rail-serpent, unit: first}}     # the first Rail Serpent's engine
  - {pickup: shield cell, dropped_by: {wave: 56, enemy: gilded-gunship, unit: last}}  # the second Gunship of the t=56 column (hard: the third)

drops:  # the CDF beacon (Level 33's nav buoy) on a crashed loyalist fighter on the hull releases an armour patch before the arena; the boss's phase 4 drops the second
  - {t: 80, x: 240, y: 380, pickup: armour patch, sprite: nav-buoy}

boss:  # the act boss: the arena's start is its arrival (the warning, the bar, the boss checkpoint on easy and medium); the station has scrolled in with the hull; its rings spin up over 4 s
  enemy: iron-sovereign
  t: 92
  x: 240
  section: 6
  notes:
    from: 'the ground (it scrolls in with the hull and halts at the centre (240, 160))'
    waves: 'At the arena''s start: the warning, the bar and the checkpoint; the rings, the batteries, the core and its Darts as in its spec; no other waves in the arena'
    spawns: {dart-drone: 84}   # the Darts its rim bays launch in a typical fight (step H3: 84 at medium as measured with the core tuned, ≈ 21 streams of 4 over its ≈ 110 s): the typical haul's count

radio:  # trigger: t or event; every approach line one radio page (three 22-character lines, gap check §4). Speakers Okafor, Varga, Rook (requires: escort), Ceres Hub Control and Vorne on the enemy channel (his voice's filter); the Choir is silent. The arena's clock halts, so the boss lines are events (PHASE lines: they wait for a gap, stale after 20 s, dropped at the kill); the closing lines are CLOSING lines in order (`boss-destroyed`; `delay` counts from the kill, a line waits behind the one before it; the debrief waits for the last)
  - {t: 1, speaker: Okafor, line: "Break the Sovereign's screen, Lancer. Then break the station."}
  - {t: 9.5, speaker: Ceres Hub Control, portrait: ceres-control, line: "Ceres Control, still on the dock channel. I'll guide you in."}
  - {t: 23, speaker: Rook, requires: escort, line: "Gunships with darts. I'll take the darts, you take the boats."}
  - {t: 36, speaker: Varga, line: "Rail Serpents on both flanks. Hit the engine first."}
  - {t: 46, speaker: Okafor, line: "SAMs and rail bunkers on the hull. Flares if you have them."}
  - {t: 55.5, speaker: Ceres Hub Control, portrait: ceres-control, line: "The mass relay is turning on you! Red line: move!"}   # the warning before the 59.8 telegraph (ends ≈ 62.1)
  - {t: 63, speaker: Rook, requires: escort, line: "That rail gun was aimed at us? I'm flattered."}   # right after the flash (the relay is the rail gun), before the lifeboat's line
  - {t: 76.5, speaker: Varga, line: "The rings are turning. Three of them, guns on every ring."}
  - {t: 83.5, speaker: Okafor, line: "This is Vorne's station. Everything you have, Lancer."}   # ends ≈ 90.8, over the pre-boss pause
  - {event: boss-arrival, speaker: Vorne, expression: smug, line: "Welcome to Ceres, Lancer. The Sovereign was built to hold the Belt. Do try to make this interesting.", notes: {trigger: "Boss arrival (`boss-arrival`, the spin-up), the enemy channel"}}
  - {event: boss-arrival, speaker: Varga, line: "The guns fire only on the side facing you. Destroy a ring's guns.", notes: {trigger: "Boss arrival, queued after Vorne's (`PHASE`)"}}
  - {event: boss-phase, phase: Two rings, speaker: Vorne, line: "Such dedication. Such waste. You could have been on the winning side, pilot.", notes: {trigger: "First ring locked (`boss-phase` Two rings), the enemy channel"}}
  - {event: boss-phase, phase: One ring, speaker: Rook, requires: escort, line: "One ring left. It's running out of guns.", notes: {trigger: "Second ring locked (`boss-phase` One ring)"}}
  - {event: boss-phase, phase: The core, speaker: Vorne, expression: rage, line: "Enough. You are becoming expensive.", notes: {trigger: "Third ring locked, the core opening (`boss-phase` The core), the enemy channel: cold and clipped, never raised"}}
  - {event: boss-phase, phase: The core, speaker: Varga, line: "The core is open! Its shield is thin. A Tesla hit empties it.", notes: {trigger: "The core, queued after Vorne's (`PHASE`)"}}
  - {event: boss-destroyed, delay: 5, speaker: Okafor, line: "The Sovereign is down! Ceres orbit is ours, Aegis Wing.", notes: {trigger: "Sovereign destroyed (`boss-destroyed`, `delay: 5`, `CLOSING`), at the flash"}}
  - {event: boss-destroyed, speaker: Vorne, line: "Lancer. You are wasted on Okafor. Come to Callisto. Name your price.", notes: {trigger: "Then (`CLOSING`): steady and warm again, the enemy channel"}}
  - {event: boss-destroyed, speaker: Rook, requires: escort, line: "Funny. We were just heading your way.", notes: {trigger: "Then (`CLOSING`, with Rook)"}}
  - {event: boss-destroyed, speaker: Okafor, requires_not: escort, line: "Our pilots are not for sale, Vorne.", notes: {trigger: "Then (`CLOSING`, without Rook: replaces his line)"}}
  - {event: boss-destroyed, speaker: Varga, line: "Its nav core took every order from one place. Callisto.", notes: {trigger: "Then (`CLOSING`)"}}
  - {event: boss-destroyed, speaker: Ceres Hub Control, portrait: ceres-control, line: "Ceres to Aegis. The hub lights are white again. Thank you.", notes: {trigger: "Then (`CLOSING`); the level ends 1 s after it"}}

objectives:
  primary: reach-end   # the arena makes the kill a condition of the level's end; the line reads the boss's name (threat_profile.objective)
  secondary: {kill_ratio: 0.65, boss_counted: false, credits: 100, name: Break the screen}   # at least 65 % of the approach's planned units (the waves and the hull guns: 99 of 151 at medium, step H3; the Gunships' Darts count as kills, not in the requirement; the Sovereign and its Darts not counted), judged at the end; no radio line (100 in Act 1 terms: pays 655)

music:
  track: 13           # Act 5 B "Gilded Cage" (audio/music track list)
  start_section: 1    # the base stem from the start
  full_section: 2     # the full mix from the escort screen (t=20)
