secrets:
  - name: Ceres lifeboat
    crate: 100   # Act 1 terms: pays 655 with the act factor (the garrison lifeboat's stores)
    radio: {speaker: Ceres Hub Control, portrait: ceres-control, line: "One of our lifeboats. Empty. Take the stores, Aegis."}   # one page (gap check §4): queued behind Rook's t=63 line when he flies

