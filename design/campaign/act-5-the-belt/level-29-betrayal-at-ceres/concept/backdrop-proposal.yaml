    docking-arm-2: {layer: ground, size: [112, 360]}
    dock-1: {layer: ground, size: [96, 128]}
    dock-2: {layer: ground, size: [96, 128]}
    dock-3: {layer: ground, size: [96, 128]}
    dock-4: {layer: ground, size: [96, 128]}
