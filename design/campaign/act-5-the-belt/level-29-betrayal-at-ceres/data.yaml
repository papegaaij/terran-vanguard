    belt-a: {size: [40, 36], hp: 6}
    belt-b: {size: [36, 32], hp: 6}
    belt-c: {size: [32, 28], hp: 6}
  clearance: 0
  placed: []   # no free rocks: every rock carries riders (the waves' on_rocks)

