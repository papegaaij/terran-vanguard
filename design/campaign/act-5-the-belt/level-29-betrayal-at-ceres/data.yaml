difficulty: {}  # the halt cycle's easy (no Talon wave) and hard (a fifth wave at H+11) are its waves' skips; the stat blocks' hooks apply (the Talon's easy pair every 2.0 s, hard 1.3 s and a parting pair; the SAM Nest's easy 6 s and 65°/s, hard salvos of 3 at 95°/s; the Mite's easy 130 px / 0.5 s / 220 px/s, hard 200 px / 300 px/s; the clamp gun's easy 2.6 s, hard pairs; the wavering pairs' easy 8 s hold, hard 40 px lower); the formation lever sizes the rest

briefing:
  pages:
    - {speaker: Okafor, image: level-29-ceres-hub, line: "Vorne has told every station to choose. Ceres Hub has not answered: the Consortium is voting, and half its garrison is paid in Helix money. We keep Helix's Talons off the docks while they vote. If the hub turns, we fight our way out down the dock canyon."}
    - {speaker: Varga, image: level-29-talon, line: "The Ascendancy's fighters are Talons. Their hulls carry a light hex shield: it soaks the first hit and grows back if you let it. Their missile nests fire homing diamonds: shoot them down. And the belt's rocks carry Vrell mites. Shoot the rock before you pass it."}
  teaser: {speaker: Okafor, line: "Ceres has not chosen yet, Lancer. Fly in as if it had."}

