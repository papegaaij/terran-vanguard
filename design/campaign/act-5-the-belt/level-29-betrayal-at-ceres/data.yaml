halt_waves:  # the rescue halt's cycle: t s from the halt's start H, repeating every 16 s while a clamp gun stands, cut at the last one's fall (a wave in flight flies on)
  every: 16
  waves:
    - {t: 1, formation: snake, enemy: skitter, count: 6, from: front, edge: left, notes: Halt cycle}
    - {t: 5, formation: line abreast, enemy: talon, count: 4, from: front, skip: [easy], notes: "Halt cycle; not on easy"}
    - t: 9
      formation: swarm
      enemy: mote-swarm
      count: 6
      from: front
      paths: [[[240, -60], [160, 160], [320, 340], [240, 620]]]
      notes: "Halt cycle (round 62: 8 → 6 motes, room for the rock groups)"
    - {t: 11, formation: line abreast, enemy: talon, count: 4, from: front, skip: [easy, medium], notes: "Halt cycle, hard only (the README's pincer as a front line: a halt cycle's waves come from the front)"}
    - {t: 13, formation: snake, enemy: skitter, count: 6, from: front, edge: right, notes: "Halt cycle (the typical halt ends ≈ H+14: the cycle starts again at H+17 if the clamps still stand)"}

