# Level 29 – Betrayal at Ceres: the level script, rendered into README.md (briefing, threat profile, layout, waves,
# ground targets, radio, credit budget). Times are seconds from the level start (clock time: the clock stands in the
# rescue halt). M9 part B, step B2, from the README's approved hand tables (round 60) and ART-B's backdrop proposal
# (concept/backdrop-proposal.yaml, re-run on these sections and adopted).
# Schema: ../../../tech/architecture/schemas-levels/README.md (the Act 5 keys: schemas-act-4)
# Keys new in M9 part B (flown from steps B1, B1b; loaded and checked in step B2; drawn and played by step B4): the held
# arena (`holds: clamps` on the rescue's arena section: the clock stands while a clamp gun stands, the scroll eases down
# across the section from 100 px/s, the next section's ramp eases it up), `halt_waves` (the halt cycle on the halt's own
# clock), `escort_swap` (Rook's rescue: the hold's launch point on the halted screen and the 1 s join), a ground
# target's `dormant_until` (Block C's nests), a V-wing's `leader: tip`, a wave's `on_rocks` (the Asteroid Mites' rocks,
# the level's debris chunks), the secondary's `spared` (Hold fire) and the radio events first-homing, neutral-left,
# neutral-down, holders-down and escort-joined.
# Step B2's own placements (pending review): the Mote Swarm routes alternate two S-routes; the rocks drift at the scroll
# plus 30 px/s (the Mite's "30–60 px/s plus the scroll"), the side rocks 90 px/s across; Block C's nests enter at
# t=57.148 so they stand 160 px below the top edge at the turn (ART-B's pads); the clamp guns enter at t=115.52 and
# 117.12 so they stand at y 330 and 170 on the halted screen; hard's halt-cycle Talons at H+11 fly a line abreast from
# the front, not the README's pincer (a halt cycle's waves are plain front waves: step B1's HaltCycle).
scroll_speed: 120     # the approach and the breakout; the canyon 100, Block C 60, the rescue 0
launch_seconds: 5
bounty_scale: 0.35    # every bounty × 0.35: the README's hand estimate 0.44, fitted in step B2 at 0.48, re-fitted in step B3b after the waves' rework (levelReport: typical haul on budget(29) 4,654)
control_prompts: []
medium: vacuum        # the belt: short flashes, debris rings, drifting wrecks (design/world/belt)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The belt, Ceres Hub
  layers: [air, ground]
  density: 4
  traits: [spread, homing]
  hazards: [the station turns, rocks with riders]
  boss: none
  objective: REACH THE OUTER RING   # the OBJECTIVE field from sensor L1
  varga:
    none: Ceres Hub, Lancer. The belt's biggest dock, still deciding.
    l1: "Mostly ahead. Some station guns are asleep: watch the lights."
    l2: "New: shielded Talons, SAM nests and mites on the rocks."
    l3: Spread for the mites, homing for the Talons and missiles.
  notes:
    Dominant layers: '`air` (Talon wings, Skitter and Mote streams, Asteroid Mites on rocks), `ground` (SAM Nests on the station hulls, the tender''s clamp guns)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: 'The turning station (sleeping guns wake at t≈60); drifting rocks with riders'
    Boss / mid-boss: none
    Sensor-suite detail: '**none**: the belt, Ceres Hub, `air` + `ground`, front · **L1**: + directions (sides), density {density}, hazard "the station turns", the objective `{objective}` and the secondary `HOLD FIRE` · **L2**: + Talon (new, shielded), SAM Nest (new), Asteroid Mite (new), Skitter and Mote portraits · **L3**: + `spread` and `homing` highlighted, the wave strip marking Block C and Dock 9'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); the rescue halt a held arena
  - name: Ceres Approach
    end: 28
    atmosphere: clear
    tiles: [belt-space]
    notes:
      layers:
        deep: Ceres's curve, the dust band.
        low-air: a loyalist ore hauler under Talon fire (t≈13).
        air: small drifting rocks (the Mites' rocks; no large rock).
        ground: the hub's outer crust, docking arms.
      purpose: Popcorn, the first Talons and their shield flash, the first riders.
  - name: The Dock Canyon
    end: 56
    speed: 100
    ramp: 2   # eased from 120 over its first 2 s
    atmosphere: clear
    tiles: [belt-space, dock-canyon]
    notes:
      layers:
        ground: 'the canyon cut into the crust, docks 1–5 along its walls (scenery, no collision); the **Helix dock block** (black and gold) with 3 SAM Nests (t≈34); Coalition blocks lit white.'
      purpose: The SAM Nest's homing diamonds; the canyon's rhythm.
  - name: Block C
    end: 76
    speed: 60
    ramp: 2   # eased from 100
    atmosphere: clear
    tiles: [belt-space, dock-canyon]
    notes:
      layers:
        ground: '**Block C**, a Coalition station block lit white, with 3 **dormant** SAM Nests on its roof. At **t=60** its lights switch white → red over 1 s, a klaxon, and the nests wake (1 s tell); the lights then go red block by block up the canyon ahead.'
      purpose: 'The signature: the station turns sides. Quiet window t=56–62 (no wave enters).'
  - name: The Red Canyon
    end: 115
    speed: 100
    ramp: 2   # eased from 60
    atmosphere: clear
    tiles: [belt-space, dock-canyon]
    notes:
      layers:
        ground: 'red-lit blocks, docks 6–8, 3 SAM Nests at t≈84 and 3 at t≈100; the loyalists'' supply cache in Dock 6 (t≈108, the secret); mutineer Talons out of the side docks.'
      purpose: 'The mutineers; the wavering pairs (t=77, 98); Hub Control''s lead to Dock 9.'
  - name: Dock 9
    end: 118
    speed: 100
    atmosphere: clear
    tiles: [belt-space, dock-canyon]
    notes:
      layers:
        ground: '**Dock 9**, the Helix prison tender in four docking clamps, a clamp gun on each.'
      purpose: 'The approach to the halt (from t=115, a second before the README''s 116: the clamp guns'' entries at 115.52 lie in it; the same scroll).'
  - name: The Rescue
    end: 120   # the level clock stands here while a clamp gun stands; the last one's fall resumes it
    speed: 0
    arena: true
    holds: clamps   # the held arena: its holders are the clamp guns (group clamps), not a boss; no boss bar
    atmosphere: clear
    tiles: [belt-space, dock-canyon]
    notes:
      layers:
        ground: 'the halted screen shows Dock 9 and the tender in the middle third; the four clamp guns at (150, 170), (330, 170), (150, 330), (330, 330).'
      purpose: 'The rescue halt (the scroll eased down from 100 px/s over 2 s from t=118, the clock stopped while a clamp gun stands, ≈ 14 s typical); Rook launches, the loaner leaves.'
  - name: Breakout
    end: 172
    speed: 120
    ramp: 2   # eased up from the halt over 2 s
    atmosphere: clear
    tiles: [belt-space, outer-docks]
    notes:
      layers:
        ground: 'the canyon mouth, the outer docks with 3 SAM Nests (t≈131), the outer ring.'
        air: small rocks with riders.
        deep: the CDF transport at the rendezvous.
      purpose: 'Rook back in the slot; the third wavering pair and Harker; the run out. Level end at t=172 as the outer ring reaches the bottom edge.'

debris:  # the Asteroid Mites' rocks (design/world/belt, hazards): small breakable chunks only (Level 03's small-chunk rules: they block shots of both sides); sprites assets/sprites/debris-<chunk>_N (16 spin frames)
