secrets:
  - name: Supply cache
    crate: 100   # Act 1 terms: pays 655 with the act factor
    radio: {speaker: Ceres Hub Control, portrait: ceres-control, line: "Dock Six stores. Take them, Aegis. Better you than Helix."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 22, enemy: talon, unit: first}}      # the first squad leader (the V-wing's tip)
  - {pickup: shield cell, dropped_by: {wave: 105, enemy: talon, unit: last}}    # the t=105 pincer's last Talon

drops:  # a loyalist ore hauler on the low-air layer releases an armour patch (the backdrop's hauler at t=150)
  - {t: 150, x: 240, y: 380, pickup: armour patch}

radio:  # trigger: t or event. Rook has no lines before the rescue (his barks dropped, as L27–L28); his rescue and t=141 lines are scripted (no requires). Harker is on the enemy channel (his voice's filter); Vorne is silent here.
  - {t: 1, speaker: Ceres Hub Control, portrait: ceres-control, line: "Aegis flight, Ceres Hub Control. You heard him too. The Consortium is still voting. Keep our docks clear while they talk."}
  - {t: 14, speaker: Varga, line: "Talons. Gold hexes are a light shield: keep firing through it."}
  - {t: 24.5, speaker: Okafor, line: "The striped one leads the wing. Drop it and the rest break off."}
  - {event: first-homing, speaker: Varga, line: "Helix missiles. Shoot the red-gold diamonds or outrun them.", notes: {trigger: "First SAM salvo (`first-homing`, t≈35)"}}
  - {t: 46, speaker: Ceres Hub Control, portrait: ceres-control, line: "The vote is closing. If the lights go red, those are not my guns."}
  - {t: 60, speaker: Ceres Hub Control, portrait: ceres-control, shout: false, line: "Block C just declared! The garrison is split. Their guns are hot!"}
  - {t: 70.5, speaker: Harker, line: "Ceres Wing, Harker. We're Ascendancy now. Clear the CDF out."}
  - {t: 79, speaker: Varga, line: "Those white blinkers are holding fire, Lancer. Let them go."}
  - {event: neutral-left, enemy: wavering-stormhawk, speaker: Harker, line: "Who broke off? Ceres Wing, get back in line!", notes: {trigger: "A wavering pair leaves (`neutral-left`, the first time)"}}
  - {t: 90, speaker: Okafor, line: "Ceres has turned, Lancer. Fight your way down to the transport."}
  - {t: 101, speaker: Ceres Hub Control, portrait: ceres-control, line: "Dock 9's prison tender holds a CDF pilot. His fighter, too."}
  - {t: 113, speaker: Okafor, line: "Dock 9 ahead. Break the clamps, Lancer. Bring him home."}
  - {t: 119.9, speaker: Ceres Hub Control, portrait: ceres-control, line: "Four clamps, a gun on each. Break them and the tender lets go.", notes: {trigger: "the halt begins; it waits for Okafor's line"}}
  - {event: holders-down, swap: bulwark, speaker: Okafor, line: "Bulwark, RTB. Rook, form on Lancer.", notes: {trigger: "The last clamp gun falls (`holders-down`) with the Bulwark flying in the slot"}}
  - {event: holders-down, swap: leaves, speaker: Okafor, line: "Rook, you're clear. Form on the transport.", notes: {trigger: "The last clamp gun falls with no Rook to join the slot (`--escort none`: the Ember leaves upward)"}}
  - {event: escort-joined, speaker: Rook, line: "Miss me? Don't answer that. Just shoot.", notes: {trigger: "Rook joins his slot (`escort-joined`, 1 s after)"}}
  - {t: 133, speaker: Harker, line: "Rook on the Aegis net? Pity. I'd have bought you a drink."}
  - {t: 141, speaker: Rook, line: "Harker's wing. I flew convoys with them. Doesn't matter now."}
  - {event: secondary-objective, speaker: Varga, line: "None of the white ones fell. Someone in Ceres will remember that.", notes: {trigger: "Secondary met (the third pair gone, ≈ t=147)"}}
  - {event: neutral-down, enemy: wavering-stormhawk, speaker: Harker, line: "That one held fire, Aegis. Remember that.", notes: {trigger: "Secondary failed (`neutral-down`, a wavering craft destroyed)"}}
  - {t: 156, speaker: Ceres Hub Control, portrait: ceres-control, line: "Outer ring holds. Go. Tell Earth that not all of Ceres said yes."}
  - {t: 163.5, speaker: Okafor, line: "You're clear of the canyon. The transport is at the outer ring."}
  - {event: level-end, speaker: Okafor, line: "Ceres is lost, but we have Rook back. I'll take that trade.", notes: {trigger: Level end (the closing line)}}

objectives:
  primary: reach-end
  secondary: {spared: wavering-stormhawk, label: HOLD FIRE, credits: 100, name: Hold fire on the wavering Ceres Wing}   # none of the six wavering Stormhawks destroyed (a hit does not fail it), met when the third pair has left; 100 in Act 1 terms: pays 655

music:
