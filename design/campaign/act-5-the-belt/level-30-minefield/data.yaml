ground_targets: []   # none: the level has no ground layer (ground: none)

secrets:
  - name: dead beacon buoy
    crate: 100   # Act 1 terms: pays 655 with the act factor (the lane authority's emergency stores)
    radio: {speaker: Rook, line: "Free stores from the lane authority. They won't miss them."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 26, enemy: talon, unit: first}}            # the t=26 squad leader (the V-wing's tip)
  - {pickup: shield cell, dropped_by: {wave: 110, enemy: gilded-gunship, unit: first}}   # the third convoy Gunship

drops:  # a CDF lane-service drone on the low-air layer releases an armour patch
  - {t: 100, x: 240, y: 380, pickup: armour patch}

radio:  # trigger: t or event; step C2 trimmed the timed lines to one radio page each (three 22-character lines: the README's two-page drafts ran up to 8 s late). Rook is back in the slot: his scripted lines (t=9, 47, 160) have no requires, his bark (t=123.5, step C3: after the convoy's line) needs him flying (requires: escort; the secret's line has no requires key). No enemy-channel line here.
  - {t: 1, speaker: Okafor, line: "Aegis, the Ceres loyalists need this lane open."}
  - {t: 9, speaker: Rook, line: "No water, no tunnels, no crate. I could kiss this lane."}
  - {t: 17.5, speaker: Varga, line: "A Minelayer, rising behind you. It lays a line. Find the gap."}
  - {t: 27, speaker: Varga, line: "Shoot a mine, its cluster goes. Fast blink? It bursts."}
  - {t: 37, speaker: Okafor, line: "Gunship ahead. Gold nose plate: hit its sides or engines."}
  - {t: 47, speaker: Rook, line: "Little darts coming out of that thing. Of course there are."}
  - {t: 59, speaker: Varga, line: "A drone train, right. Cut it near the engine: the rest dies."}
  - {t: 88, speaker: Okafor, line: "Convoy inbound: three Gunships with mines. None gets through."}
  - {event: secondary-objective, speaker: Okafor, line: "Convoy down. That's a lot fewer mines in the lane, Aegis.", notes: {trigger: "Secondary met (the third convoy Gunship down)"}}
  - {event: enemy-escaped, enemy: gilded-gunship, speaker: Varga, line: "One got through. Its mines will be in the lane by morning.", notes: {trigger: "Secondary failed (the first Gunship leaves the screen alive: an escape cue is per enemy, not per tag)"}}
  - {t: 123.5, speaker: Rook, requires: escort, line: "Six o'clock! A train's coming up behind us."}
  - {t: 131, speaker: Okafor, line: "The loyalists board a mining tug. This lane is their way out."}
  - {t: 142, speaker: Varga, line: "Two trains, both sides. Pick one."}
  - {t: 160, speaker: Rook, line: "Hey, Lancer. Thanks. For Dock 9. I'm not saying it twice."}
  - {event: level-end, speaker: Okafor, line: "The lane is open. Well flown, both of you.", notes: {trigger: Level end (the closing line)}}

objectives:
  primary: reach-end
  secondary: {escapes: gilded-gunship, tag: convoy, easy: {allowed: 1}, label: CONVOY, credits: 100, name: Stop the Gunship convoy}   # all three convoy Gunships (the waves tagged convoy) destroyed before they leave the bottom edge (easy: 2 of 3), failed by one away; 100 in Act 1 terms: pays 655

music:
  track: 12           # Act 5 A "Hollow Rock" (audio/music track list)
  start_section: 1    # the base stem in the lane's first section
  full_section: 2     # the full mix from the seeded lane (the first column)
  motif: {from: 0, sections: {}}   # Vorne's motif "in the open" (music, Cues per level (Act 5): on): track 12's motif stem on top from the base stem's start (section 1) to the end
  ambience: belt-open   # the belt's open-space bed (hull creaks, distant impacts, radio hiss through the hull)
  end_jingle: mission-complete

difficulty: {}  # the stat blocks' hooks apply (the Minelayer's easy 144 px gap and rings of 6, hard rings of 10 and 0.8 s arming; the Gunship's easy ring of 10 / 3.6 s and streams of 2, hard 14 / 2.6 s and streams of 4; the Serpent's easy 8 cars and 3.0 s turrets, hard 14 cars and bursts of 2; the Dart's hard 80°/s; the Talon's, the Mite's); the waves' easy/hard counts (columns of 3 on hard, escorts 3), the pincer one train on easy; the formation lever sizes the rest

briefing:
  pages:
    - {speaker: Okafor, image: level-30-shipping-lane, line: "Ceres is lost, but not everyone in it chose Vorne. The loyalists are leaving on a mining tug, and the only lane out is mined. Clear it before the tug sets out, and stop the Gunship convoy bringing more mines. Rook flies with you again. Welcome back, Aegis Two."}
    - {speaker: Varga, image: level-30-minelayer, line: "Minelayers come up from behind and lay a line across your path with one gap. Find the gap, or shoot a mine: its cluster goes with it. The Gunships are plated in front; their engines are not. And there is no ground out there, Lancer: the bombs stay idle."}
  teaser: {speaker: Rook, line: "Mines from behind? Then I want eyes in the back of the ship. That Swarm Tail, Lancer."}


