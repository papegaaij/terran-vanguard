# Level 30 – Minefield: the level script, rendered into README.md (briefing, threat profile, layout, waves, radio,
# credit budget). Times are seconds from the level start. M9 part C, step C2, from the README's approved hand tables
# (round 60) and ART-C's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block adopted as it is).
# Schema: ../../../tech/architecture/schemas-levels/README.md (the Act 5 keys: schemas-act-4)
# Keys new in M9 part C (flown from step C1; loaded and checked from step C1, mapped in step C2; drawn and played by
# step C4): `ground: none` (no ground layer: the bomb deliveries read NO GROUND and stay idle, nothing on the ground)
# and a mine layers' wave's `mine_lines` (unit i lays its line at rows[i % n] px below the top edge with its gap at the
# cluster boundary nearest gaps[i % m] px from the left edge; the column's units 2.5 s apart, the staggered entry).
# Step C2's own placements (pending the user's review in round 63): the dead beacon buoy (the secret) flies as a tow
# (Level 07's lifeboat rule: its 24 px housing takes 4 hits and frees the crate), not as ART-C's debris chunk: a debris
# chunk carries no secret; the large rocks at x 60 or 420 only (ART-C's x 240 sat in both gap points); every rock
# drifts at the scroll plus its own drift (the belt's "30–60 px/s plus the scroll", the large ones 20); the convoy
# Gunships fly a `column` beside their escorts' `carrier + escorts` wave (a launcher is a carrier, its escorts orbit it).
scroll_speed: 120     # the lane's first section; the minefield 80, the lane's end 100
launch_seconds: 5
bounty_scale: 0.36    # every bounty × 0.36 (step FIX7: re-fitted after the Minelayer's 60, not 30; was 0.43): the README's estimate 0.45, fitted in step C2 with the launched Darts (two streams a Gunship) and the offbeat waves (levelReport: typical haul on budget(30) 4,980)
control_prompts: []
medium: vacuum        # the belt: short flashes, debris rings, drifting wrecks (design/world/belt)
ground: none          # space only: no ground layer (J3); the Airstrike and the EMP Burst work
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The belt, shipping lane
  layers: [air]
  density: 3
  traits: [rear, piercing]
  hazards: [mine lines, drifting rocks]
  boss: none
  objective: CLEAR THE LANE   # the OBJECTIVE field from sensor L1
  varga:
    none: The lane out of Ceres, Lancer. Open space, and mined.
    l1: "Layers come from behind. No ground: the bombs stay idle."
    l2: "New: Minelayers, plated Gunships, drone trains, darts."
    l3: A rear gun for the layers, piercing to cut the lines.
  notes:
    Dominant layers: '`space` (= `air`: Minelayers, Gilded Gunships and their Darts, Rail Serpents, Talon wings, Skitter and Mote streams, Asteroid Mites on rocks); **no ground**'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: 'Mine lines (proximity, chained clusters); drifting rocks (small break, large are walls)'
    Boss / mid-boss: none
    Sensor-suite detail: '**none**: the belt, shipping lane, `space`, front and rear · **L1**: + directions (rear, sides), density {density}, hazards "mine lines" and "drifting rocks", the objective `{objective}`, the secondary `CONVOY 0/3` and the row `NO GROUND` · **L2**: + Minelayer, Gilded Gunship, Rail Serpent, Dart Drone (new), Talon, Asteroid Mite, Skitter and Mote portraits · **L3**: + `rear` and `piercing` highlighted, the wave strip marking the rear entries and the convoy'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp)
  - name: Lane Marker
    end: 30
    atmosphere: clear
    tiles: [lane-space, lane-dust]
    notes:
      layers:
        low-air: the first beacon buoys.
        air: a few small rocks with riders.
        deep: Ceres falling behind, the dust band.
      purpose: 'Popcorn and Talons; **the first Minelayer alone** (t=20) and its single line: learn the gap.'
  - name: The Seeded Lane
    end: 88
    speed: 80
    ramp: 2   # eased from 120 over its first 2 s
    atmosphere: clear
    tiles: [lane-space, lane-dust]
    notes:
      layers:
        air: 'the rock field: small breakable rocks and **one large** at a time.'
        low-air: buoys, some dark (shot out).
      purpose: 'Lines in pairs from behind; the Gunship alone (t=40, quiet window t=38–42); the first Rail Serpent from the right (t=62).'
  - name: Convoy Crossing
    end: 134
    speed: 80
    atmosphere: clear
    tiles: [lane-space, lane-dust]
    notes:
      layers:
        air: rocks (up to two large); the dead beacon buoy drifting at t≈118 (the secret).
        deep: the convoy's running lights far ahead before it arrives.
      purpose: 'The **convoy secondary** (t=96–110) between lines laid ahead of it; a train from behind (t=122).'
  - name: Lane End
    end: 178
    speed: 100
    ramp: 2   # eased from 80
    atmosphere: clear
    tiles: [lane-space, lane-dust]
    notes:
      layers:
        air: thinning rocks.
        low-air: the lane's last beacon, a tall mast with a green strobe.
        deep: the open belt ahead.
      purpose: 'Lines, a Serpent pincer (t=145), a Gunship pair, the run to the open belt. Level end at t=178 as the last beacon passes the bottom edge.'

tows:  # the dead beacon buoy (the secret): drifting down the left edge on the play plane; its housing (the tow's cable box) takes 4 hits and frees the crate (Level 07's tow rule: shots pass the rest); `beam_touch`: a beam's touch on the housing counts a hit per 0.25 s (round 64 C.1 a)
  - {t: 118, x: 60, drift: [4, -92], boat: [28, 28], pod: [20, 20], tether: [0, 0], cable: [24, 24], hits: 4, reveals: dead beacon buoy, beam_touch: true}

debris:  # the belt's rocks (design/world/belt, hazards; Level 03's rules): small ones break and pay nothing, large ones are walls (contact 10 once a second, step FIX6; `large` 20 before); bullets of both sides stop on both; sprites assets/sprites/debris-<chunk>_N (16 spin frames)
