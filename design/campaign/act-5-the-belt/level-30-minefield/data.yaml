    belt-large-a: {size: [88, 80], damage: 10}   # step FIX6: 10, not the `large` 20 (the user's playthrough 2026-10-30)
    belt-large-b: {size: [66, 60], damage: 10}
    belt-a: {size: [40, 36], hp: 6}
    belt-b: {size: [36, 32], hp: 6}
    belt-c: {size: [32, 28], hp: 6}
