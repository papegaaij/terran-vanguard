# Level 31 – Mining Rig Escort: the level script, rendered into README.md (briefing, threat profile, layout, waves,
# radio, credit budget). Times are seconds from the level start. M9 part D, step D2, from the README's approved hand
# tables (round 60, the tug 200×300: J.6 b) and ART-D's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop
# block, sections, nests and rocks adopted). Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M9 part D (flown from step D1; loaded and checked from step D1, mapped in step D2; drawn and played by
# step D4): the escort's `hull` block (the mining tug's station with its sway, entry, climb-out, HP per section by
# difficulty, the hook per kind, the unhooked waves by their t), the `CLEAN HULL` integrity secondary on a hull escort,
# the Shard Drone's linked waves (a line abreast `spacing` apart, a circle round its `at`) and the Buzzsaw's dashes.
# Step D2's own placements (pending the user's review in round 64; logged in the README's Decisions): the sway ±10 px
# across and ±2.5 px up and down (m9d §6, not the doc's ±20/±5: the strips beside the 200 px hull stay 130 px for the
# rear and side entries); the rear Dart streams enter up the side edges (x 24 / 456, the §6 rule x ≤ 110 or ≥ 370) and
# the side streams above the hull (y 120); Dacosta's claim flies as a tow (Level 30's buoy rule: the claim rock's
# housing takes 6 hits and frees the crate), not as a debris chunk (a chunk carries no secret); the armour patch drops
# at the cargo's place at t=110 whatever is left of the tug (the drop has no condition).
scroll_speed: 120     # the tug's crawl, throughout
launch_seconds: 5
bounty_scale: 0.36    # every bounty × 0.36: the README's estimate 0.40, fitted in step D2 (the section pay 786 counted) with the launched Darts (two streams a Gunship) and the offbeat waves (levelReport: typical haul on budget(31) 5,329)
control_prompts: []
medium: vacuum        # the belt: short flashes, debris rings, drifting wrecks (design/world/belt)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The belt, rock field
  layers: [air, ground]
  density: 4
  traits: [spread, side, homing]
  hazards: [drifting rocks, homing missiles]
  boss: none
  objective: ESCORT THE TUG   # the OBJECTIVE field from sensor L1
  varga:
    none: A mining tug full of refugees, and the whole belt after it.
    l1: Attacks from behind too. Watch the tug's engines.
    l2: "New: Hornets fire homing missiles at the tug. Shoot them down."
    l3: Rear and side entries marked. Spread for the missiles.
  notes:
    Dominant layers: '`space` (the play plane in vacuum: Talons, Hornets, Gunships, Shard groups, Buzzsaws, Darts, Skitters, motes, Mites on rocks), `ground` (the tug''s hull; two rock outcrops with SAM Nests)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: 'Drifting asteroids (big ones block shots and hurt on contact); homing missiles at the tug'
    Boss / mid-boss: none
    Sensor-suite detail: 'none: the open belt, `space` + `ground`, all directions, the objective `{objective}` · L1: + directions (front, sides, rear), density {density}, the hazard "drifting rocks", the secondary `CLEAN HULL` · L2: + Hornet (new), Shard Drone (new), Buzzsaw Drone (new), Dart Drone, Gilded Gunship, Talon, Asteroid Mite, SAM Nest portraits, the hooked kinds marked "targets the tug" · L3: + the rear and side entries on the threat arrows'

sections:  # back to back from t = 0; 120 px/s throughout (184 s, 22,080 px)
  - name: Bright Seam Dock
    end: 24
    atmosphere: clear
    tiles: [open-space, open-dust]
    notes:
      layers:
        ground: 'the mining rock Bright Seam''s dock gantries scrolling away, the tug rising into station (t 0–6).'
        low-air: two small ore haulers with refugees falling in behind it, on the background only.
      purpose: Popcorn and the first Darts at the bow.
  - name: The Open Belt
    end: 58
    atmosphere: clear
    tiles: [open-space, open-dust]
    notes:
      layers:
        air: the first drifting rocks (t≈26), at most 2 big ones on the screen.
        deep: Ceres a fading crescent behind.
      purpose: The first Hornet (t=24) and the first Buzzsaws (t=30.5); the first rear Darts (t=38).
  - name: The Linked Line
    end: 92
    atmosphere: clear
    tiles: [open-space, open-dust]
    notes:
      layers:
        ground: 'rock outcrop 1, a large asteroid''s sunlit face passing beside the tug with 3 SAM Nests on its pads (t≈60–66).'
        air: sparse rocks.
      purpose: The Shard groups (t=58 alone, then sent across the hull); the first Gunships.
  - name: The Drift
    end: 128
    atmosphere: clear
    tiles: [open-space, open-dust]
    notes:
      layers:
        air: 'the densest rock drift (up to 3 big rocks and 6 small on the screen), small rocks with Mites riding; the secret''s claim rock (t≈100).'
        ground: rock outcrop 2 with 3 SAM Nests (t≈119–126).
      purpose: Buzzsaw ricochets off the big rocks; Mites leaping off; rear Darts.
  - name: The Ambush
    end: 164
    atmosphere: clear
    tiles: [open-space, open-dust]
    notes:
      layers:
        air: rocks thinning.
        deep: Ascendancy running lights in the dust band (the ambushers' carrier, scenery).
      purpose: 'The heaviest pressure on the tug: three Hornets (t=134), Gunships, a Shard ring.'
  - name: The Vesta Relay
    end: 184
    atmosphere: clear
    tiles: [open-space, open-dust]
    notes:
      layers:
        deep: the relay's beacon tower and a CDF frigate, growing.
      purpose: The last waves; the climb-out at t=178.

tows:  # Dacosta's claim (the secret): a small hollow rock with a claim marker drifting through the Drift on the play plane; its housing (the tow's cable box) takes 6 hits (the README's 12 HP at 2 a Pulse Cannon bolt) and frees the crate (Level 07's tow rule: shots pass the rest); `beam_touch`: a beam's touch on the housing counts a hit per 0.25 s (round 64 C.1 a)
  - {t: 100, x: 300, drift: [-18, -146], boat: [34, 30], pod: [20, 20], tether: [0, 0], cable: [24, 24], hits: 6, reveals: Dacosta's claim, beam_touch: true}

