  - {pickup: overdrive, dropped_by: {wave: 134, enemy: hornet, unit: last}}       # the last Hornet of the t=134 trio

drops:  # the Bellwether's crew throws an armour patch out of the cargo hatch (at the cargo's place under the station)
  - {t: 118, x: 240, y: 380, pickup: armour patch}

radio:  # trigger: t or event; every timed line one radio page (three 22-character lines: 5 s), the story pair two. The Bellwether is the tug's captain (a new speaker, uncast until VOX-D); {section} names the hit or lost section (bow, cargo, engines). Rook's lines need him flying (requires: escort).
  - {t: 1, speaker: Bellwether, portrait: bellwether, line: "Bellwether to Aegis. Four hundred souls aboard. Stay close."}
  - {t: 10, speaker: Okafor, line: "Lancer, the tug is yours. Nothing touches it."}
  - {t: 16, speaker: Rook, requires: escort, line: "Big, slow and friendly. I can work with that."}
  - {t: 25, speaker: Varga, line: "Hornet. Its missiles go for the tug. Two hits each."}
  - {event: first-ally-hit, speaker: Bellwether, portrait: bellwether, line: "We're hit in the {section}! Get them off us!", notes: {trigger: "First section hit (`first-ally-hit`)"}}
  - {t: 39, speaker: Okafor, line: "Contacts behind you, on the tug's engines."}
  - {t: 59, speaker: Varga, line: "Linked drones. Kill one and its beams drop."}
  - {t: 79, speaker: Bellwether, portrait: bellwether, line: "You know why half of Ceres turned? Helix came with medicine."}
  - {t: 86, speaker: Bellwether, portrait: bellwether, line: "Lung rot, bone loss. Gone in a week. Nobody asked why."}
  - {t: 94, speaker: Varga, line: "Vrell biotech. They were cured with the enemy's blood."}
  - {t: 118, speaker: Bellwether, portrait: bellwether, line: "Throwing you a patch from the cargo hatch. It's all we've got."}
  - {t: 130, speaker: Okafor, line: "Ambush ahead. Gunships and missile boats. Hold the line, Aegis."}
  - {t: 137.5, speaker: Rook, requires: escort, line: "Three of them. I'll take the left one."}
  - {event: ally-lost, speaker: Bellwether, portrait: bellwether, line: "We've lost the {section}! We're still flying.", notes: {trigger: "A section lost (`ally-lost`)"}}
  - {t: 166, speaker: Okafor, line: "The Vesta relay. A frigate is waiting. Bring them in."}
  - {t: 176.5, speaker: Bellwether, portrait: bellwether, line: "Relay in sight. Thank you, Aegis. Tell Ceres we made it."}
  - {event: level-end, allies: [3, 3], speaker: Okafor, line: "Every one of them home. Well flown.", notes: {trigger: "Level end, all three sections home"}}
  - {event: level-end, allies: [1, 2], speaker: Okafor, line: "They made it. Not all of the ship did. That's enough today.", notes: {trigger: "Level end, one or two sections lost"}}
  - {event: mission-failed, speaker: Okafor, expression: grim, line: "The tug is gone, Lancer. Four hundred people. We go again.", notes: {trigger: Mission failed (the failed screen's line)}}

