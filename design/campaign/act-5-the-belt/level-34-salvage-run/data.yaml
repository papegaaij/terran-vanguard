secrets:  # the Salvage scanner's level: three hidden crates, its glint shows each trigger at any range
  - name: Vigil
    crate: 100   # Act 1 terms: pays 655 with the act factor (the frigate's stores)
    radio: {speaker: Okafor, line: "The Vigil. She held this lane in the first week. Take her stores, Lancer."}
  - name: Sable Wren
    crate: 100   # the courier's sealed medical crates
    radio: {speaker: Varga, line: "Helix courier. Sealed medical crates. I know what's grown in those."}   # step FIX2: one HUD page (was "A Helix courier. …", two), so it fits before Varga's t=108 when the hatch is shot as it passes the ship (t≈99.5)
  - name: Old Marta
    crate: 100   # the tender's strongbox
    radio: {speaker: Rook, requires: escort, line: "Old Marta. Somebody's grandmother's boat. Sorry, ma'am."}   # Rook's line: only with him flying

pickups:
  - {pickup: shield cell, dropped_by: {wave: 79, enemy: talon, unit: first}}    # the t=79 V-wing's leader (its tip)
  - {pickup: overdrive, dropped_by: {wave: 128, enemy: talon, unit: first}}     # the t=128 V-wing's leader
  - {pickup: story, story: helix-core, dropped_by: {group: helix-clamps, unit: last}}   # the Helix core (Q12 c, QG-2 a): rises out of the hold at the clamps' centre (108.3, 240) when the fourth is down; pays nothing, the Mk V comes with the win

drops:  # the CDF beacon on the Vigil (Level 33's nav buoy) opens and releases an armour patch
  - {t: 60, x: 235, y: 380, pickup: armour patch, sprite: nav-buoy}

radio:  # trigger: t or event; the gap check's §4 trims (Varga t=150, Okafor t=157 and the core's line to one radio page: three 22-character lines, 5 s); Rook's lines need him flying (requires: escort)
  - {t: 1, speaker: Okafor, line: "The graveyard, Lancer. Old wrecks, Helix and ours. The Ascendancy picks them over. So do we."}
  - {t: 13.5, speaker: Rook, requires: escort, line: "Quiet out here. I don't trust quiet."}   # step FIX2: t=12 → 13.5, so it starts on time voiced behind the two-page t=1
  - {t: 29, speaker: Varga, line: "Tanks on the hulls. The grey tanks from Tharsis, in their own colours now."}
  - {t: 40, speaker: Okafor, line: "They've stopped hiding, Doctor. Every crate you find, Lancer, the wing keeps."}
  - {t: 108, speaker: Varga, line: "That freighter's hold. Helix seals, a fusion core in the clamps. Shoot the clamps loose!"}
  - {event: story-collected, speaker: Okafor, line: "Helix core aboard. It'll be on the rack before Ceres.", notes: {trigger: "The core collected (event)"}}
  - {event: story-missed, speaker: Okafor, line: "Salvage tug has the core. Good enough, Lancer.", notes: {trigger: "The core missed (event: it leaves the screen, or the clamps leave unshot or the level ends first)"}}
  - {t: 130, speaker: Rook, requires: escort, line: "Finders keepers. Tell Helix to send us a bill."}   # step G2: t=128 → 130, so a core collected as late as t≈122.8 still finds its gap (its line 6.8 s + 0.4)
  - {t: 150, speaker: Varga, line: "Helix and ours, side by side, all dead. Look, Commander."}
  - {t: 157, speaker: Okafor, line: "I'm looking, Doctor. Ceres ahead, Lancer. Rest while you can."}   # step FIX2: t=159 → 157, so with the secondary met at t≈151 its line, Okafor's and *Old Marta*'s (t≈166.4) all play
  - {event: secondary-objective, speaker: Okafor, line: "Containers stripped. The quartermaster sends his thanks.", notes: {trigger: "Secondary met (at the end)"}}

objectives:
  primary: reach-end
  secondary: {escapes: cargo-container, allowed: 1, easy: {allowed: 2}, hard: {allowed: 0}, label: CONTAINERS, credits: 100, name: Strip the graveyard}   # open at least 5 of the 6 cargo containers (CDF and Helix: the look's variants) before they leave the screen (easy 4, hard all 6), failed by the second away; 100 in Act 1 terms: pays 655

music:
  track: 12           # Act 5 A "Hollow Rock" (audio/music track list): "the A theme stripped"
  start_section: 1    # the base stem from the start
  full_section: 6
  stems: {6: base}    # the base stem through the whole level, never the full mix
  section_db: {1: -3}   # the base stem 3 dB down throughout
  motif: {from: 106, to: 124, sections: {}}   # Vorne's motif stem once: in as the freighter's hold scrolls in, out after the core (to: M9 part G)
  ambience: belt-open   # the belt's open-space bed (hull creaks, distant impacts, radio hiss through the hull)
  ambience_layers:
    - {ambience: wreck-groans, from: 0, to: 174, fade_in: 3, fade_out: 3}   # the wrecks' slow metal groans (round 67), out before clear space
  end_jingle: mission-complete

difficulty: {}  # the stat blocks' hooks apply (the Warden Tank's easy 2-shot burst every 3.0 s, hard 4 every 2.0 s; the Needler's, the Talon's, the Mite's); the convoys of 2 on easy and 3 on hard (21 tanks), the clamps 10 HP on easy, the secrets' triggers 28 HP on hard, hard's Talon line at t=118 in the hold's quiet window; the formation lever sizes the rest

briefing:
  pages:
    - {speaker: Okafor, image: level-34-graveyard, line: "Before the Sovereign, we restock. A ship graveyard lies on the lane to Ceres, our hulls and Helix's. The Ascendancy has tanks on the wrecks. Take what you can carry, Lancer."}
    - {speaker: Varga, image: level-34-helix-hold, line: "Helix freighters went down out there with their holds sealed. If one carried Helix tech, I want it. Their generators run hotter than ours."}
  teaser: {speaker: Rook, line: "A salvage run. Finally, a mission where we get to keep things."}

backdrop:
  # Presentation only: Level 34's ship graveyard (tools/art/backdrop_l34.py, step ART-G, from the level's data.yaml).
  # A ground layer without a tile set: open space is the deep layer (the base); the ground holds the
  # hulls (CDF white-grey, Helix grey-gold with gold trim: QG-1 a) with the tank roads on their walkways
  # and keels, the freighter (two pieces placed exactly: stern + bow, 12 px overlap) and the scattered
  # plates; red-blink is the only animated ground piece (at most two on the screen). Deep: the dust band,
  # far wrecks, a far hulk turning, Ceres's point and the Sovereign's gold ring at the end.
  scroll_factors: {deep: 0.12, far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}   # far, low-air unused
  ramp: 2
  haze_colour: 09090e
  atmosphere:
    clear: {haze: 0.0}
  tile_sets:
    grave-space: {layer: deep, height: 1024}   # space, the sunlit dust band, stars
    grave-dust: {layer: high-air, height: 960}   # close grit and dust motes (transparent)
  pieces:
    far-wreck-a: {layer: deep, size: [140, 64]}
    far-wreck-b: {layer: deep, size: [110, 80]}
    far-hulk-turn: {layer: deep, size: [120, 120], frames: 16, fps: 0.5}
    ceres-point: {layer: deep, size: [48, 48]}
    sovereign-lights: {layer: deep, size: [128, 64]}
    plate-a: {layer: ground, size: [130, 100]}
    plate-b: {layer: ground, size: [160, 116]}
    plate-c: {layer: ground, size: [104, 140]}
    plate-helix: {layer: ground, size: [124, 104]}
    corvette-spine: {layer: ground, size: [140, 760]}
    cdf-frigate-a: {layer: ground, size: [184, 1080]}
    cdf-frigate-b: {layer: ground, size: [200, 1040]}
    vigil: {layer: ground, size: [220, 1040]}
    helix-hulk-a: {layer: ground, size: [240, 1120]}
    helix-hulk-b: {layer: ground, size: [240, 1100]}
    sable-wren: {layer: ground, size: [112, 224]}
    freighter-stern: {layer: ground, size: [480, 1300]}
    freighter-bow: {layer: ground, size: [480, 1500]}
    tangle-a: {layer: ground, size: [480, 820]}
    tangle-b: {layer: ground, size: [480, 840]}
    old-marta: {layer: ground, size: [240, 300]}
    red-blink: {layer: ground, size: [12, 12], frames: 2, fps: 1}
  placed:
    # the graveyard's edge: scattered plates
    - {piece: plate-a, t: 3.0, x: 380}
    - {piece: plate-c, t: 8.0, x: 96}
    # a broken corvette's spine (the first container on it)
    - {piece: corvette-spine, t: 20.0, x: 170}
    - {piece: plate-b, t: 22.0, x: 370}
    - {piece: plate-helix, t: 27.0, x: 410}
    # a third frigate of the picket
    - {piece: cdf-frigate-b, t: 31.0, x: 375}
    - {piece: plate-b, t: 42.5, x: 70}
    - {piece: plate-a, t: 47.0, x: 160}
    - {piece: plate-c, t: 63.0, x: 400}
    - {piece: plate-helix, t: 66.0, x: 80}
    # a hulk at the right edge (the Sable Wren wedged against it)
    - {piece: helix-hulk-a, t: 97.0, x: 560}
    - {piece: helix-hulk-b, t: 83.0, x: 420}
    - {piece: plate-helix, t: 80.0, x: 60}
    - {piece: plate-a, t: 104.0, x: 80}
