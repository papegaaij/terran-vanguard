# Level 34 – Salvage Run: the level script, rendered into README.md (briefing, threat profile, layout, waves, ground
# targets, radio, credit budget). Times are seconds from the level start. M9 part G, step G2, from the README's approved
# hand tables (round 60) and ART-G's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block, the convoys'
# road paths, the ground objects' places, the beacon's drop and the light debris adopted as they are).
# Schema: ../../../tech/architecture/schemas-levels/README.md (the Act 5 keys: schemas-act-4)
# Keys new in M9 part G (flown from step G1; loaded and checked from step G1, mapped in step G2; drawn and played by
# step G4): the secondary's `escapes` over a ground object's look (`cargo-container`: its `-cdf` and `-helix` variants
# count; destroyed = opened, off the bottom edge = away), a `story` pickup dropped by a destructible group (the Helix
# core: it rises out of the hold at the four clamps' centre, pays nothing, collected by flying through it) with the
# radio events `story-collected` and `story-missed`, the music's `motif.to` (the motif's window ends inside a section),
# the Warden Tank's `livery` (its own data: the Ascendancy's look from Act 5).
# Decided before G2 (m9g-gaps.md §5, pending round 67): QG-1 a (the Helix hulls a step lighter: backdrop), QG-2 a (the
# crate rises on its seal's glow; a missed core is radio only, no tug sprite), the core a story pickup (not the L06 data
# core), the Mk V's unlock the generator data's `available: L35`, the containers ground objects, the livery a look.
# Step G2's own placements (pending the user's review in round 67; logged in the README's Decisions): the Skitter swarms
# fly as snakes of 4 from alternating edges (a swarm needs a route, as Levels 29 and 33), the Mites' rocks drift at the
# scroll plus 15 px/s (slow rocks: the riders stay longer under the beam), the Mote Swarms weave on Level 33's two paths
# at 180 px/s, the far deck's tank pair at t=123 (ART-G), the radio's long lines trimmed to one page (gap check §4).
scroll_speed: 130     # the graveyard; the freighter's hold 110 (eased over 2 s each way)
launch_seconds: 5
bounty_scale: 0.27    # every bounty × 0.27: the README's hand estimate 0.45 at ≈ 86 a minute, fitted in step G2 with the offbeat Talon trios (levelReport: typical haul on budget(34) 6,528)
control_prompts: []
medium: vacuum        # the belt: short flashes, debris rings, drifting wrecks (design/world/belt)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The belt, Graveyard
  layers: [ground, air]
  density: 2
  traits: [anti-ground, spread]
  hazards: [tank fire, mining charges]
  boss: none
  objective: CROSS THE GRAVEYARD   # the OBJECTIVE field from sensor L1
  varga:
    none: A ship graveyard. Quiet, for once. Look in every wreck.
    l1: Tanks on the hulls, a few fighters. Crates everywhere.
    l2: The grey tanks of Tharsis, in Ascendancy colours now.
    l3: Three hidden crates, six containers. Bring a scanner.
  notes:
    Dominant layers: '`ground` (the derelict hulls: Warden Tank convoys on their roads, the containers, the hidden crates, the freighter''s hold), `air` (written `space`: Needler lines, three Talon wings and a Talon line, the Vrell popcorn and the Asteroid Mites on their rocks)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: 'The tanks'' bursts, also back up the screen; drifting asteroids; mining charges on the wrecks (they never hurt the ship)'
    Boss / mid-boss: none
    Sensor-suite detail: 'none: the belt, the ship graveyard, `ground` + `air`, front · L1: + direction, density {density}, hazards "tank fire" and "mining charges", the objective `{objective}` and the secondary `CONTAINERS 5/6` · L2: + Warden Tank (Ascendancy livery), Needler, Talon, Stinger, Asteroid Mite, Skitter, Mote Swarm portraits; the Helix crate marked as an objective pickup · L3: + the three hidden crates'' sections on the timeline strip, `anti-ground` highlighted'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); ART-G's reading of the Layout table
  - name: Graveyard Edge
    end: 25
    atmosphere: clear
    tiles: [grave-space, grave-dust]
    notes:
      layers:
        ground: scattered hull plates and a broken CDF corvette's spine.
        air: small drifting rocks with Mites.
        deep: the dust band, far wrecks.
      purpose: Popcorn and Needlers; the first container (t≈18).
  - name: The CDF Picket
    end: 65
    atmosphere: clear
    tiles: [grave-space, grave-dust]
    notes:
      layers:
        ground: 'three broken CDF frigates side by side, their dorsal walkways the tanks'' roads (convoys t≈32, t≈50), a mining charge on a frigate''s flank (t≈51), two containers (t≈38, t≈58); the frigate *Vigil*''s bridge (t≈56, the first secret).'
      purpose: The tanks in livery taught; the first Talon wing (t=39).
  - name: Helix Hulks
    end: 105
    atmosphere: clear
    tiles: [grave-space, grave-dust]
    notes:
      layers:
        ground: 'gutted black-and-gold Helix ore freighters, tank convoys along their keels (t≈70, t≈88), a mining charge (t≈89), a container (t≈80); the Helix courier *Sable Wren* wedged between two hulls (t≈96, the second secret).'
      purpose: Tanks and Needlers; the sky quiet between waves.
  - name: The Freighter
    end: 135
    speed: 110
    ramp: 2   # eased from 130 over its first 2 s
    atmosphere: clear
    tiles: [grave-space, grave-dust]
    notes:
      layers:
        ground: 'one huge Helix freighter, its hold open to space; **the Helix core** in four clamps in the hold (t≈108–120); a tank pair on its far deck (t≈123). No air wave from t=113 to t=122.'
      purpose: The salvage set piece (Q12 c).
  - name: The Tangle
    end: 172
    speed: 130
    ramp: 2   # eased from 110
    atmosphere: clear
    tiles: [grave-space, grave-dust]
    notes:
      layers:
        ground: 'wrecks of both fleets tangled together, the tanks'' last convoys (t≈140, t≈158), a mining charge (t≈141), two containers (t≈150, t≈170); the prospector''s tender *Old Marta* under a Helix hull (t≈165, the third secret).'
      purpose: The level's busiest stretch (still a breather).
  - name: Clear Space
    end: 186
    atmosphere: clear
    tiles: [grave-space, grave-dust]
    notes:
      layers:
        ground: the last plates falling behind.
        deep: Ceres ahead, a hard white point, and beside it a ring of gold lights, the Sovereign.
      purpose: Release; the level ends at t=186.

