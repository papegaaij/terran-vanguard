backdrop:
  # Presentation only: Level 48's citadel (tools/art/act7_citadel.py citadel, step ART-F, sections from the README's Layout table).
  # Vacuum: no haze. Deep: one continuous field (the void below the citadel, its towers, the spire, the pale
  # shimmer by t~235) cut at the sections' seams: deep-3 spans sections 3-6 (the spire held in the halt).
  # Ground: a tile set a section (1 outer-growth, 2 gold-decks, 3 spire-road, 7 spire-wall); sections 4-6's
  # ground is the `heart` piece (exact rows), which ends in the spire wall's own rows; seam pieces blend the
  # tiles' own rows along a ragged line. Re-run the generator after moving a section.
  # F4 hooks: (1) every ground `<tile>-veins` / `<piece>-veins` image is the veins' pulsing share (additive,
  # not listed: C4's VeinPulse, k(t) <= 0.5 Hz); (2) `spire-well` + `-glow` by the boss: frame 0 shut until
  # the sting, 1-8 the lid splitting (4 fps, 2 s), then 9-11 open (4 fps loop); (3) each `core-vein-l/r`
  # piece belongs to the core whose place is its bottom centre (the order below, C1..C10): its `-glow` (drawn
  # additive at the piece) loops 0-11 (8 fps: one pulse up the vein in 1.5 s) while the core lives, plays
  # 12-17 once (6 fps: dark from the core outward over 1 s) at its death, then is not drawn; the vein piece
  # itself stays (the dark channel). Until then the data's loop plays every frame.
  scroll_factors: {deep: 0.15, far: 0.5, ground: 1, low-air: 1.3, high-air: 1.7}   # far, high-air unused
  ramp: 2
  haze_colour: 07050c
  atmosphere:
    clear: {haze: 0.0}   # vacuum: no haze, no wisps
  tile_sets:
    deep-1: {layer: deep, height: 1536}   # section(s) 1
    deep-2: {layer: deep, height: 1376}   # section(s) 2
    deep-3: {layer: deep, height: 1184}   # section(s) 3, 4, 5, 6
    deep-4: {layer: deep, height: 1504}   # section(s) 7
    outer-growth: {layer: ground, height: 960}   # section 1: ridged growth over buried gold plating, side chasms
    gold-decks: {layer: ground, height: 960}   # section 2: decks over whole gold hulls
    spire-road: {layer: ground, height: 960}   # section 3: the causeway (x ~75-405)
    spire-wall: {layer: ground, height: 960}   # section 7: the spire's inner wall round the dead gold mast
  pieces:
    seam-2: {layer: ground, size: [480, 256]}
    seam-3: {layer: ground, size: [480, 256]}
    heart: {layer: ground, size: [480, 1060]}
    spire-well: {layer: ground, size: [320, 280], frames: 12, fps: 4}
    spire-well-glow: {layer: ground, size: [320, 280], frames: 12, fps: 4}
    core-vein-l: {layer: ground, size: [80, 560]}
    core-vein-l-glow: {layer: ground, size: [80, 560], frames: 18, fps: 8}
    core-vein-r: {layer: ground, size: [80, 560]}
    core-vein-r-glow: {layer: ground, size: [80, 560], frames: 18, fps: 8}
    gold-hull-a: {layer: ground, size: [112, 152]}
    gold-hull-b: {layer: ground, size: [120, 148]}
    gold-hull-c: {layer: ground, size: [104, 144]}
    archive-hull: {layer: ground, size: [116, 156]}
  placed:
    # the section 1/2 ground seam (exact rows)
    - {piece: seam-2, t: 45.209, x: 240}
    # the section 2/3 ground seam (exact rows)
    - {piece: seam-3, t: 117.326, x: 240}
    # sections 4-6's ground, rows 19600-20660 (exact): the citadel's heart, its veins converging on the spire well
    - {piece: heart, t: 182.926, x: 240}
    # the spire well (row 20400: its centre at screen y 60 at the halt, the Chimera's rise from (240, 60)); F4: frame 0 until the sting, 1-8 at the sting (4 fps), then 9-11 loop
    - {piece: spire-well, t: 189.5, x: 240}
    # core C1: its open hull (the hold on the core, row 6490)
    - {piece: gold-hull-a, t: 52.4, x: 118}
    # core C1: its vein up toward the spire (bottom on the core); F4: -glow frame by the core's state
    - {piece: core-vein-l, t: 54.964, x: 118}
    # core C2: its open hull (the hold on the core, row 6655)
    - {piece: gold-hull-b, t: 53.9, x: 356}
