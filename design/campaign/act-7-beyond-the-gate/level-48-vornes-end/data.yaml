# Level 48 – Vorne's End: the level script, rendered into README.md (briefing, threat profile, layout, waves, radio,
# credit budget). Times are seconds from the level start (the level clock: it halts at t=187 while the Chimera lives and
# 8 s after its K). M11 part F, step F2, from the README's approved hand tables (round 84).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M11 part F (flown from steps F1/F1b; loaded and checked from step F2): a rear wave's `lane: away` (it comes
# up in the lane the ship is not in: a rear V-wing's tip at least 120 px off the ship's x at the warning), the tracker's
# `leaving: {bottom_band: 120}` (the amber blink while a live reactor core is in the field's bottom 120 px), the radio
# event `rear-sweep` (subject 1 or 2: Rook's two sweep barks in turn) and the boss-phase subject `last-words` (K);
# the mid-boss `vornes-chimera`'s keys are its stat block's (rise, rear_sweep, last_words, part_shields, rook, bar).
# Step F2's own placements (pending the user's review in round 93): the turret nests as ground targets (their units at
# the table's times and counts, beside the cores, never on them, on the decks' solid ground); the reactor cores as
# ground targets of their own unit (`reactor-core`, `counted: false`) at ART-F's places (concept/backdrop-proposal.yaml,
# C1-C10); Vorne's archive a `ground` destructible with the secret's crate (Level 45's courier cyst); the backdrop
# ART-F's proposal as it is; the density waves (the final-act rule) marked "Step F2: density".
scroll_speed: 120     # section 1; the sections' own speeds after it, each change eased over 2 s
launch_seconds: 5
bounty_scale: 0.17    # every bounty × 0.17: step F2's levelReport fit with the density waves (the README's hand estimate 0.32 before them; the crate and the secondary are not scaled: typical 16,795, −0.2 %)
control_prompts: []
medium: vacuum        # Vrell space: short flashes and debris rings, no smoke (design/world/vrell-space)
beyond_gate: true     # past the fleet's net: the Airstrike and the Orbital Lance read NO COVER; the Swarm Call works
radio_noise: 5        # the friendly radio's noise, step 5 (held from L47 to L50); the Choir's channel clean
leaving: {bottom_band: 120}   # the tracker's well blinks amber while a live reactor core is in the field's bottom 120 px
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The Vrell citadel
  layers: [air, ground]
  density: 5
  traits: [rear, homing]
  hazards: [rear waves]
  boss: Vorne's Chimera
  objective: STOP VORNE   # the OBJECTIVE field from sensor L1
  varga:
    none: "Vorne's End. A citadel grown over Ascendancy wrecks."
    l1: "Ahead and behind. Live gold cores. Something in the spire."
    l2: "Chimeras, Harrows, Wraiths. Grown turrets on the decks."
    l3: "Guard your rear. Missiles chase what comes up behind."
  notes:
    Dominant layers: '`air` (Chimeras, Harrows, Wraiths, the swarms; the mid-boss) and `ground` (the grown decks: Graft Turrets, Spine Turrets, Polyp Mortars and the gold reactor cores)'
    Attack directions: '{directions} by the waves'' data; the mid-boss''s rear sweep'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: The rear waves; the Polyp Mortars' marked impacts; the Harrows' burst rings; the mid-boss's lance, lobs and rear sweep (its document)
    Boss / mid-boss: 'mid-boss [Vorne''s Chimera](../../../enemies/bosses/vornes-chimera/README.md) (Q5 a)'
    Special limits: '`NO COVER` (the Airstrike, the Orbital Lance; J12), as the act''s every level'
    Sensor-suite detail: '**none**: the Vrell-grown citadel, `air` and `ground`, front and rear · **L1**: + density {density}, the hazard "rear waves", the objective `{objective}`, the secondary `CORES 0 / 8`, the mid-boss row, `SPECIAL LIMITED` (`NO COVER`) · **L2**: + Chimera, Harrow, Wraith, Graft Turret, Spine Turret, Polyp Mortar, Needler, Stinger, Skitter, Mote and Choir Seraph portraits; the mid-boss''s silhouette (named at the sting) · **L3**: + `rear` and `homing` highlighted, the wave strip marking the rear waves and the arena'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); ART-F's tile sets cut at these rows (section 4 split at t=180, where the ease to the halt starts)
  - name: The Outer Growth
    end: 44
    atmosphere: clear
    tiles: [deep-1, outer-growth]
    notes:
      layers:
        ground: the first grown decks, ridged teal-black tissue over buried gold plating, side chasms.
        deep: the citadel's towers rising ahead.
      purpose: The regulars; the first turret nests; the first rear wave (t=17).
  - name: The Gold Decks
    end: 116
    speed: 110
    ramp: 2
    atmosphere: clear
    tiles: [deep-2, gold-decks]
    notes:
      layers:
        ground: decks laid over whole gold hulls, open hulls with the reactor cores (t≈50, 70, 92), veins running up the screen.
        deep: towers of growth and wreckage.
      purpose: Rear wings and Harrow streams; Graft Turret nests by the cores.
  - name: The Spire Road
    end: 176
    speed: 100
    ramp: 2
    atmosphere: clear
    tiles: [deep-3, spire-road]
    notes:
      layers:
        ground: a broad grown causeway, the last cores (t≈126, 150) and Vorne's archive (the secret, t≈138); every vein converging ahead.
        deep: the spire, a tower of growth round a gold mast.
      purpose: The Harrow cross (t=133); the last approach wave at t=169.
  - name: The Spire Well
    end: 178
    speed: 100
    atmosphere: clear
    tiles: [deep-3]
    notes:
      layers:
        ground: the citadel's heart, the spire well at the top centre, its tissue lid veined with gold light.
      purpose: The pre-arena pause (t≈177–186); Varga's warning at t=178.
  - name: The Spire Well, braking
    end: 186
    speed: 20
    ramp: 8   # eased from 100 to 20 px/s over t=178–186 (a boss's arena moves: Level 40's 20 px/s), the scroll at ART-F's halt row (19,920) at t=187
    atmosphere: clear
    tiles: [deep-3]
    notes:
      layers:
        ground: as section 4, the well's lid coming to the top centre.
      purpose: The scroll eased to a halt; the pause holds.
  - name: The Heart
    end: 187   # the arena: the scroll halted at its end while the Chimera lives (the built clock), the level clock with it
    speed: 20
    arena: true
    hold_after_boss: 8   # s the clock stays halted after K (Vorne's last line 4.5 s, the 2 s chain, the credit shower)
    atmosphere: clear
    tiles: [deep-3]
    notes:
      layers:
        ground: as section 4, held still; the lid splits at the sting.
      purpose: 'The sting at t=186, the mid-boss (≈ 67 s at medium); the clock halted while it lives.'
  - name: Through the Spire
    end: 248
    speed: 140
    ramp: 2   # eased up from the halt over 2 s
    atmosphere: clear
    tiles: [deep-4, spire-wall]
    notes:
      layers:
        ground: the spire's inner wall, rings of tissue round the dead gold mast, sliding by.
        deep: a pale shimmer at the top (Level 49's memory) by t≈235.
      purpose: The calm to t=191, then the Choir's answer (rear wings, a Seraph pair, Wraiths); the last wave at t=235; the level ends at t=248 in the spire's throat.

boss:  # the mid-boss: the sting, the bar (three segments) and the boss checkpoint (none on hard) at the arena's start; it rises out of the spire well (no edge warning)
  enemy: vornes-chimera
  t: 186
  x: 240
  section: 6
  notes:
    from: 'the spire well at the top centre (its rise, 4 s)'
    waves: 'At the arena''s start: the sting, the bar and the checkpoint; nothing enters in the fight but what it launches'

