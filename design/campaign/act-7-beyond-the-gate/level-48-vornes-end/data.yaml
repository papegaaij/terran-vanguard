radio:  # trigger: t or event; the README's lines (the 1 s rule). Rook's barks need him flying (requires: escort). Vorne on the enemy channel in his fused voice (portrait vorne-fused), the Choir on the enemy channel, clean (J3); the fight's lines are events (`boss-arrival`, `boss-phase` subjects), queued as phase lines (they wait for a gap); clock times after t=187 are the clock's after the fight
  - {t: 1, speaker: Okafor, line: "Aegis, Steadfast. The citadel grew over the wrecks Vorne brought through. His lifeboat ran here."}
  - {t: 13, speaker: Rook, requires: escort, line: "Movement under us. Things come up from behind in here.", notes: {trigger: "bark, `requires: escort`"}}
  - {t: 21, speaker: Varga, line: "The gold reactors in those wrecks are still live. The growth is drinking from them."}   # step F2: Rook at t=13, Varga at t=21 and Okafor at t=33 (the README's 11, 19, 29): each waited 1.2-1.7 s behind the line before (RadioTimelineLevel48Test, the 1 s rule)
  - {t: 33, speaker: Okafor, line: "Then starve it. Burn every core you pass, Aegis."}
  - {t: 100, speaker: Okafor, line: "Halfway to the spire. Keep your tail clear, Lancer."}
  - {t: 120, speaker: Varga, line: "The spire is the citadel's heart. Every vein in here runs into it."}
  - {t: 150, speaker: Rook, requires: escort, line: "If he's in there, he knows we're coming. Vorne always knew.", notes: {trigger: "bark, `requires: escort`"}}
  - {event: secondary-objective, speaker: Okafor, line: "Cores are dark. Whatever they were feeding is starving now.", notes: {trigger: "Secondary met (`secondary-objective`, the eighth core down)"}}
  - {event: secondary-failed, speaker: Varga, line: "Cores got past us. The growth will feed on them.", notes: {trigger: "Secondary failed (the third core away)"}}
  - {t: 176, speaker: Varga, line: "Energy rising in the spire well. Something is coming up through it."}   # step F2: t=176, not 178: Vorne's line 1 at the sting (t=186) started 2.7 s late behind it (RadioTimelineLevel48Test)
  - {t: 186, speaker: Vorne, channel: enemy, portrait: vorne-fused, expression: smug, line: "Lancer. You followed me all the way in. How loyal. How very Coalition.", notes: {trigger: "The sting (t=186, before it shows): the boss document's line 1"}}
  - {event: boss-arrival, speaker: Vorne, channel: enemy, portrait: vorne-fused, line: "Look what they grew for me. I asked for a ship. They gave me a body.", notes: {trigger: "In place (`boss-arrival`): line 2"}}
  - {event: boss-arrival, delay: 8, speaker: Okafor, line: "That's Vorne in there, Aegis. What's left of him. End it.", notes: {trigger: "`boss-arrival` + 8 s"}}
  - {event: boss-phase, phase: first-part, speaker: Vorne, channel: enemy, portrait: vorne-fused, line: "I kept my side of every bargain I ever made. They kept theirs. Forever, they said.", notes: {trigger: "The first phase-1 part down or 15 s into phase 1 (`boss-phase`): line 3"}}
  - {event: boss-phase, phase: The tissue, speaker: The Choir, channel: enemy, line: "…he is ours… he sings with us… he is afraid with us…", notes: {trigger: "The fusion's pain, its first second (`boss-phase`): line 4, the Choir"}}
  - {event: boss-phase, phase: The tissue, speaker: Vorne, channel: enemy, portrait: vorne-fused, expression: rage, shout: true, line: "Get out of my head!", notes: {trigger: "Right after it: line 5, **shouted** (the voice check's one Act 7 exception)"}}
  - {event: boss-phase, phase: first-sac, speaker: Vorne, channel: enemy, portrait: vorne-fused, expression: rage, line: "You think this war was about Earth? Earth was the price, Lancer. I was buying time.", notes: {trigger: "The first sac dead or 10 s into phase 2 (`boss-phase`): line 6, strained"}}
  - {event: boss-phase, phase: Both, speaker: Vorne, channel: enemy, portrait: vorne-fused, line: "One last deal, Lancer. Walk away, and I'll tell you what's out there.", notes: {trigger: "The capsule opens (`boss-phase`): line 7, cold again"}}
  - {event: boss-phase, phase: capsule-half, speaker: Vorne, channel: enemy, portrait: vorne-fused, expression: rage, line: "I built an empire out of three moons and a grudge. I will not end as a song.", notes: {trigger: "The capsule below half its HP (`boss-phase`): line 8"}}
  - {event: rear-sweep, subject: '1', speaker: Rook, requires: escort, line: "He's dropping! Watch the bottom edge!", notes: {trigger: "A rear sweep's tell (`rear-sweep`, the first, third ...: bark, `requires: escort`)"}}
  - {event: rear-sweep, subject: '2', speaker: Rook, requires: escort, line: "Under you, Lancer! Coming up the far side!", notes: {trigger: "The second, fourth ... sweep's tell (bark, `requires: escort`)"}}
  - {event: boss-phase, phase: last-words, speaker: Vorne, channel: enemy, portrait: vorne-fused, line: "Do you know what's coming after them, pilot? Do you have any idea what I was trying to—", notes: {trigger: "K, the capsule's death (`boss-phase` `last-words`): line 9, cut at the dash by the burst"}}
  - {event: boss-destroyed, delay: 5.5, speaker: Rook, requires: escort, line: "He was trying to tell us something. Right to the end.", notes: {trigger: "The burst (`boss-destroyed`, K + 4.5 s) + 5.5 s: t=189 of the clock after the fight (its 8 s hold from K), `requires: escort`"}}   # step F2: on the burst, not timed: a run without the fight held Vorne's sting line over t=189
  - {t: 198, speaker: Varga, line: "At the end he was afraid, Rook. Afraid like they are."}   # step F2: t=198 and Okafor's t=207 (not 195, 202): a run without the fight (the radio timeline's empty run) plays Vorne's sting line to t≈197
  - {t: 207, speaker: Okafor, line: "Vorne's war is over. Ours isn't. Out through the spire, Aegis."}
  - {t: 219, speaker: The Choir, channel: enemy, line: "…he sang with us… now he is quiet…", notes: {trigger: "enemy channel"}}   # step F2: t=219, not 212 (the 1 s rule behind the post-fight lines)
  - {t: 236, speaker: Varga, line: "Past the spire my readings make no sense. Like flying into a memory."}

