ground_targets: []   # none: the level has no ground layer (ground: none)

secrets:
  - name: gold shard
    crate: 100   # Act 1 terms: pays 1,678 with the act factor (Vorne's lifeboat's plating)
    radio: {speaker: Varga, line: "Gold plating. Ascendancy work. Vorne came through here."}

pickups:
  - {pickup: shield cell, dropped_by: {wave: 54, enemy: mantis, unit: first}}   # the t=54 Mantis
  - {pickup: overdrive, dropped_by: {wave: 70, unit: first}}                   # the t=70 chain's head
  - {pickup: armour patch, dropped_by: {wave: 140, unit: first, tail: true}}   # the t=140 chain's tail (no supply drone reaches into the gate)

radio:  # trigger: t or event; the README's lines (the 1 s rule). Rook's reversal calls (t=98, t=168) and his t=28 line are scripted (no requires: the call is one of the reversal's two tells); his barks need him flying (requires: escort). The Choir once on the enemy channel, clean. Vorne is silent.
  - {t: 1, speaker: Okafor, line: "Aegis, Steadfast. We're in the ring behind you. Nothing in here is where it should be."}
  - {t: 13, speaker: Varga, line: "Everything drifts in here but you. Fly your ship, not the stars."}
  - {t: 21, speaker: Varga, line: "A violet ring is where a Skater lands. Shoot the ring."}
  - {t: 28, speaker: Rook, line: "Lancer, I think the stars are seasick. I know I am."}
  - {t: 37, speaker: Varga, line: "The current's turning. Waves ride in on it from upwind. Watch that edge."}
  - {event: first-landing-kill, speaker: Rook, requires: escort, line: "Caught one landing. Shoot the ring, eh?", notes: {trigger: "The first Rift Skater killed within 0.5 s of landing (event, bark, `requires: escort`)"}}
  - {t: 66, speaker: Okafor, line: "Coilwyrm in the current. Go for the head."}
  - {t: 98, speaker: Rook, shout: true, line: "It's flipping! Eyes behind!", notes: {trigger: "reversal 1's tell"}}
  - {t: 112, speaker: The Choir, channel: enemy, line: "…the door is open… every light that crosses… it sees…", notes: {trigger: "enemy channel"}}
  - {t: 120, speaker: Varga, line: "Did you hear that? I have never heard the Choir afraid."}
  - {t: 148, speaker: Okafor, line: "Aegis, your signal's breaking up. Stay on the current. We'll find you."}
  - {t: 168, speaker: Rook, shout: true, line: "Flipping again! Behind us!", notes: {trigger: "reversal 2's tell"}}
  - {t: 180, speaker: Varga, line: "The narrows. The current swings hard from here. Read the stars."}
  - {event: first-kind-kill, enemy: coilwyrm, speaker: Rook, requires: escort, line: "Wyrm's down. Just like old times.", notes: {trigger: "The first chain's head destroyed (event, bark, `requires: escort`)"}}
  - {t: 252, speaker: Okafor, line: "Light ahead, Aegis. The far side. Hold there for the fleet."}
  - {event: secondary-objective, speaker: Okafor, line: "Nothing followed us through. Clean work, Aegis.", notes: {trigger: "Secondary met (level end, before the level-end line)"}}
  - {event: level-end, speaker: Okafor, line: "Steadfast is through. The fleet is gathering behind you.", notes: {trigger: Level end}}

objectives:
  primary: reach-end
  secondary: {kill_ratio: 0.65, credits: 100, name: Leave nothing to follow the fleet}   # at least 65 % of the level's enemies (422 of 648 at medium, easy 324 of 497, hard 520 of 800: step B3b's denser mixed waves; a unit the drift carries out through a side edge has left: no bounty, not a kill), judged at the end (KILLS n / 422); 100 in Act 1 terms: pays 1,678

music:
  track: 17           # Act 7 B "Hollow Light" (audio/music track list); its stems base, full and choir (MUS-B)
  start_section: 1    # the intro and the base over the far mouth
  full_section: 2     # the full mix from the current to the narrows
  stems: {9: base}    # the base again out of the gate
  duck: {on: reversal, db: -3, seconds: 5}   # each reversal ducks the theme for its run under the reversal groan (its own run: 4 s, 5 s; easy 3 s: step B4)
  ambience: vrell-gate
  ambience_layers:
    - {ambience: event-plane, from: 0, to: 264, fade_in: 1, fade_out: 0}   # the event plane's layer for the whole level: a slow deep groan of stressed space under a faint high shimmer (round 84 S.38 b)
  end_jingle: mission-complete

difficulty: {}  # the stat blocks' hooks apply (the Rift Skater's easy ring 0.7 s, burst of 2, 2 jumps, hard 4 jumps; the Coilwyrm's hard 14 segments; the Mantis's, the Lamprey's, the Harrow's, the Stinger's); the current's easy scale and runs in its block; the Skater intro pinned; the hard crossing pair its own wave; the formation lever sizes the rest

briefing:
  pages:
    - {speaker: Okafor, image: level-44-the-crossing, line: "We are inside the gate, and the crossing takes minutes, not seconds. Aegis Wing scouts ahead of the fleet to the far side. Kill what you can, Lancer: everything you leave meets the fleet behind you. Our signal will be bad in there. Keep Rook close."}
    - {speaker: Varga, image: level-44-rift-skater, line: "Rift Skaters jump: a violet ring marks the landing half a second ahead, and they fire as they land. Space drifts in there, and twice it runs backwards: Rook calls it, the HUD shows a chevron. Your controls never turn. In your shop: the Choir Resonator."}
  teaser: {speaker: Rook, line: "In there, behind you is just another way in. Bring a tail gun."}

backdrop:
  # Presentation only: Level 44's event plane (tools/art/backdrop_l44.py, step ART-B, sections from the level's data.yaml).
  # Every tile set wraps in x and y: the level's `current` slides each layer sideways at its factor (deep
  # least; BackdropTiles' lateral shift), eased to a stop and run back in a reversal. The deep field is one
  # continuous field cut at the sections' seams (LevelData.seam): re-run the generator after moving a
  # section. The plane's slow warp: BackdropAtmosphere's smooth UV wobble (<= 0.5 Hz), from plane-warp.png
  # (a data image, not a region to draw; step B4). The level opens in the transit's violet (B4).
  scroll_factors: {deep: 0.15, far: 0.3, ground: 1, low-air: 1.3, high-air: 1.7}   # far, ground unused
  ramp: 2
  haze_colour: 2c1846
  atmosphere:
    clear: {haze: 0.0}   # vacuum: no haze, no wisps
  tile_sets:
    plane-1: {layer: deep, height: 1536}   # section 1: The Far Mouth
    plane-2: {layer: deep, height: 1280}   # section 2: The Current
    plane-3: {layer: deep, height: 1312}   # section 3: The Shoal
    plane-4: {layer: deep, height: 1696}   # section 4: The Narrows
    plane-5: {layer: deep, height: 384}   # section 5: Out of the Gate
    ribbons: {layer: low-air, height: 1024}
    thin-streaks: {layer: high-air, height: 1024}
    fast-streaks: {layer: high-air, height: 1024}
  pieces:
    beyond: {layer: deep, size: [800, 800]}
    far-reef: {layer: deep, size: [240, 120]}
    curtain-left: {layer: deep, size: [368, 800]}
    curtain-right: {layer: deep, size: [368, 800]}
  placed:
    # section 5: Vrell space's nebula behind the curtain, from t=252 (hidden until it parts); held still from t=258.2
    # through the outro (to t=279: the deep layer's 16.5 px/s at 110 undone), so its top edge never reaches the screen
    - {piece: beyond, t: 258.182, x: 240, path: [[251.95, 3000, 0], [252.0, 0, 0], [258.182, 0, 0], [279.0, 0, 343.5]]}
    # section 5: a hive reef far ahead (Level 45), sinking in from the top once the curtain has parted
