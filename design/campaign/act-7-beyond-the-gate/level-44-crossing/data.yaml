# Level 44 – Crossing: the level script, rendered into README.md (briefing, threat profile, layout, waves, radio, credit
# budget). Times are seconds from the level start. M11 part B, step B2, from the README's approved hand tables (round
# 84) and ART-B's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block as it is; the sections at the
# README's times, with the two reversals' sections the level's `current` needs).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys: part A's distorted space (`current`: the drift's profile, the two reversals, easy's scale and runs; every
# reversal held by a section of negative speed from its time to its run's end, then a forward section, each eased over
# 1 s), the Rift Skater's `teleport`; M11 part B's (step B2): `opens_in_transit` (the transit's violet unbending over
# 1 s, presentation), `radio_noise` 2, the radio's `first-landing-kill` and `first-kind-kill`, a chain's pickup carried
# by its tail (`dropped_by.tail`), the music's duck on a `reversal`.
# Step B2's own placements (decided as trivia, accepted by the user in round 89): the reversals' sections split
# the README's sections 2 and 3 (The Current 40-100, its reversal 100-105 and 105-106; The Shoal 106-170, its reversal
# 170-176 and 176-177), each with its section's tile sets; a wave spawned in a reversal is a front wave flown in the
# flipped frame (Level 20's rule: it enters by travel at the bottom edge, warned); the gold shard enters at the top
# edge's right part (x 420) and the −25° current carries it across (m11b-gaps §4); the t=140 chain loops back once
# (6 s after leaving, from the bottom edge, before reversal 2's tell); the hard crossing pair is its own wave.
scroll_speed: 130     # along the scroll's vector; out of the gate 110 (eased over 2 s)
launch_seconds: 5
bounty_scale: 0.20    # every bounty × 0.20: step B3b's levelReport fit with the denser mixed waves (B2's 0.29; the README's hand estimate 0.31)
control_prompts: []
medium: vacuum        # inside the gate (design/world/vrell-space)
ground: none          # the event plane: no ground layer; the Bomb Rack and Rook's Mortar read NO GROUND
beyond_gate: true     # NO COVER for the Airstrike and the Orbital Lance; the EMP Burst works
radio_noise: 2        # the friendly radio's noise, step 2 of the act's rise; the Choir's channel clean (it is close)
opens_in_transit: 1.0 # the level opens in the transit's violet, the warp unbending over 1 s (t=0-1; presentation)
current:  # distorted space (design/enemies, Distorted space; Q1 a): θ in degrees off straight down, positive slides the space right (the current from the left); smoothstep between the points
  profile: [[0, 0], [40, 0], [50, 25], [78, 25], [88, -20], [94, 0], [106, 0], [116, -25], [124, -10], [132, -25], [140, -10], [150, -25], [160, 0], [180, 0], [185, 25], [200, 25], [205, -25], [220, -25], [225, 25], [245, 25], [255, 0]]
  reversals: [{t: 100, run: 4}, {t: 170, run: 5}]   # told 2 s ahead (t=98, t=168: Rook's call and the HUD's chevron)
  easy: {scale: 0.6, run: 3}   # easy: |θ| ≤ 15°, both reversals 3 s
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Inside the gate
  layers: [air]
  density: 4
  traits: [spread, rear]
  hazards: [distorted space, 2 reversals]
  boss: none
  objective: CROSS THE GATE   # the OBJECTIVE field from sensor L1
  varga:
    none: "Inside the gate, Lancer. Nothing holds still in there."
    l1: "Every way at once. Space drifts, and twice it runs back."
    l2: "New: Rift Skaters, they jump. Coilwyrms ride the current."
    l3: "Spread covers a landing ring. Keep a gun facing back."
  notes:
    Dominant layers: '`space` (Rift Skater streams, Coilwyrm chains, Lamprey streams, Mantis snipers at the upwind edge, Choir Heralds ringing their Needlers, Chimera and Needler wings, Stinger columns, Harrow streams, Vrell swarms); **no ground**'
    Attack directions: '{directions} by the waves'' data (the README''s count by the edge each wave enters by: front 87 % · sides 11 % · rear 2 % at medium, a wave spawned in a reversal entering by travel at the bottom edge)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: "**Distorted space**: the drift (up to ±25°) and two reversals, each told 2 s ahead; the Mantis's sweeps; the Heralds' shield rings and song; the Harrows' burst rings; the Lampreys' latch"
    Boss / mid-boss: none
    Sensor-suite detail: '**none**: inside the gate, `space`, all directions · **L1**: + density {density}, the hazards "distorted space" and "2 reversals", the objective `{objective}`, the secondary `KILLS 0 / 422`, the rows `NO GROUND` and `SPECIAL LIMITED` (`NO COVER`) · **L2**: + Rift Skater (new), Coilwyrm, Choir Herald, Mantis, Chimera, Lamprey, Harrow, Needler, Stinger, Skitter and Mote portraits · **L3**: + `spread` and `rear` highlighted, the wave strip marking the two reversals and the three chains'

sections:  # back to back from t = 0; each speed change eased (ramp); ART-B's tile sets cut at the README's sections' rows; each reversal's sections keep their section's tile sets
  - name: The Far Mouth
    end: 40
    atmosphere: clear
    tiles: [plane-1, thin-streaks]
    notes:
      layers:
        deep: the event plane's broad violet folds.
        high-air: thin dark streaks.
      purpose: 'Drift: calm (0°). The warp unbends; popcorn; the Rift Skater''s intro (t=20, quiet window t=18–26).'
  - name: The Current
    end: 100
    atmosphere: clear
    tiles: [plane-2, ribbons]
    notes:
      layers:
        deep: the folds lean with the current.
        low-air: dark ribbons crossing the field.
      purpose: 'Drift: 0° → **+25°** (t=40–50), held to t=78, swing to **−20°** (t=78–88), back to 0° (t=88–94); reversal 1 told at t=98. The drift''s lesson: waves upwind (the left edge, then the right); the first chain (t=70).'
  - name: Reversal 1
    end: 105
    speed: -130
    ramp: 1
    atmosphere: clear
    tiles: [plane-2, ribbons]
    notes:
      layers:
        deep: the layers ease to a stop and run back together.
      purpose: 'Drift: **reversed** t=101–105 (4 s; easy 3 s). The first rear wave (t=102), up from the bottom edge.'
  - name: The Current, on
    end: 106
    speed: 130
    ramp: 1
    atmosphere: clear
    tiles: [plane-2, ribbons]
    notes:
      layers:
        deep: the layers ease forward again.
      purpose: 'Drift: calm (0°). The scroll forward again.'
  - name: The Shoal
    end: 170
    atmosphere: clear
    tiles: [plane-3]
    notes:
      layers:
        deep: the plane's streaks run across the screen.
        low-air: the gold shard (the secret, t≈150).
      purpose: 'Drift: 0° → **−25°** (t=106–116), swaying −25° ↔ −10° (≤ 5°/s) to t=150, back to 0° (t=150–160); reversal 2 told at t=168. Skater streams from the right edge; the second chain (t=140).'
  - name: Reversal 2
    end: 176
    speed: -130
    ramp: 1
    atmosphere: clear
    tiles: [plane-3]
    notes:
      layers:
        deep: the layers ease to a stop and run back together.
      purpose: 'Drift: **reversed** t=171–176 (5 s; easy 3 s). The second rear wave (t=172), up from the bottom edge.'
  - name: The Shoal, on
    end: 177
    speed: 130
    ramp: 1
    atmosphere: clear
    tiles: [plane-3]
    notes:
      layers:
        deep: the layers ease forward again.
      purpose: 'Drift: calm (0°). The scroll forward again.'
  - name: The Narrows
    end: 255
    atmosphere: clear
    tiles: [plane-4, fast-streaks]
    notes:
      layers:
        deep: the folds close in from both sides, the plane at its brightest in the middle.
        high-air: fast streaks.
      purpose: 'Drift: 0° → **+25°** (t=180–185), held to t=200; **+25° → −25°** (t=200–205, 10°/s); held to t=220; **−25° → +25°** (t=220–225); held to t=245; eased to 0° by t=255. The hardest swings; the third chain (t=210); the last wave at t=250.'
  - name: Out of the Gate
    end: 264
    speed: 110
    ramp: 2
    atmosphere: clear
    tiles: [plane-5]
    notes:
      layers:
        deep: the event plane parts like a curtain on the violet and teal nebula of Vrell space, a hive reef far ahead (Level 45).
      purpose: 'Drift: calm (0°). ≥ 4 s of calm (the last wave gone by ≈ t=258); level end at t=264.'

