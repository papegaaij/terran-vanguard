debris:  # the memory pearl (the secret): a pearl of stone in a shard of the shell, drifting down the right third on the play plane (a small breakable like a small rock: 20 HP); broken, it frees the secret's hidden crate (`reveals`); sprites assets/sprites/debris-memory-pearl_N (16 tumble frames) and -break_N (ART-E; its -glow and -release are step E4's)
  chunks:
    memory-pearl: {size: [36, 36], hp: 20}
  clearance: 0
  placed:
    - {t: 170, x: 360, chunk: memory-pearl, drift: [-4, -55], reveals: memory pearl}

ground_targets: []   # none: the level has no ground layer (ground: none)

secrets:
  - name: memory pearl
    crate: 100   # Act 1 terms: pays 1,678 with the act factor (the Choir's memory of the Moon)
    radio: {speaker: Varga, line: "There's an image in it. Our Moon. The Choir remembers where it lost."}

pickups:
  - {pickup: shield cell, dropped_by: {wave: 40, unit: first}}   # the t=40 Seraph (hard: the pair's first)
  - {pickup: overdrive, dropped_by: {wave: 134, unit: first}}    # the t=134 Herald
  - {pickup: armour patch, dropped_by: {wave: 186, unit: first}}   # the t=186 Herald (no supply drone reaches past the gate)

radio:  # trigger: t or event; the README's 17 lines (the 1 s rule). Rook's barks need him flying (requires: escort); his t=11 and t=250 lines do not. The Choir twice on the enemy channel, clean (no static lead: J3). Vorne is silent.
  - {t: 1, speaker: Okafor, line: "Aegis, Steadfast. That shell is the Choir's own. Its best wait in there."}   # step E2: from "… Whatever it has left, it keeps in there.": Rook's t=11 line 1.4 s late (the 1 s rule)
  - {t: 12, speaker: Rook, line: "Bone and gold light. Like flying through a cathedral. An angry one."}
  - {t: 23, speaker: Varga, line: "Their elites are Seraphs. They vanish, land somewhere else, and copy you from the far side."}
  - {t: 35, speaker: Varga, line: "Cross the middle to line one up. Missiles find them wherever they land."}
  - {t: 56, speaker: Okafor, line: "Every Seraph that gets away carries word to the Heart. Let none of them home."}
  - {event: first-kind-kill, enemy: choir-seraph, speaker: Rook, requires: escort, line: "Got one mid-jump. They don't like surprises either.", notes: {trigger: "The first Seraph killed (event, bark, `requires: escort`)"}}
  - {t: 67, speaker: Rook, requires: escort, line: "Wraiths come up under you in here. Keep your tail gun warm.", notes: {trigger: "bark, `requires: escort`"}}
  - {t: 120, speaker: Varga, line: "Heralds ahead. They sing a shield onto whatever sits under them. Kill the singer first."}
  - {t: 144, speaker: The Choir, channel: enemy, line: "…why do you follow… we are running… we are running…", notes: {trigger: "enemy channel"}}
  - {t: 152, speaker: Varga, line: "Running. Lancer, that was not a threat. I think it is afraid."}
  - {t: 200, speaker: Okafor, line: "That light is the Choir's core. Push through it, Aegis."}
  - {t: 230, speaker: Varga, line: "Past the core I read gold hulls under the growth. Ascendancy gold. Vorne is there."}   # step E2: t=230, not 222: after the secondary's line when the 14th Seraph falls in the t=214 pair (t≈216-222)
  - {event: secondary-objective, speaker: Okafor, line: "No Seraph is getting home. Good flying, Lancer.", notes: {trigger: "Secondary met (`secondary-objective`, the 14th Seraph down)"}}
  - {event: secondary-failed, speaker: Varga, line: "Seraphs got back to the core. The Heart will know our faces now.", notes: {trigger: "Secondary failed (the fourth Seraph jumps out)"}}
  - {t: 243, speaker: The Choir, channel: enemy, line: "…the silence comes… it is behind us…", notes: {trigger: "enemy channel"}}
  - {t: 250, speaker: Rook, line: "Behind them? We're behind them. Aren't we?"}

