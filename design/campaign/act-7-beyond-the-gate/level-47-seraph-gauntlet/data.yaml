    - {speaker: Okafor, image: level-47-the-shell, line: "Dr. Varga's core is in the reactor bay, and it's waking up. Good: you'll need the power. Past the dead fleet lies the Choir's inner shell. It keeps its best in there. Get through it, Lancer. Vorne's trail runs straight across it."}
    - {speaker: Varga, image: level-47-choir-seraph, line: "The Choir's elites: we call them Seraphs. They fold away, land elsewhere and copy you from the far side. Cross the middle to hit one; missiles find them anywhere. And listen to the Choir in there. It has stopped singing at us."}   # step E2: one screen (BriefingLayoutTest: the approved text took 5 lines of 4)
  teaser: {speaker: Rook, line: "Varga's new core purrs. I don't trust anything that purrs."}

backdrop:
  # Presentation only: Level 47's inner sphere (tools/art/act7_sphere.py sphere, step ART-E: its proposal's block as it
  # is, wired by step E2; sections from the level's data.yaml).
  # Vacuum: no haze. No ground layer. Deep: one continuous field (space and the far hulls, the shell's rim, its
  # ribs at two scales lit gold-white along their upper edges, the vault's rings and spokes in section 3) cut
  # at the sections' seams (re-run the generator after moving a section). Far: the great ribs (the third
  # scale); the dead fleet's last hulls in section 1. Low-air: motes of light, the Heralds'
  # rings of light (still, drifting).
  # E4 hooks: (1) `core-light` (additive, not placed) is the core's light in screen space (BackdropAtmosphere):
  # its centre at x 240 and the curve's y (down; above the top edge), scaled and weighted by the curve,
  # linear between its points, nothing before the first: [t, y, scale, weight]
