# Level 47 – Seraph Gauntlet: the level script, rendered into README.md (briefing, threat profile, layout, waves,
# radio, credit budget). Times are seconds from the level start. M11 part E, step E2, from the README's approved hand
# tables (round 84).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M11 part E (flown from step E1; loaded and checked from step E2): the formation `pair` (two Choir Seraphs
# arriving together by their rings on two rows ≥ 90 px apart, new rows each cycle from the wave's seed) and a pair's
# fixed `rows: [upper, lower]` (px below the top edge: a pair under a Herald); a hovering `single`'s `at: [x, y]` (its
# station: straight down to it, no sine drift) and `hold` (its hover's seconds there, a difficulty's `hold` instead):
# the Heralds' station at the top centre.
# Step E2's own placements (pending the user's review in round 92): the upper row 80 px under a Herald's centre, not 90
# (the aura measures centre to centre: at 90 it rang only at dx = 0; at 80 it rings within ±41 px of the centre);
# easy's two single Seraphs and hard's t=40 pair as `skip` twins (a wave per difficulty, the built rule, as hard's
# Harrow streams); the popcorn while a pair holds along the side edges (`edge`, side-hugging swarm paths); the memory
# pearl a tumbling debris chunk on the play plane (Level 46's courier); the density waves (the final-act rule: the
# offbeat Stinger, Needler, Chimera, Harrow and Rift Skater waves marked "Step E2: density"); the backdrop ART-E's
# proposal (concept/backdrop-proposal.yaml) as it is.
scroll_speed: 130     # section 1; the sections' own speeds after it, each change eased over 2 s
launch_seconds: 5
bounty_scale: 0.17    # every bounty × 0.17: step E2's levelReport fit with the density waves (the README's hand estimate 0.37 before them; the crate and the secondary are not scaled)
control_prompts: []
medium: vacuum        # Vrell space: short flashes and debris rings, no smoke (design/world/vrell-space)
beyond_gate: true     # past the fleet's net: the Airstrike and the Orbital Lance read NO COVER; the EMP Burst works
ground: none          # air only: the stone shell is deep scenery far below (NO GROUND for the Bomb Rack and every bomb delivery)
radio_noise: 5        # the friendly radio's noise, step 5, the top of the act's rise (L43 → L47; it holds to L50); the Choir's channel clean
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The inner sphere
  layers: [air]
  density: 5
  traits: [beam, homing]
  hazards: [teleports, mirrors, spirals]
  boss: none
  objective: CROSS THE SPHERE   # the OBJECTIVE field from sensor L1
  varga:
    none: "The Choir's inner shell, Lancer. Its elites live here."
    l1: "Attacks from every side. No ground. Seraphs jump and mirror."
    l2: "New: Choir Seraphs. Heralds, Wraiths, Mantises, Lampreys."
    l3: "Cross the middle to hit a Seraph. Missiles find them."
  notes:
    Dominant layers: '`air` only (the Seraphs, Heralds, Wraiths, Mantises, Lampreys and the swarms); no ground layer'
    Attack directions: '{directions} by the waves'' data'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: The Seraphs' spirals while they mirror; the Mantises' sweeps; the Lampreys' latch; the Harrows' burst rings
    Boss / mid-boss: none
    Special limits: '`NO COVER` (the Airstrike, the Orbital Lance; J12); `NO GROUND` for the Bomb Rack and every bomb delivery'
    Sensor-suite detail: '**none**: the Choir''s inner sphere, `air`, all directions · **L1**: + density {density}, the hazards "teleports, mirrors, spirals", the objective `{objective}`, the secondary `SERAPHS 0 / 14`, the rows `NO GROUND` and `SPECIAL LIMITED` (`NO COVER`) · **L2**: + Choir Seraph (new), Choir Herald, Wraith, Mantis, Lamprey, Chimera, Harrow, Needler, Stinger, Skitter and Mote portraits · **L3**: + `beam` and `homing` highlighted, the wave strip marking the nine Seraph arrivals'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); ART-E's tile sets cut at these rows
  - name: The Shell's Edge
    end: 48
    atmosphere: clear
    tiles: [deep-1]
    notes:
      layers:
        deep: the dead fleet's last hulls falling behind, then the stone shell's wall curving away below.
        low-air: drifting motes of light.
      purpose: The regulars from the front, the first Wraiths and Lampreys; the Seraph's intro alone at t=40 (quiet window t=37–45).
  - name: The Ribs
    end: 120
    speed: 120
    ramp: 2
    atmosphere: clear
    tiles: [deep-2]
    notes:
      layers:
        deep: the shell's great ribs crossing far below, lit gold-white along their edges.
        low-air: thin light rings.
      purpose: Three Seraph pairs; a Mantis, Lampreys, a Harrow stream, Wraiths behind.
  - name: The Choir Hall
    end: 200
    speed: 110
    ramp: 2
    atmosphere: clear
    tiles: [deep-3]
    notes:
      layers:
        deep: the ribs meeting in a vault, the core a gold-white glow at the top edge.
        low-air: the Heralds' rings of light (scenery).
      purpose: Three pairs, each under a Herald; the Harrow cross (t=142); the Choir speaks (t=144); the memory pearl (the secret, t≈170).
  - name: The Core Light
    end: 266
    speed: 140
    ramp: 2
    atmosphere: clear
    tiles: [deep-4]
    notes:
      layers:
        deep: the core's light filling the top third; at its far side, by t≈255, a dark mass grown over gold (Level 48's citadel).
      purpose: The last two pairs; the last wave at t=250; ≥ 4 s of calm; the level ends at t=266 as the light fills the screen's top half.

