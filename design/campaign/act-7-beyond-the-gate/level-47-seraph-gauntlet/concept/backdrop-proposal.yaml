    - {piece: motes-b, t: 20.0, x: 120, path: [[12.0, -16, 0], [28.0, 16, 0]]}
    - {piece: motes-a, t: 36.0, x: 330, path: [[28.0, 8, 0], [44.0, -8, 0]]}
