# Level 45 – Hive Reef: the level script, rendered into README.md (briefing, threat profile, layout, waves, radio,
# credit budget). Times are seconds from the level start. M11 part C, step C2, from the README's approved hand tables
# (round 84) and ART-C's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block as it is, its sections
# at the README's times; its 14 pits P1–P14 checked against the organs, the Threadcrawlers' paths and the brood well).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M11 part C (flown from step CD1; loaded and checked from step C2): the `pits` (the reef's spawning pits,
# each named, at `[x, at]`: `at` the ground scroll when its centre is at the top edge; the world's `living_terrain`
# numbers: the 2 s tell, the 0.5 s rise, the close 3 s after, the 120 px hold) and a wave's `pit` (it rises out of that
# pit at its t, its tell from t − 2), `leaving: {bottom_third: true}` (the tracker's amber blink while an organ is in
# the field's bottom third), a story pickup's `rise` and `box` (the call organ's 2 s lift and 64 × 40 box), the music's
# timed `duck` (`on: time`, `at`: the base −6 dB under the capture, t=126–138; step C4 plays it) and the spawning
# organ's spawn keys (its unit's data). A Threadcrawler's `crawl` lies on the reef's open plates (no terrain).
# Step C2's own placements (pending the user's review in round 90): the organs O1–O8 at x 240, 330, 150, 310, 170, 300,
# 150, 320 (never two on the screen, ≥ 150 px from every opening pit, 170 px off the brood well's centre); the pits at
# ART-C's places, but **P9's wave moves from t=173 to t=178**: at t=173 its pit (row 17070) lay in the gap between the
# reefs (the first reef ends at row ≈16650, the second's lip at ≈17510), so it opens on the second reef's lip (row
# 17570), and the Needlers and Motes after it move 1.5 s and 0.5 s later; the courier's cyst at t≈176 (from t≈172) for
# the same reason; the crawlers cross diagonally (a crawler at 70 px/s cannot cross the field level against the 100 px/s
# scroll: one pass from a side edge near the top to the other side's lower half, ≈10 s on the screen).
scroll_speed: 100     # the same speed throughout (no holds: J16)
launch_seconds: 5
bounty_scale: 0.17    # every bounty × 0.17: step C2's levelReport fit with the denser mixed waves (the README's hand estimate 0.30 before them)
control_prompts: []
medium: vacuum        # Vrell space: short flashes and debris rings, no smoke (design/world/vrell-space)
beyond_gate: true     # past the fleet's net: the Airstrike and the Orbital Lance read NO COVER; the EMP Burst works
radio_noise: 3        # the friendly radio's noise, step 3 of the act's rise (L43 → L47); the Choir's channel clean
leaving: {bottom_third: true}   # the tracker's mark blinks amber while an organ is in the field's bottom third (one rule with L43's Wardens)
