threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The Hive Reef
  layers: [ground, air]
  density: 5
  traits: [anti-ground, area]
  hazards: [spore clouds, spawning pits]
  boss: none
  objective: ORGANS 0 / 8   # the OBJECTIVE field from sensor L1
  varga:
    none: "A living reef, Lancer. Eight spawning organs to burn."
    l1: "Spore clouds slow you. Pits open under the swarms."
    l2: "Threadcrawlers, Brood Pods, turrets grown from the reef."
    l3: "Anti-ground for the organs. A blast burns a cloud."
  notes:
    Dominant layers: '`ground` (the reef: the spawning organs, the pits, Threadcrawlers, Spine Turrets, Polyp Mortars), `air` (Skitter streams, Mote Swarms, Needlers, Stingers, Brood Pods, Whirl Seed clusters), `low-air` (Spore Bombers)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: Spore clouds (slow, never hide bullets); spawning pits (2 s tell); the organs' seed clusters
    Boss / mid-boss: none
    Special limits: '`NO COVER` (the Airstrike, the Orbital Lance; J12), as the act''s every level'
    Sensor-suite detail: '**none**: Vrell space, the hive reef, `ground` + `air`, front, the objective `{objective}` · **L1**: + density {density}, the hazards "spore clouds" and "spawning pits", the secondary `CRAWLERS 0 / 2`, `SPECIAL LIMITED` (`NO COVER`) · **L2**: + Threadcrawler, Brood Pod, Spore Bomber, Spine Turret, Polyp Mortar, Needler, Stinger, Whirl Seed, Skitter and Mote portraits · **L3**: + the eight organs and the call organ on the threat map, `anti-ground` and `area` highlighted'

sections:  # back to back from t = 0 at 100 px/s; ART-C's tile sets cut at these rows
  - name: The Reef Rim
    end: 40
    atmosphere: clear
    tiles: [deep-1, rim-plates]
    notes:
      layers:
        ground: chitin plates rising out of the nebula, the first pit (opens t=12), organ **O1** (t≈28).
        low-air: floating spore sacs.
        deep: the nebula, the next reefs far off.
      purpose: '**The pit taught** alone, **the first cloud** (t=18) alone, **the first organ** alone.'
  - name: The Brood Fields
    end: 108
    atmosphere: clear
    tiles: [deep-2, brood-fields]
    notes:
      layers:
        ground: rows of pits, organs **O2** (t≈58) and **O3** (t≈80), the first Threadcrawler's pass (t≈90), Spine Turrets, a Polyp Mortar pair.
      purpose: 'The reef at full breath: pits, Brood Pods, clouds.'
  - name: The Spine
    end: 160
    atmosphere: clear
    tiles: [deep-3, spine]
    notes:
      layers:
        ground: the reef's ridge, a raised backbone of plates; organ **O4** (t≈112), **the call organ** (t≈127), organ **O5** (t≈152).
      purpose: '**The capture** in a quiet window (t=126–138).'
  - name: The Living Bridge
    end: 212
    atmosphere: clear
    tiles: [deep-4]
    notes:
      layers:
        low-air: a living bridge of tendon and chitin arching over the field (t≈160–175) to the next reef.
        ground: the first reef's edge, the gap, then the second reef's rim (five pieces); the courier's cyst (t≈176), the second Threadcrawler (t≈176), organ **O6** (t≈192).
      purpose: 'Spore Bombers under the bridge; the clouds at their densest.'
  - name: The Brood Heart
    end: 268
    atmosphere: clear
    tiles: [deep-5, brood-heart]
    notes:
      layers:
        ground: a ring of pits round a deep brood well, organs **O7** (t≈226) and **O8** (t≈252), the third Threadcrawler (t≈236).
      purpose: 'The hardest stretch; the last organ.'
  - name: The Far Rim
    end: 278
    atmosphere: clear
    tiles: [deep-6]
    notes:
      layers:
        ground: the reef's edge falling away to the nebula.
        deep: the first dark hulls of the dead fleet far ahead (Level 46).
      purpose: '≥ 4 s of calm (the last wave gone by ≈ t=271); level end at t=278.'

