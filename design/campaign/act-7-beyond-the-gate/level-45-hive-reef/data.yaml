radio:  # trigger: t or event; the README's 19 lines (the 1 s rule). Rook's barks need him flying (requires: escort); the secret's line is the secret's own. The Choir once on the enemy channel, clean (no static lead: J3).
  - {t: 1, speaker: Okafor, line: "Aegis, Steadfast. A living reef the size of a moon."}   # step C2: shortened to one radio page from "… It breeds everything they fly." (two pages: Varga's pit line 2.6 s late, the 1 s rule)
  - {t: 9.6, speaker: Varga, line: "Pits glow, then open. Don't sit over one."}   # step C2: one radio page (from "The pits are its mouths. They glow, then open. Don't sit over one.": the 1 s rule)
  - {t: 17, speaker: Varga, line: "Violet spores slow you. A blast burns them away."}   # step C2: one radio page (from "Violet clouds are spores. They slow you down. A blast burns them away.")
  - {t: 24.6, speaker: Okafor, line: "Spawning organ ahead. Eight on our lane. Burn them all."}   # step C2: one radio page (from "Swollen sac ahead: a spawning organ. …")
  - {t: 33, speaker: Okafor, line: "Let none past, Lancer. Each one breeds a fleet."}   # step C2: one radio page (from "One that gets behind you breeds for the fleet. Let none past, Lancer.")
  - {event: first-target, speaker: Rook, requires: escort, line: "One down. It screamed. I didn't like that.", notes: {trigger: "The first organ destroyed (`first-target`, event, bark)"}}
  - {t: 87, speaker: Varga, line: "Threadcrawler on the plates. Take it before it crosses the reef."}
  - {t: 121.5, speaker: Varga, line: "The pale horn on the spine calls their broods. Cut its roots and bring it out. Don't burn it."}
  - {event: story-collected, speaker: Varga, line: "It's still singing. Quietly. I want to know what it says.", notes: {trigger: "The call organ collected (event)"}}
  - {event: story-missed, speaker: Okafor, line: "The tug has the horn. Keep your eyes on the organs.", notes: {trigger: "The call organ missed (event, it leaves the screen)"}}
  - {t: 160, speaker: Okafor, line: "Living bridge overhead. The next reef is just as hungry."}
  - {t: 208, speaker: The Choir, channel: enemy, line: "…do not burn the brood… it is all we carry…", notes: {trigger: "enemy channel"}}
  - {t: 215, speaker: Varga, line: "Carry? Carry where? Lancer, it's never said a thing like that."}
  - {t: 248, speaker: Okafor, line: "Last two organs. Then this reef is only meat."}   # step C2: from t=244.5, after the crawlers' met line when the third crawler's kill meets it (t≈239-242)
  - {event: secondary-objective, speaker: Varga, line: "Two crawlers down. The plates are quieter.", notes: {trigger: "Secondary met (`secondary-objective`, the second crawler down)"}}
  - {event: secondary-failed, speaker: Varga, line: "Another crawler got away. It will find a reef of its own.", notes: {trigger: "Secondary failed (the second crawler off the reef)"}}
  - {event: level-end, speaker: Okafor, line: "The reef's gone quiet. A graveyard of their ships ahead. Varga wants a look.", notes: {trigger: Level end}}
  - {event: mission-failed, speaker: Okafor, expression: grim, line: "{group} is still breeding behind you. That brood comes for the fleet. Pull back, Lancer.", notes: {trigger: "An organ leaves the screen alive (`mission-failed`, the failed screen's line)"}}

