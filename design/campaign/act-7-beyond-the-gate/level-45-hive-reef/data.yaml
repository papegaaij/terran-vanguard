backdrop:
  # Presentation only: Level 45's hive reef (tools/art/act7_reef.py reef, step ART-C: its proposal's block as it is).
  # Vacuum: no haze. Deep: one continuous nebula field cut at the sections' seams (re-run the generator
  # after moving a section). Ground: a tile set a section (1, 2, 3, 5); section 4's ground is the five
  # second-reef pieces (exact rows) after the gap the first reef's edge leaves; section 6's is the far-rim
  # piece, the nebula beyond. Seam pieces blend the tiles' own rows along a ragged line.
  # C4 hooks: (1) BackdropAtmosphere adds every ground `<tile>-veins` and `<piece>-veins` image (additive,
  # not listed here) with one slow smooth pulse k(t) <= 0.5 Hz (the veins' share above the tiles' 45 %);
  # (2) BackdropPieces draws each placed `pit` (the level's pits P1.. in this order) at the frame of its
  # Pits state: shut 0-7 (2 fps loop), tell 8-15 over 2 s (HELD holds 15), open 16-19 (4 fps loop), closing
  # 20-23 over 0.5 s then shut. `pit-shut` pieces are scenery and just loop.
  scroll_factors: {deep: 0.15, far: 0.5, ground: 1, low-air: 1.3, high-air: 1.7}   # far, high-air unused
  ramp: 2
  haze_colour: 0a0612
  atmosphere:
    clear: {haze: 0.0}   # vacuum: no haze, no wisps
  tile_sets:
    deep-1: {layer: deep, height: 1344}   # section 1: The Reef Rim
    deep-2: {layer: deep, height: 1184}   # section 2: The Brood Fields
    deep-3: {layer: deep, height: 960}   # section 3: The Spine
    deep-4: {layer: deep, height: 960}   # section 4: The Living Bridge
    deep-5: {layer: deep, height: 1024}   # section 5: The Brood Heart
    deep-6: {layer: deep, height: 384}   # section 6: The Far Rim
    rim-plates: {layer: ground, height: 960}   # section 1: plates rising out of the nebula (gaps)
    brood-fields: {layer: ground, height: 960}   # section 2
    spine: {layer: ground, height: 960}   # section 3: the ridge (x 160-320)
    brood-heart: {layer: ground, height: 960}   # section 5
  pieces:
    seam-2: {layer: ground, size: [480, 256]}
    seam-3: {layer: ground, size: [480, 256]}
    reef-edge: {layer: ground, size: [480, 352]}
    far-rim: {layer: ground, size: [480, 480]}
    second-reef-1: {layer: ground, size: [480, 872]}
    second-reef-2: {layer: ground, size: [480, 872]}
    second-reef-3: {layer: ground, size: [480, 872]}
    second-reef-4: {layer: ground, size: [480, 872]}
    second-reef-5: {layer: ground, size: [480, 872]}
    brood-well: {layer: ground, size: [320, 320]}
    brood-well-glow: {layer: ground, size: [320, 320]}
    pit: {layer: ground, size: [72, 72], frames: 24, fps: 4}
    pit-glow: {layer: ground, size: [72, 72], frames: 24, fps: 4}
    pit-shut: {layer: ground, size: [72, 72], frames: 8, fps: 2}
