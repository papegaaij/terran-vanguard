# Level 50 – Choir Heart: the level script, rendered into README.md (briefing, threat profile, layout, waves, radio,
# credit budget). Times are seconds from the level start (the level clock: it halts at t=188 while the Choir Heart
# lives and 12 s after its K, then runs the closing gate's race at 300 px/s and the near side at 60 px/s: the level ends
# at t=234 = K+58). M11 part H, step H2, from the README's approved hand tables (round 84).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M11 part H (flown from steps H1a/H1b; loaded and checked from step H2): the transit's `to`, `ease`,
# `reverse`, `after_kill` and `beats` (the closing gate: its times from the Heart's K, the warp home, the scene's
# events), `radio_noise_changes` (the noise off on the near side), the boss-phase subjects `first-node`, `reversal` and
# `core-half`; the boss `choir-heart`'s keys are its stat block's (walls, drift, part_windows, dark, heartbeat,
# checkpoints, rise, last_words, rook, bar).
# Step H2's own placements (pending the user's review in round 95): the floor's nests as ground targets at the table's
# times (x 100/380 the turrets, 170/240/310 the mortars round the vault), the seed vault a `ground` destructible with
# the secret's crate (Level 48's archive), the crawlers' passes clear of the nests (over the living floor: no terrain or
# reef); the backdrop ART-H2's hive-core proposal as it is (its `closing_gate` numbers are step H4's).
scroll_speed: 100     # the approach; the sections' own speeds after it, each change eased over its ramp
launch_seconds: 5
bounty_scale: 0.20    # every bounty × 0.20: step H2's levelReport fit with the density waves (the README's hand 0.34 before them; the crate and the secondary are not scaled)
control_prompts: []
medium: vacuum        # Vrell space: short flashes and debris rings, no smoke (design/world/vrell-space)
beyond_gate: true     # past the fleet's net: the Airstrike and the Orbital Lance read NO COVER; the Swarm Call works
radio_noise: 5        # the friendly radio's noise, step 5 (held from L47) through the fight and the race; the Choir's channel clean
radio_noise_changes:
  - {on: near-side, step: 0}   # K+30.5, the near side (the transit's beat): the first clean radio since Level 42
transit: {form: 12, warp: 29, length: 1.5, to: [240, 420], ease: 1.5, reverse: true, after_kill: true, beats: [{kind: gate-closing, at: 10.5}, {kind: near-side, at: 30.5}, {kind: plane-out, at: 31}, {kind: glyph-dark, at: 35.0, value: 1}, {kind: glyph-dark, at: 35.4, value: 2}, {kind: glyph-dark, at: 35.8, value: 3}, {kind: glyph-dark, at: 36.2, value: 4}, {kind: glyph-dark, at: 36.6, value: 5}, {kind: glyph-dark, at: 37.0, value: 6}, {kind: glyph-dark, at: 37.4, value: 7}, {kind: glyph-dark, at: 37.8, value: 8}]}   # the closing gate from the Heart's K: the gate closing K+10.5, control taken K+12 (the ship to (240, 420) over 1.5 s), the warp home K+29 (1.5 s), the near side K+30.5, the plane out K+31, the glyphs dark one by one K+35-38
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The hive core
  layers: [air, ground]
  density: 5
  traits: [beam, homing, area]
  hazards: [the Heart reshapes its chamber]
  boss: Choir Heart
  objective: SILENCE THE CHOIR   # the OBJECTIVE field from sensor L1
  varga:
    none: "The hive core. The Choir's Heart is at its centre."
    l1: "Every Vrell family at once. Then the Heart."
    l2: "Nothing new, Lancer. Everything old, all together."
    l3: "A beam, homing and area. It will use them all on you."
  notes:
    Dominant layers: '`air` (`space` is `air` in vacuum, J12: every Vrell family, the Heart) and `ground` (the Brood Halls'' tissue floor: Spine Turrets, Polyp Mortars, Threadcrawlers); the Heart''s walls are terrain'
    Attack directions: '{directions} by the waves'' data; in the Heart''s phase 2 the drift''s reversal'
    Density: '{density}'
    Recommended traits: '{traits} (**J9**: the roster''s "all" is not a trait, and it would include `anti-sub`)'
    Hazards: Every Vrell family at once; the Heart's walls, darkness and drift (its document)
    Boss / mid-boss: 'final boss [Choir Heart](../../../enemies/bosses/choir-heart/README.md) (Q7 a)'
    Special limits: '`NO COVER` (the Airstrike, the Orbital Lance; J12)'
    Sensor-suite detail: '**none**: Vrell space, the hive core, `air` + `ground`, all directions · **L1**: + density {density}, the hazard "the Heart reshapes its chamber", the secondary `KILLS 0 / 382`, `SPECIAL LIMITED` (`NO COVER`) · **L2**: + the Choir Heart''s portrait, Choir Seraph, Gate Warden, Rift Skater, Choir Herald, Chimera, Harrow, Wraith, Coilwyrm and Threadcrawler portraits · **L3**: + `beam`, `homing` and `area` highlighted, the wave strip marking the Heart'

sections:  # back to back from t = 0; each speed change eased over its ramp
  - name: The Throat
    end: 45
    atmosphere: clear
    tiles: [deep-1, throat-ribs]
    notes:
      layers:
        low-air: ribbed tissue tubes, slow-pulsing veins.
        deep: the hive's far walls.
      purpose: "Act 1's Vrell popcorn, all at once: Skitters, Needlers, Stingers, Motes, Whirl Seeds."
  - name: The Choir Chambers
    end: 97
    atmosphere: clear
    tiles: [deep-2, singing-ribs]
    notes:
      layers:
        low-air: vaulted chambers with crystalline singing ribs (the Heralds' ring markings grown into the walls).
      purpose: 'The singers: Heralds, Seraph pairs, Rift Skaters, Lampreys, Wraiths.'
  - name: The Brood Halls
    end: 135
    atmosphere: clear
    tiles: [deep-3, brood-floor]
    notes:
      layers:
        ground: the living tissue floor (its spawning pits sealed, no pit hazard), the turret and mortar nests, the crawlers; the seed vault (the secret, t≈118).
      purpose: 'The brood: Chimeras and Harrows over the floor''s guns.'
  - name: The Last Chamber
    end: 182
    atmosphere: clear
    tiles: [deep-4, vein-cables]
    notes:
      layers:
        low-air: the veins converging ahead; the Heart's pulse lighting the chamber's far end.
      purpose: 'Every family in short waves; Gate Wardens (the window shield once more); the Coilwyrm; the last wave at t=175, gone by ≈ t=181.'
  - name: The Last Chamber, braking
    end: 187
    speed: 20
    ramp: 5   # eased from 100 to 20 px/s over t=182–187 under the boss warning (t=182), the Heart coming into view from t=187
    atmosphere: clear
    tiles: [deep-5, vein-cables]
    notes:
      layers:
        deep: the Heart's chamber at the top, its pulse reaching the bottom edge.
      purpose: 'The boss warning at t=182, before the Heart shows (the Act 5 lesson); the Choir''s first line.'
  - name: The Heart
    end: 188   # the arena: the scroll halted at its end while the Heart lives (the built clock), the level clock with it
    speed: 20
    arena: true
    hold_after_boss: 12   # s the clock stays halted after K (the chain 4 s, the flash K+3.5, the Choir's last line K+5, the gate closing K+10.5); control taken at K+12
    atmosphere: clear
    tiles: [deep-6]
    notes:
      layers:
        deep: 'the Heart''s arena ([its document](../../../enemies/bosses/choir-heart/README.md#arena)); after K the hive greying outward (K+10.5).'
      purpose: 'The final boss (the bar to the kill ≈ 165 s at medium); the clock halted while it lives; then the hive goes still.'
  - name: The race
    end: 206.5   # K+30.5: the near side
    speed: 300
    ramp: 3   # eased from the halt to 300 px/s over K+12 to K+15 (control taken: the ship to (240, 420), Rook into formation)
    atmosphere: clear
    tiles: [deep-7]
    notes:
      layers:
        deep: the grey chambers in reverse order (the Last Chamber, the Brood Halls, the Choir Chambers, the Throat), still and dead; the folds closing from the bottom edge; ahead the event plane contracting inside the ring.
      purpose: 'The closing gate''s race (a scene: no input, no hits, no fail); the warp home at K+29.'
  - name: The near side
    end: 238   # K+62: the level's end, after Okafor's last line (step H2: the README's K+58, the closing lines spaced by the 1 s rule)
    speed: 60
    ramp: 2
    atmosphere: clear
    tiles: [deep-8]
    notes:
      layers:
        deep: the ordinary starfield, Neptune small and blue far off, the Steadfast's group ahead; behind, the ring's upper arc, its event plane shrinking to a point and going out (K+31), its glyphs going dark one by one (K+35–38).
      purpose: 'The near side: the radio''s noise gone; the closing lines; level end at K+58.'

boss:  # the final boss: the warning (track 22) 5 s before the arena's start, then the bar and the boss checkpoint (none on hard); it comes into view from above the top edge over 6 s (its rise), firing, invulnerable until in place
  enemy: choir-heart
  t: 187
  x: 240
  section: 6
  incoming: 5   # the warning box, the klaxon and the warning track at t=182 with the scroll's last slowing, before the Heart shows (the Act 5 lesson)
  notes:
    from: 'top (its descent into view with the last of the scroll, 6 s)'
    waves: 'At the arena''s start: the bar and the checkpoint (again at each phase''s start on easy and medium); nothing enters in the fight but what it releases'
    spawns: {whirl-seed: 18, mote-swarm: 16, skitter: 12}   # the README's expected releases: the typical haul's count

