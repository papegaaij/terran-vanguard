pickups:
  - {pickup: shield cell, dropped_by: {wave: 75, unit: first}}    # the t=75 Mote Swarm's leader
  - {pickup: overdrive, dropped_by: {wave: 133, unit: first}}     # the t=133 Chimera V-wing's tip
  - {pickup: armour patch, dropped_by: {wave: 136, unit: first}}  # the first Gate Warden of the t=136 line (the Heart's two are its phases' drops)

radio:  # trigger: t or event; the README's lines (the 1 s rule). Rook's barks need him flying (requires: escort); the Choir on the enemy channel, clean (J3). The fight's lines are events (`boss-arrival`, `boss-phase` phases and subjects), queued as phase lines (they wait for a gap); the clock halts at t=188 while the Heart lives and 12 s after K, so the scene's lines from K+12 are clock times (t=188 = K+12)
  - {t: 1, speaker: Okafor, line: "Aegis, Steadfast. The hive core. Every signal out here ends in one place. Find it."}
  - {t: 12.5, speaker: Varga, line: "Skitters, Needlers, seeds. Everything from the first day, all at once."}
  - {t: 28, speaker: Rook, requires: escort, line: "Getting crowded, Lancer. Good. Harder to miss.", notes: {trigger: "bark, `requires: escort`"}}
  - {t: 46, speaker: Varga, line: "Heralds and Seraphs. This is where the singing comes from."}
  - {t: 63, speaker: Okafor, line: "Wraiths on your six. Let the tail find them."}
  - {t: 98, speaker: Varga, line: "Brood halls. Turrets in the floor. Burn it clean."}
  - {t: 134, speaker: Okafor, line: "Wardens ahead. Wait for them to open, then hit them."}
  - {t: 150, speaker: Rook, requires: escort, line: "Everything they've got, Lancer. Means they're out of ideas.", notes: {trigger: "bark, `requires: escort`"}}
  - {t: 172, speaker: Varga, line: "There. At the centre. It's a heart, Lancer, and it's beating faster."}
  - {event: secondary-objective, speaker: Okafor, line: "Their swarm is breaking. Keep going.", notes: {trigger: "Secondary met (`secondary-objective`, the 382nd kill at medium)"}}
  - {event: secondary-failed, speaker: Varga, line: "Too many got past. They are all going to the Heart.", notes: {trigger: "Secondary failed (by the warning at the latest)"}}
  - {t: 183, speaker: The Choir, channel: enemy, line: "…small bright one… you have come into the heart of us… turn back… turn back…", notes: {trigger: "The warning (t=182, before it shows; enemy channel): the Heart's line 1"}}
  - {event: boss-arrival, delay: 1, speaker: Okafor, line: "That's the Choir. Aegis, end this.", notes: {trigger: "In place (`boss-arrival`, real t≈193) + 1 s"}}
  - {event: boss-arrival, delay: 7, speaker: Varga, line: "The organs open when they sing. Shoot them then.", notes: {trigger: "`boss-arrival` + 7 s"}}
  - {event: boss-phase, phase: The arena, speaker: The Choir, channel: enemy, line: "…we sang so it would not hear us… you are so loud… so loud…", notes: {trigger: "The closing (phase 2's start; enemy channel): the Heart's line 2"}}
  - {event: boss-phase, phase: The arena, delay: 5, speaker: Rook, requires: escort, line: "Walls! And the lights just went out.", notes: {trigger: "The closing + 5 s (bark, `requires: escort`)"}}
  - {event: boss-phase, phase: first-node, speaker: Varga, line: "The walls hang on those knots. Cut them all.", notes: {trigger: "The first node cut (`boss-phase` `first-node`)"}}
  - {event: boss-phase, phase: reversal, speaker: Rook, requires: escort, shout: true, line: "It's flipping! Hold the middle!", notes: {trigger: "The reversal's tell (`boss-phase` `reversal`: the second node's death or 23 s into phase 2; bark, `requires: escort`)"}}
  - {event: boss-phase, phase: The core, speaker: The Choir, channel: enemy, line: "…you opened us… now it can hear… it is listening…", notes: {trigger: "The opening (phase 3's start; enemy channel): the Heart's line 3"}}
  - {event: boss-phase, phase: The core, delay: 5, speaker: Okafor, line: "It's open! Everything you have, Lancer!", notes: {trigger: "The opening + 5 s"}}
  - {event: boss-phase, phase: core-half, speaker: The Choir, channel: enemy, line: "…let us through… we only wanted to live… let us through…", notes: {trigger: "The core below half its HP (`boss-phase` `core-half`; enemy channel): the Heart's line 4"}}
  - {event: boss-phase, phase: last-words, delay: 5, speaker: The Choir, channel: enemy, line: "…it is behind us… it has always been behind us…", notes: {trigger: "K + 5 s (enemy channel): the Heart's line 5 (fixed, the last; the portrait's face-like frame)"}}
  - {event: boss-phase, phase: last-words, delay: 11, speaker: Okafor, line: "The gate is closing! The Choir was holding it open. Steadfast is going now. Aegis, get out of there!", notes: {trigger: "K + 11 s"}}
  - {t: 199.5, speaker: Rook, requires: escort, line: "On your wing, Lancer. Don't you dare slow down.", notes: {trigger: "K + 23.5 s (bark, `requires: escort`)"}}
  - {t: 208, speaker: Okafor, requires: escort, line: "Aegis, Steadfast. I have you. I have both of you.", notes: {trigger: "K + 32 s (with Rook)"}}
  - {t: 208, speaker: Okafor, requires_not: escort, line: "Aegis, Steadfast. I have you.", notes: {trigger: "K + 32 s (without Rook)"}}
  - {t: 215.5, speaker: Varga, line: "The ring is dark. No readings from the far side at all. It's just stone again.", notes: {trigger: "K + 39.5 s (the README's K + 38: behind Okafor's K + 32 line, the 1 s rule)"}}
  - {t: 227, speaker: Rook, requires: escort, line: "Told you I was coming through that gate. Never said I'd stay.", notes: {trigger: "K + 51 s (bark, `requires: escort`)"}}
  - {t: 234, speaker: Okafor, line: "It's over, Aegis. Stand down.", notes: {trigger: "K + 58 s"}}

objectives:
  primary: reach-end   # with the Heart as its condition (the act bosses' form): the level ends when the Heart is dead, the closing gate has played and the closing lines are done; the line reads SILENCE THE CHOIR
  secondary: {kill_ratio: 0.65, boss_counted: false, until: warning, credits: 100, name: Break the swarm}   # at least 65 % of the approach's units (the Heart and what it releases not counted), judged by the warning (t=182): met at the target (DONE), failed once the approach's rest cannot reach it (KILLS n / 382 at medium: 65 % of the approach's 587, step GH5); 100 in Act 1 terms: pays 1,678 (unscaled)

music:
  track: 17           # Act 7 B (audio/music track list) over the approach
  start_section: 1
  full_section: 1     # the full mix with its `choir` stem over the approach
  stem_times:
    - {t: 160, stems: base, fade: 3}   # thinning to the base in the Last Chamber
    - {t: 171, stems: none, fade: 2}   # out under Varga's t=172 line: the bed alone into the warning
  ambience: vrell-hive   # the living hive's bed (after K −12 dB over the race, eased over 2 s: the game's LevelMusic, step H4; the near side's belt-open takes over at section 8)
  ambience_layers:
    - {ambience: hive-heartbeat, from: 45, to: 182, fade_in: 90, fade_out: 1}   # the bed's heartbeat layer (step AUD-GH), rising over the Choir Chambers and the Brood Halls to full in the Last Chamber, out at the warning (step H4)
  ambience_changes:
    - {section: 8, ambience: belt-open, crossfade: 2}   # the near side: open space (Act 5's)
  end_jingle: mission-complete
  boss_warning: boss-warning      # track 22 with the klaxon and the banner at t=182 (the boss's `incoming`), before the Heart shows
  boss_track: final-boss          # track 20 "Choir Heart" (full length, MUS-H) from the warning's end through the three phases; at K its `choir` stem alone (final-boss-motif), out at the gate's groan; the coda (final-boss-coda) from K+12 into the warp: step H4's hooks 2-3

difficulty: {}  # the stat blocks' hooks apply (the Heart's easy and hard: rests, one at a time on easy, the walls' corridor, no reversal on easy, the heartbeat ring of 16 and the HP ×1.05 on hard; the Seraph's, the Warden's, the Harrow's, the Chimera's); the vault's 40 HP on hard in its block; the formation lever sizes the waves

briefing:
  pages:   # the approved texts as they are (BriefingLayoutTest: 4 lines a page)
    - {speaker: Okafor, image: level-50-hive-core, line: "This is the hive core, Aegis. Every Vrell signal out here runs to one point, and that point is the Choir. Silence it and the war is over. Then come home. All of you."}
    - {speaker: Varga, image: level-50-heart-organ, line: "It will fight with every song we have heard since Luna. Watch for the organs that open when it sings: that is when they can be hurt. And Lancer, it is afraid. I still don't know of what."}
  teaser: {speaker: Rook, line: "Last one, Lancer. After this the drinks are on me. All of them."}

backdrop:
  # Presentation only: Level 50's hive core (tools/art/act7_core.py, step ART-H2; sections from the level's data.yaml).
  # Vacuum: no haze. Deep: one continuous field cut at the sections' seams (re-run the generator after
  # moving a section): the Throat's rib rings, the Choir Chambers' vaults, the Brood Halls' folds, the
  # Last Chamber's veins converging on the Heart, the Heart's chamber (deep-5 onward, halted). Low-air:
  # a set a section (1, 2, 4), each cleared along a ragged band where its section meets another. Ground:
  # section 3's living floor, its lead and end pieces at the exact rows of its seams.
  # H4 hooks: (1) VeinPulse extended to every layer of this level: each `<set>-veins` image and
  # `singing-ribs-glow` (additive, not listed here) added with the pulse k(t) <= 1 Hz, in time with
  # HEARTBEAT once the Heart lives; (2) the pulse light (`pulse` below): the additive `pulse-light`
  # (512 px, radius 256) drawn screen-space, centred at `centre`, scaled to `reach` (radius px), alpha
  # `peak` x the pulse, [from, to] eased over the section, 2 s eases between sections; none after K.
  scroll_factors: {deep: 0.12, far: 0.35, ground: 1, low-air: 1.3, high-air: 2.0}   # far, high-air unused
  ramp: 2
  haze_colour: 1a0c22
  atmosphere:
    clear: {haze: 0.0}   # vacuum: no haze, no wisps
  tile_sets:
    deep-1: {layer: deep, height: 1280}   # section 1: The Throat
    deep-2: {layer: deep, height: 800}   # section 2: The Choir Chambers
    deep-3: {layer: deep, height: 640}   # section 3: The Brood Halls
    deep-4: {layer: deep, height: 736}   # section 4: The Last Chamber
    deep-5: {layer: deep, height: 224}   # section 5: The Last Chamber, braking
    deep-6: {layer: deep, height: 192}   # section 6: The Heart
    deep-7: {layer: deep, height: 800}   # section 7: The race
    deep-8: {layer: deep, height: 448}   # section 8: The near side (step H4: re-cut for the section's end at 238)
    throat-ribs: {layer: low-air, height: 1024}
    singing-ribs: {layer: low-air, height: 1024}
    vein-cables: {layer: low-air, height: 1024}
    brood-floor: {layer: ground, height: 1024}
  pieces:
    floor-lead: {layer: ground, size: [480, 256]}
    floor-end: {layer: ground, size: [480, 256]}
  placed:
    # the Brood Halls' floor reaching raggedly below section 3's ground seam (exact rows)
    - {piece: floor-lead, t: 99.7, x: 240}
    # the floor ending raggedly above section 4's ground seam (exact rows); beyond it the deep
    - {piece: floor-end, t: 137.7, x: 240}
  pulse:   # H4: per section index (0-based), the pulse light's centre (screen px), reach and peak
    - {section: 0}   # The Throat: none (lit by the units and the veins)
    - {section: 1, centre: [240, -330], reach: [380, 440], peak: [0.2, 0.3]}   # The Choir Chambers
    - {section: 2, centre: [240, -270], reach: [460, 540], peak: [0.32, 0.45]}   # The Brood Halls
    - {section: 3, centre: [240, -200], reach: [560, 720], peak: [0.4, 0.55]}   # The Last Chamber
    - {section: 4, centre: [240, -200], reach: [720, 720], peak: [0.55, 0.55]}   # The Last Chamber, braking
    - {section: 5, centre: [240, 150], reach: [640, 640], peak: [0.35, 0.35]}   # The Heart
