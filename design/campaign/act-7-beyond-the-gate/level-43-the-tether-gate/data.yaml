# Level 43 – The Tether Gate: the level script, rendered into README.md (briefing, threat profile, layout, waves, radio,
# credit budget). Times are seconds from the level start. M11 part B, step B2, from the README's approved hand tables
# (round 84) and ART-B's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block as it is, the sections at
# the README's times so the tile sets stay cut; the glyph stones on the ring's surface strip at x 82-398).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M11 part B (flown from step B1; loaded and checked from step B2): the `transit` (the scripted formation
# from t=262, the 1.5 s warp from t=266.5, the level ending inside it), the radio's `radio_noise` step (1: the act's
# rise, rendered into the voice files and the HUD portrait's static), the radio's `escort-first-kill` naming its kind
# (Rook's first Gate Warden), a wave's `line_order: right-left`. Part A's: the Gate Warden's `window_shield` and line,
# the waves' `line`, `line_stagger` and `line_order`, `beyond_gate` (NO COVER).
# Step B2's own placements (decided as trivia, pending the user's review in round 89): the "pairs" fly as a line abreast
# of 2 (the stations at x 160 and 320; a line of 3 at x 80, 240, 400: step B3b's `spacing: 160`); the Mote
# Swarms beside a Warden group's hold fly the side lanes (`edge-left`, `edge-right` paths), the snakes and wings by the
# open columns; the glyph stones' first cluster enters at t≈207 (the t=188 line has risen out by then), the second
# at t≈227 in the columns the t=218 pair leaves free (x ≤ 98, 222-258, ≥ 382).
scroll_speed: 120     # the mouth; the pickets 110, the ring's shadow 100, along the ring 140 (eased over 2 s each)
launch_seconds: 5
bounty_scale: 0.19    # every bounty × 0.19: step B3b's levelReport fit with the denser mixed waves (B2's 0.25; the README's hand estimate 0.27)
control_prompts: []
medium: vacuum        # Vrell space: short flashes and debris rings, no smoke (design/world/vrell-space)
beyond_gate: true     # past the fleet's net: the Airstrike and the Orbital Lance read NO COVER; the EMP Burst works
radio_noise: 1        # the friendly radio's noise, step 1 of the act's rise (L43 → L47); the Choir's channel clean
transit: {form: 262, warp: 266.5, length: 1.5}   # the gate transit: the formation from t=262 (no input, no hits, Rook scripted), the 1.5 s warp from t=266.5; the level ends at t=268 inside it
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The Tether Gate
  layers: [air, ground]
  density: 4
  traits: [forward, shield-breaker]
  hazards: [laser lines]
  boss: none
  objective: CLEAR THE GATE   # the OBJECTIVE field from sensor L1
  varga:
    none: "The Tether Gate, Lancer. A ring of stone the size of a moon."
    l1: "Straight ahead. No air cover past the ring. Laser lines."
    l2: "New: Gate Wardens, sealed stone. Chimeras, Harrows, swarms."
    l3: "Wardens open only to fire. The coil's arc cracks them."
  notes:
    Dominant layers: '`space` (the Gate Wardens at their stations, the Vrell swarms, Chimera and Needler wings, Harrow streams, Stinger columns); `low-air`: Spore Bomber lines between the Warden groups; `ground` in section 4 only: the ring''s surface and its harmless **glyph stones**'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: "The Wardens' `laser-line`s (straight down and aimed); the Harrows' burst rings; the Spore Bombers' rising spores; the gate transit (scripted, harmless)"
    Boss / mid-boss: none
    Sensor-suite detail: '**none**: the Tether Gate, `space`, front · **L1**: + density {density}, the hazard "laser lines", the objective `{objective}`, the secondary `WARDENS 0 / 16`, `SPECIAL LIMITED` (`NO COVER`) · **L2**: + Gate Warden (new), Chimera, Harrow, Spore Bomber, Needler, Stinger, Skitter and Mote portraits · **L3**: + `forward` and `shield-breaker` highlighted, the wave strip marking the seven Warden groups'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); ART-B's tile sets cut at these rows
  - name: The Mouth
    end: 48
    atmosphere: clear
    tiles: [deep-1]
    notes:
      layers:
        deep: the ring small ahead, the nebula; the *Steadfast* group's running lights behind (bottom of the screen at the start, scrolling off by t≈20).
        low-air: drifting spore sacs.
      purpose: "Vrell popcorn; the Warden's intro alone at t=36 (quiet window t=33–40)."
  - name: The Pickets
    end: 124
    speed: 110
    ramp: 2
    atmosphere: clear
    tiles: [deep-2]
    notes:
      layers:
        deep: the ring grows to a third of the screen, its glyphs readable.
        low-air: dead tendrils.
      purpose: 'Warden pairs (straight, then aimed); Chimeras and Harrows; the supply drone (t=118).'
  - name: The Ring's Shadow
    end: 200
    speed: 100
    ramp: 2
    atmosphere: clear
    tiles: [deep-3]
    notes:
      layers:
        deep: the ring fills the top of the screen, the nebula behind it; the light dims a step.
      purpose: 'Three Warden lines of three; the Helix pod (the secret, t≈176).'
  - name: Along the Ring
    end: 256
    speed: 140
    ramp: 2
    atmosphere: clear
    tiles: [deep-4, ring-surface]
    notes:
      layers:
        ground: '**the ring''s surface** (basalt and glyph channels) with the glyph stones (t≈207, t≈227).'
        deep: the ring's inner curve rising like a horizon; the Choir's line (t=208).
      purpose: 'The last Warden pair (t=218); the run to the ring''s centre; the last wave at t=246.'
  - name: The Transit
    end: 268
    speed: 140
    atmosphere: clear
    tiles: [deep-5]
    notes:
      layers:
        deep: the event plane fills the ring's centre ahead, pale violet; the scripted formation from t=262; the **warp** t=266.5–268.
      purpose: '≥ 4 s of calm (the last wave gone by ≈ t=253), then the gate transit; level end at t=268 inside the warp.'

