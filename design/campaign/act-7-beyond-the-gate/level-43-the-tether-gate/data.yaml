radio:  # trigger: t or event; the README's 19 lines (the 1 s rule). Rook's barks need him flying (requires: escort: his first Warden, the t=130 line); his t=13 and t=257 lines are scripted. The Choir once on the enemy channel, clean (no static lead: J3). Vorne is silent.
  - {t: 1, speaker: Okafor, line: "Aegis, Steadfast. The gate's mouth is yours. Clear its wardens, then lead us through."}
  - {t: 13, speaker: Rook, line: "Dead for forty-four years, and the day Vorne needs a door, it wakes up. Lovely."}
  - {t: 25, speaker: Varga, line: "The stone things on the ring are new. Sealed shells. They only open when they fire."}
  - {t: 37, speaker: Varga, line: "Shoot when the red line shows. Or break the shell with the coil's arc."}
  - {t: 48, speaker: Okafor, line: "Every warden you leave stands between the fleet and the gate. Leave none."}
  - {event: escort-first-kill, enemy: gate-warden, speaker: Rook, requires: escort, line: "Cracked one. They don't like the coil.", notes: {trigger: "The first Warden killed by Rook (event, bark, `requires: escort`)"}}
  - {t: 78, speaker: Varga, line: "Chimeras and Harrows. The Vrell brought Vorne's hybrids home with them."}
  - {t: 90, speaker: Okafor, line: "Aimed lines now. Don't wait in them. Shoot from where the beam isn't."}
  - {t: 118, speaker: Okafor, line: "Supply drone inbound from Steadfast. The last one you'll get past the ring."}
  - {t: 130, speaker: Rook, requires: escort, line: "Three at once. Fine. I'll take the left one, you take the other two.", notes: {trigger: "bark, `requires: escort`"}}
  - {t: 196, speaker: Okafor, line: "You're over the ring itself. Our signal gets worse past here. Stay together."}
  - {t: 208, speaker: The Choir, channel: enemy, line: "…small bright one… why do you stand in the door…", notes: {trigger: "enemy channel"}}
  - {t: 215, speaker: Varga, line: "That was the Choir. It has never asked us anything before."}
  - {event: secondary-objective, speaker: Okafor, line: "No wardens left at the mouth. The fleet can pass.", notes: {trigger: "Secondary met (`secondary-objective`, the 16th Warden down)"}}
  - {event: secondary-failed, speaker: Varga, line: "One went back into the ring. The fleet will meet it at the mouth.", notes: {trigger: "Secondary failed (a Warden rises out)"}}
  - {t: 245, speaker: Okafor, line: "The ring is lighting, Aegis. Form up on the centre. We're right behind you."}
  - {t: 257, speaker: Rook, line: "Here we go. Stay close, Lancer."}
  - {t: 263, speaker: Okafor, line: "Steadfast, follow Aegis through."}

