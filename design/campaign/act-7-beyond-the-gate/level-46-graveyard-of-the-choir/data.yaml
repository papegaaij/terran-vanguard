set_pieces:  # huge units on a scripted course (design/enemies/space/leviathan); path: [t, x, y below the top edge] of the centre
  - enemy: leviathan
    scenery: true             # the dying Leviathan (J6): scenery for the counts; its vents and fins silent, no contact
    part_drop: small salvage  # each wrecked part (10 in Act 1 terms)
    drop: medium salvage      # its death (50) in place of L03's large: whole 7 × 10 + 50 = 120
    passes:
      - name: dying             # on high-air its first pass's diagonal: only homing and beam weapons reach it
        section: 3
        layer: high-air
        heading: 58             # degrees from straight down, positive to the right; fixed for the pass
        path: [[122, -265, -150], [142, 846, 544]]  # top left to bottom right over the quiet (L03's diagonal in 20 s)
        notes:
          t: 122–142
          name: the dying pass
          from: front (top-left, diagonal)
          notes: '`high-air`, scenery: no attacks, no bounty; salvage per part'

ground_targets:  # at: [t, x], when it enters at the top edge and its x; every object pinned to its hull on low-air (the ground's 90 px/s)
  - target: warm hull sinews
    section: 4
    layer: low-air
    pinned: true
    size: [28, 28]
    sprite: warm-hull-sinew   # tools/art/act7_deadfleet.py: _0..2 whole, hit, cut; -break the tear
    hp: 15
    group: warm-hull-sinews   # the four sinews' last one cut frees the core (pickups: story)
    count: 4
    at: [[185.677, 180.6], [185.721, 270.6], [184.899, 182.6], [184.943, 272.6]]   # ART-D's knots at the core ± (46, 34): the hull's centre at mid-screen at t=188.4, x 230
    notes:
      target: 'The warm hull''s four sinews (`low-air`, pinned to the hull, {hp} HP each, t≈184)'
      effect: 'The four cut free the core: it rises over 2 s and is collected by flying through it (no credits; the Mk VI comes with the win)'
  - target: Helix wreck hatch
    section: 2
    layer: low-air
    pinned: true
    size: [24, 24]
    sprite: helix-hatch   # shut, dented, blown open; -break
    hp: 20
    hard: {hp: 28}
    reveals: Helix wreck
    at: [[84.916, 98.2]]   # on the wreck (its centre at mid-screen at t=88, x 110; the hatch at -11.8, -4.6)
    notes:
      target: 'The Helix wreck''s hatch (a `low-air` trigger on the wreck, {hp} HP, t≈88, x 98)'
      effect: 'A secret: frees a crate worth 100 (1,678)'

debris:  # Vorne's courier (secret 2): a gold Ascendancy courier drone tumbling slowly on the play plane, its drive burnt out (a small breakable like a small rock: 20 HP); broken, it frees the secret's hidden crate (`reveals`); sprites assets/sprites/debris-vorne-courier_N (16 tumble frames) and -break_N (ART-D)
  chunks:
    vorne-courier: {size: [40, 40], hp: 20}
  clearance: 0
  placed:
    - {t: 228, x: 380, chunk: vorne-courier, drift: [-6, -60], reveals: Vorne's courier}

secrets:
  - name: Helix wreck
    crate: 100   # Act 1 terms: pays 1,678 with the act factor (the last of the 2179 Helix survey)
    radio: {speaker: Varga, line: "Helix markings. The rest of the 2179 survey. They made it through."}
  - name: Vorne's courier
    crate: 100   # Act 1 terms: pays 1,678 (a gold Ascendancy courier drone on the lifeboat's course)
    radio: {speaker: Rook, requires: escort, line: "Gold paint. One of Vorne's couriers. He came this way."}

pickups:
  - {pickup: armour patch, dropped_by: {wave: 14, unit: first}}   # the first Husk, when destroyed (the lesson's reward for meeting the new unit)
  - {pickup: shield cell, dropped_by: {wave: 167, enemy: mantis, unit: first}}   # the t=167 pincer's left Mantis
  - {pickup: overdrive, dropped_by: {wave: 212, unit: first}}   # the t=212 V-wing's tip
  - {pickup: story, story: vrell-core, dropped_by: {group: warm-hull-sinews, unit: last}, rise: 2.0, box: [48, 48]}   # the Vrell core (Q9 b): its four sinews cut, it rises over 2 s at their centre and is flown through; pays nothing, the Mk VI comes with the win

radio:  # trigger: t or event; the README's 19 lines (the 1 s rule). Rook's barks need him flying (requires: escort); the secrets' lines are the secrets' own. The Choir once on the enemy channel, clean (no static lead: J3). Nobody speaks in the quiet but Varga, once.
  - {t: 1, speaker: Okafor, line: "Dead ships, Aegis. Hundreds of them. Stay sharp anyway."}   # step D2: one radio page (from "… The scans say nothing out there is alive. …": Varga's t=11 line 1.7 s late, the 1 s rule)
  - {t: 11, speaker: Varga, line: "That hull is drifting dead. Leave it, or shoot it and see if it answers."}
  - {event: first-crack, speaker: Rook, requires: escort, line: "It answered. Noted.", notes: {trigger: "The first Husk cracks (`first-crack`, event, bark)"}}
  - {t: 24, speaker: Varga, line: "Seed caskets in the wreckage. Crack them as they pass. Five, and the fleet eats for weeks."}
  - {t: 47, speaker: Okafor, line: "Lampreys in the lanes, both sides. Keep moving."}
  - {t: 68, speaker: Varga, line: "Wraiths behind you. Your missiles find them where the guns can't."}
  - {t: 126, speaker: Varga, line: "Lancer, look at the hulls. They were opened from the inside. Nothing burned them. Something emptied them.", notes: {trigger: "t=126 (the quiet)"}}
  - {t: 144.5, speaker: Okafor, line: "Contacts on every side! The dead ones are waking."}
  - {t: 152, speaker: The Choir, channel: enemy, line: "…these were ours… we left them… we ran…", notes: {trigger: "t=152 (enemy channel)"}}
  - {t: 158, speaker: Varga, line: "They are not singing to us. They are singing away from something."}
  - {t: 181.5, speaker: Varga, line: "One hull's still warm. Its core is alive. Cut the sinews and fly through it. I want that core."}
  - {event: story-collected, speaker: Varga, line: "A living core. Give me a week and it will power anything we own.", notes: {trigger: "The core collected (event)"}}
  - {event: story-missed, speaker: Okafor, line: "The tug has the core. Stay on the lane, Lancer.", notes: {trigger: "The core missed (event, it leaves the screen)"}}
  - {t: 219, speaker: Okafor, line: "The dead world. Past it the Choir's song gets louder. That's our heading."}   # step D2: t=219, not 214: the fifth casket's line (C5, t≈207-213) held it 1.1 s late (the 1 s rule)
  - {event: secondary-objective, speaker: Rook, requires: escort, line: "Five caskets. The quartermaster owes you a drink.", notes: {trigger: "Secondary met (`secondary-objective`, the fifth casket)"}}
  - {event: secondary-failed, speaker: Varga, line: "Two caskets lost to the drift. A pity.", notes: {trigger: "Secondary failed (the second casket away)"}}
  - {event: level-end, speaker: Okafor, line: "Out of the graveyard. Form up, Aegis. Nobody talks until Varga's done.", notes: {trigger: Level end}}   # step D2: "about what we saw" dropped (it ended 0.3 s after the debrief)

objectives:
  primary: reach-end
  secondary: {escapes: seed-casket, allowed: 1, easy: {allowed: 2}, hard: {allowed: 0}, label: CASKETS, credits: 100, name: Break 5 of the 6 seed caskets}   # break at least 5 of the 6 seed caskets before they drift off the screen (easy 4, hard all 6), met at the fifth (DONE), failed by the second away (CASKETS n / 5); 100 in Act 1 terms: pays 1,678

music:
  track: 17           # Act 7 B "Hollow Light" (audio/music track list); its sparse base stem (the heartbeat and the sub, MUS-B) for Level 46 (J8)
  start_section: 1
  full_section: 5     # never the full mix: the timed stems below hold past the sections (Level 27's rule), the sparse stem alone
  stem_times:         # step D4 plays them (the drop and the return; Level 26's machinery)
    - {t: 0, stems: sparse, db: -6, fade: 0}    # the sparse base at −6 dB over the outer wrecks and the lanes
    - {t: 120, stems: none, fade: 1}            # the quiet: out over 1 s, the dead-fleet bed alone through the Husks' cue
    - {t: 147, stems: sparse, db: -6, fade: 1}  # the pulse returns with the remnants
    - {t: 214, db: -12, fade: 24}               # thinning over the dead world
    - {t: 250, stems: none, fade: 12}           # gone by t=262: the level ends in the bed alone
  ambience: dead-fleet   # a low, empty space drone with the slow creak and tick of cold hulls, very sparse (QD-1, round 91)
  end_jingle: mission-complete

difficulty: {}  # the stat blocks' hooks apply (the Husk's easy fan of 3 and ring of 6, hard fan of 7, ring of 10 and a 0.4 s tell; the Wraith's, the Lamprey's, the Mantis's, the Harrow's, the Chimera's); the crack cue's hard gap and the secondary's allowed in their blocks; the Husks, caskets and Mantises pinned; the formation lever sizes the rest

briefing:
  pages:   # the approved texts as they are (BriefingLayoutTest: 4 lines a page)
    - {speaker: Okafor, image: level-46-dead-fleet, line: "Beyond the reefs our scans show a fleet. Hundreds of Vrell hulls, and none of them moving. Cross it and tell me what killed them. Take what you can on the way: we are a long way from Callisto, and nothing out here sells us fuel."}
    - {speaker: Varga, image: level-46-hollow-hull, line: "The hulls are dead, but some still hold a charge. Hit one and it may answer. Look for one that is still warm, Lancer. A living core would give the fleet a generator like nothing we can build."}
  teaser: {speaker: Rook, line: "A graveyard. Varga says it's quiet. I'm bringing the autocannon anyway."}

backdrop:
  # Presentation only: Level 46's dead fleet (tools/art/act7_deadfleet.py fleet, step ART-D: its proposal's block, the
  # Helix wreck moved onto the ground's scroll by step D2). Vacuum: no haze. No ground layer. Deep: one continuous field
  # (near-black violet, sparse stars, the far dead fleet) cut at the sections' seams (re-run the generator after moving a
  # section); the world small in section 1 (world-far) and filling the lower sky in section 5 (world-near, on a path
  # rising against the layer). Low-air: the hollowed hulks (16 frames: 9 turns forth and back), the Helix wreck, the
  # warm hull.
  # D4 hooks: (1) the starless patch is code-drawn (Level 46 Layout: x 360, 150 px down, r ~60, a smooth edge), after
  # the deep pieces and before low-air; (2) the warm hull and its glow move with the ground's scroll (their path), the
  # core (story `vrell-core`) and the four sinews are sprites drawn on them; warm-hull-glow fades out as the core rises;
  # (3) the dying Leviathan (the scenery set piece) is drawn as `dying-leviathan` (the graded copy), with
  # `dying-leviathan-cross-glow` added in a slow pulse (k(t) <= 0.25 Hz).
