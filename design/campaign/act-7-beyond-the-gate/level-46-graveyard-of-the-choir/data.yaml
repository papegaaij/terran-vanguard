# Level 46 – Graveyard of the Choir: the level script, rendered into README.md (briefing, threat profile, layout, waves,
# radio, credit budget). Times are seconds from the level start. M11 part D, step D2, from the README's approved hand
# tables (round 84) and ART-D's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block and sections, the
# warm hull's core and sinews and the Helix hatch at its places).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M11 part D (flown from step CD1; loaded and checked from step D2): a drifting unit's wave `lines`
# ([x0, depth0, x1, depth1] each: in at the first point outside the field, out past the second; unit i on line i) and
# `warn: false` (no edge warning: a drifting derelict is scenery until hit); the level's `crack_cue` (at t every Husk on
# the screen cracks in turn, the farthest from the ship first, gap s apart); a set piece's `scenery: true` with its
# `part_drop` and `drop` (the dying Leviathan: no bounty, no kill, silent, no contact, salvage per part); a ground
# target's `pinned: true` (a low-air object riding its hull on the ground's scroll: the warm hull's sinews, the Helix
# wreck's hatch); the radio event `first-crack`; the music's `sparse` stem (track 17's, `stem_times`).
# Step D2's own placements (pending the user's review in round 91): the Husks' lines (each wave's hulls ≥ 80 px apart
# on parallel lines, VrellChecks; the quiet's two waves interleaved on one slope, 82 px apart, in from t=132 since step
# D6 so all five are on the screen at the t=144 crack cue at any drift speed); the caskets C1–C6 each on a corner chord
# from the top edge out through a side (≈ 300 px: 12–20 s on the screen at 15–25 px/s, C3 gone before
# the quiet); the Lamprey pincers as two edge-warned streams of 3 (the Lamprey flies no pincer); the Helix wreck moved
# onto the ground's scroll (a path as the warm hull's) so its hatch rides it pinned; Vorne's courier ART-D's tumbling
# debris chunk (20 HP on every difficulty: a chunk has no hard HP).
scroll_speed: 90      # the same speed throughout (no holds)
launch_seconds: 5
bounty_scale: 0.135   # every bounty × 0.135: step D2's levelReport fit with the denser mixed waves and the salvage counted (the README's hand estimate 0.19 before them; salvage, crates and the secondary are not scaled)
control_prompts: []
medium: vacuum        # Vrell space: short flashes and debris rings, no smoke (design/world/vrell-space)
beyond_gate: true     # past the fleet's net: the Airstrike and the Orbital Lance read NO COVER; the EMP Burst works
ground: none          # space only: the dead fleet's hulks are deep and low-air scenery (NO GROUND for the Bomb Rack and every bomb delivery)
radio_noise: 4        # the friendly radio's noise, step 4 of the act's rise (L43 → L47); the Choir's channel clean
breather: true        # the act's breather: its density may dip 20 % under the act's minimum (80 → 64 a minute)
quiet: {from: 118, to: 144}   # the quiet (Q4 a, t=120–144): Rook's pick holds until the player's first hit or a Husk's first shot; step D2: from t=118, the last wave gone (held from 120, Rook woke the Husks then drifting in in their first 2 s); step D6: the quiet's five Husks drift in at t=132–133 (a Husk draws 20–40 px/s, so one in at t=118 had left by the cue)
crack_cue: {t: 144, gap: 0.6, hard: {gap: 0.5}}   # the quiet's end: every Husk on the screen cracks in turn, the farthest from the ship first, 0.6 s apart (hard 0.5), each with its tell
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The dead fleet
  layers: [air]
  density: 3
  traits: [homing, piercing]
  hazards: [derelicts that answer fire]
  boss: none
  objective: CROSS THE DEAD FLEET   # the OBJECTIVE field from sensor L1
  varga:
    none: "A dead fleet, Lancer. Hundreds of hulls, none moving."
    l1: "Sparse, but from every side. Salvage everywhere."
    l2: "New: Husks, dead hulls that answer fire. Wraiths too."
    l3: "Homing for the Wraiths; piercing for drifting hulls."
  notes:
    Dominant layers: '`space` (the Husks, Chimera and Needler wings, Harrow and Skitter streams, Stinger lines and columns, Mote Swarms, Lampreys, Mantis pincers), `high-air` (Wraiths; the dying Leviathan, scenery); **no ground** (`NO GROUND`: the dead fleet''s hulks are `deep` and `low-air` scenery)'
    Attack directions: '{directions} by the waves'' data (the seed caskets drift in too, objects, not counted)'
    Density: '{density} (the breather)'
    Recommended traits: '{traits}'
    Hazards: Derelicts that answer fire (the Husks' crack fans and death rings); the quiet (scripted, harmless)
    Boss / mid-boss: none
    Special limits: '`NO COVER` (the Airstrike, the Orbital Lance; J12); `NO GROUND` for the Bomb Rack and every bomb delivery'
    Sensor-suite detail: '**none**: Vrell space, the dead fleet, `space`, all directions · **L1**: + density {density}, the hazard "derelicts that answer fire", the secondary `CASKETS 0 / 5`, `SPECIAL LIMITED` (`NO COVER`, `NO GROUND`) · **L2**: + Husk (new), Wraith, Lamprey, Mantis, Chimera, Harrow, Needler, Stinger, Skitter and Mote portraits · **L3**: + `homing` and `piercing` highlighted, the wave strip marking the quiet'

sections:  # back to back from t = 0 at 90 px/s; ART-D's tile sets cut at these rows
  - name: The Outer Wrecks
    end: 48
    atmosphere: clear
    tiles: [deep-1]
    notes:
      layers:
        low-air: scattered dead hulls, hollowed, crystal at the cracks; the first Husk (t=14), casket C1.
        deep: the withered world small and far, the starless patch.
      purpose: The Husk taught alone; the patch in place from the start.
  - name: The Graveyard Lanes
    end: 118
    atmosphere: clear
    tiles: [deep-2]
    notes:
      layers:
        low-air: hulks in loose lanes, some broken in two; the Helix wreck (secret, t≈88); caskets C2, C3.
      purpose: Lampreys from the sides, Wraiths from behind; the breather's steady stretch.
  - name: The Quiet
    end: 144
    atmosphere: clear
    tiles: [deep-3]
    notes:
      layers:
        low-air: the densest hulks, every one torn open from inside.
        high-air: '**the dying Leviathan** (t=122–142); five Husks drifting.'
      purpose: '**The quiet** (Q4 a): nothing attacks; the music out; Varga''s one line.'
  - name: The Remnants
    end: 214
    atmosphere: clear
    tiles: [deep-4]
    notes:
      layers:
        low-air: the lanes break up; **the warm hull** (t≈184); caskets C4, C5.
      purpose: The Husks crack; the remnants from every side; **the core** in a quiet window (t=182–192).
  - name: The Dead World
    end: 268
    atmosphere: clear
    tiles: [deep-5]
    notes:
      layers:
        deep: the withered grey world fills the lower sky, its surface cracked and pale.
        low-air: the last hulks thin out; Vorne's courier (secret, t≈228); casket C6.
      purpose: The last waves; ≥ 4 s of calm (the last wave gone by ≈ t=262); level end at t=268.

