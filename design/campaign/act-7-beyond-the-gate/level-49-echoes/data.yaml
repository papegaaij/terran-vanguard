# Level 49 – Echoes: the level script, rendered into README.md (briefing, threat profile, layout, waves, radio, credit
# budget). Times are seconds from the level start on the level clock: it stands at each echo's gate (t=98, 106 and 117)
# while that echo lives, so the README's real times after t=98 are later than the clock's (the rush ≈ 172 s of the
# level's ≈ 288 s). M11 part G, step G2, from the README's approved hand tables (round 84).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M11 part G (flown from step G1; loaded and checked from step G2): a rush boss's `echo: true` (it flies its
# original's `boss.echo` stat block: design/enemies/bosses, Boss rush), a rush gate's `crawl: true` (its ground crawls on
# at its speed while the clock stands: the Carrier's and the Colossus's 20 px/s), the kill ratio's `until: warning`
# (judged by the first boss warning), a `boss-destroyed` line's `enemy` (which echo's death), the music's `boss_tracks`
# (a boss track per fight, step G4's hook).
# Step G2's own placements (pending the user's review in round 94): the gates' times are ART-G's proposal's
# (concept/backdrop-proposal.yaml; each gate's end is its echo's bar: the checkpoint and the refill are taken there, the
# built rush's rule), the warnings 5 s before each arrival (the Colossus's 4.9 s), the backdrop ART-G's block as it is,
# the density waves (the final-act rule) marked "Step G2: density".
scroll_speed: 100     # the approach (the memory has no ground there: the speed moves the deep and low-air scenery)
launch_seconds: 5
bounty_scale: 0.51    # every bounty × 0.51: step G2's levelReport fit with the density waves (the README's hand 0.66 before them; the crate and the secondary are not scaled)
control_prompts: []
medium: vacuum        # Vrell space: short flashes and debris rings, no smoke (design/world/vrell-space)
beyond_gate: true     # past the fleet's net: the Airstrike and the Orbital Lance read NO COVER; the Swarm Call works
radio_noise: 5        # the friendly radio's noise, step 5 (held from L47 to L50); the Choir's channel clean
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: The Choir's memory
  layers: [air, ground]
  density: 5
  traits: [forward, rear, shield-breaker]
  hazards: [three echoes in a row]
  boss: The Echoes
  objective: BREAK THE ECHOES   # the OBJECTIVE field from sensor L1
  varga:
    none: "The Choir's memory, Lancer. Luna, Mars, Ceres."
    l1: "Waves from every side, then three echoes in a row."
    l2: "Carrier, Colossus, Sovereign: as they were, in light."
    l3: "Guns ahead and behind; a breaker for the shields."
  notes:
    Dominant layers: '`air` (`space` is `air` in vacuum, J12: every remembered wave, the Brood Carrier''s echo); `ground` in the arenas only (the Dust Colossus''s remembered basin floor, the Iron Sovereign''s station layer)'
    Attack directions: '{directions} by the waves'' data; the Colossus''s rear breach'
    Density: '{density}'
    Recommended traits: '{traits} (**J9**: the roster''s "any balanced loadout" is not a trait)'
    Hazards: The three echoes back to back (the bosses' documents); the remembered waves from every side
    Boss / mid-boss: '**boss rush**: the echoes of the Brood Carrier, the Dust Colossus and the Iron Sovereign (Q6 a)'
    Special limits: '`NO COVER` (the Airstrike, the Orbital Lance; J12)'
    Sensor-suite detail: '**none**: Vrell space, the Choir''s memory, `air`, all directions · **L1**: + density {density}, the hazard "three echoes in a row", the secondary `KILLS 0 / 157`, `SPECIAL LIMITED` (`NO COVER`) · **L2**: + the three echoes'' portraits (tinted), Skitter, Needler, Stinger, Spore Bomber, Dust Kite, Ghost Drone, Mote Swarm, Choir Herald, Dart, Talon, Gunship and Hornet portraits · **L3**: + `forward`, `rear` and `shield-breaker` highlighted, the wave strip marking the three echoes'

sections:  # back to back from t = 0; ART-G's proposal's times (its tile sets and pieces are placed by them); each change eased over 2 s
  - name: Luna remembered
    end: 31
    atmosphere: clear
    tiles: [tissue, luna-regolith]
    notes:
      layers:
        deep: "Earth's crescent over the grey limb, dissolving into the tissue."
        low-air: "Luna's regolith and the L1 point's wreck lights, remembered; the supply pod (secret, t≈24)."
      purpose: "Act 1's Vrell as the Choir remembers them: Skitters, Needlers, Stingers, Spore Bombers."
  - name: Mars remembered
    end: 61
    atmosphere: clear
    tiles: [tissue, valles-veils]
    notes:
      layers:
        deep: Mars's rust disc.
        low-air: "Valles walls far below, dust veils (scenery, never over a bullet)."
      purpose: "Act 3: Dust Kites, Ghost Drones, Mote Swarms, Choir Heralds."
  - name: Ceres remembered
    end: 90
    atmosphere: clear
    tiles: [tissue, belt-rocks]
    notes:
      layers:
        deep: The belt's dark rock, Ceres far off.
        low-air: Tumbling rocks and Ceres's station lights far off.
      purpose: "Act 5, **Vorne's memory**: Darts, Talons, shielded Gunships and Hornets (`shield-breaker`); the last wave at t=84, gone by the first warning (t=90)."
  - name: Echo of the Carrier
    end: 98     # the gate: the clock stands at t=98 (the bar, the checkpoint) while the echo lives
    speed: 20
    ramp: 2
    arena: true
    crawl: true   # the slow scroll: the ground crawls on at 20 px/s through the fight
    atmosphere: clear
    tiles: [tissue, l1-debris]
    notes:
      layers:
        deep: "Luna's L1 point: Earth, the Moon, the picket's wreck lights."
      purpose: "The first warning at t=90 (the approach's last wave gone); the Brood Carrier's echo forms at its station (t=95-98)."
  - name: First gap
    end: 101
    speed: 20
    atmosphere: clear
    tiles: [tissue]
    notes:
      layers:
        deep: The memory melting into the tissue.
      purpose: "The dissolve (≤ 2 s chain, then the motes); no wave; the next warning at t=101."
  - name: Echo of the Colossus
    end: 106    # the gate: the clock stands at t=106 (the bar, the checkpoint, the refill) while the echo lives
    speed: 20
    arena: true
    crawl: true   # the breaching boss's crawl (20 px/s) over the remembered Hellas basin floor
    atmosphere: clear
    tiles: [tissue, hellas-floor]
    notes:
      layers:
        ground: The remembered Hellas basin floor (this fight only; its breaches need it).
      purpose: "The second warning at t=101 (no line); the Dust Colossus's echo at its bar (t=106), its first tell 2 s after."
  - name: Second gap
    end: 109
    speed: 20
    atmosphere: clear
    tiles: [tissue]
    notes:
      layers:
        deep: The memory melting into the tissue.
      purpose: "The dissolve; no wave; the third warning at t=109."
  - name: Echo of the Sovereign
    end: 117    # the gate: the clock stands at t=117 (the bar, the checkpoint, the refill) while the echo lives
    speed: 0
    arena: true
    atmosphere: clear
    tiles: [tissue]
    notes:
      layers:
        deep: "Ceres orbit: Ceres's curve and the station's lights; the scroll halted (the Sovereign is its own anchored station)."
      purpose: "The third warning at t=109; the Iron Sovereign's echo forms on its station (t=114-117), the core already open."
  - name: The unmaking
    end: 135
    speed: 40
    ramp: 2
    atmosphere: clear
    tiles: [tissue]
    notes:
      layers:
        deep: "The last memory melts into the hive's living tissue; far ahead, the core's red-violet glow."
      purpose: "≥ 4 s of calm after the third dissolve; the closing lines; the level ends at t=135 (≈ 288 s real)."

rush:   # the boss rush (Q6 a; design/enemies/bosses, Boss rush): each echo in its own gate; the refill and a checkpoint at each gate on every difficulty
  refill: true
  checkpoint: every-difficulty
  par: 162        # s from the first bar to the last kill, the gaps included: the autopilot's measured mean at medium (step G5b: EchoFightTest 161.9; step G5 164.7; step G2 176; the README's paper ≈ 172)
  bosses:
