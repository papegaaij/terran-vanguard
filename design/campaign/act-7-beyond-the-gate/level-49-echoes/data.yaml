    - {enemy: dust-colossus, echo: true, t: 105.9, x: 240, section: 6, incoming: 4.9}   # the warning at t=101; its bar at the gate's halt, the first tell 2 s after
    - {enemy: iron-sovereign, echo: true, t: 114, x: 240, section: 8, incoming: 5}   # the warning at t=109; forms 3 s on the halted station

