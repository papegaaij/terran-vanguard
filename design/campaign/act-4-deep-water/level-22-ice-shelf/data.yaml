vents:  # the ice geysers (Level 19's vent rows on the ice): a crack glows lime-white for the tell, then a steam column stands; 3 cracks a row, alternate ends
  look: ice-geyser   # the game draws and sounds the rows as ice geysers (the furnace vent if not given)
  width: 40
  tell: 1.2
  burn: 0.8
  period: 4.0
  ripple: 0.4
  bullet: heavy
  easy: {period: 5}
  hard: {period: 3.2}
  rows:
    - {t: 12, xs: [150, 240, 330]}   # the first row, alone: the radio's first-geyser line
    - {t: 31, xs: [360, 240, 120]}
    - {t: 50.5, xs: [90, 170, 250]}   # under the second rig's Skimmer leads, left of its nest
    - {t: 66, xs: [360, 240, 120]}
    - {t: 84, xs: [120, 240, 360]}
    - {t: 107, xs: [360, 300, 120], period: 3.2, easy: {period: 4}, hard: {period: 2.6, ripple: 0.3}}   # section 3: Conamara's tremors (hard: 0.3 s ripple so tell, burn and the ripples fit 2.6 s)
    - {t: 118.5, xs: [120, 180, 360], period: 3.2, easy: {period: 4}, hard: {period: 2.6, ripple: 0.3}}   # the road's lane in the middle stays clear
    - {t: 136.5, xs: [360, 300, 120], period: 3.2, easy: {period: 4}, hard: {period: 2.6, ripple: 0.3}}

