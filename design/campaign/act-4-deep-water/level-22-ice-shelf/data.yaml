  - {pickup: shield cell, dropped_by: {wave: 82, unit: last}}     # the second Mantis of the t=82 pincer

drops:  # a Conamara ice-crawler (a tracked survey vehicle, the CDF supply drone's role; its look, step B4) releases an armour patch
  - {t: 110.5, x: 240, y: 380, pickup: armour patch, sprite: ice-crawler}   # step B5: on the ice-breaker road between the seam and lead 6 (its drive up and back stays off leads 5 and 6; t=100 put it on open lead 5)

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected)
  - {t: 1, speaker: Dr. Brandt, portrait: conamara, line: "Aegis flight, Conamara Station. Four rigs on the shelf, forty of us in the dome, and the ice will not hold still."}
  - {t: 18, speaker: Rook, requires: escort, line: "Copy, Conamara. Last open sky for a while, Lancer. Enjoy it."}
  - {event: first-geyser, speaker: Varga, line: "Cracks glow, then steam. Do not sit on them.", notes: {trigger: "First geyser row flares (`first-geyser`, t≈12)"}}
  - {t: 29, speaker: Varga, line: "Drill rig ahead. Hardened shell: bombs, mortars and the Airstrike get through. Break the bore core."}
  - {event: target-destroyed, speaker: Dr. Brandt, portrait: conamara, line: "That's one collar stopped and the shaking eased. Three to go.", notes: {trigger: "First rig core destroyed (`target-destroyed`)"}}
  - {t: 58, speaker: Varga, line: "Ilse? It's Elena. Hold on, we are coming."}
  - {t: 87, speaker: Rook, requires: escort, line: "Mantis, both flanks!"}
  - {t: 104, speaker: Dr. Brandt, portrait: conamara, line: "Something went through under the north dome. There is water in the shaft at Kilo-Seven. It leads down."}
  - {event: secondary-objective, speaker: Dr. Brandt, portrait: conamara, line: "Enough rigs are down. The shelf is quiet. Thank you, Aegis.", notes: {trigger: Secondary met (`secondary-objective`)}}
  - {t: 135, speaker: Okafor, line: "Conamara is in sight. We refit for the water tonight and we take that shaft in the morning."}
  - {event: level-end, speaker: Okafor, line: "Conamara is safe, for now. Refit, Aegis. Tomorrow we go under the ice."}

