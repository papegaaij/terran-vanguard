difficulty: {}  # the geysers' easy and hard periods are in `vents`, the secondary's easy and hard allowed in `objectives`; the Stinger streams' hard counts, the pincers' easy counts and the t=35 Skimmers' hard count are in their waves; the formation lever sizes the rest; the stat blocks' hooks apply (the Drill Rig's easy 4.5 s ring and hard aimed shard)

briefing:
  pages:
    - {speaker: Okafor, image: level-22-conamara-map, line: "Conamara Station has felt the ice shaking for a week. Now we know why: the Vrell have set four drill rigs on the shelf and they are boring for the ocean. Forty scientists are in that dome. Break the rigs before they go through, then we follow the hole down."}
    - {speaker: Varga, image: level-22-drill-rig, line: "A rig is a collar and four pumps in a hardened shell. Shots glance off; bombs, mortars and an Airstrike get through. Aim for the bore core. And mind the cracks: when the ice glows, the steam is next."}
  teaser: {speaker: Rook, line: "Last open sky for a while, Lancer. Bombs for the rigs, I'd say."}

