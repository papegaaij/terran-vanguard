# Level 22 – Ice Shelf: the level script, rendered into README.md (briefing, threat profile, layout, waves, ground
# targets, radio, credit budget). Times are seconds from the level start. M8 part B, step B2, from the README's approved
# hand tables (round 48). Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M8 part B (loaded and checked by content in step B2; flown from steps B1/B3, drawn by step B4): the vents'
# `look` (ice-geyser) and a row's own `period` and `ripple` (with its own easy and hard), the secondary's per-difficulty
# `allowed` (its easy and hard), the radio events `first-geyser` and `target-destroyed`, the Drill Rig's pumps that carry
# its ring and slow it (its stat block). Defaults of the gap check (m8b-gaps.md §5, pending the user's review in round
# 51): 8 geyser rows (the README lists 8 times), hard's section-3 ripple 0.3 (period 2.6 holds tell + burn + 2 ripples),
# the secondary's allowed easy 2 / medium 1 / hard 0. Step B2's own placements (pending review): the Skimmer lanes, the
# rig nests and the geyser rows' x (the leads are cut along the lanes and kept clear of the rigs, the nests and the
# cracks; briefs/m8b-lanes.md), the t=30 row at 31, the t=52 row at 50.5, the t=118 row at 118.5 and the t=132 row at
# 136.5 (clear of the Skimmer leads).
scroll_speed: 120     # the shelf approach; the rig field and the run-in set their own
launch_seconds: 5
bounty_scale: 0.30    # every bounty × 0.30: re-fitted in step B3b after the waves' rework (levelReport, medium); B3's 0.38 fitted the approved draft waves
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Europa, ice shelf
  layers: [ground, air]
  density: 3
  traits: [anti-ground, forward]
  hazards: [ice geysers]
  boss: none
  objective: REACH CONAMARA   # the OBJECTIVE field from sensor L1
  varga:
    none: Europa's ice shelf, Lancer. Four rigs are boring for the ocean.
    l1: Mostly ahead. Cracks glow before the steam bursts.
    l2: "New: a hardened drill rig. Aim for the glowing core."
    l3: Bombs and mortars for the rigs, forward guns for the rest.
  notes:
    Dominant layers: '`air` (Stinger, Needler, Skitter and Mote streams, Mantis pincers), `ground` (Drill Rigs, Spine Turret nests, a Polyp Mortar floe, Skimmers in the open leads)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: Ice geysers (cracks that glow, then burst); the rigs' ice-shard rings
    Boss / mid-boss: none
    Sensor-suite detail: 'none: Europa, ice shelf, `ground` + `air`, front · L1: + directions (sides), density {density}, hazard "ice geysers", the objective `{objective}` and the secondary `RIGS 3/4` · L2: + Drill Rig (new, hardened), Skimmer, Stinger, Needler, Mantis, Skitter and Mote portraits · L3: + `anti-ground` and `forward` highlighted, the wave strip marking the four rig sites'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); tiles: step ART-B's backdrop (no deep layer: the opaque shelf, kept in round 51)
  - name: The Shelf
    end: 36
    atmosphere: clear
    tiles: [ice-shelf, ice-crystals]
    notes:
      layers:
        ground: fissured ice, ridges, open leads (plain dark water, scenery) along the Skimmers' lanes; a Spine Turret nest on a ridge (t≈20); the first geyser row (t≈12) flares alone.
        high-air: ice crystals.
      purpose: Popcorn from t=5; the first geysers; no rig yet.
  - name: The Rig Field
    end: 104
    speed: 60
    ramp: 2   # eased from 120 over its first 2 s
    atmosphere: clear
    tiles: [rig-field]
    notes:
      layers:
        ground: four **Drill Rigs** (t=40, 56, 72, 88; x 130, 340, 150, 330), each with its nest of Spine Turrets and, after the last, a Polyp Mortar floe (t≈100); steaming cracks where the collars bore; the secret's crevasse at t≈70.
      purpose: The rigs' quiet window, the hardened target, the geysers between rigs.
  - name: Conamara Run-in
    end: 150
    speed: 110
    ramp: 2   # eased from 60
    atmosphere: clear
    tiles: [conamara-run]
    notes:
      layers:
        ground: the ice-breaker road to **Conamara Station** (the research dome, a landing pad, sodium lamps; scenery), a cordon of Spine Turrets (t≈125); the geysers tremble faster as the dome nears.
      purpose: The run-in, the faster geysers; level end as the dome reaches the bottom edge.

# The README's 48 waves at their times (draft, measured with levelReport in step B3). A Skimmer stream is a lane walker
# (design/enemies/naval/skimmer): unit i on lane i (wrapping), 1.5 s apart, each lane in ground space at its own unit's
# entry ([x, y], y below the top edge); the streams alternate between the left and the right top corner and the leads
# are cut along their runs (step ART-B, briefs/m8b-lanes.md). On the shelf and the run-in a lane curls across the screen
# and back (about 4 s on the screen); in the rig field the lanes pass under the rig that has just entered, one per unit.
# Stinger streams keep 3 on hard (the README's hand trim, at most ~3.5 enemies on the screen); the Mantis pincers fly 1
# on easy. No other wave enters t=39.5-43.5 (the first rig's quiet window): the t=35 Skimmers keep 3 on hard.
