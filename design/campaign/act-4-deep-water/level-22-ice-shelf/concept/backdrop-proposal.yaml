backdrop:
  # Presentation only: Europa's ice shelf (tools/art/backdrop_l22.py, from europa-ice-shelf-r48-a). No deep
  # layer: the shelf is opaque everywhere (the leads are dark water mirroring Jupiter, not holes); the leads
  # are cut along the Skimmer runs, the seams, the crevasse and the station sit at exact rows (re-run the
  # generator after the data moves a lane, a section or the lip).
  scroll_factors: {ground: 1, low-air: 1.35, high-air: 2.2}
  ramp: 4
  haze_colour: c8d8e8  # Europa's pale blue-white
  atmosphere:
    clear: {haze: 0.0}   # every section: hard sunlight from the top left, no haze
  tile_sets:
    ice-shelf: {layer: ground, height: 960}   # section 1: the white-blue plain of Europa's ice, double ridges (lineae) crossing it, fissures, pressure ridges; Jupiter's warm shine from the right
    rig-field: {layer: ground, height: 960}   # section 2: the chaos's broken plates over the refrozen matrix, Vrell teal stains, fissures
    conamara-run: {layer: ground, height: 960}   # section 3: the plates under packed snow, the ice-breaker road at x 240 (berms, marker poles, a sodium lamp every 240 px)
    ice-crystals: {layer: high-air, height: 960}   # section 1: glittering ice crystals and thin vapour wisps (additive at 40 %)
  pieces:
    seam-rig-field: {layer: ground, size: [480, 320]}
    seam-conamara-run: {layer: ground, size: [480, 320]}
    pressure-ridge: {layer: ground, size: [260, 120]}
    crevasse: {layer: ground, size: [180, 64]}
    lead-1: {layer: ground, size: [480, 1682]}
    lead-2: {layer: ground, size: [480, 454]}
    lead-3: {layer: ground, size: [480, 583]}
    lead-4: {layer: ground, size: [480, 713]}
    lead-5: {layer: ground, size: [480, 434]}
    lead-6: {layer: ground, size: [480, 918]}
    lead-7: {layer: ground, size: [480, 917]}
    conamara-station: {layer: ground, size: [480, 300], mid_size: true}
  placed:
    # 2. section 2's seam (ground 4860): ice-shelf into rig-field along a pressure ridge; exact rows
    - {piece: seam-rig-field, t: 39.5, x: 240}
    # 3. section 3's seam (ground 9000): rig-field into conamara-run along a pressure ridge; exact rows
    - {piece: seam-conamara-run, t: 106.909, x: 240}
    # 1. the pressure ridge under the t~20 nest
