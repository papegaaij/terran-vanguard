# The README's waves at their times (draft, measured with levelReport in step E3). The schools (`swarm`) fly an S-shaped
# route down the trench (x 190–290, the flock's spread and its 14 px sway clear of the 260 px walls; x 210–270 in the
# narrows; down the fork's left channel at x 145–150 while the pillar is on the screen); the Barbfins' groups from the
# front are laid out on the trench's span (the simulation's formation span) and hold above the ship; a cave wave
# (`cave`, from the side of its notch's wall) swims out of its notch, warned 3 s ahead at that edge; the Sirens are nests
# on the walls' feet (`wall`), a nest every 1.5 s (staggered: both walls taking turns from the right) or a pair opposite;
# a Nautilus pair (`circle`) orbits the ship for its 15 s hold, then breaks off. Quiet windows: no other wave enters
# t=18–21.5 (the first Siren) or t=62.5–66 (the first Nautilus pair).
