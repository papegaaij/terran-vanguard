# Level 25 – Siren Trench: the level script, rendered into README.md (briefing, threat profile, layout, terrain, waves,
# ground targets, radio, credit budget). Times are seconds from the level start. M8 part E, step E3, from the README's
# approved hand tables (round 48). Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M8 part E (loaded and checked by content in step E3; flown from steps E1/E2, mapped in step E3, drawn by
# step E5): the terrain's `notches` (the side caves: flyable dead ends cut into a wall, rock on three sides), a wave's
# `cave` (its units swim out of that notch, warned 3 s ahead at its wall's edge) and `wall` (Siren nests on the walls'
# feet: `staggered` a nest every 1.5 s, the walls taking turns from the right, or `opposite` pairs at one row, the left
# one's song 1.5 s later), the Siren's slowing `ring` and the Spiral Nautilus's `coil` (their stat blocks).
# Defaults of the gap check (m8e-gaps.md §5, accepted in round 54 (2026-10-23)): the nests `air` and counted as
# waves (E1: 271 + 9), the cave waves and the walls' nests counted as side entries (the intel's rule), the caves
# `terrain.notches` (E5), the pillar's Reef Spitters in the island's foot band (E6), the Nautilus's clamp and hold (E7: a
# pair holds 15 s), no Nautilus while the narrows are at the top edge (E9), the survey sub a trigger inside the left
# notch and the armour patch a drop with the `survey-buoy` look (E12). Step E3's own placements (pending review): ART-E's
# terrain proposal adopted unchanged (the walls, the pillar island, the 25 notches: one per cave wave, the survey sub's
# and fillers), the ground targets at ART-E's spots, the schools' routes (x 190–290 in the 260 px trench, x 210–270 in the
# narrows, down the fork's left channel at x 145–150 while the pillar is on the screen), the nest waves moved 0.3–0.5 s
# off notch mouths and beacons (26.8, 47, 56.2, 70, 91.3, 131.3, 152.3), the radio retimed to the HUD's hold (Rook t=13,
# Varga t=20, Okafor t=44).
scroll_speed: 140     # the trench; the narrows and the Song set their own
launch_seconds: 5
bounty_scale: 0.42    # every bounty × 0.42: the README's estimate 0.48, fitted in step E3; refitted in step AW2 (M8 AW: more Barbfins; TypicalHaulTest, levelReport)
control_prompts: []
medium: underwater    # the whole level (the descent's waterline was Level 23): the water's factors, the grade, the special limits (UNDER ICE)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Europa, Siren Trench
  layers: [air, ground]
  density: 4
  traits: [anti-sub, spread]   # the README draft named `homing` too: three do not fit the intel panel at L3 (IntelPanelLayoutTest; step E3); the L3 line names torpedoes and spread
  hazards: [walls, sonar slow]
  boss: none
  objective: CROSS THE TRENCH   # the OBJECTIVE field from sensor L1
  varga:
    none: A trench with singing walls. Narrow, and no way round.
    l1: Nests on both walls and enemies out of the caves. Keep off the rock.
    l2: "New: Sirens slow you with sound. Nautilus spirals round you."
    l3: Cave entries marked. Torpedoes and spread; keep moving.
  notes:
    Dominant layers: '`air` (the play plane under water: Glassfin schools, Barbfin groups, Nautilus pairs, the wall nests'' sacs), `ground` (Reef Spitters on the ledges at the walls'' foot)'
    Attack directions: '{directions} (the cave entries and the walls'' nests count as sides)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: Trench walls (terrain collision); Siren rings that slow the ship (60 % for 2 s)
    Boss / mid-boss: none
    Sensor-suite detail: 'none: Europa, the trench, `air` + `ground`, front and sides · L1: + directions (all), density {density}, hazards "walls" and "sonar slow", the objective `{objective}` and the secondary `KILL RATIO 65 %` · L2: + Siren (new), Spiral Nautilus (new), Barbfin, Glassfin, Reef Spitter portraits, the `ring` slow marked as no damage · L3: + the side caves'' entry points on the threat arrows'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); the whole level under water (the level's medium)
  - name: Trench Mouth
    end: 22
    atmosphere: clear
    tiles: [trench-floor]
    notes:
      layers:
        ground: 'the plain''s edge dropping into the trench, the first walls rising from t=8, three beacons on the left wall.'
        sub: the abyss below, a faint glow.
      purpose: Glassfin and Barbfin popcorn; the first Siren alone (t=18).
  - name: The Walls
    end: 60
    atmosphere: clear
    tiles: [trench-floor]
    notes:
      layers:
        ground: 'ice-rock walls with caves notched in them every 700 px, alternating sides (the first at t=29), Reef Spitters on the ledges (t=30), beacons every 900 px.'
      purpose: Siren pairs and cave entries; the nests taught as a rhythm.
  - name: Cave Mouths
    end: 95
    atmosphere: clear
    tiles: [trench-floor]
    notes:
      layers:
        ground: As section 2; the survey sub wreck in the left cave (t≈78, the secret).
      purpose: The Nautilus's first pair (t=62.5) with Sirens on top.
  - name: The Narrows
    end: 130
    speed: 120
    ramp: 2   # eased from 140 over its first 2 s
    atmosphere: clear
    tiles: [trench-scour]
    notes:
      layers:
        ground: 'a rock pillar mid-trench at t=98–106 splitting it into two 140 px channels, then the walls close to 190 px (t=108–118), a Conamara survey buoy (t=118, the armour patch).'
      purpose: The tightest stretch; Sirens flank the fork; no Nautilus inside the 190 px stretch.
  - name: The Song
    end: 160
    speed: 130
    ramp: 2   # eased from 120
    atmosphere: clear
    tiles: [trench-song]
    notes:
      layers:
        ground: As section 2, nests on both walls at their densest (up to four on the screen).
      purpose: The Sirens, Nautilus pairs and Barbfin together.
  - name: Trench Floor
    end: 173
    speed: 140
    ramp: 2   # eased from 130
    atmosphere: clear
    tiles: [abyss-floor]
    underwater_look: {ambient: 0.1, tint: 98c0e0, caustics: 0.0, snow: 80}   # the floor opening, the lights going out (Level 26)
    notes:
      layers:
        ground: the walls falling away, the sea floor opening to flat black water; no more nests.
      purpose: Release; level end; the lights ahead go out (Level 26).

# The game's under-water grade (presentation only; step C4's UnderwaterGrade): the trench is dark but not black (Q2 a):
# the ship's headlight cone, the nests' teal sacs and the beacons' red-gold pulse light it, a dim blue ambient of about
# 14 % (ART-E's proposal for round 54); a bit darker over the floor of section 6. Glows, bullets and the HUD ungraded.
# Round 54 (F.2 redo, step LX): the dark ambient kept; the headlights light the world in their cones (the walls, the
# cave mouths, the floor and the pillar near their full colour, 240 px ahead over a 50° sector) and a faint rim light
# runs along the rock edges (the walls, the caves, the pillar), so the trench's shape reads outside the beams.
underwater_look: {ambient: 0.14, tint: a0c8e8, caustics: 0.0, snow: 100, headlights: {strength: 0.95, reach: 240, angle: 50}, rim: 0.5}

# The trench (Level 16's terrain rules under water, design/campaign Level 25, The trench): the walls' collision lines
