backdrop:
  # Presentation only: Level 25's trench (tools/art/backdrop_l25.py, step ART-E, from the level's data.yaml; its
  # `--proposal`, concept/backdrop-proposal.yaml, adopted in step E3). Re-run the generator after the data moves a
  # section, a wall, a notch or a target.
  # No deep layer (the ground is opaque; the walls' rims project beyond the field's edges). The walls and the pillar are
  # the terrain's (WallProjection, the ice path): ice-wall, ice-wall-glow (additive growth nodules), ice-wall-foot,
  # pillar-face, pillar-top_0..1, in CanyonProfile's convention. cave-mouth-left/right are drawn by the game over the
  # walls at each terrain notch (not placed); relay-beacon-glow is added over the grade at relay-beacon's placements on
  # the same frame clock (D4).
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}   # far unused, given as the loader asks
  ramp: 2
  haze_colour: 041c26  # the trench's blue-black water
  atmosphere:
    clear: {haze: 0.0}
  tile_sets:
    trench-floor: {layer: ground, height: 960}   # sections 1-3: dark silt between rubble fans shed by the walls, boulders, current lines
