# depth into it}. ART-E's proposal (concept/backdrop-proposal.yaml), adopted unchanged: the walls rise at the field's
# edges from t=5 (400 px by t=12), 320 px by t=20, 260 px from t=34, the fork at 330 px round the pillar (two 140 px
