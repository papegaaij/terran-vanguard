backdrop:
  # Presentation only: Level 25's trench (tools/art/backdrop_l25.py, step ART-E, from the level's data.yaml).
  # No deep layer (the ground is opaque; the walls' rims project beyond the field's edges). The walls and the
  # pillar are the terrain's (WallProjection, the ice path): ice-wall, ice-wall-glow (additive growth nodules),
  # ice-wall-foot, pillar-face, pillar-top_0..1, in CanyonProfile's convention. cave-mouth-left/right are drawn
  # by the game over the walls at each terrain notch (not placed); relay-beacon-glow is added over the grade at
  # relay-beacon's placements on the same frame clock (D4). Re-run the generator after the data moves a
  # section, a wall, a notch or a target.
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}   # far unused, given as the loader asks
  ramp: 2
  haze_colour: 041c26  # the trench's blue-black water
  atmosphere:
    clear: {haze: 0.0}
  tile_sets:
    trench-floor: {layer: ground, height: 960}   # sections 1-3: dark silt between rubble fans shed by the walls, boulders, current lines
    trench-scour: {layer: ground, height: 960}   # section 4: current-scoured rock, ripples, boulders (the fork and the narrows)
    trench-song: {layer: ground, height: 960}   # section 5: the silt grown over with Vrell root mats
    abyss-floor: {layer: ground, height: 960}   # section 6: the floor opening into flat black silt
  pieces:
    trench-lip: {layer: ground, size: [480, 800]}
    seam-trench-scour: {layer: ground, size: [480, 320]}
    seam-trench-song: {layer: ground, size: [480, 320]}
    seam-abyss-floor: {layer: ground, size: [480, 320]}
    rock-ledge-left: {layer: ground, size: [64, 56]}
    rock-ledge-right: {layer: ground, size: [64, 56]}
    relay-beacon: {layer: ground, size: [128, 192], frames: 16, fps: 4, keep_clear: 100}
    relay-beacon-glow: {layer: ground, size: [128, 192], frames: 16, fps: 4}
    cave-mouth-left: {layer: ground, size: [112, 124]}
    cave-mouth-right: {layer: ground, size: [112, 124]}
  placed:
