# Level 26 – Blackwater: the level script, rendered into README.md (briefing, threat profile, layout, terrain, waves,
# ground targets, radio, credit budget). Times are seconds from the level start. M8 part F, step F2, from the README's
# approved hand tables (round 48). Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M8 part F (loaded and checked by content in step F2; flown from step F1, drawn and played by steps F4/F5):
# the Glow Angler's `lunge` (its stat block), `rook_loss` (Rook's scripted loss: the trails, the hit, the spin-down),
# the look's dark keys (`underwater_look`: a section's ambient `ramp`, the static `lights`, the escort's `escort_lamp`,
# with step LX's `headlights {strength, reach, angle}` and `rim`), a radio row's `static_lead` and `duck_db` (the
# Choir), a field carrier's `unit: centre` and the music's `stem_times`.
# Defaults of the gap check (m8f-gaps.md §5, pending the user's review in round 55): the dark is the light map with this
# level's values, nothing in the simulation knows it (F1); the ambient ramp 20 → 6 % over t=8–18 in section 1 (F4); the
# scarp a right wall only, each `turret nest` wave just above its notch (F5); the loss not an eject (F7); the aftermath's
# quiet window t=156–160, the jellies at 160/166 after it (F9; round 55's retime: 152–166, the jellies at 166/172); "the central Angler" the field member nearest the
# field's centre at entry (F10); the eel counted whole (48 typical, F11); track 10 only (F12).
# Step F2's own placements (pending review): ART-F's terrain proposal adopted unchanged (concept/backdrop-proposal.yaml:
# the scarp t=56–103, 3 notches); the README's `scattered` Angler rows are sparse `field`s (no `scattered` formation in
# the vocabulary: a 400 px wide area, 100 px between units); the t=26 Angler row moved to 27.5 (the first sight's quiet
# window, 24–27.5); the eel pairs of t=96 and 141.5 two rows 4 s apart (Level 24's pairs); the fields and snakes of the
# scarp on its open left side.
scroll_speed: 130     # the lamp stretch; the dark and the silence set their own
launch_seconds: 5
bounty_scale: 0.43    # every bounty × 0.43: the README's estimate 0.41, fitted in step F2 (TypicalHaulTest, levelReport)
control_prompts: []
medium: underwater    # the whole level: the water's factors, the grade, the special limits (no Airstrike, no Orbital Lance)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Europa, Blackwater
  layers: [air]
  density: 3
  traits: [homing, area]   # the README draft named `spread` too: the L3 line names homing and area guns
  hazards: [darkness, lures]
  boss: none
  objective: CROSS THE BLACKWATER   # the OBJECTIVE field from sensor L1
  varga:
    none: Black water. You'll fly by headlight and by their glow.
    l1: Nothing hides from a shot, only from your eyes. Bullets always show.
    l2: "New: Glow Angler. Its lure is not a pickup. Sonar lights it."
    l3: Homing and area guns. Pulse the sonar when it gets thick.
  notes:
    Dominant layers: '`air` (the play plane under water, seen as glows: Glow Anglers, Driftjellies, Nautilus pairs, Eel Swarm snakes), the fault scarp''s Siren nests'
    Attack directions: '{directions} (the scarp''s nests count as sides)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: 'Darkness: only the headlight cone, light pools and the Vrell''s glow; Glow Anglers lunge when touched; Driftjelly rings; Siren rings at the scarp'
    Boss / mid-boss: none
    Sensor-suite detail: 'none: Europa, deep water, `air`, front · L1: + directions (all), density {density}, hazard "darkness", the objective `{objective}` and the secondary `KILL RATIO 65 %` · L2: + Glow Angler (new), Driftjelly, Eel Swarm, Spiral Nautilus, Siren portraits, the lure marked "not a pickup" · L3: + the scarp''s nest positions on the threat arrows'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); the whole level under water (the level's medium)
  - name: The Last Lamp
    end: 20
    atmosphere: clear
    tiles: [pipeline-floor]
    underwater_look: {ambient: 0.20, ramp: {to: 0.06, from: 8, until: 18}}   # the lamps going out behind the ship (F4)
    notes:
      layers:
        ground: 'the last Thera Deep lamp posts along a drowned pipeline, one every 360 px, until t=14; the trench''s beacons falling behind.'
      purpose: The lights go out behind the ship; the Nautilus's crown learnt while lamps still burn.
  - name: The Dark
    end: 60
    speed: 120
    ramp: 2   # eased from 130 over its first 2 s
    atmosphere: clear
    tiles: [black-water]
    notes:
      layers:
        ground: Black water; marine snow in the cone; the only light the units' glow and the pickups' warm gold.
      purpose: The Glow Angler (t=24); the lure learnt.
  - name: The Scarp
    end: 100
    speed: 120
    atmosphere: clear
    tiles: [black-water]
    notes:
      layers:
        ground: 'A single **fault wall on the right** (a scarp, flyable width 400 → 280 px) with three cave mouths; the Sirens'' sacs glowing beside them; the farm barge lamp (t≈84, left). The scarp sinks away at t=100.'
      purpose: 'The Sirens in the dark: their glow is their tell.'
  - name: The Choir
    end: 130
    speed: 120
    atmosphere: clear
    tiles: [black-water]
    notes:
      layers:
        ground: Open black water; the Choir's static in the HUD portrait from t=97.
      purpose: The Choir's fragment (t=99); the constellation of Anglers (t=108).
  - name: The Deep
    end: 155
    speed: 120
    atmosphere: clear
    tiles: [black-water]
    notes:
      layers:
        ground: Open black water; a faint amber seep glow far below from t=140.
      purpose: The last fights; Rook's pre-line (t=150).
  - name: The Silence
    end: 188
    speed: 110
    ramp: 2   # eased from 120
    atmosphere: clear
    tiles: [black-water]
    notes:
      layers:
        ground: Black water; the vent field's red glow rising on the horizon from t=174; Rook's lamp beside the ship until t≈163.5.
      purpose: Rook's loss (t=161–166); the aftermath; level end.

# The game's under-water grade and its light map (presentation only; step LX's headlights, step F4's dark): the black
# level of round 48's Q2 a. The ambient 6 % (section 1 from 20 %, ramping down over t=8–18); the hard cone of the twin
# headlights, 70° × 260 px (the README's Darkness), bringing the world in it to its full colour; a faint 15 % rim on the
# scarp's rock edges; Rook's lamp a 56 px pool (the Bulwark's too, F7); the static pools of the lamp posts (sodium, until
# the last one fails at t≈14), the trench's two last beacons, the farm barge's lamp and the survey buoy. Glows, bullets,
# markers and the HUD stay ungraded. ART-F's proposal (round 55), adopted.
underwater_look:
  ambient: 0.06
  tint: 80aceb
  caustics: 0.0
  snow: 110
  headlights: {strength: 1.0, reach: 260, angle: 70}
  rim: 0.15
  escort_lamp: 56
  lights:   # scroll: the terrain's row of the pool's centre (below 0: on the screen at the start), x, radius px, colour
    - {scroll: -434, x: 158, radius: 90, colour: ffc46e}   # lamp post 1
    - {scroll: -74, x: 158, radius: 90, colour: ffc46e}    # lamp post 2
    - {scroll: 286, x: 158, radius: 90, colour: ffc46e}    # lamp post 3
    - {scroll: 646, x: 158, radius: 90, colour: ffc46e}    # lamp post 4
    - {scroll: 1006, x: 158, radius: 90, colour: ffc46e}   # lamp post 5
    - {scroll: 1366, x: 158, radius: 90, colour: ffc46e}   # lamp post 6, the last, failing (its piece loops a stutter)
    - {scroll: -210, x: 64, radius: 40, colour: ff6040}    # the trench's last beacon 1 (the 4 s pulse is its glow piece's)
    - {scroll: -70, x: 420, radius: 40, colour: ff6040}    # the trench's last beacon 2
    - {scroll: 10314, x: 64, radius: 80, colour: ffc46e}   # the farm barge's lamp (t≈84, x 60): the only warm light
    - {scroll: 15650, x: 240, radius: 30, colour: ffe0a0}  # the survey buoy (t=130, y 380)

# The fault scarp (Level 25's terrain rules with one wall; the README's The fault scarp): the right wall's collision line
# (its foot) [scroll, x(, height)], scroll the ground scroll at which the row reaches the top edge; no left wall (open
# water). ART-F's proposal (concept/backdrop-proposal.yaml), adopted unchanged: the scarp rises at the field's right edge
# from t=56, 400 px of flyable width by t=61, closing to 280 px at t≈80–92, sinking away at t=97–103. Its three notches
# (cave mouths) lie just below each `turret nest` wave's first nest (on the screen when the nests enter; gap check F5).
# The same geometry on every difficulty.
terrain:
  right:
    - [6930, 480, 0]     # t=56: the scarp begins at the field's edge, flat
    - [7290, 430, 0.7]   # t=59
    - [7530, 400]        # t=61: 400 px, at full height
    - [8130, 400]        # t=66
    - [9090, 330]        # t=74
    - [9810, 290]        # t=80
    - [11250, 280]       # t=92: 280 px, the narrowest
    - [11850, 300]       # t=97
    - [12210, 360, 0.5]  # t=100: sinking away
    - [12570, 480, 0]    # t=103: gone, flat
  notches:   # the cave mouths, 90 px along the wall and 70 deep (0-based)
    - {side: right, scroll: 7500, width: 90, depth: 70}    # 0: the t=62 nests' cave (t=60.8 at the top edge)
    - {side: right, scroll: 8700, width: 90, depth: 70}    # 1: the t=72 nests' cave (t=70.8)
    - {side: right, scroll: 10380, width: 90, depth: 70}   # 2: the t=86 nests' cave (t=84.7)
  contact: {damage: {easy: 6, medium: 10, hard: 10}, push: 28, push_seconds: 0.12, cooldown: 0.5}   # Level 25's: 10 per touch (easy 6)
  notes:   # the README's scarp table, by row
    before: Open black water, no walls
    rows:
      6930: 'The scarp rises at the field''s right edge'
      7530: The flyable width 400 px; the first cave mouth and its nests
      9090: The scarp closing in
      11250: 'The narrowest: 280 px'
      12210: The scarp sinks away
      12570: 'Gone: open black water'

# The README's waves at their times (draft, measured with levelReport in step F2). Every wave enters from the front but
