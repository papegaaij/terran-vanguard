ground_targets:  # at: [t, x], when it enters at the top edge and its x
  - target: farm barge
    section: 3
    layer: ground
    size: [80, 48]
    sprite: farm-barge   # tools/art/l26_props.py (step ART-F): the drowned Thera Deep farm barge with its one working lamp, its break frames and its glow
    hp: 20
    reveals: farm barge
    at: [[84, 60]]   # on the sea floor in the dark's open left side
    notes:
      target: 'Thera Deep farm barge (`ground` trigger, {hp} HP, t≈84, x 60)'
      effect: 'The secret: frees a crate worth 100 (410)'

secrets:
  - name: farm barge
    crate: 100   # Act 1 terms: pays 410 with the act factor
    radio: {speaker: Varga, line: "A farm barge, lamp still on. Warm light, Lancer: that one is ours."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 96, unit: first}}       # the first eel of the t=96 pair
  - {pickup: shield cell, dropped_by: {wave: 108, unit: centre}}   # the constellation's Angler nearest its centre (F10)

drops:  # a drifting Thera Deep survey buoy (warm gold glow) releases an armour patch in the open water before the deep
  - {t: 130, x: 240, y: 380, pickup: armour patch, sprite: survey-buoy}

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected). Rook's three
  # lines are scripted, not barks (no `requires`): they play with him, ejected, without him or with the Bulwark; his
  # barks end at the loss's trails (t=162.5). The Choir's line: the HUD portrait's static 2 s before it, the music 6 dB
  # under it. Step F2 retimed the loss's lines to the radio's hold (every line on the panel at least 5 s and 0.4 s of
  # silence: RadioTimelineLevel26Test): Rook's pre-line 148, Varga's warning 155, Okafor 167.5, Varga 174.5, Okafor 181.
  # Round 55's retime (the user's playtest of 2026-10-24: the cut line came seconds after his loss): Rook's cut line
  # opens as soon as Varga's shout has closed (t≈161.1 at the default text speed) and the hits cut it, 2.3 s in, in
  # its last word; the loss and everything after it 6 s later than before: Okafor 173.5, Varga 180.5, Okafor 187.
  - {t: 1, speaker: Okafor, line: "Blackwater, Lancer. No lamps, no charts. Your headlight and whatever glows, nothing else."}
  - {t: 13, speaker: Rook, line: "Dark and wet. At least nobody sees me being scared."}
  - {t: 24.5, speaker: Varga, line: "That glow is not a pickup. Teal is Vrell. Touch it and it lunges."}
  - {t: 46, speaker: Varga, line: "Lost them? Pulse the sonar. It lights everything for six seconds."}
  - {t: 63, speaker: Varga, line: "A fault wall on your right. Sirens in its caves: watch for the glow before the ring."}
  - {t: 99, speaker: The Choir, distorted: true, static_lead: 2, duck_db: 6, line: "…small ones… in the dark… your kin… came before you…"}
  - {t: 110.5, speaker: Varga, line: "Your kin. It said your kin, Commander."}
  - {t: 118, speaker: Okafor, line: "Noted, Doctor. Eyes front."}
  - {t: 140, speaker: Okafor, line: "Almost through the deep, Lancer. Vents ahead."}
  - {t: 148, speaker: Rook, line: "Lancer, if I buy you a drink for this one, we're even."}   # the README's t=150, so Varga's warning follows it
  - {t: 155, speaker: Varga, shout: true, line: "Contacts below!"}   # the README's t=157: her sonar finds them as they launch, before the trails rise (t=162.5) (the radio holds a line at least 5 s)
  - {t: 161.2, speaker: Rook, line: "Lancer, something's below u—"}   # cut mid-word (Level 10's cut dash) by the hits at t=163.5, his voice in the "u" (the take's 2.3-2.45 s); the trails rise from t=162.5 under "something's below"
  - {t: 173.5, speaker: Okafor, line: "Aegis Two, report. Rook? Rook, answer!"}   # the README's t=165, 10 s after the hits
  - {t: 180.5, speaker: Varga, line: "His lamp went down, Commander."}   # the README's t=171
  - {t: 187, speaker: Okafor, line: "Finish the dive, Lancer. We will find him.", notes: {trigger: "Level end (t=187)"}}   # the README's t=176
  - {event: secondary-objective, speaker: Okafor, line: "Clean crossing. Now find him, Lancer.", notes: {trigger: Secondary met (at the end)}}

rook_loss: {t: 163.5, trails: 162.5, spin: 2.5}   # the trails from 162.5 (his barks end; his cut line from 161.2), the hits at 163.5 cutting it, 2.5 s spinning down on the screen, off the bottom edge at 166

objectives:
  primary: reach-end
  secondary: {kill_ratio: 0.65, credits: 100, name: Clean crossing}   # at least 65 % of the level's enemies, judged at the end (100 in Act 1 terms: pays 410)

music:
