briefing:
  pages:
    - {speaker: Okafor, image: level-26-blackwater, line: "Past the trench there is nothing on the charts, only black water between us and the vents. The Vrell route runs through it. Fly it on your headlight, Lancer, and keep Rook close."}
    - {speaker: Varga, image: level-26-lure, line: "You'll see only what glows. The Vrell glow teal and violet, and so do their lures: a teal bead on a stalk is not a pickup. Bullets always show. The Sonar Pulse lights everything for six seconds."}
  teaser: {speaker: Rook, line: "Black water ahead. Stay where I can see your lights, Lancer. I'm not that good in the dark."}

