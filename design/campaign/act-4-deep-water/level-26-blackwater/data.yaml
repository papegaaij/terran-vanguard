# Glow Angler fields enter with the water and drift on it (straight down); the README's `scattered` Angler rows are sparse
# fields (a 400 px wide area, 100 px between units); during the scarp (t=62–100) the fields and the snakes keep to its
# open left side (x 30–270). A Nautilus pair (`circle`) orbits the ship for its 15 s hold, then breaks off; an eel swims
