backdrop:
  # Presentation only: Level 26's black water (tools/art/backdrop_l26.py, step ART-F, from the level's data.yaml).
  # Almost all black: the ground is unlit albedo, the light map shows it. The scarp is the terrain's right
  # wall (WallProjection, the ice path): ice-wall, ice-wall-glow, ice-wall-foot; cave-mouth-right is drawn by
  # the game at each notch (not placed). Every piece's -glow is added over the grade on its frame clock.
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}   # far unused, given as the loader asks
  ramp: 2
  haze_colour: 02080e  # the black water
  atmosphere:
    clear: {haze: 0.0}
  tile_sets:
    pipeline-floor: {layer: ground, height: 960}   # section 1: dark silt, the drowned Thera Deep pipeline and its anchor blocks
    black-water: {layer: ground, height: 960}   # sections 2-6: the far floor, near black (the cone reveals a dim murk)
  pieces:
    seam-black-water: {layer: ground, size: [480, 320]}
    relay-beacon: {layer: ground, size: [128, 192], frames: 16, fps: 4, keep_clear: 100}
    relay-beacon-glow: {layer: ground, size: [128, 192], frames: 16, fps: 4}
    lamp-post: {layer: ground, size: [64, 96], frames: 4, fps: 4}
    lamp-post-dying: {layer: ground, size: [64, 96], frames: 8, fps: 6}
    lamp-post-glow: {layer: ground, size: [64, 96], frames: 4, fps: 4}
    lamp-post-dying-glow: {layer: ground, size: [64, 96], frames: 8, fps: 6}
    amber-seep: {layer: ground, size: [320, 320]}
    amber-seep-glow: {layer: ground, size: [320, 320]}
    vent-field: {layer: ground, size: [480, 2040]}
    vent-field-glow: {layer: ground, size: [480, 2040]}
    cave-mouth-right: {layer: ground, size: [112, 124]}
  placed:
    # section 2's seam (ground 3140): the pipeline floor into the black water, the pipe broken off; exact rows
    - {piece: seam-black-water, t: 22.167, x: 240}
    # the trench's last beacon 1, falling behind at the start (its foot at ground row 330); its light relay-beacon-glow, added over the grade
    - {piece: relay-beacon, t: 0.592, x: 64}
    # the trench's last beacon 2, falling behind at the start (its foot at ground row 470); its light relay-beacon-glow, added over the grade
    - {piece: relay-beacon, t: 1.669, x: 420}
    # lamp post 1 beside the pipeline (its foot at ground row 115); its light lamp-post-glow
    - {piece: lamp-post, t: 0.0, x: 168}
    # lamp post 2 beside the pipeline (its foot at ground row 475); its light lamp-post-glow
    - {piece: lamp-post, t: 1.815, x: 168}
    # lamp post 3 beside the pipeline (its foot at ground row 835); its light lamp-post-glow
    - {piece: lamp-post, t: 4.585, x: 168}
    # lamp post 4 beside the pipeline (its foot at ground row 1195); its light lamp-post-glow
    - {piece: lamp-post, t: 7.354, x: 168}
    # lamp post 5 beside the pipeline (its foot at ground row 1555); its light lamp-post-glow
    - {piece: lamp-post, t: 10.123, x: 168}
    # lamp post 6 beside the pipeline (its foot at ground row 1915; the last, failing); its light lamp-post-dying-glow
    - {piece: lamp-post-dying, t: 12.892, x: 168}
    # an amber seep far below at t=143 (section 5); its light amber-seep-glow
    - {piece: amber-seep, t: 143.0, x: 130}
    # an amber seep far below at t=149.5 (section 5); its light amber-seep-glow
    - {piece: amber-seep, t: 149.5, x: 352}
    # the vent field's far chimneys and red glow (vent-field-glow) rising on the horizon from t~168; exact rows
    - {piece: vent-field, t: 177.727, x: 240}
# sections' tiles: 1: [pipeline-floor]; 2: [black-water]; 3: [black-water]; 4: [black-water]; 5: [black-water]; 6: [black-water]
# underwater_look (ART-F's proposal, round 55): section 1 {ambient: 0.20, ramp: {to: 0.06, from: 8, until: 18}, tint: 80aceb, caustics: 0.0, snow: 110, headlights: {reach: 260, angle: 70, strength: 1.0}, rim: 0.15}; sections 2-6 {ambient: 0.06, tint: 80aceb, caustics: 0.0, snow: 110, headlights: {reach: 260, angle: 70, strength: 1.0}, rim: 0.15}

