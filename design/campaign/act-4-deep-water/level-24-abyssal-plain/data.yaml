ground_targets:  # at: [t, x], when it enters at the top edge and its x; none within 100 px of a relay beacon (keep_clear)
  - target: ridge nest
    section: 1
    enemy: reef-spitter
    count: 2
    at: [[18, 150], [18.4, 200]]   # on a ridge, left of the middle
    notes:
      target: '[Reef Spitter](../../../enemies/naval/reef-spitter/README.md) nest ×{count} on a ridge (t≈18)'
      effect: Bounty {bounty} each
  - target: spawning reefs
    section: 2
    enemy: spawning-reef
    count: 4
    at: [[36, 120], [48, 350], [64, 130], [80, 340]]
    notes:
      target: '**[Spawning reefs](../../../enemies/ground/spawning-reef/README.md)** ×{count} (t=36, 48, 64, 80; x 120, 350, 130, 340): a coral tower with an iris that releases 4 Glassfin every 3.5 s while it is on the screen, 200 HP, **not hardened**'
      effect: 'The secondary counts them; bounty {bounty} each; razed: the iris closes, a coral burst'
  - target: reef nests
    section: 2
    enemy: reef-spitter
    count: 2
    at: [[50, 250], [66, 200]]   # beside the second reef (x 350) and the third (x 130)
    notes:
      target: '[Reef Spitter](../../../enemies/naval/reef-spitter/README.md) nests ×{count} round the second and third reef (t≈50, 66)'
      effect: Bounty {bounty} each
  - target: Meridian
    section: 3
    layer: ground
    size: [80, 48]
    sprite: meridian-wreck   # step ART-D: the Thera Deep survey sub lying on the floor, its hatch break frames; the crate it frees
    hp: 20
    reveals: Meridian
    at: [[105, 70]]   # at the left edge of the beacon line, 500 px below the first beacon
    notes:
      target: 'Wrecked survey sub *Meridian* (`ground` trigger, {hp} HP, t≈105, x 70)'
      effect: 'The secret: a crate worth 100 (410)'
  - target: beacon nests
    section: 3
    enemy: reef-spitter
    count: 2
    at: [[114, 380], [114.3, 440]]   # about 200 px below the second beacon (t=112, x 420), clear of it (gap check D7)
    notes:
      target: '[Reef Spitter](../../../enemies/naval/reef-spitter/README.md) nest ×{count} at the foot of the second beacon (t≈114), 200 px below it'
      effect: Bounty {bounty} each

secrets:
  - name: Meridian
    crate: 100   # Act 1 terms: pays 410 with the act factor
    radio: {speaker: Varga, line: "That's the Meridian. Thera Deep lost her to the dark, not to the Vrell. Take what she kept."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 58, enemy: abyss-ray, unit: first}}     # the first Ray, when it dies
  - {pickup: shield cell, dropped_by: {wave: 112, enemy: abyss-ray, unit: first}}  # the second Ray, when it dies

drops:  # a Thera Deep tender (as Level 23's) releases an armour patch
  - {t: 95, x: 240, y: 380, pickup: armour patch, sprite: thera-tender}

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected)
  - {t: 1, speaker: Okafor, line: "Past the farms is the abyssal plain, Aegis. Thera Deep's lamps end ahead; from here you fly on your own lights."}
  - {t: 13, speaker: Varga, line: "Small swimmers, needles aimed at you. They hold and shoot: take them one by one."}   # the README's t=5: after Okafor's opening, which holds the radio until t≈12.7 (gap check D8 moved it to t=7; the HUD's 1 s rule needs 13)
  - {t: 24, speaker: Rook, requires: escort, line: "Dark's coming, Lancer. Rule one in a submarine: the ceiling is lower than it looks."}   # the README's t=14, after Varga's t=13 line
  - {t: 35, speaker: Varga, line: "Spawning reefs. They breed fry from the iris, and they are soft: torpedoes will do."}   # the README's t=34, after Rook's t=24 line; the first reef enters at t=36
  - {event: first-ray, speaker: Varga, line: "Something huge under you. A shadow first, then a manta. Torpedoes reach it now; the rest must wait.", notes: {trigger: "A Ray's first shadow (`first-ray`, t=58)"}}
  - {t: 98, speaker: Varga, line: "A beacon. Human-made, relay hardware, an amber pulse. And the carrier on it is Helix's."}
  - {t: 109.5, speaker: Okafor, line: "Log it, Doctor. Full record, for my eyes only."}   # the README's t=106, after Varga's t=98 line (until t≈108.9)
  - {t: 120, speaker: Rook, requires: escort, line: "Ray at six, Lancer: it is rising!"}   # the Ray's flank bark; may drop by the 1 s rule (the README allows it)
  - {event: secondary-objective, speaker: Okafor, line: "Third reef down. The Vrell will have to breed somewhere else.", easy: {line: "Second reef down. The Vrell will have to breed somewhere else."}, notes: {trigger: Secondary met (`secondary-objective`)}}   # met at the third reef razed (easy the second; hard the third too, round 53 C.1): the line counts true on every difficulty
  - {t: 131, speaker: Varga, line: "A third beacon. The same pulse every two kilometres. Somebody laid a road down here."}
  - {event: level-end, speaker: Okafor, line: "The plain is behind us. The beacons lead into the trench, and so do we. Refit, Aegis."}

objectives:
  primary: reach-end
  secondary: {escapes: spawning-reef, allowed: 1, easy: {allowed: 2}, label: REEFS, credits: 100, name: Raze 3 of the 4 spawning reefs}   # at least 3 of the 4 reefs destroyed before they leave the screen (easy 2; hard 3 too, one allowed away: round 53 C.1, the user "allow 1"), failed by the second reef away (100 in Act 1 terms: pays 410)

music:
  track: 10           # Act 4 A "Thera Deep" (audio/music track list)
  start_section: 2    # the under-water bed alone at the plain's edge, the base stem from the reef field
  full_section: 3     # the full mix along the beacon line
  stems: {4: base}    # the base stem again in the Ray crossing, to the end
  ambience: europa-under   # the under-water bed (round 52's pick)
  end_jingle: mission-complete

difficulty: {}  # the secondary's easy and hard allowed are in `objectives`; the formation lever sizes the waves; the stat blocks' hooks apply (the Ray's easy 7-way fan and two fans, hard 11-way and four; the Barbfin's easy 3 s needle, hard 2-needle burst every 2.1 s; the Eel Swarm's easy 10 segments and no fan, hard 16; the spawning reef's easy 3 fry)

briefing:
  pages:
    - {speaker: Okafor, image: level-24-abyssal-plain, line: "Past the farms is the abyssal plain, and the Vrell are growing reefs on it: living nurseries that breed fry. Burn them down. Thera Deep's lamps end ahead, so you fly on your own lights."}
    - {speaker: Varga, image: level-24-abyss-ray, line: "Two new forms: a small swimmer with a barbed snout that holds and spits needles, and a manta the size of a cruiser that rises from the dark below you. Torpedoes reach it while it is a shadow. And there are human relay beacons out there. I want a closer look."}
  teaser: {speaker: Rook, line: "Open water, Lancer. Spread for the fry, torpedoes for the big one."}

backdrop:
  # Presentation only: Level 24's abyssal plain (tools/art/backdrop_l24.py, step ART-D, from the level's data.yaml; its
  # `--proposal`, concept/backdrop-proposal.yaml, merged in step D2 with the beacons' `keep_clear`). Re-run the
  # generator after the data moves a section, a reef, a nest, the wreck or a beacon.
  # No deep layer (the ground is opaque). The plain darkens by the grade alone (underwater_look per section,
  # ART-D's proposal below); the pylons' pools are baked assuming section 1's ambient 0.5. relay-beacon-glow is
  # not placed: the game adds it over the grade at relay-beacon's placements on the same frame clock (D4).
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}   # far unused, given as the loader asks
  ramp: 2
