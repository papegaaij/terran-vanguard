# Level 24 – Abyssal Plain: the level script, rendered into README.md (briefing, threat profile, layout, waves, ground
# targets, radio, credit budget). Times are seconds from the level start. M8 part D, step D2, from the README's approved
# hand tables (round 48). Schema: ../../../tech/architecture/README.md#data-file-schemas
# Keys new in M8 part D (loaded and checked by content in step D2; flown from step D1, mapped in step D3, drawn by step
# D4): the Abyss Ray's `rise` and the Barbfin's hover `above_ship` (their stat blocks), the spawning reef
# (enemies/ground/spawning-reef: a periodic spawn of Glassfin fry), the radio event `first-ray` (until step D3 maps the
# simulation's sighting it is resolved by content to the first Ray's wave time, a timed line), a backdrop piece's
# `keep_clear` (the relay beacons: no ground target and no walk start within 100 px), the per-section `underwater_look`
# (the plain darkening section by section), the stems' base again in section 4 (`stems`, an existing key).
# Defaults of the gap check (m8d-gaps.md §5, pending the user's review in round 53): the Ray's shadow ahead of the ship
# (D2), the escorts held until its rise (D3), the reef's fry released as single rammers that outlive it (D4), the
# Barbfin's beam-era HP only (D5), the beacons animated scenery pieces (D6) with 100 px clear (D7), four Barbfins with
# every Ray (D9), the per-section ambient 0.50 / 0.32 / 0.18 / 0.14
# (D10, ART-D's proposal). Step D2's own placements (pending review): the schools' and eels' routes over the open plain
# (x 140–340), the ribbons (`column`) straight down the left or right side (x 144 / 336), the eel pairs as two rows 4 s
# apart (t=82, 132), the walkers' paths, the README's `pair` of walkers as a `single` of two on their own paths (the
# vocabulary has no pair), the nests' x, the wreck's size and the beacons' rows (each centre at the top edge at the
# README's time); the radio retimed to the HUD's real hold (a two-page line holds it ~11 s: Varga's t=5 line at t=13, not
# D8's t=7; Rook t=24, Varga t=35, Okafor t=109.5), the secondary's line per difficulty, Varga's briefing page trimmed to
# fit one screen.
scroll_speed: 100     # the plain's edge and the beacon line; the reef field and the Ray crossing set their own
launch_seconds: 5
bounty_scale: 0.42    # every bounty × 0.42: fitted in step D3 (TypicalHaulTest, levelReport; the README's first estimate 0.40 was 3.9 % under the budget)
control_prompts: []
medium: underwater    # the whole level (no waterline): the water's factors, the grade, the special limits (UNDER ICE)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Europa, ocean floor
  layers: [air, sub, ground]
  density: 4
  traits: [anti-sub, spread]
  hazards: [Ray fans, water]
  boss: none
  objective: REACH THE BEACONS   # the OBJECTIVE field from sensor L1
  varga:
    none: The abyssal plain, Lancer. Beyond Thera Deep's lamps.
    l1: All from ahead. A shadow on the floor means a Ray is rising.
    l2: "New: a needle swimmer and a manta that rises from below."
    l3: Spread for the fry, torpedoes for the Ray's shadow.
  notes:
    Dominant layers: '`air` (Glassfin schools, Barbfins, Eel Swarms, Driftjellies, Lampreys), `sub` (the Abyss Ray''s shadow), `ground` (Scuttlers, Reef Spitters, spawning reefs)'
    Attack directions: '{directions} (the Ray rises from below the ship''s lane)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: The Ray's fans; the reefs' fry; water (bullets × 0.7, drag)
    Boss / mid-boss: none (the Abyss Ray is a large set-piece unit, not a mid-boss)
    Sensor-suite detail: 'none: Europa, ocean floor, `air` + `ground` + `sub`, front · L1: + directions, density {density}, hazard "Ray fans", the objective `{objective}` and the secondary `REEFS RAZED` · L2: + Abyss Ray (new), Barbfin (new), Scuttler, Glassfin, Eel Swarm, Driftjelly, Lamprey portraits · L3: + `anti-sub` and `spread` highlighted, the wave strip marking the three Rays'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); the whole level under water (the level's medium)
  - name: The Plain's Edge
    end: 30
    atmosphere: clear
    tiles: [lamp-edge, ice-ceiling]
    notes:
      layers:
        ground: 'silt floor at Thera Deep''s edge, the last grow-lamp pylons (t≈4, 12, 22), kelp stands, a Reef Spitter nest on a ridge (t≈18).'
        high-air: the ice ceiling far above (a faint glow of light cracks).
      purpose: The first Barbfins (t=6) alone; popcorn; the first Eel; two Scuttlers walking in (t=30).
  - name: The Reef Field
    end: 95
    speed: 80
    ramp: 2   # eased from 100 over its first 2 s
    atmosphere: clear
    tiles: [plain-reefs, ice-ceiling]
    underwater_look: {ambient: 0.32, tint: b4dcf5, caustics: 0.05, snow: 90, headlights: 0.75}   # the lamps fall behind: dimming
    notes:
      layers:
        ground: 'four **spawning reefs** (t=36, 48, 64, 80; x 120, 350, 130, 340), coral towers with a teal iris, Reef Spitter nests round the middle two; ridges; the survey sub''s wreck lies ahead (the secret).'
        high-air: the ice ceiling.
      purpose: The reefs' fry, the first Abyss Ray (t=58, over the second and third reef), Scuttlers on the floor.
  - name: The Beacon Line
    end: 135
    speed: 100
    ramp: 2   # eased from 80
    atmosphere: clear
    tiles: [beacon-line, ice-ceiling]
    underwater_look: {ambient: 0.18, tint: a8d0ee, caustics: 0.0, snow: 100, headlights: 0.85}   # dark: the headlights, the reefs' teal and the beacons' red-gold
    notes:
      layers:
        ground: 'three **relay beacons** (t=100 x 60, t=112 x 420, t=126 x 100): tall grey masts with an amber-red lamp pulsing every 2 s, human cable-laid, no Vrell growth within 100 px (scenery, not hit by shots); the survey sub''s wreck at t≈105.'
        high-air: the ice ceiling.
      purpose: The beacon beat (radio), the second Ray (t=112), a Scuttler convoy along the beacon line.
  - name: The Ray Crossing
    end: 172
    speed: 90
    ramp: 2   # eased from 100
    atmosphere: clear
    tiles: [deep-silt, ice-ceiling]
    underwater_look: {ambient: 0.14, tint: a0c8e8, caustics: 0.0, snow: 100, headlights: 0.9}   # the last lamp-free stretch
    notes:
      layers:
        ground: a wide, empty silt floor with the trench's mouth at the bottom edge; the last lamp-free stretch.
        high-air: the ice ceiling.
      purpose: The third Ray (t=150), the last eel and walkers; level end as the trench's mouth reaches the bottom edge.

# The game's under-water grade (presentation only; step C4's UnderwaterGrade), the round-48 grade a ("warm behind, dark
# ahead", Q2 a): the plain's edge still lamp-lit as Level 23's last section, darkening section by section (gap check D10:
# ambient 0.50 / 0.32 / 0.18 / 0.14 and the tints, caustics, snow and headlights of ART-D's proposal for round 53), the
# caustics gone by the beacon line, the headlights up; glows (the reefs' iris, the beacons' pulse, the Rays' gill slits), bullets and the HUD ungraded.
underwater_look: {ambient: 0.5, tint: bfe6ff, caustics: 0.1, snow: 80, headlights: 0.6}

# The README's waves at their times (draft, measured with levelReport in step D3). Every wave enters from the front.
# Schools (`swarm`) fly an S-shaped route over the open plain (x 140–340), ribbons (`column`) a straight column down
# its left (x 144) or right side (x 336); an eel swims its route with its 36 px sway; a pair of eels is two rows 4 s
# apart. The Barbfins' columns stop and hold above the ship's lane, their circles orbit their hold (9 s) and break off;
# a Ray's four Barbfins are held until its rise and fan out from it (step D1). Quiet windows: no other wave enters
# t=6–9.5 (the first Barbfins), t=55–62, 109–116, 147–154 (3 s before each Ray's rise to 4 s after it starts).
