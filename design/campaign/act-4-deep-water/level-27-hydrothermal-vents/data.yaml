# Level 27 – Hydrothermal Vents: the level script, rendered into README.md (briefing, threat profile, layout, waves,
# ground targets, radio, credit budget). Times are seconds from the level start. M8 part G, step G2, from the README's
# approved hand tables (round 48) and ART-G's backdrop proposal (concept/backdrop-proposal.yaml, adopted).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M8 part G (loaded, checked and flown from step G1, drawn and played by step G4): the vents' `look:
# heat-plume` with `shape: disc`, `enemy_damage` and `bend`; the Depth Hunter's hover `y` band with a `drift` and its
# torpedo's `aim: facing` (its stat block); a `column` `from: rear` of hovering units; a `rear ambush` of units that hold
# `above_ship` (the Barbfin); a `turret nest` wave's `on_ground` (the Sirens grown on a chimney stack).
# Defaults of the gap check (m8g-gaps.md §5, accepted in round 57): the plume kills the player's (G5),
# the bend's kinds (G6), the Bulwark's aimed shell and its hazards (G7), the Sirens' ground nest (G8), the rear Barbfin
# pairs (G9), the light (G10), the music (G11), the beacons scenery in Levels 24–26 (G13); the user's Q.1 = a (the plan
# refits the Tail Gun on the rear at this visit: step G3's balance plan).
# Step G2's own placements (pending review): ART-G's plume rows, target places and looks adopted unchanged; the README's
# Nautilus `pincer` is the unit's `circle` (its only formation: a pair orbiting the ship, 15 s); the Glassfin columns
# alternate the left and right sides (x 144 / 336), the side schools enter on one side's S-route each, alternating; the
# Hunter columns rise at x 144, 336 and 240 (left, right, the middle); easy's Hunter columns all 3 and hard's 3 / 4 / 4
# (the README's "columns of 3 only" and "the third column 4"); the relay beacons' hard HP the global multiplier's 78
# (the README's 90 has no stat-block key).
scroll_speed: 120     # the field's edge; the smokers and the garden 110, the ridge 120, the gate 130
launch_seconds: 5
bounty_scale: 0.79    # every bounty × 0.79: the README's hand estimate 0.78, fitted in step G2 (levelReport: typical haul on budget(27) 4,065)
control_prompts: []
medium: underwater    # the whole level: the water's factors, the grade, the special limits (no Airstrike, no Orbital Lance)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Europa, the vent field
  layers: [air, ground, sub]
  density: 4
  traits: [anti-sub, rear]
  hazards: [heat plumes, water]
  boss: none
  objective: REACH THE HATCHERY GATE   # the OBJECTIVE field from sensor L1
  varga:
    none: The vent field. Hot water, and Rook still missing.
    l1: Plumes bend your shots. Contacts from below and behind.
    l2: "New: grey hulls, not Vrell. They fire up from below."
    l3: Rear guns for the grey hulls. Anti-sub, and flares for the torpedoes.
  notes:
    Dominant layers: '`air` (the play plane under water: Glassfin schools, Barbfin groups, Depth Hunters, Eel Swarms, Nautilus pairs, Sirens, an Abyss Ray), `ground` (smoker chimneys with Spine Turret nests and Polyp Mortars, the relay beacons), `sub` (the Ray''s shadow and the Hunters'' rise from below)'
    Attack directions: '{directions} (the Hunter columns and the rear ambushes from below)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: 'Heat plumes (burn, and bend shots that cross them); the water''s rules ([europa](../../../world/europa/README.md#under-water-rules))'
    Boss / mid-boss: none
    Sensor-suite detail: '**none**: Europa, the vent field, `air` + `ground`, front and rear · **L1**: + directions (front, sides, rear), density {density}, hazard "heat plumes", the objective `{objective}` and the secondary `BEACONS 0/4` · **L2**: + Depth Hunter (new, shown as "unmarked grey, human-built"), Eel Swarm, Abyss Ray, Siren, Spiral Nautilus, Glow Angler, Barbfin and Glassfin portraits; the plumes'' rings on the map · **L3**: + `anti-sub` and `rear` highlighted; the timeline strip marks the three Hunter columns (56, 96 and 126 s) and the beacon ridge (94–124 s); 1 secret'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); the whole level under water (the level's medium)
  - name: Vent Field Edge
    end: 24
    atmosphere: clear
    tiles: [vent-edge]
    underwater_look: {ambient: 0.45, tint: 80aceb, caustics: 0.0, snow: 90, headlights: {strength: 0.8, reach: 260, angle: 70}}   # dim blue, L25's headlights
    notes:
      layers:
        ground: 'the plain''s last ridge, sea-floor silt, scattered tube worms and the first black smokers'' stacks (scenery); the beacons of Levels 24–26 on the ridge''s lip (scenery).'
        low-air: drifting silt.
        sub: the abyss below with a warm red haze.
      purpose: 'Dim blue, the vent glow ahead. The launch (5 s); the Glassfin and Barbfin popcorn; the water''s lesson from Level 26 refreshed in the light.'
  - name: Black Smokers
    end: 56
    speed: 110
    ramp: 2   # eased from 120 over its first 2 s
    atmosphere: clear
    tiles: [smoker-field]
    underwater_look: {ambient: 0.60, tint: e0bd9e, caustics: 0.0, snow: 70, headlights: {strength: 0.0}}   # vent-lit; the amber is in the pools
    notes:
      layers:
        ground: 'fields of black smokers, bacterial mats glowing amber round the vents, the Thera Deep hauler *Marlin* nose-down by a stack (t≈40, the secret), the first Spine Turret nest on a chimney (t≈34). **Heat plumes** from t=26.'
      purpose: 'Vent glow (amber). The plumes taught alone first (t=26), then with waves; Eel Swarm and Glow Anglers in the glow.'
  - name: Chimney Garden
    end: 90
    speed: 110
    atmosphere: clear
    tiles: [chimney-garden]
    underwater_look: {ambient: 0.62, tint: e0bd9e, caustics: 0.0, snow: 70, headlights: {strength: 0.0}}   # vent glow, brightest
    notes:
      layers:
        ground: 'a forest of chimneys 60–120 px wide, plume vents between them, the **wreck of a grey Depth Hunter** scorched by a plume (t≈66–74), Polyp Mortars on a mound (t≈80), a Siren nest on a stack (t≈81).'
        sub: the Hunters' columns rise from here.
      purpose: 'Vent glow, brightest. The first Depth Hunter column (t=56), hint 3 at the wreck (t=70), Sirens and Nautilus pairs between the plumes.'
  - name: Beacon Ridge
    end: 124
    speed: 120
    ramp: 2   # eased from 110
    atmosphere: clear
    tiles: [ridge-basalt]
    underwater_look: {ambient: 0.45, tint: 80aceb, caustics: 0.0, snow: 90, headlights: {strength: 0.8, reach: 260, angle: 70}}   # dim blue, red-gold pulses
    notes:
      layers:
        ground: 'a long ridge with four relay beacons on masts (t≈94, 101, 108, 116: **the secondary''s targets**), a Spine Turret nest on each shoulder, the supply buoy (t≈118).'
        sub: the Abyss Ray's shadow (t≈106).
      purpose: 'Dim blue, red-gold pulses. The beacons shot down under fire; the second Hunter column; the Ray with its Barbfin.'
  - name: The Gate
    end: 150
    speed: 130
    ramp: 2   # eased from 120
    atmosphere: clear
    tiles: [bowl-floor]
    underwater_look: {ambient: 0.60, tint: 80e6d6, caustics: 0.0, snow: 60, headlights: {strength: 0.0}}   # teal, the hatchery's glow
    notes:
      layers:
        ground: 'the plain falling away into a vast bowl, the **hatchery gate** ahead: a ring of grown chitin arches lit teal; the last plumes at t≈126 and 133.'
        sub: the abyss opening.
      purpose: 'Teal, the hatchery''s glow. The third Hunter column and the last Eel Swarm; the gate''s glow clears the vents; level end.'

