# The heat plumes (the README's Hazards; gap check §1.2; Level 19's furnace vents as discs): each row's vents at the
# README's times (a row's t = its row at the top edge), ART-G's xs in ripple order (alternating ends, neighbours ≥ 164 px
# centre to centre: a gap of 100 px between 64 px discs). Tell 1.4 s, burn 1.6 s, every 4.5 s, 0.5 s from one vent to the
# next; `heavy` 10 on the ship and the escort once a burst, 40 on every `air`/`low-air` unit over a burning disc (the
# player's kill), a bullet entering a burning disc turned 25° away from its centre once. Easy tell 1.8 s, every 6 s; hard
# tell 1.0 s, every 4 s. The first row (t=26) erupts alone: no wave reaches it before the t=26 column.
vents:
  look: heat-plume
  shape: disc
  width: 64
  tell: 1.4
  burn: 1.6
  period: 4.5
  ripple: 0.5
  bullet: heavy
  enemy_damage: 40
  bend: 25
  easy: {tell: 1.8, period: 6}
  hard: {tell: 1.0, period: 4}
  rows:
    - {t: 26, xs: [120, 360]}
    - {t: 33, xs: [230, 60]}
    - {t: 40, xs: [250, 420]}
    - {t: 47, xs: [420, 250, 80]}
    - {t: 52, xs: [160, 380]}
    - {t: 58, xs: [410, 240, 70]}
    - {t: 65, xs: [60, 400]}
    - {t: 72, xs: [290, 60]}
    - {t: 79, xs: [400, 215]}
    - {t: 85, xs: [410, 240, 70]}
    - {t: 94, xs: [240, 420]}
    - {t: 101, xs: [250, 80]}
    - {t: 108, xs: [60, 420]}
    - {t: 115, xs: [420, 240]}
    - {t: 126, xs: [80, 250, 420]}
    - {t: 133, xs: [400, 160]}

