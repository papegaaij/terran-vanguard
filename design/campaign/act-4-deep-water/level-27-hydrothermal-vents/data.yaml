drops:  # a Thera Deep service buoy at the ridge's end releases an armour patch (a Level 25-style buoy)
  - {t: 118, x: 240, y: 380, pickup: armour patch, sprite: survey-buoy}

radio:  # trigger: t or event. No Rook lines (he is missing since Level 26: dropped, not `requires: escort`); the Bulwark has
  # no radio. Thera Deep Control is the colony's voice of Level 23.
  - {t: 1, speaker: Okafor, line: "Aegis Two is dark, and a Bulwark drone has his slot. Vent field ahead, Lancer. Eyes up and hands steady."}
  - {t: 12, speaker: Varga, line: "The vents erupt in cycles. A plume burns whatever it touches and bends every shot that crosses it."}
  - {t: 24, speaker: Thera Deep Control, portrait: thera-deep, line: "Thera Deep Control, Aegis. Our hauler Marlin went down by the smokers in week one. If you see her, say so."}
  - {t: 52, speaker: Varga, line: "Contacts rising from below. Grey hulls, not Vrell. Stay high and shoot down their torpedoes."}
  - {t: 70, speaker: Varga, line: "That wreck on the floor, its paint burnt off by a plume. There's a hull code under it. It's Helix Dynamics, Commander."}
  - {t: 82.5, speaker: Okafor, line: "I'm sending it to UTC High Command now. Keep scanning, Doctor. I want every frequency."}
  - {t: 94.5, speaker: Varga, line: "The ridge beacons carry the same Helix handshake as that hull. Take them down, Lancer."}
  - {event: first-ray, speaker: Varga, shout: true, line: "Large contact below you! It's rising!", notes: {trigger: "The Abyss Ray's shadow (`first-ray`, t=106)"}}
  - {t: 117, speaker: Okafor, line: "High Command answers: the drones were stolen, stand by. I'm done standing by, Aegis."}
  - {t: 129, speaker: Varga, line: "Third column below you, and the gate's lights ahead. Flares, Lancer."}
  - {event: level-end, speaker: Okafor, line: "The hatchery gate. Whatever Helix is hiding, it's down there. Aegis, we go in.", notes: {trigger: Level end (the closing line)}}

objectives:
  primary: reach-end
  secondary: {escapes: relay-beacon, allowed: 1, label: BEACONS, credits: 100, name: Silence 3 of the 4 beacons}   # at least 3 of the 4 beacons destroyed before they leave the screen, on every difficulty, failed by the second beacon away (100 in Act 1 terms: pays 410); no radio line (Varga's t=94.5 line is the instruction)

music:
  track: 11           # Act 4 B "Pressure Line" (audio/music track list)
  start_section: 2    # section 1 the bed alone (gap check §5 G11: L25's reading of "the A theme's intro"), the base stem from the smokers
  full_section: 3     # the full mix from the chimney garden
  stems: {5: base}    # the base stem from the gate
  motif: {from: 56, sections: {}}   # Vorne's motif as a faint layer from the Hunters' first sight to the end
  stem_times:         # the motif alone over the ambience while Varga reads the hull code (Level 19's wreck beat), then back
    - {t: 68, stems: none, fade: 2}    # the stems out, the motif layer (on from t=56) alone over the bed (step G4: `motif` here would load the motif file a second time as an extra stem)
    - {t: 82, stems: full, fade: 2}
    - {t: 124, stems: base, fade: 2}   # the timed `full` holds past the sections, so the gate's base stem is timed too (as `stems: {5: base}`)
    - {t: 144, stems: none, db: -40, fade: 6}   # out over the last 6 s, the motif with it
  ambience: europa-vents   # a deep rumble of hot water, a distant black-smoker roar, a slow groan of chimneys, no bubbles (step AUD-G)
  end_jingle: mission-complete

difficulty: {}  # the plumes' easy and hard tell and period are in `vents`; the Hunter columns' easy and hard counts and the easy pincers' skip are in their waves; the formation lever sizes the rest; the stat blocks' hooks apply (the Hunter's easy torpedo every 4.5 s at 55°/s, hard 2.8 s at 85°/s; the Barbfin's easy 3 s needle, hard 2-needle burst; the Siren's and Nautilus's hooks); the Marlin's hard 28 HP is its entry

briefing:
  pages:
    - {speaker: Okafor, image: level-27-vent-field, line: "Aegis Two is missing. Rook's beacon went dark in the black water, and a Bulwark drone flies his slot until we find him. The vents are the last stretch before the hatchery, Lancer."}
    - {speaker: Varga, image: level-27-plume-cycle, line: "Vent plumes erupt in cycles and bend every shot that crosses them. Something grey rises from below and fires up: stay high and shoot its torpedoes down. Rear guns, and anti-sub."}
  teaser: {speaker: Okafor, line: "Vent field ahead, and a drone in Rook's slot. Bring flares and a rear gun, Lancer."}

backdrop:
