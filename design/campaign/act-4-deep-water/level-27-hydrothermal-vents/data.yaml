  # or a target. Not dark: the grade's per-section underwater_look lights it, plus the smokers' amber pools (lights) and
  # the plumes' pools by phase. Every piece's -glow is added over the grade on its frame clock (drawPieceGlows): the
  # smokers' mouths, the old beacons on the ridge's lip, the Marlin's stack, the gate's teal.
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}   # far unused, given as the loader asks
