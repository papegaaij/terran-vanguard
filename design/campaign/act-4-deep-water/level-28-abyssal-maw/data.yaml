# Level 28 – Abyssal Maw: the level script, rendered into README.md (briefing, threat profile, layout, waves, ground
# targets, radio, credit budget). Times are seconds from the level start. M8 part H, step H3, from the README's approved
# hand tables (round 48) and ART-H2's backdrop proposal (concept/backdrop-proposal.yaml, adopted: its sections, places,
# lights and the shaft's terrain).
# Schema: ../../../tech/architecture/schemas-levels/README.md (the cruisers and the armour floor: schemas-act-4)
# Keys new in M8 part H (loaded and checked in step H3, flown by steps H1-H2, drawn and played by steps H5-H6): the boss's
# `coil` (its stat block), the radio events `boss-arrival` and `boss-dive`, the finale's `cruisers` and the
# `armour_floor` from the kill, the first water -> air crossing (`medium: air` from The Breakout), the shaft's walls
# pushing without damage (`contact.damage` 0).
# Decisions of the gap check (m8h-gaps.md §5, pending round 58): the t=16 guard column enters from the rear like every
# Hunter column (H3: BOTTOM warning at t=13); hard's third Siren joins the t=76 pair (H4); no Hunters in the finale
# (H5); the kill ratio leaves the shed Eel Swarms out (H7); the arrival line on `boss-arrival` (H8); the shaft's walls
# push without damage (H9); the floor on every difficulty from the kill (H12); the CLOSING delays count from the kill
# (H13).
# Step H3's own placements (pending review): ART-H2's sections, target places, lights and terrain adopted unchanged;
# the README's Nautilus `pincer` is the unit's `circle` from the front (its only formation, as Level 27); the Glassfin
# columns alternate the left and right sides (x 144 / 336), the side schools enter on one side's S-route each,
# alternating; the Hunter columns rise at x 144, 336 and 240 (left, right, the middle; Level 27's), easy's first two
# columns 3 and the last one by the formation lever; the Sirens of t=36 on the gallery walls on every difficulty; the
# cruisers' point-defence turrets at 100, 270 and 440 px below the top edge on each hull's inner edge, their flak 80 px
# of scatter, its direct hit `medium`; the hull code `HDX-417` (round 57).
scroll_speed: 120     # the gate; the galleries and the cavern 110, the antechamber 100, the climb 150, the run 200
launch_seconds: 5
bounty_scale: 0.74    # every bounty × 0.74: the README's hand estimate, checked in step H3 (levelReport: typical haul on budget(28) 4,350)
control_prompts: []
medium: underwater    # the hatchery, the arena and the shaft; air from the breakout (section 7: the first water -> air crossing)
armour_floor: 1       # J2 (round 48, gap check §5 H12): from the Maw's kill to the level's end the armour stops at 1 on every difficulty (the run cannot be lost)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Europa, the hatchery
  layers: [air, ground, sub]
  density: 4
  traits: [anti-sub, homing]   # `side` is in Varga's L3 line (three traits do not fit the intel panel, as Levels 13 and 14)
  hazards: [coiled guardian, water]
  boss: Abyssal Maw
  objective: DESTROY THE ABYSSAL MAW   # the OBJECTIVE field from sensor L1
  strip: [choir-song]   # the L3 timeline strip marks the Choir's song (97.5 s; step H6: Intel.Mark CHOIR); nothing after the boss's arrival
  varga:
    none: The hatchery, Lancer. Everything on Europa was grown here.
    l1: From every side. Something huge coiled round the vent.
    l2: "Rays, hulls, singers. And one huge contact: the guardian."
    l3: Anti-sub for when it winds in. Homing and side guns for the machinery in its spine.
  notes:
    Dominant layers: '`air` (the play plane under water: Glassfin schools, Barbfin groups, Depth Hunters, Eel Swarms, Nautilus pairs, Sirens, Abyss Rays, the Maw), `sub` (the Rays'' shadows, the Hunters'' rise, the Maw''s wind-in after its lunge; in its dive it is out of reach), `ground` (egg racks, Spine Turret nests, Polyp Mortars, the vent), `low-air` (the cruisers of the reveal, scenery)'
    Attack directions: '{directions} (the approach by its waves; in the fight the coil frames all four edges, the lunge and the shed Eel Swarms come from the whole arena and are not in the numbers)'
    Density: '{density}'
    Recommended traits: '{traits} (`side` guns help too: three traits do not fit the intel panel, as Levels 13 and 14)'
    Hazards: 'The Maw''s coil sweeps, fan walls and lunge (the arena); the cruisers'' broadsides and flak (the run); the water''s rules ([europa](../../../world/europa/README.md#under-water-rules)) until the breakout'
    Boss / mid-boss: 'Act boss [Abyssal Maw](../../../enemies/bosses/abyssal-maw/README.md)'
    Sensor-suite detail: '**none**: Europa, the hatchery, `air` + `ground`, all directions. **L1**: + the directions, density {density}, hazard "coiled guardian", the objective `{objective}`. **L2**: + Depth Hunter, Eel Swarm, Abyss Ray, Siren, Spiral Nautilus, Barbfin, Glassfin portraits; the boss''s name and silhouette (`abyssal-maw`). **L3**: + `anti-sub` and `homing` highlighted; the timeline strip marks the Choir''s song (97.5 s) and the boss (104 s); 1 secret. The finale after the boss is **not** on the strip (the reveal is a surprise).'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp; the orbit's 3 s); ART-H2's (tools/art/backdrop_l28.py)
  - name: Hatchery Gate
    end: 22
    atmosphere: clear
    tiles: [gate-hall]
    underwater_look: {ambient: 0.55, tint: 80e6d6, caustics: 0.0, snow: 60, headlights: {strength: 0.0}}   # teal bioluminescence
    notes:
      layers:
        ground: 'the ring of chitin arches (the end of Level 27''s view), then a gallery mouth lined with egg racks, glowing lamps of grown flesh.'
        low-air: drifting spores and silt.
        sub: the dark below.
      purpose: 'Teal bioluminescence. The launch; the Hunters guarding the gate (t=16): the grey hulls beside the Vrell.'
  - name: Brood Galleries
    end: 50
    speed: 110
    ramp: 2   # eased from 120 over its first 2 s
    atmosphere: clear
    tiles: [brood-gallery]
    underwater_look: {ambient: 0.52, tint: a8c8e0, caustics: 0.0, snow: 50, headlights: {strength: 0.0}}   # teal and violet racks
    notes:
      layers:
        ground: 'long galleries of egg racks (scenery, rows of pale pods), Spine Turret nests on the racks'' ends (t≈30), the Sirens grown on the gallery walls (t≈36).'
        air: the racks' glow.
      purpose: 'Teal and violet racks. Nautilus pairs round the racks; the Sirens on the gallery wall; the Ray; a rear Hunter column.'
  - name: Spawning Cavern
    end: 80
    speed: 110
    atmosphere: clear
    tiles: [spawning-floor]
    underwater_look: {ambient: 0.58, tint: e8c09a, caustics: 0.0, snow: 60, headlights: {strength: 0.0}}   # warm amber from below
    notes:
      layers:
        ground: 'a cavern floor of hatching pools and resin ridges, the **UTC recon sub *Pelagic-3*** wedged under a collapsed rack at the cavern''s mouth (t≈58, the secret), a Spine Turret nest on a resin ridge (t≈66), Polyp Mortars on the far ridge (t≈74), Sirens on the cavern''s last stack (t≈76).'
        sub: the vent's red glow rising from the floor.
      purpose: 'Warm amber from below. The Eel Swarms, the second Ray, the last rear ambush; the floor warms up.'
  - name: Antechamber
    end: 104
    speed: 100
    ramp: 2   # eased from 110
    atmosphere: clear
    tiles: [antechamber-floor]
    underwater_look: {ambient: 0.56, tint: f0a888, caustics: 0.0, snow: 70, headlights: {strength: 0.0}}   # red-amber, the vent's glow
    notes:
      layers:
        ground: 'the vent''s caldera rim, steaming fissures, a last pair of Polyp Mortars (t≈92). No wave after t=93.5: the screen clears while the Choir sings (t=97.5).'
      purpose: 'Red-amber, the vent''s glow. The last Hunter column (t=86), the pre-boss pause (the level''s third gap over 2 s); the Choir; the warning at t=104.'
  - name: The Vent
    end: 105   # the level clock halts here while the Maw lives; the kill resumes it after hold_after_boss
    speed: 0
    arena: true
    hold_after_boss: 1   # s the clock stays halted after the Maw's 4 s death chain (its `death_seconds`; the flash and the credit shower over the vent, collectable), one second more: the clock reads 100 + K from then (K+5 = t=105). Step H6: was 5, which the clock adds to the chain (K+9)
    atmosphere: clear
    tiles: [antechamber-floor]   # the arena's rows are the caldera piece
    underwater_look: {ambient: 0.62, tint: d8f0c0, caustics: 0.0, snow: 40, headlights: {strength: 0.0}}   # the vent's lime-white
    notes:
      layers:
        ground: 'the hatchery caldera filling the field, the vent''s throat at (240, 330) ([the boss''s arena](../../../enemies/bosses/abyssal-maw/README.md#arena)).'
        sub: the coil winding in round the arena from off the screen.
      purpose: 'The vent''s lime-white, the bioluminescent frame. The boss fight (≈ 130 s at medium); the scroll halted and the level clock stopped while the Maw lives.'
  - name: The Shaft
    end: 115
    speed: 150
    ramp: 2   # eased up from the halt over 2 s
    atmosphere: clear
    tiles: [shaft-climb, ice-ceiling]
    underwater_look: {ambient: 0.58, tint: a8d8f0, caustics: 0.25, snow: 50, headlights: {strength: 0.0}}   # light growing from above
    notes:
      layers:
        ground: 'the Vrell drill shaft''s walls (Level 23''s, run in reverse: they push without damage) closing on both sides, the caldera falling away below.'
        high-air: the ice ceiling cracking ahead.
      purpose: 'Light growing from above. The climb after the kill (K+5 to K+15); no enemies; the radio''s first beat of the finale.'
  - name: The Breakout
    end: 118
    speed: 150
    medium: air   # the first water -> air crossing: the factors ease out over 1 s, the grade lifts, the special limits end (the Sonar Pulse reads NO WATER)
    atmosphere: clear
    tiles: [night-ice]
    notes:
      layers:
        ground: 'the ice ceiling shatters round the ship as it breaches the shaft mouth''s lip (near t=115, K+15; wherever the ship is: high or at a flank earlier, low later), the burst anchored on the ice where it broke through: slabs tumble out of the field, the under-water grade lifts over 1 s; Europa''s night ice under Jupiter.'
        high-air: the Vrell fleet's carriers rising from other drill holes.
      purpose: 'A white burst, then Jupiter-lit ice. Europa''s signature set piece; **the medium switches to air**.'
  - name: The Rise
    end: 122
    speed: 150
    medium: air
    atmosphere: clear
    tiles: [night-ice, ice-crystals]
    notes:
      layers:
        ground: 'Europa''s night ice (Level 22''s backdrop), intact where the cruisers break through: on both flanks the crust lifts in a hull''s shape and splits, each hull moving with the ice at first and slowing to the wing''s pace in 2 s, its hole left behind in the ice.'
        low-air: 'two **Ascendancy cruisers rise** beside the Vrell carriers, growing from dim to full scale (4 s); not hittable, no contact.'
      purpose: 'Night ice under Jupiter, amber gun ports. The reveal (K+18); the reveal sting; Varga''s and Okafor''s lines.'
  - name: The Run
    end: 157
    speed: 200
    ramp: 2   # eased from 150
    medium: air
    atmosphere: clear
    tiles: [night-ice, ice-crystals]
    notes:
      layers:
        low-air: 'the cruisers keep pace on both flanks and fire: broadsides, flak, point defence. The Vrell and the cruisers never fire at each other.'
      purpose: 'Night ice; amber broadsides. The ≈ 35 s survive section (K+22 to K+57); no fighters.'
  - name: Orbit
    end: 162
    speed: 400
    ramp: 3   # the scroll accelerates from 200 to 400 px/s over 3 s
    medium: air
    atmosphere: clear
    tiles: [night-ice, ice-crystals]
    notes:
      layers:
        low-air: the cruisers fall off the bottom edge.
      purpose: 'Fading to white as the wing makes orbit. The level ends at K+62; the debrief follows.'

# The game's under-water grade and its light map (presentation only; ART-H2's proposal for round 58): the hatchery is
