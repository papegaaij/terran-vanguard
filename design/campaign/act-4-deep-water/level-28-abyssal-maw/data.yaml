    crate: 100   # Act 1 terms: pays 410 with the act factor
    radio: {speaker: Okafor, line: "Pelagic-3. Our recon sub, eleven crew, lost in week one. Log it, Doctor. Take what's aboard, Lancer."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 41, enemy: abyss-ray, unit: first}}     # the act's last Ray, when it dies
  - {pickup: shield cell, dropped_by: {wave: 71, enemy: abyss-ray, unit: first}}   # the second Ray, when it dies

drops:  # a Thera Deep service buoy in the antechamber releases an armour patch (a Level 25-style buoy); the boss's phase 3 drops the second
  - {t: 88, x: 240, y: 380, pickup: armour patch, sprite: service-buoy}

radio:  # trigger: t or event. Speakers Okafor, Varga and the Choir; no Rook lines (he is missing: dropped, not `requires: escort`); the Bulwark has no radio. The arena's clock halts, so the boss lines are events (PHASE lines: they wait for a gap, stale after 20 s, dropped at the kill); the finale's lines are CLOSING lines in order (`boss-destroyed`; their `delay` counts from the kill, a line waits behind the one before it; the debrief waits for the last)
  - {t: 1, speaker: Okafor, line: "Everything the Vrell sent at Europa was grown in this hatchery. End it, Lancer, and we go home."}
  - {t: 13, speaker: Varga, line: "Grey hulls again, guarding the gate. Helix hulls, Commander. Why is Helix guarding a Vrell nursery?"}
  - {t: 26, speaker: Okafor, line: "I don't know, Doctor. When this is over I will ask, and I will not accept stand by."}
  - {t: 38, speaker: Varga, line: "Eggs on every rack. Thousands. This is where the Vrell on Europa came from."}
  - {t: 63, speaker: Varga, line: "The floor is warm. The vent is under us, and something large is coiled round it."}
  - {t: 76, speaker: Okafor, line: "Antechamber, then the vent. Shields up, Lancer. Everything you have."}
  - {t: 88, speaker: Varga, line: "My biosign is off the scale. It knows we're here."}
  - {t: 97.5, speaker: The Choir, distorted: true, line: "[the Choir sings]"}
  - {event: boss-arrival, speaker: Varga, line: "Gill sacs first, Lancer. Then the lime in its throat when the jaw opens.", notes: {trigger: "Boss arrival (`boss-arrival`, the coil winding in)"}}
  - {event: boss-phase, phase: Tightening, speaker: Okafor, line: "Walls of light. Find the gap and keep moving.", notes: {trigger: "Phase 2 (`boss-phase` Tightening)"}}
  - {event: boss-dive, speaker: Varga, shout: true, line: "It's gone under! Watch the dark. It comes back fast!", notes: {trigger: "The dive (the head below 50 %, `boss-dive`, queued as `PHASE`)"}}
  - {event: boss-phase, phase: Implants, speaker: Varga, line: "Commander, that's not Vrell. That's machinery in its spine. Relay housings… Helix pattern.", notes: {trigger: "Phase 3 (`boss-phase` Implants, at the first spark)"}}
  - {event: boss-phase, phase: Implants, speaker: Okafor, line: "Then hit the machinery, Lancer.", notes: {trigger: "Phase 3, queued after Varga's line"}}
  - {event: boss-destroyed, delay: 3, speaker: The Choir, distorted: true, line: "…many… we were many here…", notes: {trigger: "Maw destroyed (`boss-destroyed`, the chain's start), held 3 s (`delay`): the Choir speaks, with its layering on speech"}}
  - {event: boss-destroyed, speaker: Okafor, line: "Maw's down. Aegis Wing, up the shaft. Now.", notes: {trigger: "After the Choir (`CLOSING`)"}}
  - {event: boss-destroyed, delay: 18, speaker: Varga, line: "Those aren't Vrell hulls—", notes: {trigger: "K+18, the cruisers' rise (`CLOSING`, `delay: 18`)"}}
  - {event: boss-destroyed, speaker: Okafor, line: "Those are not Vrell ships. God help us. Those are ours.", notes: {trigger: "Then (`CLOSING`)"}}
  - {event: boss-destroyed, delay: 34, speaker: Okafor, line: "All Aegis units, break for orbit. Don't look back.", notes: {trigger: "K+34, the run (`CLOSING`, `delay: 34`)"}}
  - {event: boss-destroyed, delay: 42, speaker: Varga, line: "That's the code from the wreck, painted on their bows. They aren't hiding it any more.", notes: {trigger: "K+42, the run (`CLOSING`, `delay: 42`)"}}

objectives:
  primary: reach-end   # the arena makes the kill a condition of the level's end; the line reads the boss's name (threat_profile.objective)
  secondary: {kill_ratio: 0.65, boss_counted: false, credits: 100, name: Clear the hatchery}   # at least 65 % of the level's approach enemies (90 of 137 at medium; the Maw and its shed Eel Swarms not counted), judged at the end; no radio line (100 in Act 1 terms: pays 410)

music:
  track: 11           # Act 4 B "Pressure Line" (audio/music track list)
  start_section: 1    # the theme's file from the launch, its stems silent in section 1 (`stems: {1: motif}`): the hatchery's ambience alone, Vorne's motif over it from t=16 (the motif needs the theme playing: StormChecks)
  full_section: 3     # the full mix from the spawning cavern
  stems: {1: motif, 2: base}   # section 1 the motif layer alone (from t=16), the base stem from the galleries
  motif: {from: 16, sections: {}}   # Vorne's motif as a faint layer from the Hunters' first guard (t=16)
  stem_times:         # out in section 4 into the antechamber's near-silence (the vent's rumble, the Choir's song), the motif with it
    - {t: 80, stems: none, db: -40, fade: 6}
  ambience: europa-under   # the bed under the ice, as every level under water (the user, 2026-10-26: one bed per setting), to the breakout
  ambience_changes:
    - {section: 7, ambience: europa-ice, crossfade: 1}   # Europa's night-ice wind above from the breakout (Level 22's bed)
  end_jingle: mission-complete
  boss_warning: boss-warning      # track 22 with the klaxon and the banner at the arena's start (t=104)
  boss_track: choir-descends      # track 18 after the warning (Q.1 a, as built, until round 58's pick), dropping away under the dive's darkness and back after the lunge (the game's hook, LevelMusic.bossDrop), fading at the kill
  motif_after_boss: {from: 126, to: 162, fade_in: 3, fade_out: 5}   # the run under Vorne's motif (track 11's motif stem alone, in the open): in under the reveal sting's tail (track 30 at the cruisers' rise, t=118, 9 s), out over the orbit (157-162); the climb and the rise under the ambience alone

