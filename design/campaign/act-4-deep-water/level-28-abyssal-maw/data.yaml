# The shaft (Level 23's drill shaft run in reverse; gap check §1.3, §5 H9: the walls push, no damage). Terrain row r is on
# the top edge when the scroll is r. The walls rise at the field's edges just above the halted arena (never seen during
# the fight: the arena's top edge is terrain row 11440), close to Level 23's 320 px and flatten to the bore's lip on the
# breakout line (terrain 12346: the ship's row at t=115). ART-H2's rows.
terrain:
  left:
    - [11480, 0, 0]      # just above the halted arena: the walls begin at the field's edges, flat
    - [11880, 80]        # the shaft 320 px wide
    - [12086, 80]
    - [12346, 0, 0]      # the bore's lip on the breakout line: the walls leave the field
  right:
    - [11480, 480, 0]
    - [11880, 400]
    - [12086, 400]
    - [12346, 480, 0]
  contact: {damage: {easy: 0, medium: 0, hard: 0}, push: 30, push_seconds: 0.12, cooldown: 1.0}   # §5 H9: the walls push without damage
  notes:   # the README's climb, by row
    before: The hatchery and the arena, no walls
    rows:
      11480: 'Just above the halted arena: the walls begin at the field''s edges'
      11880: The shaft at 320 px (Level 23's)
      12086: The shaft opens toward the bore's lip
      12346: 'The breakout line: the walls leave the field'

boss:  # the act boss: the arena's start is its arrival (the warning, the bar, the boss checkpoint on easy and medium); the coil winds in round the arena from off the screen over its 6 s intro (round 58 F.2)
  enemy: abyssal-maw
  t: 104
  x: 240
  section: 5
  notes:
    from: the arena's edges (the coil winding in from off the screen at the top right)
    waves: 'At the arena''s start: the warning, the bar and the checkpoint; the coil, the sacs, the walls, the sweeps, the dive and the implants as in its spec; its shed Eel Swarms; no other waves in the arena'

# The finale's two Ascendancy cruisers (design/enemies/bosses/abyssal-maw, The cruisers (draft); gap check §1.3): they
# rise through the ice at t=118 (K+18) and grow to full scale by t=122, run beside the wing and fire until t=157 (K+57),
# then fall off the bottom edge over the orbit. Invulnerable `low-air` set pieces: shots spark off the hulls, the beam
# stops; no bounty, no bar; above water (no factor). Easy: the tell 1.5 s, one flak marker, no double bands; hard: the
# tell 0.9 s, flak every 3 s, bursts of 4.
cruisers:
  rise: 118
  run: 122
  end: 157
  fall: 5
  hull: [220, 640]
  inner: [110, 370]   # the left hull's inner (right) edge, the right hull's inner (left) edge
  broadside: {band: 70, tell: 1.2, shells: 7, speed: 260, bullet: medium, every: 3, double_after: 20, free: 100}
  flak: {markers: 2, every: 4, fuse: 1.0, radius: 45, scatter: 80, bullet: medium, ring: 8, speed: 120, ring_bullet: small}
  point_defence: {burst: 3, speed: 170, bullet: small, every: 2.5, turrets: [440, 270, 100]}
  easy: {tell: 1.5, double_bands: false, markers: 1}
  hard: {tell: 0.9, flak_every: 3, burst: 4}

