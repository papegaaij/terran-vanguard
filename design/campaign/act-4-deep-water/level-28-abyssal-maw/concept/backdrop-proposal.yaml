# ART-H2's sections for H3 (README Layout): the art is drawn for these times, speeds and eases (a halted
# arena stops at once; the shaft eases up from 0 over its ramp). Level-wide `medium: underwater`; the
# breakout's section switches to air (the first water->air crossing).
scroll_speed: 120
medium: underwater
sections:
  - {name: Hatchery Gate, end: 22, atmosphere: clear, tiles: [gate-hall]}
    # underwater_look: {ambient: 0.55, tint: 80e6d6, caustics: 0.00, snow: 60, headlights: {strength: 0.0}}
  - {name: Brood Galleries, end: 50, speed: 110, ramp: 2, atmosphere: clear, tiles: [brood-gallery]}
    # underwater_look: {ambient: 0.52, tint: a8c8e0, caustics: 0.00, snow: 50, headlights: {strength: 0.0}}
  - {name: Spawning Cavern, end: 80, speed: 110, atmosphere: clear, tiles: [spawning-floor]}
    # underwater_look: {ambient: 0.58, tint: e8c09a, caustics: 0.00, snow: 60, headlights: {strength: 0.0}}
  - {name: Antechamber, end: 104, speed: 100, ramp: 2, atmosphere: clear, tiles: [antechamber-floor]}
    # underwater_look: {ambient: 0.56, tint: f0a888, caustics: 0.00, snow: 70, headlights: {strength: 0.0}}
  - {name: The Vent, end: 105, speed: 0, arena: true, atmosphere: clear, tiles: [antechamber-floor]}
    # underwater_look: {ambient: 0.62, tint: d8f0c0, caustics: 0.00, snow: 40, headlights: {strength: 0.0}}
  - {name: The Shaft, end: 115, speed: 150, ramp: 2, atmosphere: clear, tiles: [shaft-climb, ice-ceiling]}
    # underwater_look: {ambient: 0.58, tint: a8d8f0, caustics: 0.25, snow: 50, headlights: {strength: 0.0}}
  - {name: The Breakout, end: 118, speed: 150, medium: air, atmosphere: clear, tiles: [night-ice]}
  - {name: The Rise, end: 122, speed: 150, medium: air, atmosphere: clear, tiles: [night-ice, ice-crystals]}
  - {name: The Run, end: 157, speed: 200, ramp: 2, medium: air, atmosphere: clear, tiles: [night-ice, ice-crystals]}
  - {name: Orbit, end: 162, speed: 400, ramp: 3, medium: air, atmosphere: clear, tiles: [night-ice, ice-crystals]}

# the shaft (Level 23's drill shaft run in reverse; gap §1.3, §5 H9: the walls push, no damage). Terrain row r
# is on the top edge when the scroll is r. The walls rise at the field's edges just above the halted arena
# (never seen during the fight: the arena's top edge is terrain row 11440), close to Level 23's
# 320 px and flatten to the bore's lip on the breakout line (terrain 12346: the ship's row at t=115).
terrain:
  left:
    - [11480, 0, 0]
    - [11880, 80]
    - [12086, 80]
    - [12346, 0, 0]
  right:
    - [11480, 480, 0]
    - [11880, 400]
    - [12086, 400]
    - [12346, 480, 0]
  contact: {damage: {easy: 0, medium: 0, hard: 0}, push: 30, push_seconds: 0.12, cooldown: 1.0}   # §5 H9

# fixed rows the art is drawn for (H1/H3/H5):
#   the arena: the scroll halts at 11440 (t=104); the screen shows ground rows 11440..11979;
#     the vent's throat at screen (240, 330) = ground row 11649, x 240, ~140 px across (the caldera piece);
#     the boss's geometry (gap §1.1, the boss spec's Arena): head (240, 95), throat (240, 135), sacs (178, 80),
#     (302, 80), (190, 128), (290, 128); the coil's inner flanks x 50 / 430 / y 505; the wall clamp x 62-418,
#     y <= 493; implants (110, 60), (40, 300), (440, 300): all screen space, drawn by MawLooks over the
#     caldera (the backdrop has no coil);
#   the breakout line: ground row 12886 = scroll(115) + 96 (the shaft-mouth piece's lip apex; the grade lifts above it,
#     as Level 23's waterline), the ceiling-cracks high-air piece centred on the ship's row at the same t;
#   the rise: the night ice intact where the cruisers break through (the game draws their holes, crust
#     and the hull's move to the wing's pace: CruiserLooks; step I2, round 58 F.3);
#   the Vrell carriers (high-air) at t~116.8 x 52 and t~119.8 x 430, before the run (nothing over the play in the run).

# ground places this art is drawn for (H3's `ground_targets:` and the Sirens' `on_ground` xs; t = the top
# edge, x the unit's centre):
#   Spine Turret x3 on the racks' ends (egg-rack-nest): t 30, x 96, 240, 384
#   Sirens x2 grown on the gallery walls (`on_ground`, every difficulty): t 36, x 60, 420
#   Pelagic-3 (`trigger`, `sprite: recon-sub`, size [64, 64], hitbox proposed [44, 36], 20 / hard 28 HP): t 58, x 90
#   Spine Turret x3 on the resin ridge: t 66, x 256, 300, 344, 388, 432 (hard x5: the ridge's five seats; medium's three = the middle ones)
#   Polyp Mortar x2 on the far ridge: t 74, x 84, 150
#   Sirens on the cavern's last stack: t 76, x 250, 250, 330, 410 (hard's third = the leftmost; §5 H4)
#   Polyp Mortar x2 on the caldera's rim: t 92, x 110, 370
#   the buoy (`drops:`): {t: 88, x: 240, y: 380, pickup: armour patch, sprite: service-buoy}  (tools/art/l28_props.py: Level 25's buoy in Thera Deep's orange)

