backdrop:
  # Presentation only: Level 28's hatchery, the caldera, the shaft and the night ice (tools/art/backdrop_l28.py,
  # step ART-H2, from the level's data.yaml). Up to the breakout the grade's per-section underwater_look lights it (the
  # sections block below), plus the static lights; every piece's -glow is added over the grade
  # (drawPieceGlows): the gate's teal, the flesh lamps, the racks' pods, the fissures, the vent's throat. The
  # shaft's walls are the terrain's (WallProjection's ice shaft): ice-wall, -wet, -glow, -foot, -foot-wet
  # (Level 23's, rows reversed). From the breakout the level is in air: the night ice is lit in its own pixels.
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}   # far unused (opaque ground)
  ramp: 2
  haze_colour: 0e1a1c  # the hatchery's water
  atmosphere:
    clear: {haze: 0.0}
  tile_sets:
    gate-hall: {layer: ground, height: 960}   # section 1: the hatchery's resin floor past the gate, chitin root veins
    brood-gallery: {layer: ground, height: 960}   # section 2: the gallery floor, resin grooved along the galleries
    spawning-floor: {layer: ground, height: 960}   # section 3: resin ridges round hatching pools (pale eggs in amber fluid)
    antechamber-floor: {layer: ground, height: 960}   # sections 4-5: dark basalt under resin, red fissures (the arena is the caldera piece)
    shaft-climb: {layer: ground, height: 960}   # section 6: Level 23's wet shaft floor in reverse, the vent's glow far below
    night-ice: {layer: ground, height: 960}   # sections 7-10: Level 22's ice shelf at night under Jupiter
    ice-ceiling: {layer: high-air, height: 960}   # section 6: the ice ceiling's cracks of light (additive at 40 % as Level 23's)
    ice-crystals: {layer: high-air, height: 960}   # sections 8-10: Level 22's crystals, dimmed for the night (additive at 40 %)
  pieces:
    gate-ring: {layer: ground, size: [480, 720]}
    gate-ring-glow: {layer: ground, size: [480, 720]}
    flesh-lamp: {layer: ground, size: [64, 64]}
