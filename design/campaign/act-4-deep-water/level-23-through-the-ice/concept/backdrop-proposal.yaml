backdrop:
  # Presentation only: Level 23's shaft and Thera Deep (tools/art/backdrop_l23.py, from the level's data.yaml). No deep or
  # plateau layer (the ground is opaque; the walls' rims project beyond the field's edges). The walls are the
  # terrain's (WallProjection): textures ice-wall (dry) / ice-wall-wet (below the waterline), ice-wall-glow
  # (additive collar cores), ice-wall-foot / ice-wall-foot-wet, in CanyonProfile's convention.
  # The waterline: ground row 2646 = scroll(25.5) + 96 (terrain row 2106);
  # the grade wipes above it. underwater_look (C4): keep ambient/tint overridable per section (part D: Level 24
  # darkens section by section); the lamp pools are baked into the rack, dome and lamp pieces.
  scroll_factors: {ground: 1, low-air: 1.35, high-air: 2.2}
  ramp: 2
  haze_colour: 0a4a5c  # the water's teal (europa_r48 WATER)
  atmosphere:
    clear: {haze: 0.0}
  tile_sets:
    shaft-dry: {layer: ground, height: 960}   # sections 1: the dry shaft from above, the ice receding to a dark trough, the drill's grooves, a warm glow far below
    shaft-wet: {layer: ground, height: 960}   # sections 2-3: the shaft under water, teal and darker, the glow stronger
    thera-farms: {layer: ground, height: 960}   # section 4: the chosen round-07 kelp floor (the racks and domes are pieces)
    plain-edge: {layer: ground, height: 960}   # section 5: the dark silt plain, sparse kelp
    ice-ceiling: {layer: high-air, height: 960}   # sections 3-5: the ice ceiling's cracks of light (additive at 40 %)
  pieces:
    shelf-lip: {layer: ground, size: [480, 960]}
    waterline: {layer: ground, size: [480, 556]}
    waterline-foam: {layer: low-air, size: [360, 40]}
    ice-ledge-left: {layer: ground, size: [64, 56]}
    ice-ledge-right: {layer: ground, size: [64, 56]}
    ice-ledge-left-wet: {layer: ground, size: [64, 56]}
    ice-ledge-right-wet: {layer: ground, size: [64, 56]}
    probe-ledge: {layer: ground, size: [64, 56]}
    seam-thera: {layer: ground, size: [480, 320]}
