# Level 23 – Through the Ice: the level script, rendered into README.md (briefing, threat profile, layout, terrain,
# waves, ground targets, radio, credit budget). Times are seconds from the level start. M8 part C, step C2, from the
# README's approved hand tables (round 48). Schema: ../../../tech/architecture/README.md#data-file-schemas
# Keys new in M8 part C (loaded and checked by content in step C2; flown from step C1, mapped in step C3, drawn by step
# C4): the `waterline` radio event (resolved by content to the waterline's time, a timed line), a pickup's
# `dropped_by.head_first`, the `underwater_look` block and a section's own `underwater_look`, the Eel Swarm's and the
# Glassfin's stat blocks, the siphon pump (enemies/ground/siphon-pump) and the returning units' `underwater` blocks.
# Defaults of the gap check (m8c-gaps.md §5, pending the user's review in round 52): five data sections for the
# README's four (D1: the waterline its own section, 25.5–28 s), no `special_limits` key (D9: the medium forbids the
# Airstrike and the Lance), the probe and the ledge nests at the walls' foot (D4), the `waterline` cue as a timed line
# (D5). Step C2's own placements (pending review): the ledge nests and the probe at x 96 / 384 (the walls' foot band,
# the rows ART-C's backdrop already carries), the rack-3 Reef Spitters at x 170 / 200 / 230, the eels' and schools'
# routes inside the shaft (x 130–350), the second eel of each pair as its own row 4 s later (t=94.5, 127.5).
scroll_speed: 100     # the shaft mouth and the waterline; the wet shaft, the farms and the plain's edge set their own
launch_seconds: 5
bounty_scale: 0.49    # every bounty × 0.49: fitted in step C3 (levelReport: the typical haul on budget(23) 3,101; the README's first estimate was 0.45)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Europa, drill shaft
  layers: [air, ground]
  density: 3
  traits: [anti-sub, forward]
  hazards: [shaft walls, water]
  boss: none
  objective: REACH THE PLAIN   # the OBJECTIVE field from sensor L1
  varga:
    none: A drill shaft, Lancer, then Thera Deep. Below the line it is all water.
    l1: All from ahead. The walls hurt. Everything slows under water.
    l2: "New: glass-fry schools and a head-fired eel chain."
    l3: Torpedoes and charges keep their bite. The rest lose a third.
  notes:
    Dominant layers: '`air` (the play plane; Stinger and Needler above the waterline, then Glassfin schools, Eel Swarms, Driftjellies, Lampreys), `ground` (shaft ledges, farm racks: Spine Turrets, Reef Spitters, siphon pumps)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: The shaft's walls (terrain collision); water (bullets × 0.7, drag)
    Boss / mid-boss: none
    Sensor-suite detail: 'none: Europa, drill shaft, `air` + `ground`, front · L1: + directions, density {density}, hazards "shaft walls" and "water", the objective `{objective}` and the secondary `PUMPS 4/5` · L2: + Glassfin (new), Eel Swarm (new), Driftjelly, Reef Spitter, Lamprey portraits · L3: + `anti-sub` and `forward` highlighted, the wave strip marking the waterline'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); tiles: step ART-C's backdrop (no deep layer: the opaque ice and floor)
  - name: The Shaft Mouth
    end: 25.5
    atmosphere: clear
    tiles: [shaft-dry]
    notes:
      layers:
        ground: 'the shelf''s lip, the shaft''s mouth closing from 480 to 320 px (t=6–14); then the dry shaft''s walls with ledges (Spine Turret nests, t≈14 and t≈20); the shaft''s dark below.'
      purpose: Surface popcorn; the walls teach the terrain rule; the Harpoon, the Depth Charges and the Sonar Pulse read NO WATER until the waterline.
  - name: The Waterline
    end: 28
    medium: underwater   # the waterline at its start (t=25.5): the water's factors ease in over 1 s, the grade, the ambience bed and the special limits switch
    atmosphere: clear
    tiles: [shaft-wet]
    notes:
      layers:
        ground: the waterline band across the shaft at the ship's row (t=25.5), the wet shaft above it.
        low-air: the waterline's foam lace.
      purpose: The waterline beat, with the hydro-kit tell (a short refit flash, the HUD's rules strip); the last surface wave still on the screen.
  - name: The Wet Shaft
    end: 72
    speed: 90
    ramp: 2   # eased from 100 over its first 2 s
    medium: underwater
    atmosphere: clear
    tiles: [shaft-wet, ice-ceiling]
    notes:
      layers:
        ground: 'shaft walls 320 px wide until t≈66, then opening to the full 480 by t≈74; Reef Spitter nests on the ledges (t≈36, t≈56), the secret''s snagged probe (t≈52, the left wall''s foot).'
        high-air: the ice ceiling.
      purpose: The first Glassfin school, the first Eel Swarm, the Driftjellies between the ledges, the walls' scrape; first torpedo targets.
  - name: Thera Deep
    end: 140
    speed: 80
    ramp: 2   # eased from 90
    medium: underwater
    atmosphere: clear
    tiles: [thera-farms, ice-ceiling]
    underwater_look: {ambient: 0.58, tint: ccf2ff, caustics: 0.12, snow: 40, headlights: 0.35}   # the lamp-lit farms (the round-48 Thera Deep still: warm grow-lamp pools)
    notes:
      layers:
        ground: five farm racks (t=78, 90, 102, 114, 126) each with a siphon pump, lit kelp grids, pressure domes (scenery) with their lamps; a Reef Spitter nest on a rack (t≈108).
        high-air: the ice ceiling.
      purpose: The pumps (the secondary), eels and schools over the racks, the Thera Deep voice.
  - name: The Plain's Edge
    end: 165
    speed: 100
    ramp: 2   # eased from 80
    medium: underwater
    atmosphere: clear
    tiles: [plain-edge, ice-ceiling]
    underwater_look: {ambient: 0.45, tint: bfe6ff, caustics: 0.12, snow: 80, headlights: 0.6}   # the lamps thinning out over the dark plain (toward Level 24's)
    notes:
      layers:
        ground: the farms thinning into dark plain; the last lamps at the top edge.
        high-air: the ice ceiling.
      purpose: Release into the next level; the last eels and schools.

# The game's under-water grade (presentation only; step C4's UnderwaterGrade), the round-48 grade a (lamp-lit to black): the
# wet shaft's look from the descent still (europa_r48.py `descent`: the water ahead 0.5, the caustics on the walls, marine
# snow, the headlight beam in the water); Thera Deep and the plain's edge change it in their sections.
underwater_look: {ambient: 0.5, tint: bfe0ff, caustics: 0.45, snow: 60, headlights: 0.8}

terrain:  # the drill shaft (Level 16's canyon rule): ice walls at the field's edges closing to 320 px, then opening onto the farms
  left:
    - [600, 0, 0]        # t=6: the shaft's mouth, the walls begin at the field's edges, flat
    - [1400, 80]         # t=14: the shaft 320 px wide, the walls at full height
    - [6230, 80]         # t=66: the shaft opens
    - [6940, 0, 0]       # t=74: the walls leave the field, flat (the farms' open water)
  right:
    - [600, 480, 0]
    - [1400, 400]
    - [6230, 400]
    - [6940, 480, 0]
  contact: {damage: {easy: 2, medium: 4, hard: 4}, push: 30, push_seconds: 0.12, cooldown: 1.0}   # `small` 4 per touch (easy 2): a teaching level, not Level 16's 10
  notes:   # the README's wall table, by row
    before: The shelf's ice, no walls
    rows:
      600: 'The shaft''s mouth: the walls begin at the field''s edges'
      1400: The shaft at 320 px; ledge nests at the walls' foot
      6230: The shaft opens toward the farms
      6940: 'The walls leave the field: Thera Deep''s open water'

# The README's waves at their times (draft, measured with levelReport in step C3). Every wave enters from the front
# (the shaft has no side entries). Schools (`swarm`) fly an S-shaped route inside the shaft, ribbons (`column`) a straight
# column down its left (x 144) or right side (x 336; step C3: a column flies no path) (x 130–350: the flock's spread and its 14 px sway stay clear of the 320 px shaft's walls); the schools of 16 are 12 on
# easy and 22 on hard (the stat block's school sizes), the others by the formation lever. An eel swims its route with a
# 36 px sway (x 150–330 inside the shaft); a pair is two rows 4 s apart. Quiet windows: no other wave enters t=28.5–32
# (the first school) or t=42–45.5 (the first eel).
