secrets:
  - name: survey probe
    crate: 100   # Act 1 terms: pays 410 with the act factor
    radio: {speaker: Thera Deep Control, portrait: thera-deep, line: "That's Conamara's probe. Keep it, you earned it."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 54.5, unit: first}}                     # the leader of the t=54.5 Lamprey stream
  - {pickup: shield cell, dropped_by: {wave: 42, unit: first, head_first: true}}   # the first Eel Swarm, only when its head is shot first

drops:  # a Thera Deep tender (a pressure-hull supply drone, the CDF supply drone's role; its look, step ART-C) releases an armour patch
  - {t: 100, x: 240, y: 380, pickup: armour patch, sprite: thera-tender}

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected)
  - {t: 1, speaker: Okafor, line: "Aegis flight, down the shaft. The hydro-kits are fitted; trust them. Thera Deep is at the bottom."}
  - {t: 13.5, speaker: Varga, line: "Water in twelve seconds. Everything slows, theirs and yours. Torpedoes keep their bite; the rest lose a third."}
  - {event: waterline, speaker: Varga, line: "Under the ice. Airstrike and Lance are dead weight now. A Sonar Pulse lights the water.", notes: {trigger: "Waterline crossed (`waterline`, t=25.5)"}}
  - {t: 41, speaker: Varga, line: "Eel chain. Cut the head and the body dies; cut the body and the tail scatters."}
  - {t: 65, speaker: Thera Deep Control, portrait: thera-deep, line: "Aegis, Thera Deep Control. We see you on the shaft. The farms are below you, and so is whatever is draining them."}
  - {t: 77, speaker: Varga, line: "Siphon pumps on the racks: they drain the farms into the Vrell. Shoot the pumps, not the racks."}
  - {t: 88.5, speaker: Thera Deep Control, portrait: thera-deep, line: "Those are our farms, Aegis. Forty thousand people eat from those racks."}
  - {t: 99.5, speaker: Rook, requires: escort, line: "A shaft, a hydro-kit and a ship that was never meant to swim. Flying a submarine, Lancer."}
  - {event: secondary-objective, speaker: Thera Deep Control, portrait: thera-deep, line: "Enough pumps are off the racks. Thera Deep owes you a dinner, Aegis.", notes: {trigger: Secondary met (`secondary-objective`)}}
  - {t: 140, speaker: Okafor, line: "The farms are clear. Beyond the lamps is the open plain. Hold your lights, Aegis."}
  - {event: level-end, speaker: Okafor, line: "Good work. Thera Deep is breathing again. The Vrell's road leads out across the plain."}

objectives:
  primary: reach-end
  secondary: {escapes: siphon-pump, allowed: 1, easy: {allowed: 2}, hard: {allowed: 0}, label: PUMPS, credits: 100, name: Break 4 of the 5 siphon pumps}   # at least 4 of the 5 pumps destroyed before they leave the screen (easy 3, hard all 5), failed by the second pump away (100 in Act 1 terms: pays 410)

music:
  track: 10           # Act 4 A "Thera Deep" (audio/music track list)
  start_section: 2    # the ice-surface ambience alone in the shaft mouth, the base stem from the waterline
  full_section: 4     # the full mix from the farms (Thera Deep)
  ambience: europa-ice   # the ice-surface bed (round 51's pick) in the dry shaft
  ambience_changes:
    - {section: 2, ambience: europa-under, crossfade: 1}   # the under-water bed from the waterline (step AUD-C proposes it, round 52)
  end_jingle: mission-complete

difficulty: {}  # the schools of 16's easy and hard counts are in their waves, the secondary's easy and hard allowed in `objectives`, the wall touch's easy cost in `terrain`; the formation lever sizes the rest; the stat blocks' hooks apply (the Eel Swarm's easy 10 segments and no fan, hard 16 and 1.4 s; the Glassfin's ram shares; the Driftjelly's hard ring)

briefing:
  pages:
    - {speaker: Okafor, image: level-23-drill-shaft, line: "The Vrell drilled a shaft from Conamara to the ocean. We take it. Your Stormhawks have been fitted with hydro-kits overnight: they swim. Below is Thera Deep. Forty thousand people live there, and the Vrell are draining their farms."}
    - {speaker: Varga, image: level-23-eel-and-fry, line: "Under water everything slows, theirs and yours. Torpedoes and depth charges keep their strength; your other guns lose a third. Eels have a head that fires: cut it. A Sonar Pulse lights the water. The Airstrike and the Lance cannot reach under the ice."}
  teaser: {speaker: Rook, line: "A shaft, then water. Torpedoes, Lancer. Guns only tickle it down there."}

backdrop:
  # Presentation only: Level 23's shaft and Thera Deep (tools/art/backdrop_l23.py, step ART-C, its `--proposal` from
  # the README's values, which this data keeps: the sections, the nests, the probe and the pumps at the same rows). No
  # deep or plateau layer (the ground is opaque; the walls' rims project beyond the field's edges). The walls are the
  # terrain's (WallProjection): textures ice-wall (dry) / ice-wall-wet (below the waterline), ice-wall-glow (additive
  # collar cores), ice-wall-foot / ice-wall-foot-wet, in CanyonProfile's convention. The waterline: ground row 2646 =
  # scroll(25.5) + 96 (terrain row 2106); the grade wipes above it. Re-run the generator after the data moves a section,
  # a nest or a pump.
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}   # far unused (no deep or far layer: the ground is opaque), given as the loader asks
  ramp: 2
  haze_colour: 0a4a5c  # the water's teal (europa_r48 WATER)
  atmosphere:
    clear: {haze: 0.0}
  tile_sets:
    shaft-dry: {layer: ground, height: 960}   # section 1: the dry shaft from above, the ice receding to a dark trough, the drill's grooves, a warm glow far below
    shaft-wet: {layer: ground, height: 960}   # sections 2-3: the shaft under water, teal and darker, the glow stronger
    thera-farms: {layer: ground, height: 960}   # section 4: the chosen round-07 kelp floor (the racks and domes are pieces)
    plain-edge: {layer: ground, height: 960}   # section 5: the dark silt plain, sparse kelp
    ice-ceiling: {layer: high-air, height: 960}   # sections 3-5: the ice ceiling's cracks of light (additive at 40 %)
