eruptions:   # 27 vents (README Hazards; m10e-gaps §4: the works' vents retimed into their holds, QE-1 a's
  # `first` = s after the vent enters to its first tell; then every period on real time). No vent within
  # 100 px of a tower or a pump station (checked by --check). Outside the holds `first` makes the rocks
  # leave in the lower half (medium throw y up ~150-300); in a hold the first throw ~1.5 s after it starts.
