sections:   # ART-E's reading of the README's Layout (130 px/s throughout); E2 writes the real ones
  - {name: Tvashtar Plains, end: 20, speed: 130, atmosphere: clear, tiles: [io-space]}
  - {name: Loki Works, end: 62, speed: 130, atmosphere: clear, tiles: [io-space, loki-yard]}
  - {name: The Pipeline Run, end: 104, speed: 130, atmosphere: clear, tiles: [io-space, pipeline-run]}
  - {name: Pele Works, end: 142, speed: 130, atmosphere: light, tiles: [io-space, pele-yard]}
  - {name: The Plume Field, end: 164, speed: 130, atmosphere: light, tiles: [io-space, plume-field]}
  - {name: Prometheus Works, end: 192, speed: 130, atmosphere: clear, tiles: [io-space, prometheus-yard]}
holds:   # README Layout: when a works' first tower reaches 200 px below the top edge; window 9.7 s
  - {groups: [Loki A, Loki B], depth: 200, speed: 40, easy: {speed: 30}, hard: {speed: 50}, ramp: 1}   # starts at script t 44.91
  - {groups: [Pele A, Pele B], depth: 200, speed: 40, easy: {speed: 30}, hard: {speed: 50}, ramp: 1}   # starts at script t 126.91
  - {groups: [Prometheus A, Prometheus B], depth: 200, speed: 40, easy: {speed: 30}, hard: {speed: 50}, ramp: 1}   # starts at script t 176.91
ground_placements:   # at: [t, x] (the centre entering half its size above the top edge), as Level 37's
  - target: "cracking towers, each its own group (96x96, hitbox 72x72; on their works' pads)"
    enemy: cracking-tower
    groups: [Loki A, Loki B, Pele A, Pele B, Prometheus A, Prometheus B]
    at: [[43, 150], [44, 330], [125, 330], [126, 150], [175, 160], [176, 340]]
  - target: "pump stations P1-P8 on the racks (40x40; escapes pump-station, allowed 2)"
    enemy: pump-station
    at: [[68, 150], [76, 150], [84, 150], [92, 150], [146, 150], [152, 150], [158, 150], [162.5, 150]]
  - target: "Strider pair down the Loki yard road, 1.5 s apart; the second drops a shield cell"
    enemy: strider
    at: [[32, 90], [33.5, 90]]
  - target: "SAM Nest pair by the Loki rack"
    enemy: sam-nest
    at: [[38, 200], [38, 290]]
  - target: "SAM Nest on the section 3 rack, between P2 and P3"
    enemy: sam-nest
    at: [[80, 150]]
  - target: "Sentinel Tower pair on the Pele gate's blockhouses (emitters >= 40 px inside the field); the left drops an overdrive"
    enemy: sentinel-tower
    at: [[110, 64], [110, 416]]
  - target: "Strider pair walking up the Pele yard toward Pele B (x 150)"
    enemy: strider
    at: [[118, 110], [118, 200]]
  - target: "SAM Nest trio in the Pele yard, east of the rack"
    enemy: sam-nest
    at: [[122, 290], [122, 360], [122, 430]]
  - target: "SAM Nest pair on the plume field beside row 2's vents"
