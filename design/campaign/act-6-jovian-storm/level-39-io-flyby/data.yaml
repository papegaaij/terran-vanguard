secrets:
  - name: survey hut
    crate: 100   # Act 1 terms: pays 1,049 with the act factor (a Coalition survey hut from before the Ascendancy took Io)
    radio: {speaker: Varga, line: "A Coalition survey hut. Pre-war. Somebody left in a hurry."}

pickups:
  - {pickup: shield cell, dropped_by: {wave: 32, enemy: strider, unit: last}}   # the second Strider of the Loki pair
  - {pickup: overdrive, dropped_by: {wave: 116.5, enemy: talon, unit: first}}   # the t=116.5 wing's leader, inside the Pele gate (the README's left Sentinel: see the header)

radio:  # trigger: t or event; the README's 17 lines (the 1 s rule: ≈ 12 characters a second, a 1.5 s lead, event lines dropped after 6 s; script time, so a hold stretches the gaps; the secret's line is the secret's own). Rook's line needs him flying (requires: escort). Vorne once on the enemy channel, cold (never shouted).
  - {t: 1, speaker: Okafor, line: "Io. Three works on the plains, two towers each. Every one burns."}
  - {t: 8.5, speaker: Varga, line: "Vents. They glow, then throw burning rocks up. Shoot them or move."}
  - {t: 32.5, speaker: Varga, line: "Striders on the yard. Drop one on a tower and the tower counts."}
  - {t: 41, speaker: Okafor, line: "Loki works. We hold over the towers until both burn."}
  - {event: first-target, speaker: Rook, requires: escort, line: "Tower's down. Sorry about the fuel bill, Vorne.", notes: {trigger: "The first tower destroyed (`first-target`, event, bark)"}}
  - {t: 63, speaker: Varga, line: "Pump stations on the racks. Cut six and the lines run dry."}
  - {t: 76.5, speaker: Varga, line: "Skitters on their Talons. The Vrell aren't picking sides."}
  - {t: 91, speaker: Vorne, channel: enemy, line: "Lancer. Burn Io if you like. Callisto holds fuel enough for what I still have to do.", notes: {trigger: "t=91, the enemy channel (cold, never shouted)"}}
  - {t: 104.5, speaker: Okafor, line: "Pele works. Towers behind the gate. Same drill."}
  - {t: 110.5, speaker: Varga, line: "Sentinels on the gate. They sweep all the way round."}
  - {event: topple-target, speaker: Okafor, line: "Dropped it on the tower. That'll do.", notes: {trigger: "The first tower destroyed by a topple (`topple-target`, event)"}}
  - {event: secondary-objective, speaker: Varga, line: "Six pumps cut. The racks are running dry.", notes: {trigger: "Secondary met (the sixth pump, event)"}}
  - {t: 142.5, speaker: Okafor, line: "The plume field. Pele has erupted for a thousand years. It won't stop for us."}
  - {t: 164.5, speaker: Okafor, line: "Prometheus. The last two towers. Burn them and his fleet runs dry."}
  - {event: level-end, speaker: Okafor, line: "Io's lines are dark. Callisto next, Lancer.", notes: {trigger: Level end}}
  - {event: mission-failed, speaker: Okafor, expression: grim, line: "{group} is still burning. That fuel flies against us. Pull back, Lancer.", notes: {trigger: "A tower leaves the screen alive (`mission-failed`, the failed screen's line)"}}

objectives:
  primary: destroy-targets
  targets: [Loki A, Loki B, Pele A, Pele B, Prometheus A, Prometheus B]   # TOWERS n / 6; fails as soon as one leaves the screen alive
  secondary: {escapes: pump-station, allowed: 2, label: PUMPS, credits: 100, name: Cut 6 of the 8 pump stations}   # at least 6 of the 8 pump stations destroyed before they leave the screen, met at the sixth down (DONE), failed by the third away (PUMPS n / 6); 100 in Act 1 terms: pays 1,049

music:
  track: 14           # Act 6 A "Eye of the Storm" (audio/music track list)
  start_section: 2    # its open storm strings over the Tvashtar plains, the base from the Loki works
  full_section: 4     # the full mix in the Pele works and the plume field
  motif: {from: 91, to: 99.5, sections: {}}   # Vorne's motif under his line (t=91 to its end; the radio's duck only)
  ambience: io-refinery   # a deep ground rumble through the rock, refinery machinery, the hiss of venting gas
  end_jingle: mission-complete

difficulty: {}  # the holds' speeds in `holds` (easy 30, hard 50 px/s); the eruptions' easy and hard values are the world's; the stat blocks' hooks apply (the Strider's fans of 5 and salvos of 3 on hard, the SAM Nest's, the Sentinel's easy and hard arcs, the Harrow's, the Talon's, the Chimera's, the Gunship's, the Hornet's); the Harrow, Hornet, Gunship and Strider waves pinned on easy and hard; the formation lever sizes the rest

briefing:
  pages:   # the approved texts as they are (BriefingLayoutTest: 4 lines a page)
    - {speaker: Okafor, image: level-39-io-flyby, line: "Io's refineries fuel every ship Vorne has left. Three works on the plains, Loki, Pele and Prometheus, two cracking towers each. All six burn. One left standing and his fleet flies on, and we have failed."}
    - {speaker: Varga, image: level-39-cracking-tower, line: "Io is all volcano. A vent glows, then throws burning rocks up at you: shoot them or move. Striders guard the yards; drop one on a tower and the tower counts. And cut the pump stations on the racks. Six, and the pipelines run dry."}
  teaser: {speaker: Rook, line: "Io. Volcanoes and refineries. I'm bringing the Mortar."}

backdrop:
  # Presentation only: Level 39's Io (tools/art/backdrop_l39.py, step ART-E: its proposal's block as it is; the sections above at the README's times).
  # Section 1 has no ground tile set: its ground is the two tvashtar pieces from Io's limb up (exact rows), so
  # Jupiter (deep) shows below the limb at the start. Every other section's ground tile is periodic in 1040
  # rows; the seam pieces (exact rows) carry the racks' bends between sections. `dark_with` (E4's
  # BackdropPieces hook, presentation only): the piece's -glow is no longer drawn once that tower's group is
  # cleared (GROUP_CLEARED) or that pump station dies (P1-P8 = the pump stations in ground_placements order).
  # Motion: the plume on the limb is the only animated piece (t 0-5); the vents, the towers' flares and the
  # rocks are sprites.
  scroll_factors: {deep: 0.15, far: 0.5, ground: 1, low-air: 1.3, high-air: 1.7}   # far, low-air unused
  ramp: 2
  haze_colour: d8cc98   # Pele's sulphur haze (no haze is used: the ground covers deep)
  atmosphere:
    clear: {haze: 0.0}
    light: {haze: 0.0, wisps: pele-veil}   # sections 4-5: Pele's plume haze over the play field (<= 16 %)
  tile_sets:
    io-space: {layer: deep, height: 512}   # black space, stars, two moons as points
    loki-yard: {layer: ground, height: 1040}   # section 2: the yard road (x ~70), the rack (x 240)
    pipeline-run: {layer: ground, height: 1040}   # section 3: the lava channel (x ~300), the rack (x 150)
    pele-yard: {layer: ground, height: 1040}   # section 4: Pele's fallout, the road (x ~180), the rack (x 240)
    plume-field: {layer: ground, height: 1040}   # section 5: pale fallout, vent crusts, the rack (x 150)
    prometheus-yard: {layer: ground, height: 1040}   # section 6: frost, the road (x ~90), the rack (x 250)
    pele-veil: {layer: high-air, height: 960}   # the light atmosphere's wisps (normal)
