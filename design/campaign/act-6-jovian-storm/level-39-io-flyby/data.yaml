# Level 39 – Io Flyby: the level script, rendered into README.md (briefing, threat profile, layout, waves, ground
# targets, radio, credit budget). Times are seconds from the level start (script time: in a hold the level clock slows
# with the scroll). M10 part E, step E2, from the README's approved hand tables (round 72) and ART-E's backdrop proposal
# (concept/backdrop-proposal.yaml: its backdrop block, ground placements, holds and 27 vents, the sections at the
# README's times as they are, so the tile sets stay cut).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M10 part E (flown from step E1; loaded and checked from step E2): a vent's `first` (its first tell that
# many real seconds after its entry, round 77 QE-1 a; its cycles then every period on real time, so the vents beside a
# works erupt in its hold), the radio events `first-target` and `topple-target`, a trigger spent by damage (`hits: 1`
# with an `hp`: the survey hut's 30 HP lock) and a backdrop piece's `dark_with` (its -glow piece goes dark with a tower
# group or a pump station, P1-P8 = the pump stations in their data order; step E4 draws it).
# Step E2's own placements (decided as trivia, pending the user's review in round 77): the towers and pump stations are
# counted enemies (the units cracking-tower and pump-station: the topple's crush and the tally need it); the works'
# vents retimed into their holds (m10e-gaps §4, ART-E's times); the first vent's tell 0.8 s after its entry (not 1.0:
# easy's 1.6 s tell then ends by t=14.4, before the t=14.5 wave); the Striders are walker waves (as Level 32's) on the
# roads and racks between the towers: the Loki pair at t=32/33.5 with its SAM pair at t=33 (not 38: a Strider walks
# 32 px/s up the ground, so it passes only a nest that enters within about a second after it), the Pele pair at
# t=122.5/124 (not 118) and the lone Strider at t=173.5 (not 168), so that each walks beside its works' towers in the
# hold (a topple onto a tower is possible at all); the right Sentinel 1.7 s after the left (221 rows, Level 32's QE-1 a:
# their rows offset so they never sweep the same rows at once; ART-E's gate piece puts both blockhouses on one row:
# the generator moves the right one); the left Sentinel's overdrive comes from the t=116.5 wing's leader (a ground
# enemy's group must be an objective's, so a single Sentinel cannot carry a pickup).
scroll_speed: 130     # the same speed throughout (the holds slow it over the works)
launch_seconds: 5
bounty_scale: 0.41    # every bounty × 0.41: the README's hand estimate (typical +2.6 %; levelReport's fit below)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Io, the refineries
  layers: [ground, air]
  density: 4
  traits: [anti-ground, piercing]
  hazards: [eruptions, beam sweeps]
  boss: none
  objective: TOWERS 0 / 6   # the OBJECTIVE field from sensor L1
  varga:
    none: "Io's refineries. Six towers to burn, and volcanoes."
    l1: "Vents throw rocks up. Every tower must fall."
    l2: "Striders guard the works. SAMs, Sentinels, Chimeras."
    l3: "Anti-ground for the towers; a Strider's fall counts."
  notes:
    Dominant layers: '`ground` (the cracking towers, Striders, SAM Nests, Sentinel Towers, pump stations), `air` (Talons, Chimeras, Gilded Gunships and their Darts, Hornets, Harrows, Needlers, Skitter and Dart streams, motes)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: Eruptions (vents throw burning rocks up the screen); Sentinel sweeps; the holds over the works
    Boss / mid-boss: none
    Special limits: Sonar Pulse `NO WATER` ([Act 6 specials](../../../player/specials/README.md#act-6-specials-draft)); the Airstrike and the Orbital Lance work over Io
    Sensor-suite detail: '**none**: Io, the refineries, `ground` + `air`, front, the objective `{objective}` · **L1**: + density {density}, the hazards "eruptions" and "beam sweeps", the secondary `PUMPS 0 / 6` · **L2**: + Strider, Sentinel Tower, SAM Nest, Chimera, Talon, Gilded Gunship, Hornet, Harrow, Needler, Dart Drone, Skitter and Mote portraits · **L3**: + the six towers and the three holds on the threat map, `anti-ground` highlighted'

sections:  # back to back from t = 0, all at 130 px/s; ART-E's tile sets cut at these times
  - name: Tvashtar Plains
    end: 20
    atmosphere: clear
    tiles: [io-space]
    notes:
      layers:
        ground: sulphur flats, black lava flows, frost fields from Io's limb on; one vent (t≈12).
        deep: Jupiter's disc, a distant umbrella plume.
      purpose: The approach; **the eruption taught** alone.
  - name: Loki Works
    end: 62
    atmosphere: clear
    tiles: [io-space, loki-yard]
    notes:
      layers:
        ground: the yard road, pipeline racks, the Loki towers A and B (t≈43–44), the Strider pair (t≈32), a SAM pair (t≈33), three vents.
      purpose: The first Strider pair (a topple to aim), **the first hold**.
  - name: The Pipeline Run
    end: 104
    atmosphere: clear
    tiles: [io-space, pipeline-run]
    notes:
      layers:
        ground: the racks along a lava channel, pump stations P1–P4, vents alternating sides, the survey hut on a lava island (t≈96).
      purpose: The Gunships; the pumps; the first hunt.
  - name: Pele Works
    end: 142
    atmosphere: light
    tiles: [io-space, pele-yard]
    notes:
      layers:
        ground: the works' gate with the Sentinel pair (t≈110), the yard, the Pele towers (t≈125–126), the Strider pair walking up between them, a SAM trio.
        high-air: Pele's plume haze.
      purpose: '**The second hold**: towers behind sweeping beams, a topple onto a tower.'
  - name: The Plume Field
    end: 164
    atmosphere: light
    tiles: [io-space, plume-field]
    notes:
      layers:
        ground: a field of vents under Pele's umbrella plume, rows of three; pump stations P5–P8 on a rack crossing it; a SAM pair.
        high-air: Pele's plume haze.
      purpose: "The eruptions at their densest; the pumps' last chance."
  - name: Prometheus Works
    end: 192
    atmosphere: clear
    tiles: [io-space, prometheus-yard]
    notes:
      layers:
        ground: a lone Strider (t≈173.5), a SAM pair (t≈172), the Prometheus towers (t≈175–176), two vents; the works going dark behind.
      purpose: '**The last hold**; the calm before the end.'

