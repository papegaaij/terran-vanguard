secrets:
  - name: pathfinder pod
    crate: 100   # Act 1 terms: pays 1,049 with the act factor (the scouts' stores)
    radio: {speaker: Varga, line: "A pathfinder's pod, from the scouts who dived before you. Take it."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 42, enemy: talon, unit: first}}            # the t=42 squad leader (the V-wing's tip)
  - {pickup: shield cell, dropped_by: {wave: 54, enemy: gilded-gunship, unit: first}}   # the t=54 Gilded Gunship

drops:  # a CDF supply drone from the carrier (low-air) releases an armour patch between the second and third harvester pairs
  - {t: 96, x: 240, y: 380, pickup: armour patch}

radio:  # trigger: t or event; the README's 16 lines (the 1 s rule: ≈ 12 characters a second, a 1.5 s lead). Rook's barks need him flying (requires: escort: the t=118 homing bark, the first strike kill); his t=11 line is scripted (no requires). Vorne is silent here (the act intro's page 3 carries him).
  - {t: 1, speaker: Okafor, line: "Aegis, you're cleared to dive. Break their air cover over the bands. The fleet follows you down."}
  - {t: 11, speaker: Rook, line: "Jupiter. All sky and no floor. If we go down here, Lancer, we fall for a week."}
  - {t: 20, speaker: Varga, line: "Under the haze the cloud banks lie over your plane. Bodies dim under them. Their shots never do."}
  - {t: 30, speaker: Varga, line: "There: Chimeras. Talon frames, Vrell tissue in the seams. Pick one and keep hitting it."}
  - {t: 40, speaker: Varga, line: "See the seams glow? It's healing. Hold the beam on it, or it grows back."}
  - {t: 48, speaker: Okafor, line: "Wraiths overhead, cloaked. They come out behind you."}
  - {t: 67, speaker: Okafor, line: "Helium-3 harvesters ahead, skimming the bands. That's Vorne's fuel. Bring down six."}
  - {t: 90, speaker: Varga, line: "Spore bombers under the harvesters. Vrell, still flying with the gold ones. For now."}
  - {event: secondary-objective, speaker: Okafor, line: "Six harvesters down. His fleet will feel that at Io.", notes: {trigger: "Secondary met (`secondary-objective`, the sixth harvester down)"}}
  - {event: secondary-failed, speaker: Varga, line: "Too many got through. Their fuel reaches the refineries.", notes: {trigger: "Secondary failed (`secondary-failed`: the third harvester away; easy the fourth, hard the second)"}}
  - {t: 118, speaker: Rook, requires: escort, line: "Homing's earning its keep. Those clouds are full of them."}
  - {t: 128, speaker: Varga, line: "A white line drawn down the sky means lightning. Get out of it. A second later it strikes."}
  - {event: first-strike-kill, speaker: Rook, requires: escort, line: "Ha! The sky's on our side.", notes: {trigger: "The first enemy killed by a strike (event, bark)"}}
  - {t: 172, speaker: Okafor, line: "The bands are thinning. Aurelia is ahead, Aegis."}
  - {event: level-end, speaker: Okafor, line: "First dive done. The fleet is in the clouds behind you. Aurelia next.", notes: {trigger: Level end}}

objectives:
  primary: reach-end
  secondary: {escapes: harvester, allowed: 2, easy: {allowed: 3}, hard: {allowed: 1}, label: HARVESTERS, credits: 100, name: Bring down 6 of the 8 harvesters}   # at least 6 of the 8 harvesters destroyed before they leave the bottom edge (easy 5, hard 7), failed by the third away (HARVESTERS n / 6); 100 in Act 1 terms: pays 1,049

music:
  track: 14           # Act 6 A "Eye of the Storm" (audio/music track list)
  start_section: 2    # section 1 the theme's intro over the dive (storm strings, a far thunder roll), the base stem from the bands
  full_section: 3     # the full mix from the harvester fields to the end
  ambience: jovian-sky   # the Jovian sky bed (round 72 S.13 b: high wind on the hull, distant thunder, the carrier's radio hiss)
  ambience_layers:
    - {ambience: dive-wind, from: 0, to: 26, fade_in: 0, fade_out: 4}   # the dive's rushing wind over section 1, falling away as the dive levels out
  end_jingle: mission-complete

difficulty: {}  # the stat blocks' hooks apply (the Chimera's easy 15 %/s after 1.3 s and a pair every 2.0 s, hard 25 %/s after 0.8 s and 1.3 s; the Talon's easy 2.0 s, hard 1.3 s and a parting pair; the Gunship's, the Wraith's, the Lamprey's); the escorts' hard three, the harvester and drop-craft pairs pinned; the weather's easy and hard gusts and strikes and the secondary's allowed in their blocks; the banks' easy skips in the backdrop; the formation lever sizes the rest

briefing:
  pages:
    - {speaker: Okafor, image: level-36-the-dive, line: "Callisto sits behind Jupiter's air defences, and Vorne fuels his fleet from these clouds. Aegis Wing dives first: break the fighter cover over the upper bands so the fleet can follow, and bring down his helium-3 harvesters on the way. Rook flies your wing. Aurelia is below us. We go there next."}
    - {speaker: Varga, image: level-36-chimera, line: "The wrecks from Ceres carried something new: Talon airframes with Vrell tissue grown through the seams. I call them Chimeras. Give one a second and it heals. A pilot still flies each one, and the healing costs him more than the machine. And the cloud banks down there drift over your plane: what flies under them dims, their shots never do. There is no ground, Lancer. The bombs stay idle."}
  teaser: {speaker: Rook, line: "Varga says the new ones heal. So no tickling, Lancer. Burn them."}

backdrop:
  # Presentation only: Level 36's dive over Jupiter's bands (tools/art/backdrop_l36.py, step ART-B: its proposal's
  # block as it is). No ground (`ground: none`): the deep layer is the base. Its four tile sets are cut from one
  # continuous field at the rows each section's tiles begin (the sections above: re-run the generator after moving
  # one). Animated: carrier-group-glow (section 1) and storm-wall-glow (section 4), never together. The -glow pieces
  # are additive at their piece's placements (Level 24's ground rule; B4: on deep too).
  scroll_factors: {deep: 0.15, far: 0.5, ground: 1, low-air: 1.3, high-air: 1.7}   # far, ground unused
