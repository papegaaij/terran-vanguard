# Level 36 – Cloud Divers: the level script, rendered into README.md (briefing, threat profile, layout, waves, radio,
# credit budget). Times are seconds from the level start. M10 part B, step B2, from the README's approved hand tables
# (round 72) and ART-B's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block, the banks with their
# pieces and the pod's debris adopted as they are; the sections at the README's times, so the tile sets stay cut).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M10 part B (flown from step B1; loaded and checked from step B2): the debris chunk's `reveals` (a small
# chunk that frees a secret's hidden crate when broken: the pathfinder pod), the radio's `first-strike-kill` event and
# the backdrop bank's `piece`; the harvester's `counted: false`, `haul` and drift `vx` and the Chimera's flock
# `fire_cap` are their stat blocks'.
# Step B2's own placements (pending the user's review in round 74): the Wraiths fly the built `rear ambush` from the
# rear (the README's "column, decloaking behind the ship"); the Gilded Gunships a `column` (Level 30's); the t=151 Spore
# Bombers enter at t=150 and the t=169 Chimera wing at t=168 (the world's rule: no strike tell within 1 s of a wave's
# entry, the strikes' tells at t=151 and t=169); the harvesters drift 8 px/s apart (QB-5, the harvester's data).
scroll_speed: 160     # the dive; the bands 120, the harvester fields 100, the storm edge 120 (eased over 2 s each)
launch_seconds: 5
bounty_scale: 0.31    # every bounty × 0.31: the README's hand estimate (step B2: levelReport's fit below)
control_prompts: []
ground: none          # air only (J2: the cloud decks are scenery): the bomb deliveries read NO GROUND; the Airstrike and the EMP Burst work
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Jupiter, the upper atmosphere
  layers: [air, low-air]
  density: 4
  traits: [forward, homing]
  hazards: [cloud banks, wind, lightning]
  boss: none
  objective: BREAK THE AIR COVER   # the OBJECTIVE field from sensor L1
  varga:
    none: "Jupiter's upper air, Lancer. Big sky, and it hides things."
    l1: "Mostly ahead. Clouds over your plane. No ground: bombs idle."
    l2: "New: Chimeras, hybrids that heal. Talons, Wraiths, bombers."
    l3: "Hold the beam on a Chimera. Homing finds what clouds hide."
  notes:
    Dominant layers: '`air` (Talon wings, Chimera wings and swarms, Mote Swarms, Lamprey streams, Gilded Gunships and their Darts; Wraiths cloaked on `high-air` until they decloak), `low-air` (Spore Bombers, the harvesters); **no ground**'
    Attack directions: '{directions} (the Wraiths decloak behind the ship, as built)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: Foreground cloud banks over the play plane; wind gusts (two spells); lightning strikes (three, section 4)
    Boss / mid-boss: none
    Sensor-suite detail: '**none**: Jupiter, the upper atmosphere, `air`, front · **L1**: + directions (sides), density {density}, hazards "cloud banks", "wind" and "lightning", the objective `{objective}`, the secondary `HARVESTERS 0 / 6` and the row `NO GROUND` · **L2**: + Chimera (new), Talon, Wraith, Spore Bomber, Lamprey, Gilded Gunship, Dart Drone and Mote portraits · **L3**: + `forward` and `homing` highlighted, the wave strip marking the harvester pairs and the three strikes'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); ART-B's tile sets cut at these rows
  - name: The Dive
    end: 24
    atmosphere: clear
    tiles: [dive-bands, cloud-tops, ice-haze]
    notes:
      layers:
        deep: Jupiter's curve and the bands far below, the CDF carrier group and its escorts (lights blinking).
        low-air: the first cloud tops rushing past.
        high-air: thin ice haze. No banks yet.
      purpose: 'The dive: popcorn and Talons at speed; the drop craft marked friendly (t=4, t=10).'
  - name: Into the Bands
    end: 70
    speed: 120
    ramp: 2   # eased from 160 over its first 2 s
    atmosphere: clear
    tiles: [cream-bands, cloud-wisps]
    notes:
      layers:
        deep: storm bands in cream and ochre.
        low-air: cloud wisps.
        high-air: 'the **first foreground banks** from t≈28 (small, slow).'
      purpose: "The Chimera's intro pair (t=34, quiet window t=32–38), the first wings; Wraiths; gust spell 1 (t=58, t=64)."
  - name: Harvester Fields
    end: 125
    speed: 100
    ramp: 2   # eased from 120
    atmosphere: clear
    tiles: [rust-band, cloud-wisps]
    notes:
      layers:
        deep: a broad rust band.
        low-air: 'the **harvesters** in four pairs (t=72–125) with their plumes, Spore Bombers among them.'
        high-air: banks at their densest (a third of the field).
      purpose: 'The secondary; the Chimera swarms under the banks (`homing`).'
  - name: Storm Edge
    end: 192
    speed: 120
    ramp: 2   # eased from 100
    atmosphere: clear
    tiles: [storm-edge, cloud-wisps]
    notes:
      layers:
        deep: "the band turns brown-grey, the storm wall of Level 38 far ahead with lightning inside it."
        high-air: 'banks thinning; the pathfinder pod (the secret, t≈146). Lightning flashes from t=130, **strikes** at t=138, 152 and 170. Level end at t=192 as the bands thin over Aurelia''s sky.'
      purpose: "The act's first strikes; gust spell 2 (t=156, t=162); the run to Aurelia."

weather:  # the Jovian system's hazards (design/world/jovian): Level 12's gusts and flashes as built, part A's strikes
  gusts:   # spell 1 from the left, spell 2 from the right (the bands' jets run opposite ways); push starts at t
    at:
      - {t: 58, from: left}
      - {t: 64, from: left}
      - {t: 156, from: right}
      - {t: 162, from: right}
    seconds: 2.5      # including the ramps
    ramp: 0.25        # s up and down
    push: 40          # px/s, added to the positions of the ship, Rook, the Lampreys
    telegraph: 1.0    # s ahead: the wind streaks brighten and an arrow shows at the upwind edge
    easy: {push: 25, telegraph: 1.5}
    hard: {push: 55}
  lightning:   # flash-only lightning dressing the storm edge from t=130 (the LIGHTNING event for the thunder); none within 1 s of a strike's tell
    at: [130, 133.5, 141, 145.5, 148.5, 155, 165, 174, 179, 184]
    reveal: 0.5   # s a flash makes the banks see-through
  strikes:   # told columns (data t = the tell's start, 1.0 s before the strike): t=138 through the t=136 Chimera wing's lane, t=152 left and t=170 right of the centre; easy t=138 and 170 only; hard + a tracking column at t=160
    - {t: 137, x: 240}
    - {t: 151, x: 120, skip: [easy]}
    - {t: 159, x: 240, track: true, skip: [easy, medium]}
    - {t: 169, x: 360}

debris:  # the pathfinder pod (the secret): a CDF pathfinder's cargo pod drifting down under a foreground bank on the play plane, a small breakable like a small rock (20 HP); broken, it frees the secret's hidden crate (`reveals`); sprites assets/sprites/debris-pathfinder-pod_N (16 tumble frames) and -break_N (ART-B)
  chunks:
    pathfinder-pod: {size: [28, 28], hp: 20}
  clearance: 0
  placed:
    - {t: 146, x: 400, chunk: pathfinder-pod, drift: [-6, -90], reveals: pathfinder pod}   # under bank-d (t 148.6, x 390) about t=147.2-148.8

