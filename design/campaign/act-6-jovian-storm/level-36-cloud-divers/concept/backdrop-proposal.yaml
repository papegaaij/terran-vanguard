sections:   # ART-B's reading of the README's Layout (speeds, 2 s eases); B2 writes the real ones
  - {name: The Dive, end: 24, atmosphere: clear, tiles: ['dive-bands', 'cloud-tops', 'ice-haze']}
  - {name: Into the Bands, end: 70, speed: 120, ramp: 2, atmosphere: clear, tiles: ['cream-bands', 'cloud-wisps']}
  - {name: Harvester Fields, end: 125, speed: 100, ramp: 2, atmosphere: clear, tiles: ['rust-band', 'cloud-wisps']}
  - {name: Storm Edge, end: 192, speed: 120, ramp: 2, atmosphere: clear, tiles: ['storm-edge', 'cloud-wisps']}
# rows: the end's bottom edge 22940 (ground px); deep 3441, high-air 38998
debris:
  # Proposal (ART-B): the pathfinder pod (the secret), a small breakable on the play plane like a small rock
  # (20 HP); `secret: true` (B1's flag) frees the hidden crate on its break. Sprites debris-pathfinder-pod_0..15
  # (32x32, its slow tumble) and debris-pathfinder-pod-break_0..7 (tools/art/jovian_units.py). It enters the
  # top at t=146 and drifts down under bank-d (t 148.6, x 390): under the bank about t=147.2-148.8.
  chunks:
    pathfinder-pod: {size: [28, 28], hp: 20}
  placed:
    - {t: 146, x: 400, chunk: pathfinder-pod, drift: [-6, -90], secret: true}
