radio:  # trigger: t or event; the README's lines (the 1 s rule: ≈ 12 characters a second, a 1.5 s lead, event lines dropped after 6 s; the secret's line is the secret's own). Rook's lines need him flying (requires: escort). The aces on the enemy channel; the duel's lines are events (`boss-arrival`, `boss-phase` subjects), queued as phase lines (they wait for a gap, stale after 20 s, dropped at the kill)
  - {t: 1, speaker: Okafor, line: "Callisto's picket line, Lancer. Vorne's own guard flies it. Clear a lane for the fleet."}
  - {t: 12, speaker: Varga, line: "Chimeras in the pickets. They heal if you let them rest: hold the beam on one."}
  - {t: 23.5, speaker: Rook, requires: escort, line: "The bugs are still chewing on their old friends. Fine by me."}
  - {t: 33, speaker: Varga, line: "Mirror interceptors on the flanks. Hit them from the side, or burn the mirror."}
  - {t: 44.5, speaker: Okafor, line: "Contacts behind you, Lancer. Rear guns."}
  - {t: 62.5, speaker: Varga, line: "Harrows from every side. They burst when they die: thin them far out."}
  - {t: 75, speaker: Rook, requires: escort, line: "Callisto. Looks cold. Looks like it's waiting for us."}
  - {t: 82, speaker: Okafor, line: "Long-range scan: three gold Talons holding the lane ahead. The Honour Guard."}
  - {t: 92.5, speaker: Varga, line: "Vorne's aces. One snipes, one dances, one comes from behind. Watch all three."}
  - {event: boss-arrival, speaker: Harker, portrait: harker-guard, channel: enemy, line: "Rook. They let you fly again? Then let's settle Ceres properly.", notes: {trigger: "Harker's entry tell (`boss-arrival`)"}}
  - {event: boss-arrival, speaker: Rook, requires: escort, line: "Harker. Still flying for whoever pays the most?", notes: {trigger: "After Harker's taunt (`boss-arrival`, queued behind it)"}}
  - {event: boss-phase, phase: vesper-joins, speaker: Vesper, channel: enemy, line: "Leave some for me, Harker. The quiet one's mine.", notes: {trigger: "Vesper's entry tell (`boss-phase`)"}}
  - {event: boss-phase, phase: kestrel-joins, speaker: Kestrel, channel: enemy, line: "Check your six, Lancer. I'm already there.", notes: {trigger: "Kestrel's entry tell (`boss-phase`)"}}
  - {event: boss-phase, phase: first-loss-harker, speaker: Harker, portrait: harker-guard, channel: enemy, line: "That was one of mine.", notes: {trigger: "The first ace's death, Harker surviving (`boss-phase`)"}}
  - {event: boss-phase, phase: first-loss-vesper, speaker: Vesper, channel: enemy, line: "You'll pay for that one.", notes: {trigger: "The first ace's death, Vesper the senior survivor (`boss-phase`)"}}
  - {event: boss-phase, phase: first-loss-kestrel, speaker: Kestrel, channel: enemy, line: "No more games.", notes: {trigger: "The first ace's death, Kestrel the only survivor flying (`boss-phase`)"}}
  - {event: boss-phase, phase: harker-down, speaker: Rook, requires: escort, line: "That one's for Ceres, Harker.", notes: {trigger: "Harker's death, whenever it comes (`boss-phase`)"}}
  - {event: boss-phase, phase: last-ace-harker, speaker: Harker, portrait: harker-guard, channel: enemy, line: "Just us now. Come on, then.", notes: {trigger: "The second ace's death, Harker the last (`boss-phase`)"}}
  - {event: boss-phase, phase: last-ace-vesper, speaker: Vesper, channel: enemy, line: "Just us now. Come on, then.", notes: {trigger: "The second ace's death, Vesper the last (`boss-phase`)"}}
  - {event: boss-phase, phase: last-ace-kestrel, speaker: Kestrel, channel: enemy, line: "Just us now. Come on, then.", notes: {trigger: "The second ace's death, Kestrel the last (`boss-phase`)"}}
  - {event: boss-destroyed, delay: 2.5, speaker: Rook, requires: escort, line: "Three gold Talons. Vorne needs new friends.", notes: {trigger: "The last ace's death (K, `boss-destroyed`, 2.5 s later)"}}
  - {event: boss-destroyed, delay: 2.5, speaker: Okafor, requires_not: escort, line: "The Honour Guard is down. Well flown, Lancer.", notes: {trigger: "The last ace's death without Rook (replaces his line)"}}
  - {t: 108.5, speaker: Okafor, line: "The guard is gone and the ring is open. Push through to the ice."}
  - {t: 125, speaker: Varga, line: "Helix HQ is under that ice. I had an office there, once. Three floors down."}
  - {t: 138.5, speaker: Rook, requires: escort, line: "Bursters again. Shoot them far out, not on top of us."}
  - {t: 158, speaker: Okafor, line: "That's the citadel's outer line. Form up, Aegis. Callisto is next."}

objectives:
  primary: reach-end   # with the duel as its condition (Level 19's mid-boss rule: the level cannot go on while an ace lives)
  secondary: {kill_ratio: 0.65, boss_counted: false, credits: 100, name: Break the pickets}   # at least 65 % of the level's planned units (the waves' 285 at medium: 186; the Gunships' Darts count as kills, not in the requirement; the aces and the Vrell's prey kills not counted), judged at the end; no radio line (100 in Act 1 terms: pays 1,049)

music:
  track: 14           # Act 6 A "Eye of the Storm" (audio/music track list)
  start_section: 1    # the base stem over Jupiter's shadow
  full_section: 2     # the full mix from the picket line (t=30)
  motif: {from: 30, to: 96, sections: {}}   # Vorne's motif on through the pickets (his guard's level), out with the theme
  stem_times:
    - {t: 96, stems: none, fade: 4}   # the theme out over the pre-duel pause (t=96-100); the ambience alone until the sting
  ambience: belt-open   # open space heard through the hull (Act 5's)
  ambience_layers:
    - {ambience: fleet-comms, from: 0, to: 30, fade_in: 1, fade_out: 4}   # the fleet's distant comms and engine rumble under section 1
  end_jingle: mission-complete
  boss_sting: miniboss-sting   # track 21 at the arena's start, when the bar appears
  boss_track: duel-theme       # track 32 "Three Aces" after the sting for the whole duel, out at the last ace
  track_after_boss: full       # track 14's full mix back with the clock's resume (the waves at t=107)

difficulty: {}  # the stat blocks' hooks apply (the Honour Guard's easy and hard joins, line, rests, spiral and pull-out; the Talon's, the Chimera's, the Gunship's, the Hornet's, the Mirror Interceptor's, the Harrow's); the Gunship, Hornet, Mirror and Harrow waves pinned on easy and hard; the formation lever sizes the rest

briefing:
  pages:   # the approved texts as they are (BriefingLayoutTest: 4 lines a page)
    - {speaker: Okafor, image: level-40-callisto-approach, line: "Callisto's approach is held by Vorne's pickets and by his Honour Guard: three aces in gold Talons. Break the pickets, then the guard. The fleet follows your lane, Lancer."}
    - {speaker: Varga, image: level-40-honour-guard, line: "The pickets fly hybrids and mirrors. The aces start one by one and end together: a sniper, a dancer, and one who comes from behind. Keep your rear guns fitted."}
  teaser: {speaker: Okafor, line: "Vorne's guard waits at Callisto. Fit something that shoots behind you."}

backdrop:
  # Presentation only: Level 40's Callisto approach (tools/art/backdrop_l40.py, step ART-F2: its proposal's block as it is;
  # the sections above at its times). No ground (`ground: none`): the deep layer is the base, scrolling at 0.06 (the
  # bodies drift: the README's motion budget). Its tile sets are cut from one continuous field at the rows each
  # section's tiles begin (re-run the generator after moving a section). Animated: the -glow pieces, additive at their
  # piece's placements on the real clock (two on a `path`), at most two on the screen at once. The scroll halts at the
  # arena's end while an ace lives (the built clock): the backdrop holds still behind the duel, Callisto's lit lower
  # limb crossing the screen at y~330.
  scroll_factors: {deep: 0.06, far: 0.3, ground: 1, low-air: 1.3, high-air: 1.7}   # ground, low-air, high-air unused
  ramp: 2
  haze_colour: 03040a
  atmosphere:
    clear: {haze: 0.0}   # vacuum: no haze, no wisps
  tile_sets:
    jupiter-shadow: {layer: deep, height: 1056}   # section 1: Jupiter's Shadow
    picket-line: {layer: deep, height: 512}   # section 2: The Picket Line
    callisto-rising: {layer: deep, height: 480}   # section 3: Callisto Rising
    guard-lane: {layer: deep, height: 192}   # section 4: The Guard's Lane
    guard-brake: {layer: deep, height: 192}   # section 5: The Guard's Lane, braking
    duel: {layer: deep, height: 192}   # section 6: The Duel
    callisto-ring: {layer: deep, height: 512}   # section 7: Callisto's Ring
    ice-line: {layer: deep, height: 512}   # section 8: The Ice Line
  pieces:
    picket-station: {layer: deep, size: [112, 112]}
    picket-station-glow: {layer: deep, size: [112, 112], frames: 8, fps: 4}
    fleet-far: {layer: deep, size: [128, 96]}
    fleet-far-glow: {layer: deep, size: [128, 96], frames: 8, fps: 4}
    guard-glints: {layer: deep, size: [96, 48]}
    guard-glints-glow: {layer: deep, size: [96, 48], frames: 12, fps: 6}
    citadel: {layer: deep, size: [256, 144]}
    citadel-glow: {layer: deep, size: [256, 144], frames: 8, fps: 4}
    ring-span: {layer: far, size: [480, 128]}
  placed:
    # section 1: the carrier group rising off Jupiter's limb (its path climbs 15 px/s against the deep layer's 9.6: y 470 at t=0, y~310 at t=30), then sinking out at the bottom by t~54
    - {piece: fleet-far, t: -20.833, x: 352, path: [[0, 0, 0], [30, 0, 450]]}
    # section 2: the picket station far off on the right (the recorder drifts down the left edge at t~50), entering the top at t~34 as Jupiter sinks out below it; on the screen to t~100
    - {piece: picket-station, t: 67.333, x: 386}
    # section 4: three gold glints far ahead (in from the top at t~90), climbing away out of the top edge over t=100.6-102.4 (the aces leaving to make their entries; gone before the sting at 102), then parked 1000 px up for the rest of the level (a path that starts before the duel runs on the real clock after it: its last offset holds)
    - {piece: guard-glints, t: 123.91, x: 262, path: [[100.6, 0, 0], [102.4, 0, 200], [102.5, 0, 1000]]}
    # section 6: the fleet closing behind: in from the bottom edge after the duel (16 px/s against the deep layer's 9.6: y~600 at t=104, y~410 at t=134), then sinking back out by t~153; until t=104 it waits 600 px off the right edge (its path starts after the duel, so the path keeps the level clock)
    - {piece: fleet-far, t: 66.289, x: 150, path: [[104, 600, 0], [104.1, 0, 0], [134, 0, 480]]}
    # section 7: the black citadel on Callisto's night side, its red and gold lights at the top edge from t~159, the outer line of lamps at y~130 at the level's end
    - {piece: citadel, t: 187.25, x: 300}
    # section 6: Callisto's orbital ring and two relay platforms crossing below (far, 0.3): on the screen t~111-125
    - {piece: ring-span, t: 118.0, x: 240}
