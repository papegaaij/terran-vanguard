# Level 40 – Honour Guard: the level script, rendered into README.md (briefing, threat profile, layout, waves, radio,
# credit budget). Times are seconds from the level start (the level clock: it halts in the duel while an ace lives).
# M10 part F, step F2, from the README's approved hand tables (round 72) and ART-F2's backdrop proposal
# (concept/backdrop-proposal.yaml: its backdrop block, the recorder's tow and its eight sections as they are, so the
# tile sets stay cut).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M10 part F (flown from steps F1a/F1b; loaded and checked from step F2): the mid-boss `honour-guard`, a
# squadron (its stat block's `boss.squadron`), its radio subjects as `boss-phase` lines (`vesper-joins`,
# `kestrel-joins`, `harker-down`, `first-loss-<ace>`, `last-ace-<ace>`), the music's `track_after_boss` (a mid-boss's
# `boss_track` after its `boss_sting`, the level track's full mix back after the kill). (The supply drones' `marked`
# keys went in step R79b2: the friendly brackets rule of round 79 leaves an untouchable drone unmarked.)
# Step F2's own placements (decided as trivia, accepted 2026-11-01 (round 78 C.3, C.4)):
# - The duel's arena **halts** the scroll (ART-F2's backdrop is laid out for the built clock, which halts a
#   non-crawling arena) where the README says it drifts at 20 px/s: the eight sections are ART-F2's (section 4 split
#   at t=98 where the ease to 20 px/s starts; the duel the one-second arena at 20 px/s, held 4 s after the last ace).
# - The two rear V-wings (t=48, t=144.5) flew from the front until the simulation flew a front formation from the rear
#   (m10f-gaps.md §1 #11); since F1c (a V-wing rising from the bottom edge) they fly `from: rear` (step DB1).
# - The supply drone's second armour patch (t=145) at the first's point (240, 380); the shield cell from the t=70.5
#   column's last Gunship (easy flies one); the Skitter swarms are streams (Skitters fly no flock), the Chimera swarms
#   on the motes' routes; the Mirror rear ambush at t=68, not 75.5 (swapped with the motes: at 75.5 the t=70.5
#   Gunships drifted down through its stations, two big hulls overlapping); hard's Harrow cross 2 per edge (the
#   README's 3 is beyond the Harrow's cross of 4-8).
scroll_speed: 160     # open space (the duel's arena halts it; ART-F2's sections)
launch_seconds: 5
bounty_scale: 0.39    # every bounty × 0.39: the README's hand estimate (typical +0.8 %; levelReport's fit below)
control_prompts: []
ground: none          # air only (J2): the Bomb Rack and Rook's Mortar read NO GROUND; the Airstrike and the EMP Burst work
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Callisto approach
  layers: [air]
  density: 5
  traits: [spread, rear]
  hazards: [death-burst rings, sniper line]
  boss: Honour Guard
  objective: BREAK THE HONOUR GUARD   # the OBJECTIVE field from sensor L1
  varga:
    none: "Callisto approach. Air only, no ground at all."
    l1: "Pickets from front, sides and rear. Then the guard."
    l2: "Chimeras, Mirrors, Harrows. Three gold Talons."
    l3: "Spread for the three aces, rear guns for the third."
  notes:
    Dominant layers: '`air` only (`space` is `air` in vacuum, the [Jovian media](../../../world/jovian/README.md#media-per-level)): the pickets and the Honour Guard. No ground layer: the Bomb Rack and Rook''s Mortar read **`NO GROUND`** (J2; the hangar warns)'
    Attack directions: '{directions} (counted by enemy; the duel adds the aces'' side and rear entries)'
    Density: '{density}'
    Recommended traits: '`spread` (three aces apart, wide pickets), `rear` (the Mirror Interceptors'' rear ambushes, Kestrel''s station); `homing` helps against the moving aces'
    Hazards: Harrow death-burst rings; the Mirror Interceptors' bounced shots; the aces' sniper line and dives; no weather (vacuum)
    Boss / mid-boss: 'Mid-boss [Honour Guard](../../../enemies/bosses/honour-guard/README.md)'
    Sensor-suite detail: '**none**: the Callisto approach, `air` only, front, sides, rear. **L1**: + the directions, density {density}, hazards "death-burst rings" and "sniper line", the objective `{objective}`. **L2**: + Talon, Chimera, Gilded Gunship, Hornet, Mirror Interceptor, Harrow, Dart Drone, Skitter, Mote Swarm portraits; the mid-boss''s name and three silhouettes (`honour-guard`). **L3**: + `spread` and `rear` highlighted; the timeline strip marks the Harrow cross (65 s) and the duel (102 s); 1 secret.'

sections:  # back to back from t = 0; ART-F2's eight (its proposal's times: the tile sets are cut at them)
  - name: "Jupiter's Shadow"
    end: 30
    speed: 160
    atmosphere: clear
    tiles: [jupiter-shadow]
    notes:
      layers:
        deep: "Jupiter's limb filling the bottom edge, its night side, the fleet's lights rising off it."
      purpose: Talons, Chimeras and popcorn; the Vrell hunting Talons (t=15.5).
  - name: The Picket Line
    end: 64
    speed: 160
    atmosphere: clear
    tiles: [picket-line]
    notes:
      layers:
        deep: Jupiter shrinking to a disc at the right edge; a picket station far off (scenery).
        low-air: a dead CDF scout drifting down the left edge (t≈50, the secret's source).
      purpose: Gunships and Darts, the first Mirror pincer (t=35.5), the first V-wing from the rear (t=48, rising from the bottom edge).
  - name: Callisto Rising
    end: 96
    speed: 160
    atmosphere: clear
    tiles: [callisto-rising]
    notes:
      layers:
        deep: "Callisto's dark disc rising at the top, its ice catching Jupiter's light."
      purpose: The Harrow cross (t=65.5), the Mirror rear ambush (t=68), the last pickets (t=93).
  - name: "The Guard's Lane"
    end: 98
    speed: 160
    atmosphere: clear
    tiles: [guard-lane]
    notes:
      layers:
        deep: Callisto larger; three gold glints far ahead.
      purpose: The pre-duel pause begins (t≈97); the supply drone's first armour patch (t=97).
  - name: "The Guard's Lane, braking"
    end: 102
    speed: 20
    ramp: 4
    atmosphere: clear
    tiles: [guard-brake]
    notes:
      layers:
        deep: the three glints climbing away out of the top edge (the aces leaving to make their entries).
      purpose: The scroll eased from 160 to 20 px/s over t=98–102; Varga names the aces.
  - name: The Duel
    end: 103   # the arena: the scroll halts at its end while an ace lives (the built clock), the level clock with it
    speed: 20
    arena: true
    hold_after_boss: 4   # s the clock stays halted after the last ace (its 2 s chain, the credit shower, 2 s more)
    atmosphere: clear
    tiles: [duel]
    notes:
      layers:
        deep: as section 5, held still behind the duel (Callisto's lit lower limb across the screen).
      purpose: 'The sting at t=102, the duel (≈ 66 s at medium); the clock halted while an ace lives.'
  - name: "Callisto's Ring"
    end: 140
    speed: 160
    ramp: 2   # eased up from the halt over 2 s
    atmosphere: clear
    tiles: [callisto-ring]
    notes:
      layers:
        deep: "Callisto's orbital ring (black and gold relay platforms, scenery) crossing below; the fleet closing behind."
      purpose: Calm to t=107, then the waves resume; the ring's defenders.
  - name: The Ice Line
    end: 170
    speed: 160
    atmosphere: clear
    tiles: [ice-line]
    notes:
      layers:
        deep: "Callisto's ice filling the lower half, the black citadel's lights at the top edge by t=165."
      purpose: "The last waves; the level ends at t=170 as the citadel's outer line reaches mid-screen."

boss:  # the mid-boss: the sting, the bar (three segments, hatched) and the boss checkpoint (none on hard) at the arena's start; each ace's own entry tell (no edge warning)
  enemy: honour-guard
  t: 102
  x: 240
  section: 6
  notes:
    from: 'top, then a side, then the rear (each ace''s own entry tell, 2.5 s ahead)'
    waves: 'At the arena''s start: the sting, the bar and the checkpoint; Harker told 1 s later; no other waves in the duel'

tows:  # Sentry Two's recorder (the secret): drifting down the left edge on its dead scout; its housing takes 4 hits and frees the crate (Level 30's buoy rule); `beam_touch`: a beam's touch counts a hit per 0.25 s. ART-F2's sprites (TowLooks draws the scout beside it: step F4)
  - {t: 50, x: 70, drift: [3, -90], boat: [20, 20], pod: [16, 16], tether: [0, 0], cable: [20, 20], hits: 4, reveals: "Sentry Two's recorder", beam_touch: true}

