debris:  # Aurelia's cargo pod (the secret) and the CDF supply canister (ART-D's proposal; sprites debris-cargo-pod_N and -outline_N, -break_N; debris-canister_N, -latch_N, -release_N)
  chunks:
    cargo-pod: {size: [30, 30], hp: 20}
    canister: {size: [22, 30], hp: 10}   # the canister; the canopy above it is no target. No latch (round 76 L.1 b): it opens by itself, every shot passes it, so its hp is never spent (a small chunk's, as a drop needs)
  clearance: 0
  placed:
    - {t: 100, x: 240, chunk: canister, drift: [0, -60], drop: armour patch, opens_at: 270}   # down the middle on its parachute (no friendly brackets since step R79c: every shot passes it); it opens by itself over the middle (270 px from the top) and lets the armour patch fall (round 76 L.1 b)
    - {t: 118, x: 40, chunk: cargo-pod, drift: [4, -70], reveals: Aurelia cargo pod}   # tumbling down the left edge, lights dead; a strike crossing it opens it too

