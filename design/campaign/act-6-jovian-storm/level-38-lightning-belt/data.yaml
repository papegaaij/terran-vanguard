  # No ground (`ground: none`): the deep layer is the base. Its five tile sets are cut from one continuous field at the
  # rows each section's tiles begin (the sections above: re-run the generator after moving one). Animated: the -glow
  # pieces (the walls' and cells' inner lightning, the wreck's fires), additive at their piece's placements on the
  # real clock, at most two on the screen at once; frame 0 of each wall/cell glow is its brightest flash (D4: a
  # brighter pulse on STRIKE_TOLD).
  scroll_factors: {deep: 0.15, far: 0.5, ground: 1, low-air: 1.3, high-air: 1.7}   # far, ground unused
