secrets:
  - name: Aurelia cargo pod
    crate: 100   # Act 1 terms: pays 1,049 with the act factor (freight torn loose from the falling city)
    radio: {speaker: Varga, line: "Aurelia freight. Someone tried to save it."}

pickups:
  - {pickup: shield cell, dropped_by: {wave: 111, enemy: hornet, unit: second}}   # the second Hornet of the t=111 pair (if the player kills it)
  - {pickup: overdrive, dropped_by: {wave: 126, enemy: chimera, unit: last}}      # the t=126 wing's last Chimera

radio:  # trigger: t or event; the README's 14 lines (the 1 s rule: ≈ 12 characters a second, a 1.5 s lead, event lines dropped after 6 s; the secret's line is the secret's own). Rook's lines need him flying (requires: escort: the first strike kill and his t=186 line). The Choir and Vorne are quiet.
  - {t: 1, speaker: Okafor, line: "The storm layer. Their trackers can't see through it, and neither can we."}
  - {t: 23, speaker: Varga, line: "Lightning. A thin line, then the strike, top to bottom. It hits them too."}
  - {t: 34, speaker: Varga, line: "Harrows: hybrid rammers. However they die, they burst into a ring. Kill them far off."}   # step D4: 32.5 → 34, Varga's t=23 line on the typed pages runs to t≈33.9 (RadioTimelineLevel38Test), pending round 76
  - {event: first-strike-kill, speaker: Rook, requires: escort, line: "Did the sky just take my kill?", notes: {trigger: "The first enemy killed by a strike (event, bark)"}}
  - {t: 52, speaker: Okafor, line: "Contacts from the flanks. The storm turns everything round down here."}
  - {t: 62.5, speaker: Varga, line: "Buzzsaws. Out here they bounce off nothing but the edges."}
  - {t: 73, speaker: Varga, line: "Lampreys on that Talon wing. The Vrell hunt them everywhere now."}
  - {t: 109.5, speaker: Okafor, line: "The Red Spot's rim. Every storm on this planet feeds it."}
  - {t: 134.5, speaker: Varga, line: "Harrows on every side. Find the gaps in the rings."}
  - {t: 150.5, speaker: Okafor, line: "Climbing out. Io's ahead, and every refinery he has left."}
  - {t: 186, speaker: Rook, requires: escort, line: "Lightning, kamikazes, buzzsaws. Next time I pick the scenic route."}
  - {event: secondary-objective, speaker: Varga, line: "Most of their Harrows down. Aurelia's labs will notice.", notes: {trigger: "Secondary met (at the end: 23 of the 35 Harrows down)"}}
  - {event: level-end, speaker: Okafor, line: "Out of the storm. Io, Lancer.", notes: {trigger: Level end}}

objectives:
  primary: reach-end
  secondary: {kill_ratio: 0.65, enemy: harrow, label: HARROWS, credits: 100, name: Down 23 of the 35 Harrows}   # 65 % of the Harrows flown, rounded up (HARROWS n / 23; easy and hard 65 % of their own count), judged at the end; a strike's, a ram's and Rook's kills count; 100 in Act 1 terms: pays 1,049

music:
  track: 15           # Act 6 B "Storm Wall" (audio/music track list): the storm and the war sound alike
  start_section: 1    # its intro over the drop under Aurelia, then the base through the storm wall
  full_section: 3     # the full mix from the cells to the breakout
  ambience: jovian-sky   # the Jovian sky bed (a wide wind roar, rain-less, thunder rolling far off)
  ambience_db: {2: 3, 3: 3, 4: 3}   # +3 dB in the storm sections (Level 13's whiteout rule), back at the breakout
  end_jingle: mission-complete

difficulty: {}  # the stat blocks' hooks apply (the Harrow's easy tell 0.8 s and ram 240 px/s, hard 0.5 s, 340 px/s and its ring at 100 px/s; the Buzzsaw's; the Hornet's, the Wraith's, the Chimera's, the Talon's, the Lamprey's, the Stinger's); the Harrow waves pinned on easy (at most 4 on the screen) and hard (at most 6), the Hornet waves pinned (at most 3); the weather's easy and hard gusts and strikes in their blocks; the formation lever sizes the rest

briefing:
  pages:   # the approved texts as they are: each wraps to 4 lines of the panel's 67 characters (BriefingLayoutTest)
    - {speaker: Okafor, image: level-38-lightning-belt, line: "Aurelia is gone, and Vorne's fleet still drinks from Io. The high road to Io runs under Callisto's guns; the storm layer below the cloud cities doesn't. Their trackers go blind in it. So do we. Fly the Lightning Belt and come out over Io."}
    - {speaker: Varga, image: level-38-harrow, line: "The storm throws columns of lightning: a thin line first, then the strike, the whole way down. It hits whatever flies in it, theirs too. And Aurelia's labs bred hybrids for this storm. Harrows. Whatever kills one, it bursts into a ring. Kill them far away."}
  teaser: {speaker: Rook, line: "Storm layer next. Weather report: lightning, then more lightning."}

backdrop:
