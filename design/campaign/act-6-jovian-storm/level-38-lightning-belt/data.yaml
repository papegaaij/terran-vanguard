    at:
      - {t: 80, from: right}
      - {t: 86, from: right}
      - {t: 140, from: right}
      - {t: 146, from: right}
    seconds: 2.5      # including the ramps (Level 12's)
    ramp: 0.25        # s up and down
    push: 40          # px/s, added to the positions of the ship, Rook, the Lampreys (never bullets, rams or rings)
    telegraph: 1.0    # s ahead: the wind streaks brighten and an arrow shows at the upwind edge
