# Level 38 – Lightning Belt: the level script, rendered into README.md (briefing, threat profile, layout, waves, radio,
# credit budget). Times are seconds from the level start. M10 part D, step D2, from the README's approved hand tables
# (round 72) and ART-D's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block, the pod's and the
# canister's debris and the sections at the README's times as they are, so the tile sets stay cut).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M10 part D (flown from step D1; loaded and checked from step D2): the Harrow's dash variant (its stat
# block's `chase: [least, most]`, `lock: tell-end`, `after: out`), the secondary's `enemy` (a kill ratio of one
# enemy's units, HARROWS n / 23), the debris chunk's `drop` and `marked` (the CDF canister's armour patch; its
# friendly brackets dropped in step R79c: shot-proof; round 76 L.1 b: its `opens_at`, no latch) and the music's `ambience_db` by section (the bed +3 dB in the storm sections). Part A's strikes
# and the waves' `tag`/`hunts` (the three-way war, no `turn`: live from the hunters' entry) are flown since part A;
# rear streams and the cross of dashers since step D1.
# Step D2's own placements (decided as trivia, pending the user's review in round 76): the strikes' tells moved by at
# most 1 s off the waves' entries (the world's rule: no tell within 1 s of an entry, which the README's times broke at
# 17 of them) and the lures 1.0-1.5 s after their Harrow waves; the lures' columns on the waves' chase lanes (a front
# stream's left or right lane, a side stream's edge, the cross's middle); hard's third gust at t=111, not 113 (the
# strike at t=114: no gust within 2 s of a tell); the t=159.5 Skitters a rear snake on its path (only chasers and
# dashers stream in from the rear); the Harrow and Hornet waves' counts pinned on easy and hard (their caps).
scroll_speed: 140     # the storm layer, the same speed throughout (the backdrop's)
launch_seconds: 5
bounty_scale: 0.43    # every bounty × 0.43: the README's hand estimate (step D2: levelReport's fit below)
control_prompts: []
ground: none          # air only (J2): the bomb deliveries read NO GROUND; the Airstrike and the EMP Burst work
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Jupiter, storm layer   # step D4: "the storm layer" left the intel panel (IntelPanelLayoutTest)
  layers: [air, high-air]
  density: 5
  traits: [homing, beam]
  hazards: [lightning, gusts, burst rings]
  boss: none
  objective: REACH IO   # the OBJECTIVE field from sensor L1
  varga:
    none: "Under the cloud cities: the storm layer. Lightning."
    l1: "From every side. No ground: the bombs stay idle."
    l2: "New: Harrows that burst. Buzzsaws back, Chimeras."
    l3: "Homing for the flanks, a beam for the healers."
  notes:
    Dominant layers: '`air` (Harrows, Buzzsaw Drones, Chimeras, Talons, Hornets, Dart and Skitter streams, motes, Lampreys, Stingers, Needlers); `high-air` (the Wraiths, cloaked); **no ground**'
    Attack directions: '{directions} (counted by enemy: every side or rear entry edge-warned 3 s ahead, the Wraiths'' rear ambush excepted: their own flight)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: Lightning strikes (told columns, they hit the ship and the enemies); wind gusts; burst rings (the Harrows)
    Boss / mid-boss: none
    Sensor-suite detail: '**none**: Jupiter, storm layer, `air`, all directions, the objective `{objective}` · **L1**: + density {density}, the hazards "lightning", "gusts" and "burst rings", the secondary `HARROWS 0 / 23`, the row `NO GROUND` · **L2**: + Harrow (new), Buzzsaw Drone, Chimera, Talon, Hornet, Wraith, Lamprey, Stinger, Needler, Dart Drone, Skitter and Mote portraits · **L3**: + `homing` and `beam` highlighted, the wave strip marking the side and rear entries'

sections:  # back to back from t = 0, all at 140 px/s; ART-D's tile sets cut at these times
  - name: Under Aurelia
    end: 22
    atmosphere: medium
    tiles: [storm-top]
    notes:
      layers:
        deep: the storm's top, Aurelia's wreck sinking far above and behind (lights going out).
        low-air: torn balloon fabric and deck debris falling past (scenery, no hit box).
      purpose: The drop into the storm; popcorn and the first Chimeras.
  - name: The Storm Wall
    end: 62
    atmosphere: heavy
    tiles: [storm-floor]
    notes:
      layers:
        deep: cloud walls lit from inside.
        high-air: storm scud passing over.
      purpose: '**The lightning taught** (the first strike alone at t=26), **the Harrow introduced** (t=30.5) and the first lure (t=43.5).'
  - name: The Cells
    end: 109
    atmosphere: heavy
    tiles: [storm-cells]
    notes:
      layers:
        deep: 'storm cells as towers of cloud (backdrop only: no hit box, the Buzzsaws do not bounce off them); gust streaks.'
      purpose: "All directions: the Buzzsaws' return, side and rear entries, the first three-way hunt, the first gust spell."
  - name: "The Red Spot's Rim"
    end: 150
    atmosphere: heavy
    tiles: [red-spot-rim]
    notes:
      layers:
        deep: "the Red Spot's rim as a rust glow and a vast curving wall far off; the densest lightning."
      purpose: 'The peak: Hornets hunted by Stingers, Harrows from every edge, the second gust spell.'
  - name: The Breakout
    end: 196
    atmosphere: medium
    tiles: [breakout]
    peak: {atmosphere: light, from: 172, to: 196}
    notes:
      layers:
        deep: "the cloud tops thinning, stars, Io's yellow disc rising; the last strike at t=163."
      purpose: The climb out; the last waves; the calm before the end.

weather:  # the Jovian system's hazards (design/world/jovian): Level 12's gusts as built, part A's strikes
