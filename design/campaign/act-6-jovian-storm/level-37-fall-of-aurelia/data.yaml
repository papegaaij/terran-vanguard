secrets:
  - name: CDF locker
    crate: 100   # Act 1 terms: pays 1,049 with the act factor (a CDF locker left on the decks in 2166)
    radio: {speaker: Okafor, line: "A CDF locker from sixty-six. Take it. We left a lot behind."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 55, enemy: talon, unit: first}}            # the t=55 squad leader (the V-wing's tip)
  - {pickup: shield cell, dropped_by: {wave: 52, enemy: gilded-gunship, unit: first}}   # the t=52 Gilded Gunship

drops:  # a CDF supply drone from the carrier (low-air) releases an armour patch before the fall
  - {t: 152, x: 240, y: 380, pickup: armour patch}

radio:  # trigger: t or event; the README's 22 lines (the 1 s rule: ≈ 12 characters a second, a 1.5 s lead, event lines dropped after 6 s; step C4b retimed them to the game's typed pages, two pages ≈ 11 s a line, and moved Okafor's answer before Varga's turret warning, the third pair's call before Varga's t=129.5 and Okafor's "hunting" line after the secondary's outcome, accepted in round 75; step C6a, round 75 L.3 a and L.4 a: the timed lines to t=140 and Okafor's t=153.5 line cut to one typed page each, ≈ 7 s, and retimed so the event lines find gaps and Okafor's reply ends before the Choir's static at t=98). Rook's barks need him flying (requires: escort: the first bounce, the first prey kill); his t=52.5 line is scripted (no requires). Aurelia Traffic on the friendly channel; the Choir distorted with its 2 s static (the music ducks 6 dB under it); Vorne on the enemy channel, cold.
  - {t: 1, speaker: Aurelia Traffic, line: "CDF flight, civilians on our pads. Please. Help us get them out."}
  - {t: 9, speaker: Okafor, line: "Aegis copies. Lancer, the shuttles fly. Keep their lanes clear."}
  - {t: 16.5, speaker: Varga, line: "Grown turrets. Kill one, burn its root, or the turret grows back."}
  - {t: 24.5, speaker: Varga, line: "Mirror noses, both sides: shots bounce back. Hit the flanks."}
  - {event: first-bounce, speaker: Rook, requires: escort, line: "It's throwing your own shots back, Lancer. Go round it.", notes: {trigger: "The first bounced shot (`first-bounce`, event, bark)"}}
  - {t: 32, speaker: Aurelia Traffic, line: "Halcyon One and Two boarding. CDF flight, they're yours."}
  - {t: 52.5, speaker: Rook, line: "Gold decks, domes and guns. Lancer, these people have a problem."}
  - {t: 70.5, speaker: Aurelia Traffic, line: "Halcyon Three and Four next. Boarding faster than we can launch."}
  - {event: first-ally-lost, speaker: Aurelia Traffic, line: "We lost a shuttle! Aegis, keep them off the lanes!", notes: {trigger: "A shuttle lost (`first-ally-lost`, event, the first time)"}}
  - {t: 78.5, speaker: Varga, line: "Their traffic net is mine. Aurelia's codes. I'm keeping these."}
  - {t: 86.5, speaker: Okafor, line: "Take everything, Doctor. Lancer, the growth is moving."}
  - {t: 100, speaker: The Choir, distorted: true, static_lead: 2, duck_db: 6, line: "…the one who opened… is no longer needed… the door is ours…", notes: {trigger: "t=100 (its 2 s static from t=98)"}}
  - {t: 115.5, speaker: Vorne, expression: rage, channel: enemy, line: "All wings, this is Vorne. The Vrell are hostile. Burn them.", notes: {trigger: "t=115.5, the enemy channel (cold, never shouted)"}}
  - {t: 123, speaker: Aurelia Traffic, line: "Halcyon Five and Six, launching through the growth. Aegis, please!"}
  - {t: 131, speaker: Varga, line: "They're eating the city. Never his partners. Only a door."}
  - {event: first-prey-kill, speaker: Rook, requires: escort, line: "They're eating their own side. Not complaining.", notes: {trigger: "A prey unit killed by a hunter (`first-prey-kill`, event, the first time, bark)"}}
  - {event: secondary-objective, speaker: Aurelia Traffic, line: "That's everyone we could load. Aurelia thanks you, Aegis.", notes: {trigger: "Secondary met (`secondary-objective`, the fifth shuttle out; easy the fourth, hard the sixth)"}}
  - {event: secondary-failed, speaker: Okafor, line: "Two shuttles down. Keep the rest flying, Lancer.", notes: {trigger: "Secondary failed (`secondary-failed`, the second shuttle lost; easy the third, hard the first)"}}
  - {t: 153.5, speaker: Okafor, line: "Vrell hunting the gold ones. Let them. Shoot whatever fires at you."}
  - {t: 163, speaker: Aurelia Traffic, line: "The lift rings are failing. Aurelia is falling. Aurelia Traffic, signing off."}
  - {t: 174.5, speaker: Okafor, expression: grim, line: "I stood on those decks in sixty-six, when we fired on them. Follow her down, Lancer. Then get out."}
  - {t: 186.5, speaker: Varga, line: "Aurelia Traffic is off the air. I'm sorry, Commander."}
  - {event: level-end, speaker: Okafor, line: "Aurelia is gone. The people on those shuttles are not. Come home, Aegis.", notes: {trigger: Level end}}

