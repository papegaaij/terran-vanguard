  livery: aurelia
  player_hits: true   # step C6a (round 75 F.3, the user's decision 2026-11-01): the player's fire hits them as it hits Act 5's marked craft; one shot down is a lost shuttle
  stations:   # pair by pair: one behind the other in the middle, 170 and 240 px below the top edge, Level 10's lane sway (hulls inside x 192-288)
