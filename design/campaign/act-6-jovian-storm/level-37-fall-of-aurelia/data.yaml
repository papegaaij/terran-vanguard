# Level 37 – Fall of Aurelia: the level script, rendered into README.md (briefing, threat profile, layout, waves, ground
# targets, radio, credit budget). Times are seconds from the level start. M10 part C, step C2, from the README's approved
# hand tables (round 72) and ART-C2's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop block with the
# growth burst and the fall as they are; the sections, the ground targets' places, the pads and the locker at its
# times, so the city's rows stay where the generator cut them).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M10 part C (flown from step C1; loaded and checked from step C2): `air_allies` (the Halcyon shuttles,
# air allies outside the objectives lifting in groups, the waves at the `hooked` times aiming at them; Aurelia's
# `livery`), the secondary's `saved` (5 of the 6 home; easy 4, hard 6), the radio's `first-bounce` and
# `first-prey-kill` events, the music's `themes` (track 15 from t=103), the backdrop's `growth` and `fall`; the Mirror
# Interceptor's `movement.station` is its stat block's. Part A's `turn` and the waves' `tag`/`hunts` (the three-way war)
# are flown since part A.
# Step C2's own placements (decided as trivia, pending the user's review in round 75): the Choir's line at t=100 with
# its static from t=98 (Level 33's convention: `t` is the line, the static before it); the old theme out over 1 s from
# t=100 (a stem time `none`), track 15 at t=103 without its motif; the Mote swarms at t=43 and t=88 down the middle
# third (clear of the mirrors' arcs), the t=49 Skitter snake down the right edge round the shuttles' band.
# Step C6a (round 75 F.3, L.2 a, L.3 a, L.4 a; the user's decisions 2026-11-01): the shuttles take the player's fire
# (`player_hits`) and leave the centre lane (each group's `hold`, `aside` and `climb.seconds`); no enemy hovers or flies
# in behind a shuttle in the line of fire (ShuttleLaneTest): the t=77 Hornet to the right third, the t=80 snake down the
# middle, around the third pair the Talon pair at t=132 down the left third, the Hornet at t=135, the rear ambush at
# t=136.5, the Motes at t=137 and the left snake at t=140, the last pincer at t=149 (no hull stacked with the Hornet); the
# dome rim and terrace nests off the stations, slides and edge lanes; the timed radio lines to t=140 one typed page each
# and retimed (and Okafor's t=153.5).
scroll_speed: 120     # Aurelia's Rim; the gilded decks 100, the Spire Plaza 80, after the turn 100 (eased over 2 s each)
launch_seconds: 5
bounty_scale: 0.32    # every bounty × 0.32: levelReport's fit (step C2; the README's hand estimate 0.30 flew 7,490 at medium, −6.3 %)
control_prompts: []
turn: 100             # the Vrell turn: the hunting waves' links are live from t=100 (the Choir's line)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Jupiter, Aurelia
  layers: [air, ground]
  density: 4
  traits: [anti-ground, spread, shield-breaker]
  hazards: [mirrors, regrowth]
  boss: none
  objective: CROSS AURELIA   # the OBJECTIVE field from sensor L1
  varga:
    none: "Aurelia, Lancer. The Ascendancy's capital, on balloons."
    l1: "Ahead and both sides. Civilians lifting off: keep them safe."
    l2: "New: grown deck turrets, mirror-nosed interceptors."
    l3: "Spread and bombs for the decks. Tesla breaks the mirrors."
  notes:
    Dominant layers: '`ground` (Aurelia''s decks: Graft Turret nests, SAM Nests), `air` (Talon wings, Mirror Interceptors, Chimeras, a Gunship and a Hornet at a time, Mote Swarms, Skitter snakes; Lampreys after the turn)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: Mirrors (bounced shots); regrowing turrets; the Vrell turn (t≈100); the falling city (the last 40 s)
    Boss / mid-boss: none
    Sensor-suite detail: '**none**: Jupiter, Aurelia, `air` + `ground`, front · **L1**: + directions (sides, rear), density {density}, hazards "mirrors" and "regrowth", the objective `{objective}` and the secondary `SHUTTLES 0 / 5` · **L2**: + Mirror Interceptor (new), Graft Turret (new), Talon, Chimera, Gilded Gunship, Hornet, SAM Nest, Skitter and Mote portraits · **L3**: + `anti-ground`, `spread` and `shield-breaker` highlighted, the wave strip marking the shuttle pairs and the mirrors'' entries (the turn is not on it: the sensors do not see it coming)'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); ART-C2's city cut at these times
  - name: Aurelia's Rim
    end: 30
    atmosphere: clear
    tiles: [cloud-deck]
    notes:
      layers:
        ground: the outer decks, gilded rails, a deck edge with the first Graft Turret nest (t≈14), a SAM platform (t≈24).
        low-air: balloon cables, the first anti-grav ring.
        deep: the city's far side and its balloons.
      purpose: Popcorn and Talons; the regrowth lesson on one nest.
  - name: The Gilded Decks
    end: 70
    speed: 100
    ramp: 2   # eased from 120 over its first 2 s
    atmosphere: clear
    tiles: [cloud-deck]
    notes:
      layers:
        ground: domes and promenades, the shuttle pads (pair 1, t=44), a dome rim nest (t≈48), two deck edges either side of the pads (t≈62), the 2166 CDF locker under an awning (t≈60, the secret).
        low-air: balloons.
      purpose: The first mirrors (t=38, quiet window t=36–42); shuttle pair 1.
  - name: The Spire Plaza
    end: 100
    speed: 80
    ramp: 2   # eased from 100
    atmosphere: clear
    tiles: [cloud-deck]
    notes:
      layers:
        ground: the plaza round the great spire, its terrace nest (t≈79), pads (pair 2, t=72), SAM Nests under the spire (t≈95); teal growth thickening on the dome seams.
      purpose: Shuttle pair 2, the 2 + 2 mirrors, Varga's codes; the window before the turn.
  - name: The Turn
    end: 158
    speed: 100
    ramp: 2   # eased from 80
    atmosphere: medium   # ART-C2's `smoke` look (the game's intensities: clear, light, medium, heavy)
    tiles: [cloud-deck, smoke-wisps]
    notes:
      atmosphere: darkening, smoke
      layers:
        ground: burning decks overgrown with teal growth, a nest on a burning deck (t≈128), the last SAM platform (t≈138), the balloon deck's edge (t≈144), pads in the growth (pair 3, t=127).
        low-air/deep: Vrell and gold craft fighting, hulks falling.
      purpose: The prey links; shuttle pair 3; the rear ambush.
  - name: The Fall
    end: 200
    speed: 100   # step C4a: the README's 100 px/s through the fall (without it the scroll jumped to scroll_speed, 120, at t=158 and the halves lost their rows)
    atmosphere: medium   # ART-C2's `smoke` look (the game's intensities: clear, light, medium, heavy)
    tiles: [cloud-bands, smoke-wisps]
    notes:
      atmosphere: smoke, then open cloud
      layers:
        ground: 'the two falling halves of the deck (t=160–196: each slows, darkens, shrinks at its own rate and fades from t≈161.5 as the cloud tops close over it, t=170–197.5; round 75 F.6 redo), then none.'
        low-air: spires rising past, debris, a torn balloon.
        deep: the bands. Level end at t=200 over open cloud.
      purpose: The set piece; the last waves out of the debris; calm to the end.

