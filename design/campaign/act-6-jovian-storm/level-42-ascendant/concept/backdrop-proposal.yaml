#   # l42_props.py's `cdf-frigate` (+ `-glow` frames, `-muzzle`, `-tracer`; pivots/cdf-frigate.json: the turrets'
#   # muzzles, the engines): each in from the bottom edge over 3 s, on station ~6 s, falling back; its two turrets fire a
