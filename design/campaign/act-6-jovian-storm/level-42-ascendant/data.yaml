    hulk-a: {layer: deep, size: [96, 96]}
    hulk-a-glow: {layer: deep, size: [96, 96], frames: 8, fps: 8}
    hulk-b: {layer: deep, size: [80, 80]}
    hulk-b-glow: {layer: deep, size: [80, 80], frames: 8, fps: 8}
    home-fleet: {layer: deep, size: [192, 64]}
    home-fleet-glow: {layer: deep, size: [192, 64]}
    fleet-far: {layer: deep, size: [128, 96]}
    fleet-far-glow: {layer: deep, size: [128, 96], frames: 8, fps: 4}
    ascendant-far: {layer: deep, size: [64, 96]}
