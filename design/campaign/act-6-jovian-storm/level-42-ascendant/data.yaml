# Level 42 – Ascendant: the level script, rendered into README.md (briefing, threat profile, layout, waves, radio,
# credit budget). Times are seconds from the level start (the level clock: it halts at the arena's end while the
# Ascendant lives, its escape included, and reads 93 at ESCAPED).
# M10 part H, step H2, from the README's approved hand tables (round 72) and ART-H2's backdrop proposal
# (concept/backdrop-proposal.yaml: its backdrop block, the tender's tow and its seven sections as they are, so the tile
# sets stay cut).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M10 part H (flown from steps H1a/H1b; loaded and checked from step H2): the act boss `ascendant` (its stat
# block's bow keys), its radio subjects as `boss-phase` lines (`first-generator`, `cannon-half`, `eruption`,
# `heart-open`, `hull-breaks`, `lifeboat-away`), the closing lines on `boss-escaped` (CLOSING from ESCAPED), the music's
# `boss_track_changes` (track 19 -> 18 at the eruption) and `boss_end_sting` (the escape sting at ESCAPED), and the
# cruisers' `runs` (one flank at a time; `flak: none`, no double band).
# Step H2's own placements (decided as trivia, pending the user's review in round 80):
# - The README's six sections are ART-H2's seven (section 4 split at t=86 where Level 35's 6 s ease to the halt starts:
#   1 px/s until the arena, then the one-second arena at 0); the warning at t=88 is the boss's `incoming` (4 s) before
#   the arena's start at t=92 (Level 35's), the boss checkpoint there (none on hard).
# - The cruisers: A on the left rises at t=24, runs (solid, firing) 28-38 and falls back over 4 s; B on the right rises
#   at 40, runs 44-54, falls back by 58 (the README's "≈ 10 s on station"); the CDF frigate pair flies A's run.
# - The secondary is 104 of the waves' 159 at medium (65 %, rounded up), the Gunships' Darts counting as kills, not in
#   the requirement (the README's "112 of 171" counted them in; Level 40's rule).
# - The Skitter swarms are streams (Skitters fly no flock) but the hunters of t=14 (a snake, Level 40's), the Chimera
#   swarms on the motes' two routes; hard's Harrow cross 2 per edge (the README's 3 is beyond the Harrow's cross of
#   4-8); the Harrow stream's 5 on hard.
scroll_speed: 160     # open orbit (the arena halts it; ART-H2's sections)
launch_seconds: 5
bounty_scale: 0.63    # every bounty × 0.63: step H2's levelReport fit (the typical haul at the README's hand 0.64 +1.2 %, 0.63 on the budget), the boss's bounty recomputed at it (407)
control_prompts: []
ground: none          # air only (J2): the Bomb Rack and Rook's Mortar read NO GROUND; the Airstrike and the EMP Burst work
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Callisto orbit
  layers: [air]
  density: 5
  traits: [piercing, homing]
  hazards: [broadsides, death-burst rings]
  boss: Ascendant
  objective: STOP THE ASCENDANT   # the OBJECTIVE field from sensor L1
  varga:
    none: "Callisto orbit. Both fleets, no ground at all."
    l1: "A screen from every side. Then his flagship."
    l2: "Talons, Chimeras, Mirrors, Harrows. The Ascendant."
    l3: "Piercing for the bow, homing for the broods."
  notes:
    Dominant layers: '`air` (`space` is `air` in vacuum: the screen, the Ascendant and what it launches); `low-air` (the cruisers, invulnerable set pieces). No ground layer: the Bomb Rack and Rook''s Mortar read **`NO GROUND`** (J2: the approach keeps the fleet''s hulls on `low-air`)'
    Attack directions: '{directions} (counted by enemy; the cruisers'' broadsides cross from the flanks; in the fight the boss fires from the top and is not in the numbers)'
    Density: '{density}'
    Recommended traits: '`piercing` (the bow''s stacked parts), `homing` (the broods, the lifeboat''s weave, the Harrows); `side` opens the mirror panels from the far side'
    Hazards: "The cruisers' broadsides and point defence (t≈24–58); Harrow death-burst rings; the Mirrors' bounced shots; the Ascendant's spinal lance, fans, salvos, spore spiral, bile lobs and the lifeboat's spore wake"
    Boss / mid-boss: 'Act boss [Ascendant](../../../enemies/bosses/ascendant/README.md)'
    Sensor-suite detail: '**none**: Callisto orbit, `air` only, all directions. **L1**: + the directions, density {density}, hazards "broadsides" and "death-burst rings", the objective `{objective}`. **L2**: + Talon, Chimera, Gilded Gunship, Hornet, Mirror Interceptor, Harrow, Dart Drone, Skitter, Mote Swarm portraits; the boss''s name and silhouette (`ascendant`). **L3**: + `piercing` and `homing` highlighted; the timeline strip marks the cruisers (24 s), the Harrow cross (67 s) and the boss (92 s); 1 secret.'

sections:  # back to back from t = 0; ART-H2's seven (its proposal's times: the tile sets are cut at them)
  - name: Callisto Orbit
    end: 22
    speed: 160
    atmosphere: clear
    tiles: [orbit-start]
    notes:
      layers:
        deep: "Callisto's curve below with the citadel's lights on its night side, Jupiter's cream limb at the right edge, the CDF fleet closing from below."
      purpose: Talons, Chimeras, popcorn; the Vrell hunting Talons (t=14).
  - name: The Home Fleet
    end: 54
    speed: 160
    atmosphere: clear
    tiles: [fleet-lane]
    notes:
      layers:
        deep: "The home fleet's lights far ahead."
        low-air: '**cruiser A** on the left flank (t≈24–42), **cruiser B** on the right (t≈40–58), each overtaking from the bottom edge and falling back off it; a CDF frigate pair trading fire with cruiser A from the right flank (friendly marker); a dead home-fleet tender drifting (t≈42, the secret).'
      purpose: The broadsides; popcorn and small waves only (no medium hull beside a cruiser).
  - name: The Screen
    end: 84
    speed: 160
    atmosphere: clear
    tiles: [the-screen]
    notes:
      layers:
        deep: "The home fleet's burning hulks falling toward Callisto; the Ascendant's gold glint high ahead."
      purpose: Gunships and Darts, the Mirror pincer and rear ambush, Hornets, the Harrow cross (t=67) and stream.
  - name: The Berth Line
    end: 86
    speed: 160
    atmosphere: clear
    tiles: [berth-line]
    notes:
      layers:
        deep: "The Ascendant's drive glow growing over its glint."
      purpose: The last wave has entered (t=83); a CDF supply drone's armour patch (t=85).
  - name: "The Berth Line, braking"
    end: 92
    speed: 1
    ramp: 6   # eased from 160 down to 1 px/s over [86, 92] (Level 35's halt: the simulation allows a timed halt of speed 0 only with a defend primary), then the arena's 1 s ease to rest
    atmosphere: clear
    tiles: [berth-brake]
    notes:
      layers:
        deep: "The drive glow swinging away as the Ascendant comes about."
      purpose: The pre-boss pause (t≈86–92); the boss warning at t=88 (the checkpoint there).
  - name: The Ascendant
    end: 93   # the arena: the level clock halts here while the Ascendant lives, its escape included; ESCAPED resumes it at once (no hold_after_boss: the hull's break and the escape are in the fight)
    speed: 0
    arena: true
    atmosphere: clear
    tiles: [arena]
    notes:
      layers:
        air: 'the hull filling the top of the field, bow-on ([arena](../../../enemies/bosses/ascendant/README.md#arena)).'
        deep: "Callisto's curve, the fleets."
      purpose: 'The boss fight (≈ 150 s at medium with the escape); the scroll halted and the clock stopped until `ESCAPED`.'
  - name: The Empty Orbit
    end: 113   # E+20: the closing queue's last line (Okafor's) ends ≈ E+18.7 by the radio's text model
    speed: 60
    ramp: 2   # eased up from the halt over 2 s
    atmosphere: clear
    tiles: [empty-orbit]
    notes:
      layers:
        deep: "The CDF fleet's lights closing in; the gate's bearing marked by the lifeboat's last flash."
        air: "The wreck's two halves drifting out of the field's sides, burning at the breaches. No enemies."
      purpose: The closing lines (E+2 to ≈ E+18.7); the level ends at t=113 (E+20).

boss:  # the act boss: the warning (track 22) 4 s before the arena's start, then the bar and the boss checkpoint (none on hard); the hull slides in bow-first over ≈ 6 s, invulnerable until in place
  enemy: ascendant
  t: 92
  x: 240
  section: 6
  incoming: 4   # the warning box, the klaxon and the warning track open at t=88 with the scroll's last slowing, before the hull shows (the Act 5 lesson); a retry from the boss checkpoint warns at the arrival
  notes:
    from: 'top (the bow slides in from the top edge; it hangs there, bow-on)'
    waves: 'At the arena''s start: the bar and the checkpoint; the Darts and Chimeras it launches as in its spec; no other waves in the arena'
    spawns: {dart-drone: 32, chimera: 16}   # the README's expected launches: the typical haul's count (step H3 measures them)

tows:  # the dead home-fleet tender (the secret): drifting down the field's right half; the strongbox's housing takes 4 hits and frees the crate (Level 30's buoy rule); `beam_touch`: a beam's touch counts a hit per 0.25 s. ART-H2's sprites (TowLooks draws the tender's hull beside it: step H4a)
  - {t: 42, x: 330, drift: [-3, -80], boat: [24, 24], pod: [18, 18], tether: [0, 0], cable: [22, 22], hits: 4, reveals: "The home-fleet tender's strongbox", beam_touch: true}

cruisers:  # the home fleet's cruisers (Level 28's Regent class, its built set piece): invulnerable `low-air` hulls on one flank at a time, no name or bar, paying nothing; broadside every 3.5 s after a 1.2 s tell (its band on the ship's y, then a random one, in turn; never two bands), point defence bursts of 3 every 2.5 s; no flak
  runs:
    - {flank: left, rise: 24, run: 28, end: 38, fall: 4, frigates: true}   # cruiser A; the CDF frigate pair trades fire with it from the right flank (friendly marker)
    - {flank: right, rise: 40, run: 44, end: 54, fall: 4}                  # cruiser B
  hull: [220, 640]
  inner: [110, 370]   # the left hull's inner (right) edge, the right hull's inner (left) edge
  broadside: {band: 70, tell: 1.2, shells: 7, speed: 260, bullet: medium, every: 3.5, free: 100}
  flak: none
  point_defence: {burst: 3, speed: 170, bullet: small, every: 2.5, turrets: [440, 270, 100]}
  easy: {tell: 1.5, every: 4.5}
  hard: {every: 3.0}

