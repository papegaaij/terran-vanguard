ground_targets: []   # none: no ground layer (J2); the citadel is `deep` scenery, the cruisers `low-air` set pieces, the Ascendant an `air` boss

secrets:
  - name: "The home-fleet tender's strongbox"
    crate: 100   # Act 1 terms: pays 1,049 with the act factor (a home-fleet supply tender the Vrell boarded and picked clean)
    radio: {speaker: Okafor, line: "A home-fleet tender. The Vrell took its crew, not its strongbox. Take it."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 27, enemy: talon, unit: first}}   # the t=27 wing's leader
  - {pickup: shield cell, dropped_by: {wave: 54.5, enemy: gilded-gunship, unit: last}}   # the t=54.5 column's last Gunship (the second at medium)

drops:  # a CDF supply drone (a small white craft on low-air, marked friendly) releases an armour patch in the pre-boss pause; the eruption drops the second (the boss's phase)
  - {t: 85, x: 240, y: 380, pickup: armour patch, sprite: supply-drone, marked: true}

radio:  # trigger: t or event; the README's lines (the 1 s rule: ≈ 12 characters a second, a 1.5 s lead, event lines dropped after 6 s; the secret's line is the secret's own). Rook's lines need him flying (requires: escort). Vorne on the enemy channel, the Choir on its own; the fight's lines are events (`boss-arrival`, `boss-phase` subjects), queued as phase lines (they wait for a gap, stale after 20 s, dropped at the escape); the closing lines are CLOSING lines in order from ESCAPED (`boss-escaped`; `delay` counts from E, a line waits behind the one before it; the debrief waits for the last)
  - {t: 1, speaker: Okafor, line: "Callisto orbit. Everything Vorne has left is between us and the Ascendant. Break through, Lancer."}
  - {t: 12, speaker: Varga, line: "Hybrids and Talons in his screen, and the Vrell are hunting both. Let them."}
  - {t: 21.5, speaker: Okafor, line: "Home-fleet cruisers on your flanks. Watch the gun ports: broadsides."}
  - {t: 31, speaker: Rook, requires: escort, line: "Seen these at Europa. They still can't hit a moving target."}
  - {t: 55, speaker: Varga, line: "Mirror interceptors. Flank them, burn the mirror, or break it with the Tesla."}
  - {t: 63.5, speaker: Okafor, line: "Bursters from every side! Thin them far out."}
  - {t: 73, speaker: Rook, requires: escort, line: "Vorne's flagship is breaking orbit. If we're doing this, it's now."}
  - {t: 80.5, speaker: Okafor, line: "The Ascendant is coming about. All Aegis units: everything you have."}
  - {event: boss-arrival, speaker: Vorne, channel: enemy, expression: smug, line: "The Ascendant, Lancer. Helix built her, the Vrell grew her, and I command her. You should have named your price.", notes: {trigger: "The hull in place (`boss-arrival`), the enemy channel: the boss document's line 1"}}
  - {event: boss-arrival, speaker: Varga, line: "Generators feed the bow shield. The batteries hide behind mirrors: hit them from the far side.", notes: {trigger: "After it (`PHASE`)"}}
  - {event: boss-phase, phase: first-generator, speaker: Vorne, channel: enemy, line: "Okafor sends you in alone again. She spent Aurelia's people the same way, once.", notes: {trigger: "The first generator destroyed, or 25 s into phase 1 (`boss-phase`): line 2"}}
  - {event: boss-phase, phase: first-generator, speaker: Okafor, line: "Aurelia asked us for help, Vorne. We came. You never did.", notes: {trigger: "After it (`PHASE`)"}}
  - {event: boss-phase, phase: cannon-half, speaker: Vorne, channel: enemy, line: "You fight well for a hired gun. It changes nothing. The door is open, and I hold the key.", notes: {trigger: "The bow cannon below half (`boss-phase`): line 3"}}
  - {event: boss-phase, phase: cannon-half, speaker: Rook, requires: escort, line: "He talks a lot for a man in a gold box.", notes: {trigger: "After it (`PHASE`)"}}
  - {event: boss-phase, phase: eruption, speaker: The Choir, distorted: true, duck_db: 6, line: "…the one who opened… is inside us now… he was always inside us…", notes: {trigger: "The eruption, its first second (`boss-phase`): line 4, the Choir's own channel"}}
  - {event: boss-phase, phase: eruption, speaker: Vorne, channel: enemy, expression: rage, shout: true, line: "No! We had an agreement!", notes: {trigger: "Right after it: line 5, **shouted** (the voice check's one exception)"}}
  - {event: boss-phase, phase: eruption, speaker: Varga, line: "The Vrell half is waking! The sacs heal: hold your fire on one until it bursts.", notes: {trigger: "After it (`PHASE`)"}}
  - {event: boss-phase, phase: heart-open, speaker: Varga, line: "Two sacs down. The heart is open!", notes: {trigger: "The heart opens, two sacs dead (`boss-phase`)"}}
  - {event: boss-phase, phase: hull-breaks, delay: 0.5, speaker: Okafor, line: "She's breaking up!", notes: {trigger: "The hull breaks, K (`boss-phase`, `delay: 0.5`)"}}
  - {event: boss-phase, phase: lifeboat-away, delay: 1, speaker: Vorne, channel: enemy, line: "A misunderstanding. They still need me; someone must open the way. The gate, then. Goodbye, Lancer.", notes: {trigger: "K + 4 s, the lifeboat away (`boss-phase` at the breakout K+3, `delay: 1`): line 6, cold again"}}
  - {event: boss-escaped, delay: 2, speaker: Varga, line: "He's past our reach, heading for the Tether Gate. The Choir won't keep his deal.", notes: {trigger: "`ESCAPED` (E, `CLOSING`, `delay: 2`)"}}
  - {event: boss-escaped, speaker: Rook, requires: escort, line: "He ran. After all that, he just ran.", notes: {trigger: "Then (`CLOSING`, with Rook)"}}
  - {event: boss-escaped, speaker: Okafor, line: "Then we follow him.", notes: {trigger: "Then (`CLOSING`), ≥ 4 s after E: line 7, the level's and the act's last voice"}}

objectives:
  primary: reach-end   # with the arena as its condition (Levels 21, 28 and 35): the level ends when the Ascendant's fight is over (ESCAPED) and the closing lines have played; the line reads the boss's name (threat_profile.objective)
  secondary: {kill_ratio: 0.65, boss_counted: false, credits: 100, name: Clear the orbit}   # at least 65 % of the level's planned units (the waves' 159 at medium: 104; the Gunships' Darts count as kills, not in the requirement; the Ascendant, its launches and the Vrell's prey kills not counted), judged at the end; no radio line (100 in Act 1 terms: pays 1,049)

music:
  track: 15           # Act 6 B "Storm Wall" (audio/music track list)
  start_section: 1    # the base stem in Callisto orbit
  full_section: 2     # the full mix from the home fleet (t=22)
  motif: {from: 0, to: 86, sections: {}}   # Vorne's motif on (his home fleet), out at the halt
  stem_times:         # out at the halt (t=86-88), into the boss warning
    - {t: 86, stems: none, db: -40, fade: 2}
  ambience: belt-open   # open space heard through the hull (Act 5's)
  end_jingle: mission-complete
  boss_warning: boss-warning      # track 22 with the klaxon and the banner at t=88 (the boss's `incoming`), before the hull shows
  boss_track: iron-sovereign      # track 19 "Iron Sovereign" (the Ascendancy boss theme) after the warning, through phase 1
  boss_track_changes:
    - {on: eruption, track: choir-descends, fade: 2}   # track 18 "The Choir Descends" by a 2 s crossfade at the eruption (M.3 a), its intro under the Choir and the shout with the radio's duck
  boss_end_sting: escape-sting    # track 33 cuts track 18 at ESCAPED; then the belt-open bed alone under the closing lines (Vorne's motif gone with him)

difficulty: {}  # the stat blocks' hooks apply (the Ascendant's easy and hard rests, line, bursts, arc, spiral, regeneration, brood and climb; the Talon's, the Chimera's, the Gunship's, the Hornet's, the Mirror Interceptor's, the Harrow's); the cruisers' easy and hard broadsides are their own (`cruisers.easy`, `hard`); the Gunship, Hornet, Mirror and Harrow waves pinned on easy and hard; the formation lever sizes the rest

briefing:
  pages:   # the approved texts as they are (BriefingLayoutTest: 4 lines a page)
    - {speaker: Okafor, image: level-42-callisto-orbit, line: "Vorne is aboard the Ascendant, in Callisto orbit, behind what is left of his home fleet. Break the screen, then break his ship. He does not leave orbit, Lancer."}
    - {speaker: Varga, image: level-42-ascendant-files, line: "From his own files: the Ascendant is half warship, half Vrell. Generators feed the bow's shield, mirrors cover the batteries. If the Vrell half wakes, its sacs heal: burn them steadily."}
  teaser: {speaker: Okafor, line: "This is where Vorne makes his stand. Fit for one big target and everything it launches."}

backdrop:
  # Presentation only: Level 42's Callisto orbit (tools/art/backdrop_l42.py, step ART-H2: its proposal's block as it is;
  # the sections above at its times). No ground (`ground: none`): the deep layer is the base, scrolling at 0.06 (the
  # bodies drift). Its tile sets are cut from one continuous field at the rows each section's tiles begin
  # (LevelData.seam): re-run the generator after moving a section. The pieces draw in the placements' order (the hulks
  # before the curve, so they fall behind Callisto's limb); the -glow pieces are additive at their piece's placements, at
  # most two animated on the screen at once (checked). Every path before the arena ends by t=92 (the fight moves
  # nothing); the paths after it start at 93.05 (the clock reads 93 at ESCAPED: they keep the level clock). Step H2: the
  # proposal's five exits off the screen (the hulks out of the bottom, the glint, the drive glow and the gate flash out
  # of the top) slowed to 120 px/s (2 px a frame) until each is out of sight, then re-parked in one 0.05 s step.
  scroll_factors: {deep: 0.06, far: 0.3, ground: 1, low-air: 1.3, high-air: 1.7}   # far, ground, high-air unused
  ramp: 2
  haze_colour: 03040a
  atmosphere:
    clear: {haze: 0.0}   # vacuum: no haze, no wisps
  tile_sets:
    orbit-start: {layer: deep, height: 960}   # section 1: Callisto Orbit
    fleet-lane: {layer: deep, height: 480}   # section 2: The Home Fleet
    the-screen: {layer: deep, height: 448}   # section 3: The Screen
    berth-line: {layer: deep, height: 192}   # section 4: The Berth Line
    berth-brake: {layer: deep, height: 192}   # section 5: The Berth Line, braking
    arena: {layer: deep, height: 192}   # section 6: The Ascendant
    empty-orbit: {layer: deep, height: 256}   # section 7: The Empty Orbit
