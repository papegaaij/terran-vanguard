# Level 41 – Callisto Fortress: the level script, rendered into README.md (briefing, threat profile, layout, waves,
# ground targets, radio, credit budget). Times are seconds on the level clock from the level start: in a halt the clock
# stands while the gate holds (its halt cycle and its lines run on the halt's own time). M10 part G, step G2, from the
# README's approved hand tables (round 72) and ART-G2's backdrop proposal (concept/backdrop-proposal.yaml: its backdrop
# block, sections, gate layouts, ground placements, roads and objects as they are).
# Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M10 part G (flown from steps G1a/G1b; loaded and checked from step G2): a held section's `holds` naming the
# level's held set piece (the Halo Platform, `boss.kind: held`: no bar, warning or boss music; its checkpoint the gate's
# halt, none on hard), a held section's own `halt_cycle` (Level 29's `halt_waves` per gate), a destructible's `uplink`
# (an archive core's hatch: Varga's spike, the ship's centre within `radius` px for `seconds` in total), the secondary's
# `files` and the radio events `halt` (`subject`: gate-n or the piece's slug), `file` (`subject`: the count) and
# `halo-destroyed`, with `stale: never` (the Silence line: Level 21's CLOSING rule mid-level).
# Step G2's own placements (decided as trivia, pending the user's review in round 79): the sections as ART-G2's (a
# moving section's 2 s ease included, so Gate One halts at scroll 5,460, the README's 5,440 without the ease: the
# backdrop needs no rerun); the pylons asleep until a step before their gate's end (Level 29's clamp-gun rule: the
# clock stands there); the Halo arriving at 113.98 (the same step); the Warden pairs entering ≈ 3 s before their gate
# and parking in the gateway by its halt (their roads' last stretch; walker waves, Level 34's), the causeway pair and
# the ring-road convoy walking their roads off the screen; easy's dropped pylon per gate: Gate Two's and Gate Three's
# bastion pylon (C) and its dome; the CDF beacon's drop without the friendly marker (a ground beacon, no craft); the
# vault 36×36 (ART-G1's frame); the overdrive from the t=83 column's last Gunship (the second; hard's third); the
# shield cell from the t=58.5 wing's leader; the leaders on the nine moving V-wings (a halt cycle's waves have none:
# the README's 11 counted the cycles' two V-wings).
scroll_speed: 120     # the fortress; the ice field and HQ's run 140, the halts 0
launch_seconds: 5
bounty_scale: 0.30    # every bounty × 0.30: the README's hand estimate (typical −1.2 %; levelReport's fit below)
control_prompts: []
medium: vacuum        # Callisto: short flashes, debris rings, wrecks do not burn (design/world/belt, vacuum rules)
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Callisto, the citadel
  layers: [ground, air]
  density: 5
  traits: [anti-ground, area]
  hazards: [rail lines, dome gates]
  boss: none
  objective: BREAK THE GATES   # the OBJECTIVE field from sensor L1
  varga:
    none: "Callisto's citadel. Ground and air, all front."
    l1: "Three gates held by pylons. Then the Halo."
    l2: "Pylons, the Halo, Wardens, Rail Bunkers, Towers."
    l3: "Anti-ground and area for the gates and the Halo."
  notes:
    Dominant layers: '`ground` (the pylons, the Halo Platform, Warden Tanks, Rail Bunkers, Sentinel Towers, SAM Nests, Graft Turrets on the citadel''s decks), `air` (Talons, Chimeras, Gilded Gunships and their Darts, Hornets, the Vrell''s Lampreys and popcorn)'
    Attack directions: '{directions} (the ground''s fire from every side as the ship passes)'
    Density: '{density}'
    Recommended traits: '`anti-ground` (the gates, the hardened Rail Bunkers, the Halo), `area` (the guns under a dropped dome, the Halo''s ring); `piercing` helps on the Halo''s ring'
    Hazards: Rail lines (the Rail Bunkers and the Halo's rail turrets), Sentinel sweeps, SAM homing diamonds; the domes (no damage, they protect)
    Boss / mid-boss: none (the Halo Platform is a held set piece, not a boss)
    Sensor-suite detail: '**none**: Callisto, the citadel, `ground` and `air`, front. **L1**: + density {density}, hazards "rail lines" and "dome gates", the objective `{objective}`, the secondary `FILES`. **L2**: + Shield Pylon, Halo Platform, Warden Tank, Rail Bunker, Sentinel Tower, SAM Nest, Graft Turret, Talon, Chimera, Gilded Gunship, Hornet portraits. **L3**: + `anti-ground` and `area` highlighted; the timeline strip marks the three gates (42, 74, 98 s) and the Halo (112 s); 1 secret.'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); the four halts held gates (ART-G2's sections)
  - name: The Ice Field
    end: 20
    speed: 140
    atmosphere: clear
    tiles: [berth-depth]
    notes:
      layers:
        ground: "Callisto's cratered ice from t = 0, a crater-rim outpost (t≈8), the outer causeway's gatehouse (t≈15)."
      purpose: Talons, Chimeras and popcorn; the first SAM group and a Graft nest.
  - name: The Outer Causeways
    end: 42
    speed: 120
    ramp: 2
    atmosphere: clear
    tiles: [berth-depth]
    notes:
      layers:
        ground: two causeways across a crevasse field to the citadel's outer wall; a Sentinel Tower on the wall (t≈32).
      purpose: Warden Tanks on the causeways; the Lampreys on the Gunships; the first gate ahead.
  - name: Gate One
    end: 44
    speed: 0
    arena: true
    holds: gate-1   # the held gate: the clock stands while a pylon of gate-1 stands
    atmosphere: clear
    tiles: [berth-depth]
    halt_cycle:  # from the halt's start H, every 13 s while a pylon stands, cut at the last one's fall (a wave in flight flies on)
      every: 13
      typical: 8   # s: the README's typical halt (≈ 8 s): the density and the typical haul count the waves before it
      waves:
        - t: 1
          formation: swarm
          enemy: mote-swarm
          count: 6
          from: front
          speed: 200
          paths: [[[80, -60], [100, 160], [280, 260], [390, 170], [320, 60], [150, 120], [110, 320], [260, 440], [380, 620]]]
          notes: Halt cycle
        - {t: 5, formation: line abreast, enemy: talon, count: 4, from: front, skip: [easy], notes: "Halt cycle; not on easy"}
        - {t: 9, formation: swarm, enemy: chimera, count: 6, from: front, paths: [[[240, -60], [200, 140], [280, 260], [200, 380], [260, 480], [240, 620]]], notes: "Halt cycle (the typical halt ends ≈ H+8)"}
        - {t: 11, formation: line abreast, enemy: talon, count: 4, from: front, skip: [easy, medium], notes: "Halt cycle, hard only"}
    notes:
      layers:
        ground: "the outer gate: two pylons on its towers, their domes over a Warden pair in the gateway and a SAM group on the right bastion; archive core A in the courtyard at (240, 400)."
      purpose: The first halt (≈ 8 s); the first file.
  - name: The Hangar Decks
    end: 74
    speed: 120
    ramp: 2
    atmosphere: clear
    tiles: [berth-depth]
    notes:
      layers:
        ground: "hangar roofs and launch decks, open bays with parked Talons (scenery), Rail Bunker pairs (t≈50, 70), a Graft nest (t≈58), a SAM group (t≈64)."
      purpose: Hardened bunkers and regrowing turrets.
  - name: Gate Two
