  start_section: 1    # the base stem on the ice field
  full_section: 2     # the full mix from the causeways (t=20), held through the halts
  motif: {from: 0, sections: {}, to: 116}   # Vorne's motif on (his headquarters) until the Silence line (the clock resumes at 114 as the Halo dies, the line 2 s later): his secret is out, the motif stem out to the end
  ambience: callisto-fortress   # the bed heard through the hull (round 72 b)
  ambience_layers:
    - {ambience: fortress-machinery, from: 20, to: 146, fade_in: 3, fade_out: 3}   # deep hums, door servos, distant klaxons in sections 2-10 (round 79 a)
