    holds: halo-platform   # the held set piece: the clock stands while its core lives; its checkpoint here (none on hard)
    atmosphere: clear
    tiles: [berth-depth]
    halt_cycle:  # every 17 s from H (the platform is the threat: a lighter cycle)
