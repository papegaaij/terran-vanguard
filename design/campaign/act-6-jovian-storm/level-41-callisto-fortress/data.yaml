    end: 146
    speed: 140
    ramp: 2
    atmosphere: clear
    tiles: [berth-depth]
    notes:
      layers:
        ground: "HQ's roofs and comm masts, a Rail Bunker pair (t≈120), a SAM group (t≈126), a Sentinel Tower (t≈132), a Graft nest (t≈138), then the dock: the Ascendant's **empty berth**, its clamps open, its gold drive glow climbing away in the `deep` layer."
      deep: the drive glow through the empty berth's well (t≈141–146)
      purpose: The run to the dock; the level ends at t=146 over the empty berth.

