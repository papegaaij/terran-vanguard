title_card:  # over the act's still (ui/act-6-jovian-storm-still.png, tools/art/act_stills.py act-6 from Level 36's backdrop): Jupiter's cream and ochre bands from above the cloud decks, the fleet's lights on the curve, a far gold glint where Aurelia hangs; its chrome lettering ui/act-6-jovian-storm-title.png (tools/art/act_titles.py)
  act: ACT VI
  name: JOVIAN STORM
  line: Jupiter · September 2185

briefing:  # three pages by Commander Okafor, one by Chairman Vorne on the enemy channel (approved in round 72), each voiced and with its image (tools/art/briefing_images.py)
  - {speaker: Okafor, expression: grim, image: act-6-jupiter, line: "Aegis, Okafor, from the bridge of the Steadfast. Three weeks out of Ceres, and Jupiter fills every window. The whole fleet is here. So is everything Vorne has left."}
  - {speaker: Okafor, image: act-6-the-plan, line: "Callisto sits behind his home fleet and Aurelia's air-defence grid, and that fleet burns helium-3 from the cloud harvesters and Io's refineries. So we break his grid, take the storm road to Io and burn his fuel. Then Callisto."}
  - {speaker: Vorne, channel: enemy, music: motif, image: act-6-invitation, line: "Commander Okafor. Welcome to Jupiter. Do come to Aurelia; you know the way. You visited it once before, I believe, in sixty-six. The city still remembers you."}
  - {speaker: Okafor, expression: fierce, image: act-6-every-channel, line: "All channels. Vorne, this is Okafor. I was at Aurelia. I remember. So will you. Aegis: you dive first. Mission briefing follows. Aegis Actual out."}

