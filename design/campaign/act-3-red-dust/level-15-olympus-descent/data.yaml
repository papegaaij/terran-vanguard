    # 3. the basalt outcrop under the turret nest
    - {piece: basalt-outcrop, t: 94.28, x: 160}
    # 4. Lycus Survey Station: the road (the Creeper convoy enters at x 300), two pairs of pads (two turrets each), the hab (two mortars on its roof)
    - {piece: lycus-road, t: 121.27, x: 300}
    - {piece: lycus-pads, t: 120.157, x: 125}
    - {piece: lycus-pads, t: 126.157, x: 355}
    - {piece: lycus-hab, t: 123.153, x: 250}
