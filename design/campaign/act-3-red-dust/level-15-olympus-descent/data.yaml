  track: 8            # Act 3 A "Red Dust Run" (audio/music track list)
  start_section: 2    # the base stem from the Cloud Deck; section 1 has the entry roar only
  full_section: 3     # the full mix from the slopes, the Burrower's first sight
  ambience: mars-entry    # the high thin entry roar in sections 1-2 (step AUD-B proposes it)
  ambience_changes:
    - {section: 3, ambience: mars-dust, crossfade: 2}   # the Martian dust wind from the slopes on
  end_jingle: mission-complete

difficulty:  # the easy line abreasts are entries of their own, the convoy's hard 4 and the fields' sizes come from the formation lever, the rubble's hard hits and the hard rail-line pair are in their entries; the stat blocks' hooks apply (the Burrower's easy ring of 8 and 2.4 s window, hard ring of 12, second ring of 8 and 1.8 s window; the Kite's hard swoop at 230 px/s)
  easy:
    extra_pickups:
      - {pickup: armour patch, dropped_by: {group: containers, unit: last}}   # the station's last container

briefing:
  pages:
    - {speaker: Okafor, image: level-15-descent-route, line: "The Vrell own the sky over Ares Landing, so we come in from the west: down the flank of Olympus Mons and across the dunes to the colony rail line. They have held five weeks alone. Don't keep them waiting."}
    - {speaker: Varga, image: level-15-burrower-scan, line: "The colonists call them Burrowers. They swim under the sand, surface to fire, then dive. Nothing touches them underground. The sand bulges just before one comes up: shoot there."}
  teaser: {speaker: Rook, line: "Mars. Red sand, red sky, and bugs that swim in the dirt. There's a beam gun in the shop, if you're feeling rich."}

backdrop:
  # Presentation only: Olympus Descent (tools/art/backdrop_l15.py, from mars-olympus-r36-a and parallax r02-c).
  # Sections 1-2 have no ground: Mars far below on deep (x0.15), the cloud decks on low-air and high-air; the
  # ground takes over under the opaque deck-close; the escarpment's cliff and the rail pylons are towers.
  scroll_factors: {deep: 0.15, far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}
  ramp: 4
  haze_colour: d6a670  # the butterscotch sky (mars_r36.SKY)
  atmosphere:
    clear: {wisps: entry-streaks, haze: 0.34}   # the entry-glow peak 0-8: the plasma streaks, the surface washed out
    light: {banks: dust-thin, haze: 0.2}   # sections 1, 3-5: thin dust veils
    medium: {banks: deck-banks, haze: 0.26}   # section 2: the water-ice deck in banks ~30 %, opaque cores
    heavy: {banks: dust-peak, haze: 0.3}   # the dust peak 170-180: rolling dust banks ~30 %, translucent
  tile_sets:
    mars-high: {layer: deep, height: 960}   # section 1: Mars from high up, the Tharsis plain small (dark lava lobes, crater fields with wind streaks, graben)
    mars-flank: {layer: deep, height: 960}   # sections 2-5: Olympus Mons' flank closer: leveed lava channels and lobate flows along the flight (under the ground from section 3)
    slopes: {layer: ground, height: 960}   # section 3: the lower flank: stepped lava terraces, basalt knobs, dusty regolith fields with burrow furrows
    escarpment: {layer: ground, height: 960}   # section 4: the foot of the Lycus escarpment: regolith, scree fans and boulders toward the cliff on the right
    dunes: {layer: ground, height: 960}   # section 5: the Tharsis dune sea, crests across the wind from the left, dark sand in the troughs
    cirrus: {layer: high-air, height: 960}   # sections 1-2: thin water-ice cirrus (additive at 40 %); empty where it ends at section 3's seam
    entry-streaks: {layer: high-air, height: 960}   # the `clear` look's wisps: the entry's plasma streaks and glow (the entry-glow peak 0-8, faded by the ramp)
    deck-banks: {layer: low-air, height: 960, drift: 5}   # medium: the thick water-ice deck in banks, ~30 %, opaque cores, pale peach tops, mauve undersides
    dust-thin: {layer: low-air, height: 960, drift: 8}   # light: thin dust veils stretched along the wind, ~14 %, at most 35 % opaque
    dust-streaks: {layer: low-air, height: 960, drift: 12}   # section 5: dust streaks blown off the dune crests, ~12 %, translucent; empty where section 5 begins
    dust-peak: {layer: low-air, height: 960, drift: 16}   # heavy: the dust peak's rolling banks, ~30 %, at most 55 % opaque (the Burrowers' bulges read under them)
  pieces:
    olympus: {layer: deep, size: [440, 440]}   # Olympus Mons from the entry corridor: the caldera's nested pits, the radial flank, the basal scarp (edges transparent)
    mars-blend: {layer: deep, size: [480, 400]}   # on the deep seam of section 2: mars-high into mars-flank along a lava margin (exact rows)
    slopes-lead: {layer: ground, size: [480, 658]}   # the slopes continued below section 3's seam: the ground's opaque edge (the swap line) crosses the screen under deck-close (exact rows)
    seam-escarpment: {layer: ground, size: [480, 320]}   # on section 4's seam: the slopes into the escarpment's regolith along a lava front (exact rows)
    seam-dunes: {layer: ground, size: [480, 320]}   # on section 5's seam: the escarpment's regolith into the dune sea (exact rows)
    lava-terrace: {layer: ground, size: [480, 300], mid_size: true}   # a raised lava terrace across the flank, flat top, lobate front: the two mortars stand on it
    basalt-outcrop: {layer: ground, size: [208, 160], mid_size: true}   # a basalt outcrop, knobs round a flat top: the turret nest of three
    lycus-pads: {layer: ground, size: [160, 176], mid_size: true}   # a pair of Lycus Survey Station's landing pads, overrun: scorched concrete, Vrell growth with teal veins (two turrets; placed twice)
    lycus-hab: {layer: ground, size: [152, 152], mid_size: true}   # the station's domed hab drawn flat (a low dome): ribs, airlock, panels, growth (two mortars on its roof)
    lycus-road: {layer: ground, size: [112, 601]}   # the station's graded road with tyre ruts and Vrell growths along it (the Creeper convoy)
    drop-pod-ledge: {layer: ground, size: [136, 120]}   # the ledge at the cliff's foot the rubble lies on: a rock shelf, the pod's impact furrow
    crashed-lander: {layer: ground, size: [216, 176], mid_size: true}   # a crashed colony lander on a dune crest, a leg folded, sand drifted against it (the nest of three)
    rail-line: {layer: ground, size: [480, 104]}   # the colony rail line across the field on its embankment, sleepers, cable trough
    escarpment-cliff: {layer: ground, size: [96, 1600], tower: {height: 1.2, wall: wall-escarpment, shade: 0.55}}   # the great cliff along the right edge in perspective (scenery: nothing gameplay touches): the plateau's rim, strata on its face
    rail-pylon: {layer: ground, size: [14, 14], tower: {height: 0.9, wall: wall-pylon, shade: 0.5}}   # a rail line's catenary pylon in perspective
    deck-close: {layer: low-air, size: [480, 1360]}   # the opaque close-over: the deck covers the whole field ~2 s round t=63 while the ground takes over (1,000 px core)
    transport: {layer: high-air, size: [400, 660]}   # the Mars transport passing over the launch, its drop bay open (ART-B proposes the piece key overhead_pass, 75 % normal blending: new for steps B3/B4; additive at 40 % until then)
  placed:
    # 1. Olympus Mons under the entry corridor (deep x0.15: on screen the whole section)
