    radio: {speaker: Ares Control, portrait: generic-colonial, line: "Our supply drop from last week. It's yours, Aegis."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 38.5, unit: first}}       # the leader of the t=38.5 Stinger V-wing
  - {pickup: armour patch, dropped_by: {wave: 128.5, unit: last}}    # the last Stinger of the t=128.5 V-wing

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected)
  - {t: 1, speaker: Okafor, line: "Aegis, you're clear of the transport. The corridor is hot. Weapons free."}
  - {t: 12, speaker: Ares Control, portrait: generic-colonial, line: "Aegis flight, Ares Landing. Five weeks we held alone. Nice of Earth to drop by."}
  - {t: 23.5, speaker: Rook, requires: escort, line: "Copy, Lancer. I'm on your {side}. Watch the clouds, things are hiding in them."}
  - {t: 34.5, speaker: Varga, line: "Those kites ride the dust. You barely see them until they turn. Shoot early."}
  - {t: 45.5, speaker: Okafor, line: "Clouds are breaking up. Olympus Mons dead ahead, all twenty-two kilometres of it."}
  - {t: 57, speaker: Varga, line: "Ground movement on the slopes. Something is swimming under the sand."}
  - {event: first-surfacing, speaker: Varga, line: "There! The sand bulges before it comes up. Hit it while it's out.", notes: {trigger: "First Burrower surfaces (`first-surfacing`)"}}
  - {t: 84, speaker: Ares Control, portrait: generic-colonial, line: "Those things took our survey posts. Lycus Station went dark a week ago."}
  - {t: 100, speaker: Rook, requires: escort, line: "Bugs that swim in the dirt. Back home we just had moles."}
  - {t: 110, speaker: Okafor, line: "Lycus Station ahead. The growths on its pads are Vrell. Burn them off."}
  - {t: 142, speaker: The Choir, distorted: true, line: "[the Choir sings]"}
  - {t: 149.5, speaker: Varga, line: "That song again. Lancer, it's coming from under the ground."}
  - {t: 158.5, speaker: Ares Control, portrait: generic-colonial, line: "Rail line in sight. Half the colony is watching you come in."}
  - {t: 168, speaker: Okafor, line: "Big contact under the dunes. Lots of them. Keep moving."}
  - {event: secondary-objective, speaker: Ares Control, portrait: generic-colonial, line: "The slopes are quiet. Maybe Earth can fly after all.", notes: {trigger: Secondary met (at the level end)}}
  - {event: level-end, speaker: Okafor, line: "You're down, Aegis. Refuel at the rail head. The canyon run starts at dawn."}

objectives:
