# Level 15 – Olympus Descent: the level script, rendered into README.md (briefing, threat profile, layout,
# waves, ground targets, radio, credit budget). Times are seconds from the level start. M7 part B, step B2,
# from the README's approved hand tables (round 36). Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M7 part B, flown by the simulation since step B3: the sections' moving `ramp` (each speed change
# eased over 1 s), `launch: drop`, `no_surface` and the Burrower's and the Dust Kite's own blocks (their stat blocks).
# The `backdrop` block and the sections' tiles, atmospheres and peaks are step ART-B's proposal
# (concept/backdrop-proposal.yaml, tools/art/backdrop_l15.py --proposal), merged in step B2.
scroll_speed: 150     # the slopes and the escarpment; the entry, the deck and the dunes set their own
launch_seconds: 5     # the ship and Rook drop from the transport's bay in formation
launch: drop          # default pending the user's review in round 38: from above the top edge, not the bottom
bounty_scale: 0.26    # every bounty × 0.26: the typical haul on budget(15) (TypicalHaulTest, step PE15: typical 1,796, -0.5 %)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Mars, Olympus Mons
  layers: [ground, buried, air]
  density: 3
  traits: [anti-ground, forward]
  hazards: []
  boss: none
  objective: REACH THE RAIL LINE   # the OBJECTIVE field from sensor L1
  varga:
    none: Mars, Lancer. A hot descent, then the slopes of Olympus Mons. Something lives in the sand.
    l1: Nearly all from ahead, two pincers from the flanks. Nothing behind you.
    l2: "New: Burrowers under the sand, and dust kites in the clouds."
    l3: Anti-ground for the Burrowers. One cache on the escarpment.
  notes:
    Dominant layers: '`ground` (Burrowers when surfaced, Ravager packs, a Creeper convoy, turret nests and mortars), `buried` (Burrowers under the sand: nothing hits them), `air`; `high-air` and `low-air` carry the cloud decks (scenery)'
    Attack directions: '{directions} (two Needler pincers)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: none (no terrain collision; the Burrowers' rings are their attack)
    Boss / mid-boss: none (finale the dune field of six Burrowers under a Kite V-wing)
    Sensor-suite detail: 'none: Mars, entry and the slopes of Olympus Mons, `ground` + `air`, front · L1: + directions, density {density}, no hazards, the objective `{objective}` · L2: + Burrower (new), Dust Kite (new), Skitter, Needler, Stinger, Spore Bomber, Ravager and Creeper portraits; no boss · L3: + `anti-ground` highlighted, the wave strip marking the Burrower fields at 68, 80, 98, 125, 153 and 172 s, 1 secret'

sections:  # back to back from t = 0; tiles: the backdrop's tile sets (step ART-B: tools/art/backdrop_l15.py)
  - name: Entry Corridor
    end: 30
    speed: 190
    atmosphere: light
    peak: {atmosphere: clear, from: 0, to: 8}   # the entry glow: the plasma streaks (the clear look's wisps), the surface washed out
    tiles: [mars-high, cirrus]
    notes:
      layers:
        deep: Mars from high up, Olympus Mons' caldera rim and flank, the Tharsis plain beyond.
        high-air: the transport's underside (0–3 s), fading entry streaks (0–8 s, the entry glow), thin cirrus (≤ 40 %).
      purpose: The launch; the Dust Kite's first sight at t=5; Needler lines and Stinger streams round the popcorn.
  - name: Cloud Deck
    end: 65
    speed: 170
    ramp: 1   # eased from 190 over its first second
    atmosphere: medium
    tiles: [mars-flank, cirrus]
    notes:
      layers:
        deep: the flank closer, lava channels.
        low-air: the thick water-ice deck in banks (~30 %), covering the field at t≈61.5–64.5 while `ground` takes over.
        high-air: cirrus (≤ 40 %).
      purpose: Mixed air waves through the cloud banks; the first pincer.
  - name: Olympus Slopes
    end: 115
    ramp: 1   # eased from 170 to 150
    atmosphere: light
    tiles: [mars-flank, slopes]   # the deep tile under the opaque ground (the deep layer covers every section)
    notes:
      layers:
        ground: the volcano's lower flank, lava terraces, basalt outcrops, dusty regolith fields with burrow furrows.
        low-air: the last cloud wisps, thin dust.
      purpose: The Burrower alone at t=68, then fields of 4 with popcorn; the first turret nest and mortars.
  - name: Lycus Escarpment
    end: 150
    atmosphere: light
    tiles: [mars-flank, escarpment]
    notes:
      layers:
        ground: 'the foot of the escarpment (the great cliff, drawn as perspective scenery, nothing gameplay touches on its face); **Lycus Survey Station**, overrun: pads, a domed hab, a road with Vrell growths; the crashed drop pod on a ledge at its foot.'
        low-air: thin dust.
      purpose: The station's growths, the Creeper convoy on its road, the secret.
  - name: Tharsis Dunes
    end: 190
    speed: 160
    ramp: 1   # eased from 150
    atmosphere: light
    peak: {atmosphere: heavy, from: 170, to: 180}   # the dust peak: rolling dust banks
    tiles: [mars-flank, dunes, dust-streaks]
    notes:
      layers:
        ground: the dune sea, a crashed colony lander on a crest, then the colony rail line and its pylons across the field at the end.
        low-air: dust streaks off the crests.
      purpose: The finale field of six Burrowers; the level ends over the rail line.

# Step PE15 (2026-10-19, the user's round 40 P.e "all later levels" and "tougher, not more"): the waves to the
# Act 2+ rules (PacingTest: at most 3 pauses over 2 s at medium and hard; ActFloorTest: at least 2.5 enemies on the
# screen and 10 enemy shots a minute with the plan's fit at medium). The set pieces, the Burrower fields, the
# pincers and the radio keep their times; between them a wave about every 2 s from t=5, filled with long-lived,
# firing, low-threat groups: Needler lines of 3 (12 HP with `small_act_hp`: they hover and fire), Stinger streams
# of 3 (18 HP), Dust Kite swarms of 6 (they loop on the screen) in place of the V-wings, round the Act 3 popcorn.
# The Burrower's first field is still alone: no other wave enters from t=68 until t=73 and the Kites of t=62.5
# are gone first. A Burrower `field` wave's x and size give its area (its bottom edge enters at the top edge at t),
# where its units enter buried with the ground before they burrow toward the ship.
