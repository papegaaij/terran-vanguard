# Level 21 – Dust Colossus: the level script, rendered into README.md (briefing, threat profile, layout, waves, ground
# targets, radio, credit budget). Times are seconds from the level start. M7 part H, step PH2, from the README's
# approved hand tables (round 36) and the user's round 43 answers (H.1-H.7). Schema: ../../../tech/architecture/README.md#data-file-schemas
# The arena CRAWLS (round 36): section 5 is an arena of speed 20 whose ground scrolls on at 20 px/s on the real steps
# while the Dust Colossus lives (the level's boss breaches: content's ColossusRules makes a moving arena of a breaching
# boss crawl); the level clock halts at its end (t=245) and a kill jumps it there without moving the ground. The
# arena's `ramp` eases the scroll 140 -> 20 over its first 2 s (t=105-107, H.7a). Keys new in M7 part H: a moving
# arena's `ramp` (only a breaching boss's), the ridge pass on `ridge` (round 43 Q.4 / H.7f; step LQ's key), the
# Colossus's own blocks in its stat block; the Act 3 outro and `next_act` in the act's data.
# The approach to the Act 2+ rules, "tougher, not more" (H.1, count-neutral as Level 20): the approved anchors kept at
# their times (the three Burrower fields, both Mantis pincers and the side Kite stream with their edge warnings, the two
# Wraith rear ambushes, the rear Mote stream, the Spore Bombers with the crest mortars, the Shellbacks, the Herald with
# its escorts, the nests, the ridge pass window held by the t=64 Kites); the Kite V-wings fly as Kite swarms that loop
# on the screen (Level 15's fix), four Kite streams and snakes became firing groups (Needler line abreasts of 4 at
# t=20 and 54, Stinger streams at t=26.5 and 91: the beam era's HP, `small_act_hp` + `beam_era_hp`, Needler 24,
# Stinger 36); the t=101 Stinger V-wing dropped (H.3: the screen clears while the Choir sings, no incoming box, the
# warning at t=105), its four folded into the t=16.5 Needler line (3 -> 4), the t=26.5 Stinger stream (4) and the t=44
# V-wing (4 -> 5). Kites 35 -> 20, Needlers 11 -> 20, Stingers 8 -> 13: 96 + 10 ground targets = 106 at medium over
# t=8-105, ≈ 66 a minute. Hard: the firing groups one smaller (Levels 17-19), a third Wraith in each rear ambush, the
# centre turret pair; easy by the formation lever, the t=61 Wraiths a Needler V-wing from the front (Level 14's rule).
# Step H4 measured the haul and the fight (the level report): the `bounty_scale` 0.74 puts the typical haul on
# budget(21), the boss's bounty 325 keeps H.5's 22.7 %, the fight's par is its measured 102 s. Rook keeps Level 20's Autocannon (H.2: the balance plan's fit carries it).
# Round 44 Q.1 (step L21R, 2026-10-20): H.1's 106 failed the Act 2+ floor (1.78 on the screen, 5 stretches over 2 s), so
# the waves were reworked as Level 20's, the anchors kept at their times: a firing group between every two approved
# waves (23 entries, Needler line abreasts and Stinger V-wings of 2, one smaller on hard; the two last ones not on
# hard), Needler rings held over the Kite swarms at t=9.5 and 30 (`circle`, 6 and 5, hold 8), and a slow
# Stinger stream with the t=64 Kites that holds the ridge pass (4, 1.6 s apart; hard 2). 158 + 10 = 168 at medium,
# 2.55 on the screen, the pre-boss pause and the settling dust the only stretches over 2 s; the haul re-scaled to 0.50
# and the boss's bounty to 480 (H.5's share). The survey crawler's hard 28 HP is its `hard: {hp}` (Q.5).
# The backdrop is step ART-H1's (tools/art/backdrop_l21.py --proposal, merged here): seams at exact rows.
scroll_speed: 160     # the rim; the inner wall, the dune sea and the hollow set their own
launch_seconds: 5     # the usual launch from the bottom edge over the rim's CDF line (H.7g)
bounty_scale: 0.50    # every bounty × 0.50: the typical haul on budget(21) 2,709 (step L21R's measured fit after round 44 Q.1's wave rework; step H4's 0.74, step PH2's paper value 0.75)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Mars, Hellas basin
  layers: [ground, air]
  density: 4
  traits: [anti-ground, rear]   # `side` is in Varga's L3 line (three traits do not fit the intel panel, as Level 14)
  hazards: [suction]
  boss: Dust Colossus
  objective: DESTROY THE DUST COLOSSUS   # the OBJECTIVE field from sensor L1
  varga:
    none: Hellas basin, Lancer. Every Vrell on Mars came out of it. Something is still down there.
    l1: From every side, even behind you. It comes up where the sand bulges.
    l2: Burrowers, dust devils, a singer. And something under the floor, colony-sized.
    l3: Anti-ground, side and rear guns. Hit the lime when the throat opens.
  notes:
    Dominant layers: '`ground` (Burrowers when surfaced, Dust Devils, Shellbacks, turret nests and mortars, the Colossus''s mouths), `buried` (Burrowers under the sand and the Colossus''s body: nothing hits them), `air` (Dust Kites, Needler and Stinger groups, Mantises, Wraiths, the Choir Herald, the Mote stream); `low-air` (risen Dust Devils, the dust haze)'
    Attack directions: '{directions} (the approach by its waves; in the fight the mouths breach from all four edges)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: The Colossus's suction and the debris rocks (the arena); the ridge pass (scenery)
    Boss / mid-boss: 'Act boss [Dust Colossus](../../../enemies/bosses/dust-colossus/README.md)'
    Sensor-suite detail: '**none**: Hellas basin, `ground` + `air`, all directions. **L1**: + the directions, density {density}, hazard "suction", the objective `{objective}`. **L2**: + Burrower, Dust Devil, Shellback, Choir Herald, Dust Kite, Mantis, Wraith, Needler portraits; the boss''s name and silhouette (`dust-colossus`). **L3**: + `anti-ground` and `rear` highlighted; the timeline strip marks the ridge pass (64–72 s) and the boss (105 s); 1 secret.'

sections:  # back to back from t = 0; each speed change eased (ramp: 1 s on the approach, the arena's 2 s); tiles and atmospheres ART-H1's (tools/art/backdrop_l21.py)
  - name: Hellas Rim
    end: 22
    atmosphere: light
    tiles: [rim-wall]
    notes:
      layers:
        ground: the rim's edge, the CDF line held at the end of the retreat (emplacements, burnt-out walkers and crawlers, scorched pads), then the first slope of the inner wall.
        low-air: dust streaks off the rim.
      purpose: 'The launch over the line; popcorn from t=6.'
  - name: Inner Wall
    end: 50
    speed: 170
    ramp: 1
    atmosphere: light
    tiles: [inner-wall]
    notes:
      layers:
        ground: terraced slopes falling into the basin, landslide fans of red sand, a CDF hauler's wreck (the turret nest on it), the survey crawler under a slide on a tread (the secret).
        low-air: thin dust.
      purpose: 'Burrowers on the dune fans, the first nest, the Mantis pincer.'
  - name: Dune Sea
    end: 78
    speed: 150
    ramp: 1
    atmosphere: medium
    tiles: [dune-sea]
    notes:
      layers:
        ground: 'the basin floor, long dune crests, old breach craters filling with sand. **The ridge pass** (t≈64–72): the Colossus''s back runs under the dunes from the right edge to the left across the upper half, a travelling ridge with a dust haze.'
        low-air: ochre dust banks, the dust devils' trails.
      purpose: 'Dust Devils, the first rear ambush; the ridge pass teaches the arena''s read.'
  - name: Lime Hollow
    end: 105
    speed: 140
    ramp: 1
    atmosphere: heavy
    tiles: [hollow-crust]
    notes:
      layers:
        ground: the basin's lowest point, a lime-veined crust cracked in rings round the centre, Vrell growths, sinkholes.
        low-air: dust haze lit lime from below.
      purpose: 'The Herald with escorts, the last nests, two rear waves; the Choir''s song, then the screen clears.'
  - name: Dust Colossus
    end: 245   # the level clock halts here while the Colossus lives, a kill jumps it here; the ground crawls on (the arena's tile repeats every 512 px)
    speed: 20
    ramp: 2    # eased 140 -> 20 over the arena's first 2 s (t=105-107, H.7a)
    arena: true
    atmosphere: heavy
    tiles: [basin-floor]
    notes:
      layers:
        ground: 'the hollow''s floor as the seamless tile (512 px); the breaches'' bulges, craters and the ridge; the debris rocks (phases 2–3).'
      purpose: 'The boss fight (≈ 102 s at medium, its measured par); the warning, the arrival and the checkpoint at t=105.'
  - name: Settling Dust
    end: 277
    speed: 25
    ramp: 1
    atmosphere: clear
    tiles: [settled-floor]
    notes:
      layers:
        ground: 'the collapsed crater, the ridge''s sunken furrow, the dust falling out of the air (the settled floor from the next 512 px seam, H.6).'
        high-air: far off over the basin, Vrell shapes and spore trails lifting off and climbing out of the frame (scenery, ≤ 40 %).
      purpose: 'Release; no enemies, no music; the act end''s lines.'

boss:  # the act boss: the arena's start is its arrival (the warning, the bar, the boss checkpoint); its first tell after its 6 s intro (≈ t=111)
