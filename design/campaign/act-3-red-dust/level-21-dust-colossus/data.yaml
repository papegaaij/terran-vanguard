    seam-dunes: {layer: ground, size: [480, 320]}   # section 3's seam: the last terrace onto the dune sea (exact rows)
    seam-hollow: {layer: ground, size: [480, 320]}   # section 4's seam: the dune sea onto the hollow's crust (exact rows)
