  - {t: 97.5, speaker: The Choir, distorted: true, line: "[the Choir sings]"}
  - {t: 111, speaker: Varga, line: "It's coming up! Hit the lime in its throat when it opens.", notes: {trigger: "t=111 (the first tell; the arena's clock runs)"}}
  - {event: boss-phase, phase: Hunting, speaker: Okafor, line: "It's hunting you now, Lancer. Keep moving and mind the pull.", notes: {trigger: "Phase 2 (`boss-phase` Hunting)"}}
  - {event: boss-phase, phase: Hunting, speaker: Rook, requires: escort, line: "Remember the moles, Lancer? I take it back.", notes: {trigger: "Phase 2, queued after Okafor's line"}}
  - {event: boss-phase, phase: Breaching anywhere, speaker: Varga, expression: fierce, line: "It's under you! Move when the ground cracks!", notes: {trigger: "Phase 3 (`boss-phase` Breaching anywhere)"}}
  - {event: boss-destroyed, speaker: The Choir, distorted: true, line: "…many… we are many… we are going…", notes: {trigger: "Colossus destroyed (`boss-destroyed`, the chain's start): the Choir speaks, with its layering on speech"}}
  - {event: boss-destroyed, speaker: Varga, line: "Commander… that was not singing. Those were words.", notes: {trigger: "After the chain and the flash (`CLOSING`)"}}
  - {event: boss-destroyed, speaker: Okafor, line: "I heard it, Doctor. Log everything.", notes: {trigger: "Then (`CLOSING`)"}}
  - {event: boss-destroyed, speaker: Ares Control, portrait: generic-colonial, line: "Clear sky over every dome, Aegis. Dinner's on Ares Landing.", notes: {trigger: "Then (`CLOSING`)"}}
  - {event: level-end, speaker: Okafor, line: "Mars holds. They're pulling off the planet. Come home, Aegis.", notes: {trigger: "Level end (the closing line, `CLOSING`)"}}

objectives:
  primary: reach-end   # the arena makes the kill a condition of the level's end
  secondary: {kill_ratio: 0.65, boss_counted: false, credits: 100, name: Clear the basin}   # at least 65 % of the level's enemies (the boss and its debris not counted), judged at the end; no radio line (100 in Act 1 terms: pays 256)

music:
  track: 9            # Act 3 B "Grey Signal" (audio/music track list); Vorne's motif layer stays muted (no `motif`: the Colossus is pure Vrell)
  start_section: 2    # the rim's wind alone in section 1, the base stem from the inner wall
  full_section: 3     # the full mix from the dune sea (the ridge pass)
  ambience: mars-dust   # the Martian dust wind throughout (the calm over the settling dust: step HB)
  ambience_layers:
    - {ambience: basin-rumble, from: 64, to: 245, fade_in: 30, fade_out: 1}   # the seismic rumble bed from the ridge pass, swelling through the hollow into the fight; cut at the kill (the clock's jump to t=245)
  end_jingle: mission-complete
  boss_warning: boss-warning      # track 22 with the klaxon and the banner at the arena's start (t=105)
  boss_track: choir-descends      # track 18 after the warning, fading out at the kill; the settling dust without music

ridge: {t: 64, seconds: 8, from: right, to: left, depth: 150}   # presentation (round 43 Q.4 / H.7f): the ridge pass: the Colossus's back surfaces off the right edge at t=64, 150 px below the top edge, its head off the left edge at t=72 across the upper half, hitting nothing (Level 20's ridge sprites)

difficulty: {}  # easy's Needler V-wing at t=61 and hard's centre turret pair and third Wraiths are in their entries; the firing groups' hard counts are in their waves; the formation lever sizes the rest (the Burrower fields one smaller on easy); the stat blocks' hooks apply (the Burrowers', the Dust Devils' pull, the Colossus's easy and hard hooks); the survey crawler's hard 28 HP is its entry's `hard: {hp}` (round 44 Q.5)

briefing:
  pages:
    - {speaker: Okafor, image: level-21-hellas-basin, line: "No more running. Every Vrell attack on Mars came out of the Hellas basin, and Doctor Varga thinks she knows why. We go down there and end it. Ares Landing is counting on you, Lancer."}
    - {speaker: Varga, image: level-21-colossus-scan, line: "The song comes from under the basin floor. It's one organism, the size of a colony. It breaches where the sand bulges, from any side, even behind you. The throat glows lime. Bring side and rear guns."}
  teaser: {speaker: Rook, line: "Something big under Hellas. Bring side guns, rear guns. Bring all the guns."}

backdrop:
  # Presentation only: Dust Colossus (tools/art/backdrop_l21.py, from mars-hellas-r36-a, Level 20's style).
  # The ground is opaque; no deep layer. Seams sit at exact rows: re-render them (`backdrop_l21.py
  # seam-wall seam-dunes seam-hollow seam-arena`) after the data moves a section. The arena's tile repeats
  # every 512 px; section 6's starts at the next 512 px seam with seam-settle, and the collapsed crater and
  # the furrow are laid at the kill: the game's (H.6), declared here without a placed entry.
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2}   # far unused (no deep layer), given as the loader asks
  ramp: 3
  haze_colour: d6a670  # the butterscotch sky (mars_r36.SKY)
  atmosphere:
    clear: {haze: 0.03}   # section 6, the settling dust: haze only (the heavy dust ramps out)
    light: {banks: rim-dust, haze: 0.06}   # the rim and the inner wall: dust streaks off the rim
    medium: {banks: basin-haze, haze: 0.09}   # the dune sea: ochre dust banks
    heavy: {banks: hollow-dust, haze: 0.12}   # the lime hollow and the arena: dust lit lime from below
  tile_sets:
    rim-wall: {layer: ground, height: 960}   # section 1: the basin wall's upper slope, gullies, strata, the retreat's shell craters and scorch
    inner-wall: {layer: ground, height: 960}   # section 2: the inner wall's terraces, four steps a tile, red sand from the slides on the treads
    dune-sea: {layer: ground, height: 960}   # section 3: the dune sea, crests across the screen
    hollow-crust: {layer: ground, height: 960}   # section 4: the lime hollow's crust, cracked in rings round the centre, veins lit lime
    basin-floor: {layer: ground, height: 512}   # section 5, the arena: the hollow's floor, repeating every 512 px (H.6), lime veins
    settled-floor: {layer: ground, height: 512}   # section 6: the same floor under fallen dust, from the next 512 px seam (the game's)
    rim-dust: {layer: low-air, height: 960, drift: 10}   # light: dust streaks off the rim, at most 33 %
    basin-haze: {layer: low-air, height: 960, drift: 6}   # medium: ochre dust banks, at most 26 %
    hollow-dust: {layer: low-air, height: 960, drift: 8}   # heavy (the hollow, the arena): denser dust lit lime from below, at most 35 %
  pieces:
    rim-line: {layer: ground, size: [480, 960]}   # the start: the plain behind the CDF line, pads, berm and trench, the rim's crest, the slope (exact rows)
    scorched-pad: {layer: ground, size: [96, 96]}   # a CDF landing pad behind the line, scorched by the last lift-off
