# No `no_surface` zones yet (pending): the nests' rocks (the hauler's wreck t 36 x 330 176×120, the dune crest t 57
# x 250 380×128, the hollow nest's crust t 84 x 240 260×90, the lip mortars t 92.2 x 240 320×70) would keep the
# Burrowers off them, but the simulation's LevelScript refuses no-surface zones in a level with an arena (holds and
# arenas make the scroll's time depend on play); these all lie before the arena: a sim step may allow zones that end
# before the first arena (step H4 adds them then).

