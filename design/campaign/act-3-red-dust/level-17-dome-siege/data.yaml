drops:  # the Ares militia's supply drone (the CDF supply drone's presentation, as Level 14's) flies in from the bottom edge, releases its armour patch at [x, y up] at t and leaves the way it came
  - {t: 100, x: 240, y: 380, pickup: armour patch, sprite: supply-drone}

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected)
  - {t: 1, speaker: Ares Control, portrait: generic-colonial, line: "Aegis flight, Ares Landing. Took Earth long enough. Five domes still hold air: keep the bombers off the glass."}
  - {t: 14, speaker: Rook, requires: escort, line: "Copy, Ares. Lancer, I'll keep an eye on the flanks."}
  - {t: 29, speaker: Varga, line: "Shelled walker. Hit the lime vent; when it curls up, wait."}
  - {t: 36.5, speaker: Varga, line: "Bombers on the domes! Get them before they're over the glass."}
  - {t: 47, speaker: Ares Control, portrait: generic-colonial, line: "Bradbury and Lowell grow our food, Aegis. Every pane counts."}
  - {t: 71, speaker: Ares Control, portrait: generic-colonial, line: "Outer greenhouses are gone. The inner ring is still sealed."}
  - {t: 78, speaker: Varga, line: "Commander, they have not touched a single Helix facility. Not one."}
  - {t: 88.5, speaker: Okafor, line: "Not on this channel, Doctor."}
  - {t: 95, speaker: Rook, requires: escort, line: "Flankers, both edges. Mind their beams."}
  - {t: 102, speaker: Ares Control, portrait: generic-colonial, line: "Inner ring: Schiaparelli, Burroughs, then Eden. Eden feeds the whole colony."}
  - {t: 123, speaker: Varga, line: "Singer with bombers under its rings. Singer first, Lancer!"}
  - {t: 130.5, speaker: Ares Control, portrait: generic-colonial, line: "Eden is under you. Everything we grow is under that glass."}
  - {t: 143, speaker: Rook, requires: escort, line: "If we save the greenhouse, I'm owed a tomato."}
  - {t: 150, speaker: Okafor, line: "Ares Landing holds. Clear the spaceport, Aegis, then set down."}
  - {event: first-ring, speaker: Varga, line: "That flyer is singing shields onto the others. See the rings? Kill the singer first.", notes: {trigger: "The first Herald's first ring (`first-ring`, round 40)"}}
  - {event: ally-hit, speaker: Ares Control, portrait: generic-colonial, line: "{ally} is hit! The glass is holding... for now.", notes: {trigger: "A dome's first hit (`ally-hit`)"}}
  - {event: ally-lost, speaker: Ares Control, portrait: generic-colonial, line: "We've lost {ally}. Its people are below. Its crops aren't.", notes: {trigger: "A dome breaks (`ally-lost`)"}}
  - {event: secondary-objective, speaker: Ares Control, portrait: generic-colonial, line: "All five domes still standing. Fine. Earth can stay for dinner.", notes: {trigger: "Secondary met (`secondary-objective`)"}}
  - {event: level-end, speaker: Okafor, line: "The domes are behind you and the colony is breathing. Good work, Aegis."}

objectives:
  primary: reach-end   # the domes never fail the mission (a broken dome loses its crops, not lives)
  secondary: {standing: true, label: DOMES, credits: 100, name: No dome lost}   # round 41 (the user's playtest 2026-10-19: was `untouched`, "No dome hit"): hits allowed, failed when the first dome breaks, met when Eden leaves the bottom edge (t≈135.8); 100 in Act 1 terms: pays 256

music:
  track: 8            # Act 3 A "Red Dust Run" (audio/music track list)
  start_section: 2    # the colony ambience alone in section 1, the base stem from the first dome
  full_section: 4     # the full mix from the inner ring
  stems: {5: base}    # the base stem again over the spaceport, to the end
  ambience: mars-colony   # plains wind, the domes' air-plant hum, distant rail clank (step AUD-D), from t=0
  end_jingle: mission-complete

flak: {from: 160, every: 1.5}   # presentation: the militia's flak guns over the spaceport from t≈160, hitting nothing (step G1: a distant flak sound)

difficulty: {}  # the domes' easy and hard hits and easy's unhooked Shellbacks are in the allies block; hard's extra bomber pair is its wave (skip); the formation lever sizes the rest; the stat blocks' hooks apply (the Herald's radius and song, the Shellback's mortar and roll)

briefing:
  pages:
    - {speaker: Okafor, image: level-17-ares-domes, line: "Ares Landing is the oldest colony on Mars, and the Vrell are at its domes. The people are below ground. The crops and the air plants are not. Keep the bombers off the glass until the militia can man its guns."}
    - {speaker: Varga, image: level-17-choir-herald, line: "Two new forms. A shelled walker that lobs spores and rolls when it's hurt, and a flyer that sings shields onto the others. Kill the singer, then the rest."}
  teaser: {speaker: Rook, line: "Ares Landing wants its glass in one piece. Spread guns for the bombers, I'd say."}

backdrop:
  # Presentation only: Dome Siege (tools/art/backdrop_l17.py, from mars-ares-landing-r36-a and dome a).
  # The ground is opaque; no deep layer (the README's Olympus horizon cannot show under it: pending round 40).
  # The domes are the ally's sprites (ares-dome, ares-dome-eden); their aprons and annexes are pieces here.
  # The rail pieces and seams sit at exact rows: re-run `backdrop_l17.py --proposal` after the data moves a section.
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2.2}   # far and high-air unused (no deep layer: the ground is opaque)
  ramp: 3
  haze_colour: d6a670  # the butterscotch sky (mars_r36.SKY)
  atmosphere:
    clear: {haze: 0.06}   # the spaceport (section 5): haze only
    light: {banks: dust-wisps, haze: 0.12}   # thin dust wisps over the plain
    medium: {banks: smoke-banks, haze: 0.18}   # the smoke over the burnt greenhouses (section 3's peak 72-80)
  tile_sets:
    ares-plain: {layer: ground, height: 960}   # section 1: the rust plain north of the colony, wind ripples, dust drifts, small craters
    colony-ground: {layer: ground, height: 960}   # sections 2 and 4: the colony's worked ground, rover tracks, cable trenches, concrete dust
    burnt-fields: {layer: ground, height: 960}   # section 3: the burnt outer greenhouse fields, soot scars, ash streaks, cinders
    spaceport-apron: {layer: ground, height: 960}   # section 5: the spaceport's concrete slabs, stains, a dashed taxi line at x 240
    dust-wisps: {layer: low-air, height: 960, drift: 6}   # light: thin dust wisps, at most 30 % opaque
    smoke-banks: {layer: low-air, height: 960, drift: 4}   # medium (72-80): the smoke over the burnt greenhouses, at most 45 %
  pieces:
    seam-domes: {layer: ground, size: [480, 320]}   # section 2's seam: the plain into the colony's ground (exact rows)
    seam-burnt: {layer: ground, size: [480, 320]}   # section 3's seam: the colony's ground into the burnt fields (exact rows)
    seam-inner: {layer: ground, size: [480, 320]}   # section 4's seam: the burnt fields back into the colony's ground (exact rows)
    seam-apron: {layer: ground, size: [480, 320]}   # section 5's seam: the colony's ground into the spaceport's apron (exact rows)
    rail-track: {layer: ground, size: [96, 322]}   # the rail line from the north, tiling along itself every 320 px (exact rows: joins the bends)
    rail-bend-a: {layer: ground, size: [192, 642]}   # the line bending from x 310 to 240 before Bradbury (exact rows)
    rail-bend-b: {layer: ground, size: [192, 642]}   # the line bending from x 240 to 160 after Lowell (exact rows)
    rail-yard: {layer: ground, size: [240, 962]}   # the rail yard, sidings, wagons and the buffer stops where the line ends (exact rows; the nest's turrets)
    freight-train: {layer: ground, size: [32, 244]}   # the stranded freight train on the line in section 1
    dome-apron-west: {layer: ground, size: [184, 184]}   # a dome's apron, annexes on the west, the road stub east toward the rail (Bradbury, Schiaparelli)
    dome-apron-east: {layer: ground, size: [184, 184]}   # a dome's apron, annexes on the east, the road stub west (Lowell, Burroughs)
    dome-apron-eden: {layer: ground, size: [216, 216]}   # Eden's larger apron, annexes both sides
    vrell-growth-a: {layer: ground, size: [160, 144]}   # Vrell nest growth, violet with teal veins
    vrell-growth-b: {layer: ground, size: [224, 184]}   # a larger patch of Vrell nest growth (under the floes)
    burnt-greenhouses: {layer: ground, size: [200, 248]}   # three burnt tube greenhouses, collapsed (section 3)
    helix-compound: {layer: ground, size: [184, 264]}   # the Helix compound: black and gold, lit, a clean fenced yard, unlabelled, no growth within 100 px
    ring-road-north: {layer: ground, size: [480, 160]}   # the inner ring road's arc as the flight enters the ring
    ring-road-south: {layer: ground, size: [480, 160]}   # the inner ring road's arc as the flight leaves it
    gun-pit: {layer: ground, size: [56, 56]}   # an unmanned militia flak pit
    landing-pad: {layer: ground, size: [128, 128]}   # a spaceport landing pad
    hangar: {layer: ground, size: [120, 152]}   # a spaceport hangar, doors to the east
    smoke-plume: {layer: low-air, size: [96, 96]}   # smoke over the burnt greenhouses, at most 45 %
