# Level 17 – Dome Siege: the level script, rendered into README.md (briefing, threat profile, layout, waves, ground
# targets, radio, credit budget). Times are seconds from the level start. M7 part D, step D2, from the README's
# approved hand tables (round 36). Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M7 part D (loaded and checked in step D2 by content's LevelData and SiegeChecks, mapped for the
# simulation in step D4, flown from steps D1/D3): the level's `allies` block (the five Ares Landing domes, scrolling
# through with the ground, and the target-the-objective hook that goes for them: `targeted_by`, `bomb_row`,
# `bomb_slot`, the easy/hard `hits`), the secondary `untouched`, a pickup's `dropped_by.enemy`, the presentation key
# `flak` and the ambience `mars-colony`. Round 41 (the user's playtest 2026-10-19, "both"; step FX-C): the secondary
# `standing` instead of `untouched` ("No dome lost": hits allowed, failed when a dome breaks) and the hooked bombers'
# `bomb_run_in` (they fly 2.5 s on the play field before they may drop).
# Defaults of the gap check built here, pending the user's review in round 40: the hook per unit type (every Spore
# Bomber wave `always`, every Shellback `alternate`: the t=30.5 Shellback walks while no dome is on the screen, so it
# has nothing to lob at); the hooked bombers hold a row 160 px below the top edge, a wave's bombers on x slots 40 px
# apart round the dome's x; the t=124 bombers a plain hooked line abreast beside the Herald (not its escorts: a bomb run
# never applies to escorts; step D4), on the ±40 px slots round Eden's x and so inside the Herald's rings; the Polyp Mortar floes
# static nests (not Level 13's drifting `side`); Eden the dome's size override (144 px) with its own sprite.
# The backdrop is step ART-D's Ares Landing backdrop (tools/art/backdrop_l17.py), merged in step D4.
scroll_speed: 130     # the approach and the spaceport; the dome sections and the compound set their own
launch_seconds: 5     # from the rail line north of the colony (scenery)
bounty_scale: 0.40    # every bounty × 0.40: the typical haul on budget(17) 2,067 (TypicalHaulTest; step PE17: from 0.60 of round 36, Q.17c, with the reworked waves)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Mars, Ares Landing
  layers: [air, ground]
  density: 4
  traits: [spread, anti-ground]
  hazards: [dome attacks]
  boss: none
  objective: REACH THE SPACEPORT   # the OBJECTIVE field from sensor L1
  varga:
    none: Ares Landing, Lancer. A colony that wants its glass in one piece.
    l1: Front and flanks. Bombers will go for the domes.
    l2: "New: a shelled walker and a singing flyer."
    l3: Spread for the bombers, anti-ground for the shells.
  notes:
    Dominant layers: '`air` (bombers, the Herald and its escorts, Stinger streams, popcorn), `ground` (Shellbacks, Burrower fields, spine-turret nests, Polyp Mortars, the domes)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: Bombers and Shellbacks going for the domes (the secondary); Shellback spore mortars
    Boss / mid-boss: none
    Sensor-suite detail: 'none: Ares Landing, `air` + `ground`, front · L1: + directions (sides), density {density}, hazard "dome attacks", the objective `{objective}` and the secondary `NO DOME LOST` · L2: + Shellback (new), Choir Herald (new), Spore Bomber, Burrower, Mantis, Dust Kite, Skitter, Needler, Stinger portraits · L3: + `spread` and `anti-ground` highlighted, the wave strip marking the two dome sections, 1 secret'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); tiles: step ART-D's Ares Landing sets (merged in step D4)
  - name: Rail Approach
    end: 30
    atmosphere: light
    tiles: [ares-plain]
    notes:
      layers:
        deep: rust plain, Olympus Mons on the horizon.
        ground: the rail line from the north with a stranded freight train, a spine-turret nest on the embankment (t≈18), wind-blown dust drifts.
        low-air: thin dust wisps.
      purpose: Popcorn from t=6, a Burrower field under the plain (t=9); the first ground targets.
  - name: Outer Domes
    end: 72
    speed: 80
    ramp: 2
    atmosphere: light
    tiles: [colony-ground]
    notes:
      layers:
        ground: Bradbury (x 130) and Lowell (x 350) on their rings, greenhouse annexes, rail spurs, Vrell nest growth creeping up to the rings; a Polyp Mortar floe at t≈64.
      purpose: The Shellback alone (t=30.5), the first hooked bombers, the Herald alone (t=55.5); a Burrower field in the nest growth after Lowell (t=60).
  - name: Helix Compound
    end: 98
    speed: 110
    ramp: 2
    atmosphere: light
    peak: {atmosphere: medium, from: 72, to: 80}   # smoke over the burnt outer greenhouses
    tiles: [burnt-fields]
    notes:
      layers:
        ground: the burnt outer greenhouses (collapsed frames, the secret's capsule at t≈76), then the **Helix compound** at x 300–460 (t≈78–85) black-and-gold, lit, a landing pad, its perimeter fence clean, no Vrell growth within 100 px while everything round it burns; a rail yard with a spine-turret nest (t≈90).
      purpose: The Helix beat (the t=77 swarm bends round the compound); a Burrower field after it (t=86); Mantis flankers.
  - name: Inner Ring
    end: 140
    speed: 70
    ramp: 2
    atmosphere: light
    tiles: [colony-ground]
    notes:
      layers:
        ground: Schiaparelli (x 110), Burroughs (x 370), then Eden (x 240, the largest, its glass lit brightest); the ring road, airlocks, militia gun pits (unmanned); a Polyp Mortar floe at t≈117.
      purpose: The hooked waves at their densest, a Burrower field between the domes (t=112, never on one); the second Herald over Eden; the secondary judged at t≈135.8.
  - name: Spaceport
    end: 172
    speed: 130
    ramp: 2
    atmosphere: clear
    tiles: [spaceport-apron]
    notes:
      layers:
        ground: the spaceport's pads and hangars, a spine-turret nest on the apron (t≈150), the militia's flak guns opening up at t≈160 (presentation).
      purpose: Release, with two Burrower fields (t=137.5 as Eden leaves, t=161.5 through the apron); level end.

# The domes (design/allies/ares-landing-dome; M16 = a): each enters at the top edge at `at` [t, x] (its bottom edge
# there) and scrolls through with the ground; they never fail the mission. The hook goes for them per unit type.
allies:
  units:
    - {ally: ares-landing-dome, name: Bradbury, at: [38, 130]}
    - {ally: ares-landing-dome, name: Lowell, at: [46, 350]}
    - {ally: ares-landing-dome, name: Schiaparelli, at: [104, 110]}
    - {ally: ares-landing-dome, name: Burroughs, at: [110, 370]}
    - {ally: ares-landing-dome, name: Eden, at: [126, 240], size: [144, 144], sprite: ares-dome-eden}   # the largest
  targeted_by: {spore-bomber: always, shellback: alternate}   # the popcorn, the Needlers, the Stingers, the Mantises, the Herald, the Burrowers and the nests are never hooked
  bomb_row: 220    # px below the top edge (round 40 R.b: from 160): a hooked bomber holds this row and steers (at its 45 px/s) to the next dome's x
  bomb_slot: 40    # px between a hooked wave's bombers' x slots round the dome's x
  bomb_run_in: 2.5  # s a hooked bomber flies on the play field before it may drop (round 41: it dropped at once, the t=124 bombers on Eden as they entered); over a dome before then it keeps its load and steers on to the next
  easy: {hits: 4, targeted_by: {shellback: none}}   # a dome breaks on its 4th hit; the Shellbacks' mortar lobs only at the ship (their roll still crushes)
  hard: {hits: 2}

# Popcorn in small waves (Dust Kite streams and V-wings of 3, long V-wings and snakes of 4, Mote Swarms of 6, Skitter
# snakes of 4), a wave every 3-3.5 s from t=6; no rear waves; the side waves warned 3 s ahead at their edge.
# Step PE17 (the user's round 40 P.e "all later levels" and "tougher, not more", pending the user's review): the waves
# to the Act 2+ rules (PacingTest's 2 s rule at medium and hard, ActFloorTest's floor) with long-lived, firing groups
# rather than more popcorn: six Burrower fields (t=9, 60, 86, 112, 137.5, 161.5; never while an outer dome or a quiet
# window is on the screen, the inner field kept off the domes and the compound by `no_surface`; hard one fewer each),
# whose rings give most of the shots (the t=9.5 V-wing and the t=88 stream made way for two of them), and nine Stinger
# streams of 3 (13, 26.5, 48.5, 71, 79.5, 105.5, 141.5, 152, 165.5) for three Skitter waves, five Dust Kite waves
# and the t=81.5 Stinger V-wing; the t=121
# Needler line of 4 a line of 3 at t=119.5 (hard 2: with `small_act_hp` and the inner field it outlived the Herald's
# arrival, and the bombers broke Eden in every medium run); moved: the t=42 V-wing to 40.5, the t=84.5 snake to 83.5 (left edge),
# the t=100 snake to 99, the t=159 V-wing to 157.5; added the t=74 Kite stream and the t=168 V-wing. The
# formation lever makes the 3-bomber waves (t=102, t=124) two on easy and four on hard. The side pairs of bombers
# (t=43.5, 108.5, hard's 126) are streams on a route in at the row 140 px below the top edge (written from the left,
# mirrored for the right edge), 1 s apart (step D4: a side column needs a hovering or diving unit; a hooked bomber
# keeps its entry row on its run). Step D4 (PacingTest: on easy the screen emptied for over 3 s five times) moved three
# popcorn waves by 0.5-1.5 s: the stream at t=73.5 to 72.5, the Stinger V-wing at 80.5 to 81.5, the Dust Kite snake at
# 98.5 to 100, the V-wing at 105 to 105.5, the snake at 162.5 to 162 and the last stream at 166 to 165.5.
# Walker paths are the ground positions at the wave's t ([x, y] px, y below the top edge), as Level 04's.
