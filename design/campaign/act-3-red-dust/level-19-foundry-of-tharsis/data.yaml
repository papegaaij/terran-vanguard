secrets:
  - name: payroll safe
    crate: 100   # Act 1 terms: pays 256 with the act factor
    radio: {speaker: Ares Control, portrait: generic-colonial, line: "That's the foundry payroll. The crews say keep it."}

pickups:
  - {pickup: overdrive, dropped_by: {wave: 97, unit: first}}   # the leader of the t=97 Stinger V-wing

drops:  # an Ares militia supply drone (the CDF supply drone's presentation, as Levels 17-18) releases an armour patch before the yard
  - {t: 122, x: 240, y: 380, pickup: armour patch, sprite: supply-drone}

radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected); the arena's lines are events (the level clock is halted)
  - {t: 1, speaker: Okafor, line: "Tharsis Foundry, Lancer. The Vrell hold the lower works, and the grey machines are with them. Clear it to the casting yard."}
  - {t: 14, speaker: Varga, line: "Gantry turrets ahead face up the line. They fire once you're past."}
  - {t: 22.5, speaker: Ares Control, portrait: generic-colonial, line: "Two hundred foundry crew are sealed in the smelter tower."}
  - {t: 30, speaker: Varga, line: "Grey tanks on the conveyors. Their back plates are thin."}
  - {t: 38, speaker: Rook, requires: escort, line: "Tanks on a conveyor belt. Someone hates walking."}
  - {t: 45.5, speaker: Rook, requires: escort, line: "Six o'clock! Cloakers!"}
  - {t: 57.5, speaker: Ares Control, portrait: generic-colonial, line: "Furnace row is next. The vents still fire. Watch for the glow."}
  - {t: 66, speaker: Varga, line: "A singer with escorts. Kill it and their shields go with it."}
  - {t: 77, speaker: Rook, requires: escort, line: "Coming up behind, Lancer!"}
  - {t: 88, speaker: Okafor, line: "Grey drones again, same as the storm. Keep your spacing."}
  - {t: 97.5, speaker: Rook, requires: escort, line: "Cloakers on six again!"}
  - {t: 105, speaker: Ares Control, portrait: generic-colonial, line: "Something big walked into the casting yard an hour ago. It isn't one of ours."}
  - {t: 116, speaker: Rook, requires: escort, line: "Behind us!"}
  - {t: 124.5, speaker: Okafor, line: "Casting yard ahead. Whatever is in there, Lancer, put it down."}
  - {event: first-telegraph, speaker: Varga, line: "It burns what's behind it. Stay out of the cone, then hit the vents.", notes: {trigger: "First flame tell (`first-telegraph`)"}}
  - {event: boss-part-destroyed, parts: [left pod, right pod], speaker: Rook, requires: escort, line: "Pod's gone. One more.", notes: {trigger: "First missile pod destroyed (`boss-part-destroyed`)"}}
  - {event: boss-destroyed, speaker: Rook, requires: escort, line: "Walker's down. No colours, no numbers.", notes: {trigger: "Walker destroyed (`boss-destroyed`)"}}
  - {t: 137, speaker: Varga, line: "Lancer, the serial plates are filed off. By hand. And that alloy is Helix foundry stock."}
  - {t: 148.5, speaker: Okafor, line: "Not on this channel, Doctor."}
  - {t: 155.5, speaker: Ares Control, portrait: generic-colonial, line: "Tower to Aegis: the yard is clear. We're coming out."}
  - {t: 163, speaker: Okafor, line: "South gate ahead. Last of them, Lancer."}
  - {event: secondary-objective, speaker: Okafor, line: "Not one grey tank left the foundry. Good.", notes: {trigger: Secondary met (at the end)}}
  - {event: level-end, speaker: Okafor, line: "Tharsis is breathing again. Come home, Aegis."}

objectives:
  primary: reach-end
  secondary: {escapes: warden-tank, allowed: 2, label: GREY TANKS, credits: 100, name: Stop 12 of the 14 grey tanks}   # at least 12 of the 14 Warden Tanks destroyed before they leave the screen, failed at the third away (100 in Act 1 terms: pays 256)

music:
  track: 9            # Act 3 B "Grey Signal" (audio/music track list)
  start_section: 2    # the foundry ambience alone in section 1, the base stem from the halls
  full_section: 3     # the full mix from the furnace row
  stems: {6: motif, 7: base}   # the crawl: the motif layer alone over the ambience (hint 2 in the music); the base stem to the end
  motif: {from: 132, sections: {7: false}}   # Vorne's motif layer as a faint layer under the walker fight and alone over the crawl, not in the run-out
  ambience: mars-foundry   # conveyor rumble, a far furnace roar, a slow hammer, the plateau wind
  end_jingle: mission-complete
  boss_sting: miniboss-sting   # track 21 at the arena halt, when the boss bar appears, then the track again

difficulty: {}  # the vents' easy and hard tell, period and ripple are in `vents`; hard's extra nest and Wraith pair are in their entries; the firing groups' hard counts are in their waves; the formation lever sizes the rest; the stat blocks' hooks apply (the Warden Tank's 2- and 4-shot bursts and hard turret, the walker's easy and hard hooks)

briefing:
  pages:
    - {speaker: Okafor, image: level-19-tharsis-works, line: "Tharsis Foundry went quiet two days ago. The Vrell hold the lower works, and those grey machines are with them. Two hundred crew are sealed in the smelter tower. Get them out."}
    - {speaker: Varga, image: level-19-rear-arcs, line: "Grey tanks ride the conveyors, and the gantry turrets face up the line: they fire after you pass. Rear guns, Lancer. And something large is in the casting yard."}
  teaser: {speaker: Rook, line: "A foundry full of grey tanks. Bring something that shoots backwards."}

