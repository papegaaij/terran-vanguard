# Level 19 – Foundry of Tharsis: the level script, rendered into README.md (briefing, threat profile, layout, waves,
# ground targets, radio, credit budget). Times are seconds from the level start. M7 part F, step F2, from the README's
# approved hand tables (round 36). Schema: ../../../tech/architecture/schemas-levels/README.md
# Keys new in M7 part F (loaded, checked and mapped in step F2 by content's LevelData, FoundryChecks and FoundryRules;
# flown from steps F1/F3, drawn by steps G1/G2): the conveyor `belts` (runs up the screen at 40 px/s that carry ground
# units), the furnace `vents` (rows of grates firing as a ripple), a nest's `arc: up` (the gantry nests turned 180°),
# the arena's `hold_after_boss` (the wreck beat), the crawl section's ease from the halt (its `ramp`), the secondary's
# `allowed` (12 of 14 grey tanks), the music's `stems: motif` (the motif layer alone over the crawl) and the ambience
# `mars-foundry`; the Warden Tank's and the Revenant Walker's own blocks are in their stat blocks.
# Defaults of the gap check built here (§1.5, pending the user's review in round 42): the level meets the Act 2+ pacing
# and floor rules by density (PacingTest's Act 2 rule, ActFloorTest), not by an exception: the approved anchor waves
# kept at their times (the Warden Tanks at 30.5/41/76/107.5 and the south gate's pair, the Creepers at 55/125, the
# Herald at 69, the Shellbacks at 83, the Ravagers at 93.5, the Ghost Drones at 58.5/90/159.5, the rear entries at
# 23.5/48/79.5/100.5/118/156, the radio beats, the quiet windows after the first tanks and the first vent row, held by
# ground units on the screen); between them a wave about every 2.5 s with light firing groups (Needler line abreasts of
# 3-4, Stinger V-wings and streams of 3-4: the beam era's HP, `small_act_hp` + `beam_era_hp`, Needler 24, Stinger 36)
# in place of the approved popcorn streams, more up-facing spine nests under the gantries (t≈36, 70, 88, 110, 152);
# the crawl's kites as Dust Kite swarms at the edges, so the wreck in the middle reads. Hard: the firing groups one
# smaller (as Levels 17-18), its extra nest and Wraith pair; easy by the formation lever. The `bounty_scale` and the
# walker's bounty are the paper values (§1.5): step F4 sets them from the measured run.
# The backdrop is step ART-F2's (tools/art/backdrop_l19.py --proposal, merged in step F2): seams and belts at exact rows.
scroll_speed: 150     # the open slag fields and the run-out; the halls, the furnace row and the yard approach set their own
launch_seconds: 5     # from the bottom edge over the slag fields
bounty_scale: 0.28    # every bounty × 0.28: the typical haul on budget(19) 2,366 (step F4, from the floor's measured waves; step F2's paper 0.35)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Mars, Tharsis Foundry
  layers: [ground, air]
  density: 4
  traits: [anti-ground, rear]
  hazards: [furnace vents, rear-firing turrets]
  boss: Revenant Walker
  objective: CLEAR THE FOUNDRY   # the OBJECTIVE field from sensor L1
  varga:
    none: Tharsis Foundry. Vrell and grey machines together.
    l1: Front and rear. Turrets that fire after you pass.
    l2: "New: grey tanks. And one huge contact, unknown."
    l3: Rear guns for the turrets. Anti-ground for tanks.
  notes:
    Dominant layers: '`ground` (Warden Tanks, Creepers, Ravagers, Shellbacks, turret and mortar nests, the walker), `air` (Needler and Stinger groups, popcorn, Ghost Drones, Wraiths, a Choir Herald)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: Furnace vents flaring from the floor; conveyors carrying ground units; turrets that fire after the ship passes
    Boss / mid-boss: 'Mid-boss: Revenant Walker (unnamed before the fight)'
    Sensor-suite detail: 'none: Tharsis industrial zone, `ground` + `air`, front · L1: + directions (front, rear), density {density}, hazards "furnace vents" and "rear-firing turrets", the objective `{objective}` and the secondary `GREY TANKS 12/14` · L2: + Warden Tank (new), Dust Kite, Skitter, Needler, Stinger, Ghost Drone, Wraith, Creeper, Ravager, Shellback, Choir Herald portraits, and a silhouette "unclassified, huge, `ground`" (the walker) · L3: + `anti-ground` and `rear` highlighted, the wave strip marking the casting-yard halt, 1 secret'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); tiles and atmospheres ART-F2's (tools/art/backdrop_l19.py)
  - name: Slag Fields
    end: 24
    atmosphere: light
    tiles: [slag-field]
    notes:
      layers:
        ground: slag heaps, the smelter tower at the left edge (from above), an ore gantry across the field (t≈18) with a turret nest under it.
        low-air: stack smoke (~15 %).
      purpose: 'Popcorn and light groups from t=6; the first up-facing turret nest taught.'
  - name: Conveyor Halls
    end: 64
    speed: 130
    ramp: 2
    atmosphere: light
    tiles: [hall-floor]
    notes:
      layers:
        ground: two roofless halls, conveyor belts at x 140 and 340 running up the screen, gantries over them; the shift office at the left wall (the secret, t≈52).
      purpose: 'Warden Tanks alone first (t=30.5), then on both belts.'
  - name: Furnace Row
    end: 104
    speed: 130
    atmosphere: medium
    tiles: [furnace-floor]
    notes:
      layers:
        ground: rows of furnace vent grates across the floor between smelter stacks, one belt at x 240 between the rows, slag pools glowing orange.
        low-air: heat shimmer above the grates.
      purpose: 'The vents introduced alone (t≈64.5), then with waves; the Choir Herald; Shellbacks on the furnace road.'
  - name: Yard Approach
    end: 132
    speed: 120
    ramp: 2
    atmosphere: light
    tiles: [yard-apron]
    notes:
      layers:
        ground: the casting yard's two feed belts (x 100 and 380), two vent rows, the yard gate with a turret gantry (t≈115); the yard's slab floor enters at the top at the end.
      purpose: 'Mixed waves; the last tanks before the yard.'
  - name: Casting Yard
    end: 133   # the scroll eases to a halt over the arena's first second; the level clock halts here while the walker lives
    speed: 0
    arena: true
    hold_after_boss: 1   # s the clock stays halted after the walker's 2 s death chain (the wreck beat)
    atmosphere: light
    tiles: [casting-yard]
    notes:
      layers:
        ground: 'the casting yard filling the field: cast slabs, cooling moulds, molten channels (scenery, no damage), the vents cold.'
      purpose: 'The mid-boss (≈ 60 s at medium); the scroll halted while it lives.'
  - name: The Wreck
    end: 145
    speed: 20
    ramp: 2   # eased up from the halt over 2 s, then 10 s at the crawl
    atmosphere: light
    tiles: [casting-yard]
    notes:
      layers:
        ground: as section 5; the walker's **wreck** smoking where it fell, the filed plate turned up.
      purpose: 'Hint 2: the crawl past the wreck with Varga''s line and Okafor''s cut.'
  - name: South Gate
    end: 172
    speed: 150
    ramp: 2
    atmosphere: clear
    tiles: [slag-field]
    notes:
      layers:
        ground: the outbound belt, ingot stacks, the south gate and the plateau beyond; the crews' rovers leaving the tower (t≈160, scenery).
      purpose: 'Release; level end.'

boss:  # the mid-boss: it walks in from the top edge as the scroll halts (its intro pass) and walks its passes across the yard
  enemy: revenant-walker
  t: 132
  x: 240
  section: 5
  incoming: 3   # the boss warning 3 s before the halt (round 41's key; the walker's passes carry no edge warning)
  notes:
    from: top (its intro pass)
    waves: 'At the halt (the bar, the mini-boss sting, the boss checkpoint); its passes from every edge per its spec, without edge warnings; no other waves in the arena'

# The conveyor belts (design/campaign Level 19, Conveyors): 48 px wide, running up the screen at 40 px/s relative to the
# ground; each run from where its bottom end enters at the top edge to where its top end leaves at the bottom edge
# (ART-F2's belt pieces, tools/art/backdrop_l19.py --proposal: the runs lie where the pieces are drawn). Ground units on
# a belt ride it; the ship, Rook, pickups and bullets fly above. No nest stands on a belt (FoundryChecks).
belts:
  width: 48
  speed: 40
  runs:
    - {x: 140, from: 26.77, to: 67.85}    # section 2, the halls' first belt
    - {x: 340, from: 26.77, to: 67.85}    # section 2, the second
    - {x: 240, from: 66.77, to: 108.08}   # section 3, between the vent rows
    - {x: 100, from: 107.67, to: 147.73}  # section 4, the casting yard's feed belts (they run on under the halt)
    - {x: 380, from: 107.67, to: 147.73}
    - {x: 240, from: 147.72, to: 173.72}  # section 7, the outbound belt to the south gate

# The furnace vents (design/campaign Level 19, Hazards; Level 05's sleds the model): rows of grates 44 px across, each
# firing as a ripple from its first x every period: a grate glows for the tell, then its flame column stands for the
# burn, hitting the ship and Rook whatever their layer for `heavy` 10, once per burst; enemies and bullets pass. Cold
# from the arena on. Hard's ripple 0.3 s (step F2's default, pending round 42: 0.4 s would not fit a row of 4 into
# hard's 3 s period with its 0.9 s tell).
vents:
  width: 44
  tell: 1.2
  burn: 1.0
  period: 3.5
  ripple: 0.4
  bullet: heavy
  easy: {tell: 1.6, period: 5}
  hard: {tell: 0.9, period: 3, ripple: 0.3}
  rows:
    - {t: 64.5, xs: [110, 175, 305, 370]}   # the first row, alone: no wave reaches it (the mortar pair holds the screen)
    - {t: 72, xs: [370, 305, 175, 110]}
    - {t: 80.5, xs: [110, 175, 305, 370]}
    - {t: 87, xs: [370, 305, 175, 110]}
    - {t: 96, xs: [110, 175, 305, 370]}
    - {t: 112.5, xs: [180, 240, 300]}       # section 4: between the feed belts
    - {t: 122.5, xs: [300, 240, 180]}

