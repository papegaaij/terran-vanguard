# Level 18 – Dust Storm: the level script, rendered into README.md (briefing, threat profile, layout, waves, ground
# targets, radio, credit budget). Times are seconds from the level start. M7 part E, step E2, from the README's
# approved hand tables (round 36). Schema: ../../../tech/architecture/README.md#data-file-schemas
# Keys new in M7 part E (loaded and checked in step E2 by content's LevelData and StormChecks, mapped for the
# simulation in step E4, flown from steps E1/E3, drawn by step G1): the presentation key `visibility` (the dust
# storm's radius round the ship and its ramps; the simulation never reads it), the music's `motif` (track 9's motif
# stem from hint 1, off in the eye) and the ambience `mars-storm`; the Dust Devil's and the Ghost Drone's own blocks
# are in their stat blocks.
# The user's decision (2026-10-19): Level 18 meets the Act 2+ pacing and floor rules (PacingTest's Act 2 rule,
# ActFloorTest: 2.5 enemies on the screen and 10 enemy shots a minute with the plan's fit at medium) and joins
# `small_act_hp` (the Needler 12 HP, the Stinger 18): it stays the act's breather by threat (no boss, light groups, the
# calm eye in clear air), not by count. Defaults of the gap check built here (§1.5), pending the user's review in
# round 41: the anchor waves kept at their times (the Dust Devils at 41.5/77/116.5/138.5, the Ghost Drones at
# 69.5/87.5/131.5/145.5/166.5, the rear entries at 52/94.5/152.5, the Needler pincers at 80.5/159.5, the radio beats),
# filled to a wave about every 2.5 s (the eye included) with long-lived, firing, light groups (Needler line abreasts
# of 3-4, Stinger V-wings of 3, Dust Kite swarms of 6-7 that stay on the screen) and more spine/mortar nests along
# the pipelines; a ground nest on the screen in the hint-1 window (69.5-73.5, no Vrell air); the Needler pincers 2 per
# edge; the Skitters' rear entries line abreasts from the rear (the `rear ambush` formation is the Wraith's); a Dust
# Devil pair or trio a `pack`, each on its own path (its wander's centre line); hard: the firing groups one unit
# smaller (as Act 2's reworks), easy thinned by the formation lever. Step E4 tuned the waves to the floor (605
# enemies); the user's "tougher, not more" (2026-10-19) replaced that: step E5 rebuilt them from E2's plan with the
# beam era's HP (design/enemies `beam_era_hp`: small units ×2 from Level 18): Needler lines and Stinger V-wings one
# larger, E2's short Dust Kite V-wings and streams Stinger groups of 3, four light groups in the widest gaps.
# The backdrop is step ART-E's (tools/art/backdrop_l18.py --proposal, merged in step E4): tile sets north-plain,
# storm-plain, dry-lake; atmospheres 1 clear with the medium peak 20-25, 2 medium, 3 heavy, 4 light, 5 heavy, 6 light.
scroll_speed: 150     # the clear plains and the clearing; the front and the storm set their own
launch_seconds: 5     # from the bottom edge over the northern plains
bounty_scale: 0.37    # every bounty × 0.37: the typical haul on budget(18) 2,211 (step E5 with the beam era's HP, ≈ 101 a minute: typical 2,186, −1.1 %; 0.38 steps to +4.3 % as the rounded bounties step)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Mars, northern plains
  layers: [air, ground]
  density: 3
  traits: [homing, spread]
  hazards: [dust storm, half blind]   # "low visibility" overflowed the intel panel (step E4); Varga's "half blind"
  boss: none
  objective: SWEEP THE STORM   # the OBJECTIVE field from sensor L1
  varga:
    none: A dust storm on the plains. You'll fly half blind.
    l1: From every side, rear too. Ground vortices that pull.
    l2: "New: Dust Devils. And contacts I can't classify."
    l3: Homing sees through dust. Spread for the kites.
  notes:
    Dominant layers: '`air` (popcorn, Needler and Stinger groups, Ghost Drones, Wraiths), `ground` and `low-air` (Dust Devils, which rise to `low-air` when open; mortar and turret nests)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: 'Dust storm: visibility drops to a radius round the ship; Dust Devils pull the ship and the pickups'
    Boss / mid-boss: none
    Sensor-suite detail: 'none: storm plains, `air` + `ground`, front · L1: + directions (all), density {density}, hazard "dust storm, half blind", the objective `{objective}` and the secondary `KILL RATIO 65 %` · L2: + Dust Devil (new), Dust Kite, Skitter, Needler, Stinger, Mote Swarm, Wraith portraits, and a silhouette "unclassified, small, `air`" (the Ghost Drone stays unnamed before its first sight) · L3: + `homing` and `spread` highlighted, the wave strip marking the eye, 1 secret'

sections:  # back to back from t = 0; each speed change eased over 2 s (ramp); tiles and atmospheres ART-E's (tools/art/backdrop_l18.py)
  - name: Open Plains
    end: 25
    atmosphere: clear
    peak: {atmosphere: medium, from: 20, to: 25}   # the front's leading streaks
    tiles: [north-plain]
    notes:
      layers:
        deep: rust plain to the horizon, the storm wall standing on it.
        ground: dry channels, a buried pipeline, wind ripples.
        high-air: the front's leading streaks from t=20.
      purpose: Popcorn from t=6; the storm seen coming.
      visibility: full
  - name: Storm Front
    end: 55
    speed: 140
    ramp: 2
    atmosphere: medium
    tiles: [north-plain]
    notes:
      layers:
        high-air: the dust wall passing over the screen from the top edge (t=28), streaks ≤ 40 %.
        ground: the plain dimming into dust outside the radius.
      purpose: The radius ramps in; the Dust Devils alone (t=41.5).
      visibility: full → 170 px over t=28–36
  - name: Deep Storm
    end: 110
    speed: 120
    ramp: 2
    atmosphere: heavy
    tiles: [storm-plain]
    notes:
      layers:
        ground: as section 2 at full strength; a militia rover wreck half buried at x 60 (t≈90, the secret), its red beacon visible only inside the radius; the pipeline's spine-turret nests.
      purpose: Ghost Drones (hint 1, t=69.5); the first rear entries.
      visibility: 170 px
  - name: The Eye
    end: 130
    speed: 120
    atmosphere: light
    tiles: [dry-lake]
    notes:
      layers:
        deep: the sky clear overhead, the storm's walls round the field.
        ground: a dry lake bed, a Polyp Mortar floe (t≈125).
      purpose: A breather in clear air; the Dust Devil's core window learnt in plain sight.
      visibility: 170 → full over t=110–114; full; full → 150 over t=130–134
  - name: Back Wall
    end: 170
    speed: 120
    atmosphere: heavy
    tiles: [storm-plain]
    notes:
      layers:
        high-air: the storm's back wall, denser than the front, streaks at 40 %.
        ground: the plain gone outside the radius.
      purpose: Ghost Drone pincers and lines with Dust Devils; the hardest stretch.
      visibility: 150 px
  - name: Clearing
    end: 183
    speed: 150
    ramp: 2
    atmosphere: light
    tiles: [north-plain]
    notes:
      layers:
        ground: the dust thinning, the plain and the domes of Ares Landing on the horizon.
      purpose: Release; level end.
      visibility: 150 → full over t=170–176

# The dust storm (M6 = a, MA.2 = b; a look only: the simulation never reads it). The radius round the ship by level
# time at medium, each ramp easing from the radius before it (full view before the first) to its own; easy and hard
# their own radii. The Dust Devil's pull (130 px) always lies inside it (StormChecks).
visibility:
  radii: {deep: 170, wall: 150}   # px: the deep storm (sections 2-3), the back wall (sections 5-6)
  ramps:
    - {from: 28, to: 36, radius: deep}    # into the front: 8 s
    - {from: 110, to: 114, radius: full}  # into the eye: 4 s
    - {from: 130, to: 134, radius: wall}  # into the back wall: 4 s
    - {from: 170, to: 176, radius: full}  # out over the clearing: 6 s
  falloff: 120    # px: the soft ragged edge, centred on the radius, broken by two drifting noise fields (look b)
  easy: {deep: 200, wall: 180}
  hard: {deep: 150, wall: 130}

