radio:  # trigger: t or event; requires: escort = only while Rook flies (hired, fitted and not ejected)
  - {t: 1, speaker: Okafor, line: "Storm front on the northern plains, Lancer. Vrell are moving inside it. Sweep it before it reaches Ares Landing."}
  - {t: 14, speaker: Rook, requires: escort, line: "Can't see a thing in there. Sounds like home."}
  - {t: 22, speaker: Varga, line: "The front hits in a few seconds. Past your wingtips you'll see glow, not shapes. Bullets always show."}
  - {t: 41, speaker: Varga, line: "Vortex organisms. They pull. Shoot the core when the spin opens."}
  - {t: 49, speaker: Rook, requires: escort, line: "Six o'clock, Lancer! Coming up behind!"}
  - {t: 56, speaker: Varga, line: "We're in the thick of it. Trust the glow and the warnings."}
  - {t: 71, speaker: Varga, line: "That's not Vrell. That signature is... ours?"}
  - {t: 78, speaker: Okafor, line: "Later, Doctor. Eyes on the storm."}
  - {t: 86, speaker: Rook, requires: escort, line: "Grey ones fire straight. Watch for the red eye."}
  - {t: 93, speaker: Varga, line: "Cloakers at your back. Homing finds them before they show."}
  - {t: 111.5, speaker: Varga, line: "We're in the eye. Clear sky for a minute. Enjoy it."}
  - {t: 127.5, speaker: Okafor, line: "Back wall of the storm ahead. It's thicker than the first."}
  - {t: 146, speaker: Rook, requires: escort, line: "Grey drones on both flanks. Same red eyes."}
  - {t: 168, speaker: Okafor, line: "Clear air ahead, Lancer. Bring it home."}
  - {event: secondary-objective, speaker: Okafor, line: "Clean sweep. Nothing in that storm will reach the domes.", notes: {trigger: Secondary met (at the end)}}
  - {event: level-end, speaker: Okafor, line: "The front is breaking up over the plains. Come home, Aegis."}

objectives:
  primary: reach-end
  secondary: {kill_ratio: 0.65, credits: 100, name: Clean sweep}   # at least 65 % of the level's enemies, judged at the end (100 in Act 1 terms: pays 256)

music:
  track: 9            # Act 3 B "Grey Signal" (audio/music track list)
  start_section: 2    # the plains wind alone in section 1, the base stem from the front
  full_section: 5     # the full mix with the motif in the back wall
  stems: {4: base, 6: base}   # the base stem in the eye and out over the clearing
  motif: {from: 69.5, sections: {4: false}}   # Vorne's motif layer from the Ghost Drones' first sight (hint 1), off in the eye
  ambience: mars-dust   # the plains wind in section 1
  ambience_changes:
    - {section: 2, ambience: mars-storm, crossfade: 3}   # the recorded front (round 36 S.5 = a) from t=25
    - {section: 4, ambience: mars-dust, crossfade: 4}    # the eye: a light wind
    - {section: 5, ambience: mars-storm, crossfade: 4}   # the back wall
    - {section: 6, ambience: mars-dust, crossfade: 4}    # the clearing
  end_jingle: mission-complete

difficulty: {}  # the radii are in visibility (easy 200 / 180, hard 150 / 130); hard's extra Wraith pair is its wave (skip); the firing groups' hard counts are in their waves; the formation lever sizes the rest; the stat blocks' hooks apply (the Ghost Drone's 2- and 4-shot bursts and hard second pass, the Dust Devil's easy window and pull, hard spiral and pull, the Wraith's hard hold)

briefing:
  pages:
    - {speaker: Okafor, image: level-18-storm-front, line: "A storm front is crossing the northern plains with Vrell inside it. Sweep it before it reaches Ares Landing. And Lancer: what Doctor Varga said about the Helix compound stays in this room."}
    - {speaker: Varga, image: level-18-visibility, line: "In the dust you'll see glow, not shapes, past a few ship-lengths. The Vrell glow; bullets always show. Homing guns find what your eyes can't."}
  teaser: {speaker: Rook, line: "Sandstorm on the plains. Bring homing, or bring luck. I'm bringing both."}

backdrop:
  # Presentation only: Dust Storm (tools/art/backdrop_l18.py, from mars-storm-plains-r36-a and the radius look b).
  # The ground is opaque; no deep layer (the README's horizon and the storm wall standing on it cannot show
  # under a top-down ground: the wall is the high-air front passing over, the domes Ares Landing's outskirts
  # ahead at the end; pending round 41). The storm's veil and tongues (storm-veil, storm-veil-drift,
  # storm-tongues-a/-b in the same folder) are StormLooks' textures, not backdrop pieces.
  # Seams and the eye's walls sit at exact rows: re-run `backdrop_l18.py --proposal` after the data moves a section.
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2}   # far unused (no deep layer: the ground is opaque); high-air 2.0 as ART-E built and rendered it (E2's placeholder had 2.2; step E4 took ART-E's)
  ramp: 3
  haze_colour: d6a670  # the butterscotch sky (mars_r36.SKY)
  atmosphere:
    clear: {haze: 0.04}   # section 1 before the front: haze only
