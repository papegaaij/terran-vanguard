briefing:
  pages:
    - {speaker: Okafor, image: level-16-canyon-route, line: "Ares Landing is two thousand kilometres east, and the one road the Vrell don't hold from the air is the Valles Marineris. Fly it fast and keep off the walls. Rook, stay on Lancer's tail in the narrows."}
    - {speaker: Varga, image: level-16-tendril-scan, line: "They grow barriers across the canyon: an anchor on each wall and a burning tendril between. Kill either anchor and it falls; a beam burns through the tendril. Something long crawls along the walls, too."}
  teaser: {speaker: Rook, line: "Canyon run. Walls on both sides and nowhere to swerve. Scrape the paint and I'm telling Okafor."}

backdrop:
  # Presentation only: Valles Canyon Run (tools/art/backdrop_l16.py, from canyon-walls-r36-b and mars-valles-r36-a).
  # The walls are NOT pieces: their geometry is the level's `terrain`, projected by the game (WallProjection) from
  # the foot (1.0) to the plateau's rim (1.25) in steps (cliffs and talus benches set back toward the rock, side
  # canyons in the rim: CanyonProfile, round 40) with the textures canyon-wall (128x1280: columns the steps' strata
  # foot -> rim, rows along the wall), wall-foot (24x512, the foot band, column 0 at the collision line), the
  # buttes' mesa-face/pillar-face and caps mesa-top_0..2 (three slices, far end first) and pillar-top; the
  # `plateau` layer (x1.25) shows only beyond the rims, its pieces kept clear of the rock. No deep
  # layer: the ground covers the screen; section 1's Noctis cracks show the far layer (x0.6) through them.
  scroll_factors: {far: 0.6, ground: 1, plateau: 1.25, low-air: 1.35, high-air: 2.2}
  ramp: 3
  haze_colour: d6a670  # the butterscotch sky (mars_r36.SKY)
  atmosphere:
    clear: {haze: 0.06}   # the outflow's clear air (t 178-190): haze only
    light: {banks: dust-veil, haze: 0.12}   # thin dust veils along the canyon
    medium: {banks: narrows-dust, haze: 0.2}   # the narrows' dust (section 5; the rapids' peak 110-120)
  tile_sets:
    noctis-chasm: {layer: far, height: 960}   # section 1: the chasm floor deep below the cracks (talus, rubble), hazed
    noctis-plateau: {layer: ground, height: 960}   # section 1: the plateau east of Lycus cracking into the labyrinth's graben; the cracks transparent onto the far layer
    canyon-floor: {layer: ground, height: 960}   # sections 2, 3, 5: the floor, wind ripples along the canyon, a dry channel, boulders
    riverbed: {layer: ground, height: 960}   # section 4, the Coprates rapids: braided scoured channels, streamlined bars, cobbles
    eos-chaos: {layer: ground, height: 960}   # section 6: the outflow's sand floor (x 130-350, the Burrowers') between the chaos terrain's blocks
    plateau: {layer: plateau, height: 960}   # the plateau's pale top beyond the walls' rims, dendritic gullies draining into the big side canyons (they repeat with the tile; the islands' caps are their own)
    dust-streaks: {layer: high-air, height: 960}   # sections 1, 2, 4: dust streaks blown along the canyon (additive at 40 %)
    dust-veil: {layer: low-air, height: 960, drift: 0}   # light: thin dust veils along the canyon, ~10 %, at most 30 % opaque
    narrows-dust: {layer: low-air, height: 960, drift: 0}   # medium: the narrows' dust (and the rapids' 110-120), ~25 %, at most 45 % opaque
  pieces:
    canyon-mouth: {layer: ground, size: [480, 1264]}   # the Noctis plateau's cracks closing into the canyon floor (exact rows)
    seam-rapids: {layer: ground, size: [480, 320]}   # section 4's seam: the floor into the rapids' riverbed (exact rows)
    seam-narrows: {layer: ground, size: [480, 320]}   # section 5's seam: the riverbed back into the floor (exact rows)
    seam-eos: {layer: ground, size: [480, 320]}   # section 6's seam: the floor into the outflow's sand and chaos (exact rows)
    cliff-road: {layer: ground, size: [120, 1600]}   # the colonists' road along the right wall's foot, ruts, a broken rail (the cargo rovers)
    habitat-pad: {layer: ground, size: [96, 64]}   # a burnt cliff habitat's landing pad at a wall's foot (the Spine Turret pair)
    cliff-habitat: {layer: ground, size: [64, 160]}   # a FACE PATCH, not a flat piece: a burnt habitat cut into a wall's red middle cliff (64 columns the cliff's foot to its top, 160 rows); the game draws it on that step (placements below)
    helix-station: {layer: plateau, size: [126, 161]}   # Helix's research station on the north plateau: black and gold, lit, unlabelled, untouched
    dust-plume: {layer: low-air, size: [72, 72]}   # a dust plume in the canyon, at most 45 %
    arch-a: {layer: high-air, size: [480, 160]}   # a rock arch over the canyon, alpha <= 53 % (x the 75 % overhead pass: <= 40 %)
    arch-b: {layer: high-air, size: [480, 192]}   # a thinner, broken-backed arch with a lower span, alpha <= 53 %
  placed:
    # 1. the canyon mouth: Noctis's cracks close into the canyon floor after the walls begin (exact rows)
    - {piece: canyon-mouth, t: 23.4316, x: 240}
    # the section seam under seam-rapids (exact rows; re-run after the data moves a section's start)
    - {piece: seam-rapids, t: 96.2826, x: 240}
    # the section seam under seam-narrows (exact rows; re-run after the data moves a section's start)
    - {piece: seam-narrows, t: 126.361, x: 240}
    # the section seam under seam-eos (exact rows; re-run after the data moves a section's start)
    - {piece: seam-eos, t: 161.4, x: 240}
    # 4. the cliff road along the right wall's foot under the cargo rovers
    - {piece: cliff-road, t: 108.872, x: 324}
    # 4. a burnt habitat's pad at the left wall's foot under the Spine Turret pair
    - {piece: habitat-pad, t: 105.104, x: 100}
    # 4. the Helix research station on the north (right) plateau, beside the widest stretch (plateau layer x1.25)
    - {piece: helix-station, t: 116.067, x: 412}
    # 4. two rock arches over the rapids (overhead pass: arch-a, arch-b in Backdrop.OVERHEAD_PASSES)
    - {piece: arch-a, t: 101.5, x: 240}
    - {piece: arch-b, t: 117, x: 240}
    # 2-5. dust plumes in the canyon (low-air), every 6.5 s along the middle
    - {piece: dust-plume, t: 28, x: 210, repeat: {count: 20, every: 6.5}}
    - {piece: dust-plume, t: 31.3, x: 270, repeat: {count: 19, every: 6.5}}
    # face patches: cliff-habitat drawn on a wall's face (the game's WallProjection), not as a flat piece; the side
    # from x (left of 240: the left wall), t puts its centre on terrain rows 6,600, 8,350, 10,400 and 20,180
    - {piece: cliff-habitat, t: 35.625, x: 32}
    - {piece: cliff-habitat, t: 44.375, x: 448}
    - {piece: cliff-habitat, t: 54.625, x: 32}
    - {piece: cliff-habitat, t: 105.522, x: 448}
  # Atmospheres as the README's Layout: 1-4 light (4: a medium peak 110-120 for the rapids' dust), 5 medium, 6 light with a clear peak 178-190.
