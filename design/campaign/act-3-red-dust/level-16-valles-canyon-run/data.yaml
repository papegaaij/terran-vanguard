  - {event: first-wall-contact, speaker: Okafor, line: "Mind the walls, Lancer. They don't give.", notes: {trigger: "First wall touch (`first-wall-contact`)"}}
  - {t: 33, speaker: Varga, line: "Barrier ahead. Two anchors on the walls: kill either one and it falls."}
  - {t: 47, speaker: Varga, line: "Kill an anchor and the tendril drops. Ordinary shots pass straight through it."}   # round 39 R.4: no beam promised (the plan has none at L16)
  - {t: 60, speaker: Okafor, line: "The canyon splits ahead. Pick a side and commit."}
  - {t: 81, speaker: Varga, line: "Movement on the left wall. Something long."}
  - {t: 94, speaker: Rook, requires: escort, line: "Coprates rapids. And Okafor calls this a road."}
  - {t: 114, speaker: Varga, line: "That's the Helix research station on the rim. Vrell all round it, and not a scratch."}
  - {t: 126, speaker: Okafor, line: "Eyes on the canyon, Doctor."}
  - {t: 146, speaker: Ares Control, portrait: generic-colonial, line: "Eos outflow ahead. You're nearly through, Aegis."}
  - {event: secondary-objective, speaker: Ares Control, portrait: generic-colonial, line: "Every barrier down. The road east is open.", notes: {trigger: "Secondary met (`secondary-objective`)"}}
  - {t: 166, speaker: The Choir, distorted: true, line: "[the Choir sings]"}   # step VOX-C: 162 -> 166, past the secondary's line when gate 6 is decided as late as t=159
  - {t: 173, speaker: Varga, line: "The singing is louder out east. Toward Ares Landing."}   # step VOX-C: 169.5 -> 173, after the Choir
  - {t: 180, speaker: Okafor, line: "Ares Landing has you on its scopes. Bring it home."}
  - {event: level-end, speaker: Okafor, line: "Canyon run complete. The domes are yours to hold now. Get some sleep."}

