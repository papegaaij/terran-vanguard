# Level 16 – Valles Canyon Run: the level script, rendered into README.md (briefing, threat profile, layout, wall
# table, waves, ground targets, radio, credit budget). Times are seconds from the level start. M7 part C, step C2,
# from the README's approved hand tables (round 36). Schema: ../../../tech/architecture/README.md#data-file-schemas
# Keys new in M7 part C (loaded and checked in step C2, flown by the simulation from steps C1/C3/C4): `terrain` (the
# walls' and islands' collision lines and the contact), a linked nest's `link: pairs` (the gates), a wave's `crawl`
# path (the Threadcrawlers), the `links` secondary, the radio event `first-wall-contact`.
# Defaults of the gap check built here, pending the user's review in round 39: the gates as linked enemy nests among
# the ground targets (moved from the README's wave table), the crawlers crawl up-canyon (the head along increasing
# rows) and the t=160 one crosses the floor from wall to wall (Q.22c), the walls' height ramps from 0 at the canyon
# mouth (scroll 2,850) to full by 4,180 and back to 0 over the outflow (31,250 to 34,850).
scroll_speed: 200     # the canyon; the plateau, the gate stretches and the rapids set their own
launch_seconds: 5     # from the rail head at Lycus (a CDF field pad, scenery)
bounty_scale: 0.54    # every bounty × 0.54: TypicalHaulTest (step C4): typical 1,944 on budget(16) 1,931 (+0.7 %)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Mars, Valles Marineris
  layers: [ground, air]
  density: 4
  traits: [forward, piercing]   # round 39 R.4: no beam (the plan buys the Ion Beam at L18); every gate falls to an anchor kill
  hazards: [canyon walls, barriers]
  boss: none
  objective: REACH ARES LANDING   # the OBJECTIVE field from sensor L1
  varga:
    none: The Valles Marineris, Lancer. Walls on both sides, and the Vrell have strung it shut.
    l1: "Everything comes from ahead. The walls are the danger: keep off them."
    l2: "New: tendril barriers on the walls, and a long crawler."
    l3: Kill an anchor to drop a tendril. A cache down the left fork.
  notes:
    Dominant layers: '`ground` (tendril anchors, Threadcrawlers and turrets at the walls'' foot, a Burrower field on the outflow''s floor), `air`; `low-air` dust plumes and `high-air` rock arches (scenery)'
    Attack directions: '{directions}'
    Density: '{density}'
    Recommended traits: '{traits}: `piercing` for the Threadcrawler; an anchor kill drops each tendril (a beam also burns it, once the ship has one: the plan buys the Ion Beam at Level 18)'
    Hazards: '**Canyon walls** (terrain collision: 10 per touch and a push-back), **tendril barriers** (6 per touch)'
    Boss / mid-boss: none
    Sensor-suite detail: 'none: Mars, Valles Marineris, `ground` + `air`, front · L1: + directions, density {density}, hazards "canyon walls" and "barriers", the objective `{objective}` · L2: + Tendril Anchor (new), Threadcrawler (new), Dust Kite, Skitter, Needler and Mantis portraits; no boss · L3: + `forward` and `piercing` highlighted, the wave strip marking the six barriers and the two crawlers, 1 secret'

sections:  # back to back from t = 0; each speed change eased over 1 s (ramp)
  - name: Noctis Edge
    end: 25
    speed: 190
    atmosphere: light
    tiles: [noctis-chasm, noctis-plateau, plateau, dust-streaks]
    notes:
      layers:
        ground: the plateau east of Lycus, the labyrinth of Noctis cracking into chasms; from t=15 the ship drops into the canyon mouth, the floor becomes the ground layer and the walls rise at the field's edges.
        far: the first canyon floor through the cracks.
        high-air: thin dust.
      purpose: Popcorn on the plateau; the walls close in (480 → 400 px) with nothing on them.
  - name: Into the Canyon
    end: 60
    speed: 200
    ramp: 1
    atmosphere: light
    tiles: [canyon-floor, plateau, dust-streaks]
    notes:
      layers:
        ground: the canyon floor, a dry riverbed, with ledges at the walls' foot. The walls rise toward the camera to the plateau (1.25), burnt cliff habitats of the colonies on their faces (scenery).
        low-air: dust plumes in the canyon.
      purpose: Gate 1 alone (t=34), gates 2 and 3; the first ledge turrets and mortars.
  - name: Fork One
    end: 95
    speed: 180
    ramp: 1
    atmosphere: light
    tiles: [canyon-floor, plateau]
    notes:
      layers:
        ground: A **mesa** (rock island) splits the canyon into two 150 px channels from t=66 to t=80, the left channel past the **Candor relay hut** at the left wall's foot (the secret), the right channel past a turret ledge at the mesa's foot.
      purpose: The branch (M3 = a); the Threadcrawler's first sight along the left wall (t=84) after the channels rejoin.
  - name: Coprates Rapids
    end: 125
    speed: 230
    ramp: 1
    atmosphere: light
    peak: {atmosphere: medium, from: 110, to: 120}   # the dust in the rapids
    tiles: [riverbed, plateau, dust-streaks]
    notes:
      layers:
        ground: a rock pillar mid-canyon (t≈100), an S-bend, the cliff road along the right wall's foot with stranded cargo rovers; from t≈113 the **Helix research station** on the wide north (right) plateau, lit, pads intact.
        high-air: two rock arches passing over the canyon (scenery, ≤ 40 % where they cross the field).
      purpose: Speed; the dodge round the pillar; the Helix glimpse (radio). No gates.
  - name: The Narrows
    end: 160
    speed: 180
    ramp: 1
    atmosphere: medium   # dust in the narrows
    tiles: [canyon-floor, plateau]
    notes:
      layers:
        ground: the walls close to **180 px** (t=140–148) and stand at their tallest, the floor in their shadow; mortar ledges at their foot.
      purpose: Gates 4–6 in the narrowing canyon; Rook tucks in behind.
  - name: Eos Outflow
    end: 190
    ramp: 1
    atmosphere: light
    peak: {atmosphere: clear, from: 178, to: 190}   # clear from 178
    tiles: [eos-chaos, plateau]
    notes:
      layers:
        ground: the canyon opens onto the outflow's chaos terrain and its sand floor (the walls sinking back to the floor's level by t≈182), a turret nest on the floor.
      purpose: The second Threadcrawler, a Burrower field on the sand, the last waves; the level ends as the walls leave the field.

