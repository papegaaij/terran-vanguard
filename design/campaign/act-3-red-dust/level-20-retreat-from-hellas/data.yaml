# Level 20 – Retreat from Hellas: the level script, rendered into README.md (briefing, threat profile, layout, waves,
# ground targets, radio, credit budget). Times are seconds from the level start. M7 part G, step G2, from the README's
# approved hand tables (round 36). Schema: ../../../tech/architecture/README.md#data-file-schemas
# Keys new in M7 part G (loaded and checked in step G2 by content's LevelData and RetreatChecks; flown from steps G1
# (the reverse scroll) and G3 (the pursuit), mapped in step G4, drawn by steps GA/GB): a section's **negative speed**
# (the ground moving up the screen: the retreat; its `ramp` eases through zero at the turnabout), the `pursuit`
# formation with its wave's `pursuit` block (`break_at`, the refills; the rest from the Mote Swarm's own `pursuit`
# block), a front wave's `warning` in a reversed section (the three BOTTOM lessons), the music's `ambience_layers`
# (the basin rumble), the flak's `band: top` (the rim guns) and the backdrop's `strip` (the ground keyed by strip row,
# its pieces by `row`).
# Entries are BY TRAVEL (M5 = a): `from: front` is the top edge in section 1 and the bottom edge once the scroll is
# reversed (t > ~22.1), `from: rear` the top edge there. A wave's `paths` and `at` and a field's area are written in
# the travel frame (as for a forward level: y below the entry edge); the simulation flips the units that spawn while
# the travel is reversed. Ground targets enter at the bottom edge in a reversed section and carry no `arc` (the frame
# turns a nest's arc).
# Defaults of the gap check built here (m7g-gaps §1.5; the user's answers of 2026-10-20 §4), pending the user's review
# in round 43: "tougher, not more", count-neutral: the approved anchors kept at their times (the pursuits at 24 and 124
# with their refills and break-offs at 108 and 163, the BOTTOM lessons 27.5/31.5/35.5, the Burrower fields
# 35.5/52.5/87/150, the Dust Devil pairs 44/133.5, the Wraith pairs 59/101/146.5 (hard + 80), the Stinger V at 71, the
# Needler lines 48.5/79/141.5, the nests 42/85/140, the mortars 60/100, the cache 92, the patch 117, every radio beat);
# 8 of the bottom popcorn threes turned into firing threes (Needler line abreasts at 40, 63, 94.5, 137.5; Stinger
# V-wings at 56.5, 75, 129.5, 154: the beam era's HP, `small_act_hp` + `beam_era_hp`, Needler 24, Stinger 36, against
# the rear guns); three spine nests ×3 added (t≈66 basin floor, ≈96 terrace step, ≈155 rim road); the lull's kite
# pairs Dust Kite flocks of 4 at the edges (no PacingTest exception, the user's Q.1). Hard: the firing groups one
# smaller, the extra Wraith pair; easy by the formation lever. Rook flies his Autocannon at this visit (the balance
# plan's `fit` at "20", the user's Q.2).
# Step G4 (measured with `levelReport -Plevel=20`, the plan's fit, its retreat play; two passes, pending the user's
# review in round 43): the beam killed every forward wave and the pursuit on entry, so the screen was empty 8 times over
# 2 s at medium (the strike, the turnabout, the swarm's entry, the lull). Added: three strike waves (t=11.5, 15, 18.5),
# Needler pincers from the sides at 22.5 and 25.5 (through the turnabout and beside the swarm's entry) and the lull as
# six kite flocks of 3, 2.5 s apart (110.5–123), not three of 4 (the homing missiles take a flock in about a second).
# Count back to ≈ 197: the firing threes are pairs on every difficulty (the rear guns serve one unit at a time), the
# Stinger V at 71 a three, the Burrower fields at 52.5, 87 and 150 pairs (the lesson at 35.5 stays a three).
# The backdrop is step ART-G1's (tools/art/backdrop_l20.py --proposal, merged in step G2): a strip keyed by row.
scroll_speed: 140     # the strike; the retreat's sections set their own (negative)
launch_seconds: 5     # from the bottom edge over the basin floor
bounty_scale: 0.83    # every bounty × 0.83: the typical haul on budget(20) 2,532 (step G4, from the tuned waves: levelReport's haul; step G2's paper value 0.77)
control_prompts: []
threat_profile:  # the hangar intel panel (design/ui/hangar) and the README's Threat profile table
  setting: Mars, Hellas basin
  layers: [air, ground]
  density: 4
  traits: [rear, homing]
  hazards: [reverse scroll, fallback under pursuit]
  boss: none
  objective: FALL BACK TO THE RIM   # the OBJECTIVE field from sensor L1
  varga:
    none: Hellas basin. The Vrell are massing on the floor.
    l1: If we fall back, the swarm will be on your nose.
    l2: Swarms, Burrowers, Dust Devils. Cloakers too.
    l3: Rear guns clear the road. Spread holds the swarm.
  notes:
    Dominant layers: '`air` (popcorn, Needler and Stinger groups, the pursuit swarm, Wraiths), `ground` (Burrowers, Dust Devils, turret and mortar nests)'
    Attack directions: '{directions} (by travel: front = ahead, the bottom edge once reversed; rear = behind, the top)'
    Density: '{density}'
    Recommended traits: '{traits}'
    Hazards: 'Reverse scroll from t≈22: the ground moves up the screen; a pursuing swarm lunging from the top'
    Boss / mid-boss: none
    Sensor-suite detail: 'none: Hellas basin, `air` + `ground`, front · L1: + directions (all, "reverse scroll"), density {density}, hazard "fallback under pursuit", the objective `{objective}` and the secondary `KILL RATIO 65 %` · L2: + Mote Swarm, Dust Kite, Skitter, Needler, Stinger, Wraith, Burrower, Dust Devil portraits · L3: + `rear` and `homing` highlighted, the wave strip marking the turn and the lull, 1 secret'

sections:  # back to back from t = 0; signed speeds (M5 = a): negative = the ground moves up the screen; each speed change eased (ramp: the turnabout 4 s through zero at ≈ 22.1, the retreat's 2 s, the rim's 8 s); the ground's tiles come from the backdrop's strip, by row
  - name: The Strike
    end: 20
    atmosphere: light
    tiles: []
    notes:
      layers:
        ground: 'dunes, salt flats, the first Vrell growth; from t≈12 a **travelling ridge** (≈ 900 px, the [Dust Colossus](../../../enemies/bosses/dust-colossus/README.md)''s body, scenery) crosses the floor near the top edge, dunes heaving.'
      purpose: A short normal-scroll opener; the ridge foreshadows Level 21.
  - name: Turnabout
    end: 26
    speed: -120
    ramp: 4   # +140 → −120 over t=20–24, through zero at ≈ 22.1
    atmosphere: medium
    tiles: []
    notes:
      layers:
        ground: as section 1; the ridge's wake boiling with Vrell at the top.
      purpose: The reversal; the pursuit swarm enters from the top (t=24).
  - name: Basin Floor
    end: 70
    speed: -130
    ramp: 2
    atmosphere: light
    tiles: []
    notes:
      layers:
        ground: 'the floor seen again, then new dunes; a dune ridge with a turret nest (t≈42), mortars in the salt flats (t≈60), a nest on the floor (t≈66).'
      purpose: 'The first retreat: the swarm above, ambushes from below.'
  - name: The Terraces
    end: 108
    speed: -120
    ramp: 2
    atmosphere: light
    tiles: []
    notes:
      layers:
        ground: 'the basin''s terrace steps rising from the bottom edge, sand on each step (Burrowers), turret nests on the steps (t≈85, 96), the outpost''s emergency cache on a ledge (t≈92), mortars (t≈100).'
      purpose: Mixed; the swarm drops back at the end.
  - name: The Lull
    end: 124
    speed: -100
    ramp: 2
    atmosphere: clear
    tiles: []
    notes:
      layers:
        ground: a wide upper terrace, wind-carved pillars.
      purpose: 'A breather: Dust Kite flocks at the edges only; Rook''s quiet line; the armour patch.'
  - name: Rim Road
    end: 160
    speed: -140
    ramp: 2
    atmosphere: light
    tiles: []
    notes:
      layers:
        ground: 'the rim road''s switchbacks coming up from the bottom, abandoned militia crawlers, turret nests on the road (t≈140, 155).'
      purpose: The second pursuit, the last ambushes.
  - name: Over the Rim
    end: 172
    speed: -60
    ramp: 8   # −140 → −60 over t=160–168
    atmosphere: clear
    tiles: []
    notes:
      layers:
        ground: 'the rim''s lip rising from the bottom, the militia guns firing up past the ship (flak bursts in the top band, scenery), the plain beyond.'
      purpose: Release; the swarm breaks off; level end.

