  end_jingle: mission-complete

flak: {from: 160, every: 1.5, band: top}   # presentation: the rim guns firing up past the ship, bursts in the top band among the pursuers, hitting nothing (the frigate's flak sound, as Level 17's militia)
ridge: {t: 12, seconds: 8, from: left, to: right, depth: 70}   # presentation (round 43 Q.4): the Dust Colossus's travelling ridge surfaces off the left edge at t=12, 70 px below the top edge, its head off the right edge 8 s later on a slow S up the strip, the tail gone by t≈27; hitting nothing (Level 21's ridge pass uses the same key)

difficulty: {}  # the pursuit's easy and hard lunges and tells are in the Mote Swarm's hooks; the TOP warnings' easy 4 s are in their waves; hard's extra Wraith pair is its wave (skip); the firing pairs stay pairs on hard (step G4); the formation lever sizes the rest (the swarm 8 / 12 on entry, refills of 2 / 4); the stat blocks' hooks apply (the Burrowers' rings, the Dust Devils' pull and spiral, the Wraiths' hard hold)

briefing:
  pages:
    - {speaker: Okafor, image: level-20-hellas-fallback, line: "We hit the Vrell staging grounds on the Hellas floor. If it turns, you fall back to the rim: nose to the enemy, rear guns clearing the road. Doctor Varga's walker report comes to me alone."}
    - {speaker: Varga, image: level-20-filed-plate, line: "That walker's plate, Lancer. Filed by hand, not worn. I'm told to leave it. On the basin floor: Burrowers, Dust Devils, and swarms. A lot of swarms."}
  teaser: {speaker: Rook, line: "Hellas. Big hole, lots of bugs. Pack a tail gun, just in case."}

backdrop:
  # Presentation only: Retreat from Hellas (tools/art/backdrop_l20.py, from mars-hellas-r36-a; step ART-G1's
  # proposal briefs/l20-backdrop.yaml, merged in step G2). The ground is opaque; no deep layer (pending round 43).
  # M7 part G: the ground is a STRIP keyed by strip row (strip row = strip.origin + the ground scroll + y, y counted
  # up from the screen's bottom edge), not by section: Level 20 flies back over ground it has shown. A tile's pixel
  # row is floorMod(strip row, height) from the image's bottom; ground pieces are placed by `row` (their centre's
  # strip row), not `t`. The rows do not move with the data's timing; re-run `backdrop_l20.py --proposal` only to
  # re-align the dune ridge with its nest (it reads the data).
  scroll_factors: {far: 0.5, ground: 1, low-air: 1.35, high-air: 2}   # far and high-air unused (no deep layer, no high-air art), given as the loader asks
  ramp: 3
  haze_colour: d6a670  # the butterscotch sky (mars_r36.SKY)
  atmosphere:
    clear: {haze: 0.04}   # the lull and over the rim: haze only
    light: {banks: basin-haze, haze: 0.06}   # the floor, the terraces, the rim road: faint dust
    medium: {banks: ridge-dust, haze: 0.09}   # the turnabout: the ridge's wake
  strip:
    origin: 15360   # the strip row at the screen's bottom edge at t=0 (row 0: the bottom edge at the end)
    zones:   # the ground's tile set by strip row, [from, to); the ends lie beyond any scroll
      - {from: -4800, to: 400, tiles: [rim-plain]}   # beyond the rim
      - {from: 400, to: 6080, tiles: [rim-slope]}   # 6. the rim road's switchbacks
      - {from: 6080, to: 7640, tiles: [upper-terrace]}   # 5. the lull
      - {from: 7640, to: 12240, tiles: [terraces]}   # 4. the terraces
      - {from: 12240, to: 14400, tiles: [basin-flats]}   # 3. the salt flats (the t~60 mortars)
      - {from: 14400, to: 16200, tiles: [basin-dunes]}   # 3. the dune sea (the t~42 ridge)
      - {from: 16200, to: 20160, tiles: [basin-flats]}   # 1-3. the staging grounds
  tile_sets:
    basin-flats: {layer: ground, height: 960}   # the basin floor's salt flats under drifted sand (the staging grounds, the mortars' flats)
    basin-dunes: {layer: ground, height: 960}   # the dune sea, crests across the screen
    terraces: {layer: ground, height: 960}   # the basin wall's terraces: four steps of layered rock a tile, sand on the treads
    upper-terrace: {layer: ground, height: 960}   # the lull's wide upper terrace: wind-fluted bedrock pavement
    rim-slope: {layer: ground, height: 960}   # the rocky slope below the rim with the rim road's switchbacks (two legs a tile)
    rim-plain: {layer: ground, height: 960}   # beyond the rim: the rust plain
    basin-haze: {layer: low-air, height: 960, drift: 5}   # light: faint ochre dust, at most 25 %
    ridge-dust: {layer: low-air, height: 960, drift: 8}   # medium (the turnabout): the ridge's wake, at most 35 %
  pieces:
    seam-road: {layer: ground, size: [480, 320]}   # the upper terrace onto the rim slope and its road (exact rows)
    seam-upper: {layer: ground, size: [480, 320]}   # the last terrace riser onto the upper terrace (exact rows)
    seam-terraces: {layer: ground, size: [480, 320]}   # the salt flats onto the first terrace riser (exact rows)
    seam-flats: {layer: ground, size: [480, 320]}   # the dune sea onto the salt flats (exact rows)
    seam-dunes: {layer: ground, size: [480, 320]}   # the staging grounds' flats onto the dune sea (exact rows)
    rim-lip: {layer: ground, size: [480, 320]}   # the rim's crest: the slope's lit face, the back slope onto the plain, the road's track (exact rows)
    dune-ridge: {layer: ground, size: [400, 136]}   # a sharp dune ridge across the field: the t~42 turret nest on its crest
    vrell-growth-a: {layer: ground, size: [160, 120]}   # Vrell growth on the staging grounds
    vrell-growth-b: {layer: ground, size: [120, 96]}   # Vrell growth, smaller
    vrell-growth-c: {layer: ground, size: [200, 140]}   # Vrell growth, larger
    hellas-pillar-a: {layer: ground, size: [160, 160]}   # a wind-carved pillar on the upper terrace (cap rock, neck, shadow)
    hellas-pillar-b: {layer: ground, size: [112, 112]}   # a smaller pillar
    hellas-pillar-c: {layer: ground, size: [168, 160]}   # a twin pillar
    militia-crawler-a: {layer: ground, size: [64, 64]}   # an abandoned militia crawler along road leg a (nose down-right)
    militia-crawler-b: {layer: ground, size: [64, 64]}   # an abandoned militia crawler along road leg b (nose down-left)
    militia-crawler-wreck: {layer: ground, size: [64, 64]}   # a burnt militia crawler off the road
    rim-gun-a: {layer: ground, size: [64, 64], frames: 4, fps: 6}   # the militia's twin flak gun on the rim's lip, firing up (flash on frame 0)
    rim-gun-b: {layer: ground, size: [64, 64], frames: 4, fps: 6}   # the same gun, its flash on frame 2
  placed:   # ground pieces by strip row (their centre)
    # the zone seams, centred on their boundaries (exact rows)
