# Act 3 – Red Dust: its levels and the act intro (title card and the four intro pages), rendered into
# README.md (Act intro and outro), and its act-end outro after Level 21 (M7 part H, step PH2: the four approved pages,
# the text unchanged, one paragraph each, each with its image). M7 part B, step B2. M8 part B (step B2): no `next_act`
# any more: Act 4 is built from Level 22 on, so its outro leads to Act 4's intro; Act 4 names the next act in part H.
# Schema: ../../tech/architecture/schemas-levels/README.md
levels: [15, 21]

title_card:  # over the act's still (ui/act-3-red-dust-still.png, tools/art/act_stills.py act-3 from Level 15's backdrop): Mars from the entry corridor, Olympus Mons far below through thin cirrus
  act: ACT III
  name: RED DUST
  line: Mars · June 2185

briefing:  # three pages by Commander Okafor, one by Dr. Varga (approved in round 36), each voiced and with its image (tools/art/briefing_images.py)
  - {speaker: Okafor, expression: grim, image: act-3-arrival, line: "Nine days at full burn. Ares Landing has now held alone for five weeks: no fleet, no supply drops, only militia guns and the air its domes still make. Every colony on Mars is cut off from every other."}
  - {speaker: Varga, image: act-3-mars-front, line: "The Vrell came down in the Hellas basin, in the south, and spread north from there. They have changed for Mars: they swim through the sand and ride the dust storms. They are learning this planet faster than we did."}
  - {speaker: Okafor, image: act-3-colonists, line: "The colonists asked Earth for help long before the Gate opened, and got committees. They will not thank us for coming late. They don't have to. We fly for them anyway."}
  - {speaker: Okafor, expression: fierce, image: act-3-drop, line: "We go in from the west, past Olympus Mons, and take the canyons back one at a time. Drop in ninety minutes. Mission briefing follows. Aegis Actual out."}

outro:  # after the Level 21 debrief with the act summary (Level 14's order, H6 = a; approved in round 36), each page voiced and with its image (tools/art/outro_l21_images.py)
  music: act-complete  # track 24 under the first page, played once
  pages:
    - {speaker: Okafor, expression: grim, image: act-3-outro-hellas, line: "The Colossus is dead. Within a day the Vrell lifted off from every site on Mars: the basin, the plains, the foundry. Ares Landing opened its shelters this morning, for the first time in six weeks.", notes: {image: "the Hellas basin at dawn, the Colossus's collapsed crater, the last spore trails climbing out of the frame"}}
    - {speaker: Okafor, image: act-3-outro-domes, line: "The colonists have not forgiven Earth for coming late, and they are right not to. But last night every dome in Ares Landing burned its lights for Aegis Wing. Take that with you.", notes: {image: "Ares Landing's domes at night with every pane lit, colonists on the ring road looking up"}}
    - {speaker: Varga, expression: grim, image: act-3-outro-europa, line: "I tracked their fleet off Mars. It is not going home. Every course bends toward Jupiter and ends at one moon: Europa. It told us '*we are going*'. Now we know where.", notes: {image: "Varga's tracking plot: the Vrell fleet's courses off Mars bending toward Jupiter and converging on Europa; in a corner of her screen a minimised window with the walker's filed plate (the quiet thread, unexplained)"}}
    - {speaker: Okafor, expression: fierce, image: act-3-outro-aegis, line: "Europa means Thera Deep and Conamara Station, and Conamara reports tremors under the ice. We refit, and we follow them. Aegis Wing leaves Mars in four days. Aegis Actual out.", notes: {image: "Aegis Wing on Ares Landing's spaceport apron, ground crews refitting the Stormhawks, Jupiter a bright point in the dusk sky"}}
