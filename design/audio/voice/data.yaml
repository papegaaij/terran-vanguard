# The voice pipeline's speaker table (design/audio/voice): the Chatterbox settings per expression
# and the speakers' voices. Schema: ../../tech/architecture/schemas-voice/README.md
# The renderer (tools/art/voice.py) and the game (vanguard.content.voice.VoiceLines) read it: a
# change here changes the key of every line it touches, so only those lines are rendered again.

# respell: a word or name -> its spelling as spoken (round 36, Q.24f and S.6's (a)-(c); M7 part B): applied to
# the text as spoken of every line, whole words, case-sensitive, longest first; the subtitle keeps the real
# spelling. It is part of the key, so a changed respelling re-renders exactly the lines that use the word.
# Airees, Skyaparelli and Burrows were heard in Ares Control's audition and accepted; the others were tried at
# the render step (VOX-B, Whisper read-back of Okafor and Ares Control, three seeds each, plain against
# respelled): Vallis Marinairis and Coprateez kept (the plain spellings read "Vales/Valet's" and "cop rates");
# Lycus and Eos dropped (plain read back as well as Lykus and Ee-oss, which also read "E-O-S" once).
respell:
  Ares: Airees
  Schiaparelli: Skyaparelli
  Burroughs: Burrows
  Valles Marineris: Vallis Marinairis
  Coprates: Coprateez
  u: us   # M8 part F: Rook's cut "…below u—" (Level 26, t=161.2) is spoken "us" and cut inside it by Whisper's timing (the subtitle keeps "u—")

expressions:   # exaggeration 0.25-2, cfg_weight (lower: slower, more dramatic), temperature
  neutral: {exaggeration: 0.5, cfg_weight: 0.5, temperature: 0.7}
  grim: {exaggeration: 0.45, cfg_weight: 0.5, temperature: 0.7}
  fierce: {exaggeration: 0.8, cfg_weight: 0.4, temperature: 0.8}
  shout: {exaggeration: 1.2, cfg_weight: 0.3, temperature: 0.8}   # a cue with shout: true

# names: the speaker as the level data writes it; ref: the clip in refs/ (without .wav);
# shift: added to the expression's row (optional); fixed: settings for every line instead of the
# expression's; layering: choir = the Choir's post-processing; pins: a line's seed by its key;
# uncast: true = no voice cast yet (no ref): its lines have no voice file and play as text;
# filter: pa = the public-address filter instead of the radio filter (an automated loudspeaker);
# stage: the sound (a file in assets/voice/<slug>/) a radio line plays when it is only a stage
# direction in square brackets, which is not spoken (the Choir sings).
