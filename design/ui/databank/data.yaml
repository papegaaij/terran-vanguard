# The databank's authored texts: Varga's two lines per enemy and boss, the bosses' phase notes, a note per gear
# item, the concept pages. Read by the databank index (design/ui/databank/README.md). Schema:
# ../../tech/architecture/schemas-player/README.md (Databank texts). Every text is a list of lines, one label line
# each, at most 63 characters (a label line at 8x12 over the entry page's 504 px). Keys are slugs; gear sections are
# keyed by the part's slug inside its kind. Text only, not voiced. Draft: round 82's recommendations.
faction_from:
  warden-tank:
    34: Jovian Ascendancy
enemies:
  needler:
    vague:
    - Ivory crab-things with guns. They shoot back, Lancer, slowly.
    tip:
    - Any forward gun. Hit the violet eye cluster and sidestep the
    - thorns.
  skitter:
    vague:
    - 'Chitin fodder: tiny, fast, and there is always more of it.'
    tip:
    - One hit each. A spread gun clears a stream; keep the heavy gun
    - for others.
  stinger:
    vague:
    - A wasp that picks a spot on you and dives for it.
    tip:
    - 'It stops and glows red before the dive: sidestep on the red.'
    - Hit the abdomen.
  spore-bomber:
    vague:
    - A slow gas-bag under the others. It leaves things behind.
    tip:
    - Its mines rise to your level after a second. Spread fire pops
    - them; shoot the bulbs.
  whirl-seed:
    vague:
    - Little spinning seeds, released in clusters. They bounce.
    tip:
    - 'One hit pops one. Spread or area fire, and keep moving: they'
    - ricochet.
  brood-pod:
    vague:
    - An egg sac, pulsing. It will not stay shut for long.
    tip:
    - It bursts into six Skitters when killed, or alone after 8 s.
    - Kill it early, at range.
  spine-turret:
    vague:
    - A grown turret, rooted to the wreck. It follows you round.
    tip:
    - 'Ground target: fly over it. Anti-ground hits count double; aim'
    - at the barrel root.
  polyp-mortar:
    vague:
    - A mouth ringed with tentacles. It throws things where you are.
    tip:
    - 'A marker shows the impact a second ahead: leave it. Anti-ground'
    - into the lime mouth.
  scuttler:
    vague:
    - A six-legged crab walker. Its front is plated, its back is not.
    tip:
    - Bombs or a flank shot reach the glowing back; forward shots
    - glance off the claws.
  leviathan:
    vague:
    - Something enormous drifting over the formation. It is dropping
    - things.
    tip:
    - While it is high, only homing and beam reach it. Once down,
    - shoot the blowhole, vents and fins.
  lamprey:
    vague:
    - A rust eel with a mouth like a drain. It wants your shield.
    tip:
    - 'It latches on and drains the shield: shake it off with hard'
    - left-right moves. Kill it early.
  mantis:
    vague:
    - A bone-white sniper at the edge of the screen.
    tip:
    - It holds at the side and sweeps a laser across the lower
    - screen. Side or spread guns; hit the thorax.
  wraith:
    vague:
    - A manta that goes invisible overhead and returns behind you.
    tip:
    - It decloaks at your back. Rear guns or homing missiles; the
    - blue-violet veins are weak.
  mote-swarm:
    vague:
    - A flock of embers. They sweep off the screen and loop back.
    tip:
    - 'Spread, area and rear guns shred them: the second pass comes'
    - from behind.
  creeper:
    vague:
    - A salamander on the streets, travelling in convoys.
    tip:
    - Anti-ground weapons. The convoy's fans ripple half a second
    - apart; hit the violet gland.
  reef-spitter:
    vague:
    - A barnacle gun on a kelp raft. It turns to aim.
    tip:
    - Three-way fans across the lanes. Anti-ground shots count
    - double; hit the barrel root.
  driftjelly:
    vague:
    - A jellyfish mine. It reacts when you get close.
    tip:
    - 'It pulses a ring when you come near: shoot it from range.'
    - Spread or anti-sub guns.
  skimmer:
    vague:
    - A flying-fish skiff weaving between the floes.
    tip:
    - It comes in from every edge, firing aimed shots. Side and rear
    - guns catch it.
  dust-kite:
    vague:
    - Dust-coloured gliders, in streams, that come down onto you.
    tip:
    - One hit each. A spread gun takes a whole stream as it sways in.
  burrower:
    vague:
    - Something moving under the sand. A bulge gives it away.
    tip:
    - It surfaces ahead, fires a ring and dives after 2 s. Hit the
    - maw while it is up.
  dust-devil:
    vague:
    - A whirlwind that pulls on loose things, you included.
    tip:
    - 'Its vanes part once a cycle: hit the lime core then. Spread or'
    - homing.
  shellback:
    vague:
    - A tortoise the size of a house with a mortar on its back.
    tip:
    - Hurt, it curls into a rolling ball. Shoot the vent, then the
    - belly as it uncurls.
  threadcrawler:
    vague:
    - A centipede along the canyon floor, firing in a wave.
    tip:
    - 'The head is vital: kill it and the body dies. Beam or piercing'
    - shots run down it.
  tendril-anchor:
    vague:
    - Pairs of growths with a glowing line stretched between them.
    tip:
    - Kill either anchor and the barrier drops. A beam burns through
    - the tendril itself.
  choir-herald:
    vague:
    - A singer behind the others. Whatever is near it glows.
    tip:
    - 'Its rings soak damage while it lives. Kill it first: the'
    - glowing crest, homing or forward.
  ghost-drone:
    vague:
    - Grey and angular, and not grown. I do not like it, Lancer.
    tip:
    - It drops into a lane, strafes, fires one precise burst. Hit the
    - red eye; homing finds it.
  warden-tank:
    vague:
    - 'A tracked tank: the hull drives one way, the turret another.'
    tip:
    - The turret tracks you even behind it. Hit the rear hull plate
    - from behind, or kill the turret.
  abyss-ray:
    vague:
    - A huge shadow rising from the black water.
    tip:
    - It sweeps a wide fan with four Barbfin escorts. Anti-sub
    - reaches it; hit the lime gill slits.
  barbfin:
    vague:
    - A barbed swimmer that darts in and spits.
    tip:
    - Aimed needles, the Needler's job under water. Homing or spread;
    - it escorts the Ray.
  glassfin:
    vague:
    - Transparent fry, streaming up the screen in ribbons.
    tip:
    - One hit each, dangerous only in numbers. Spread and area
    - weapons.
  glow-angler:
    vague:
    - A light in the dark that looks like something worth picking up.
    tip:
    - 'Do not touch the lure: it lunges and bursts a ring. Shoot the'
    - lure from range.
  siren:
    vague:
    - A nest in the trench walls that sings.
    tip:
    - Its rings do no damage but slow you 2 s. Kill the throat sac
    - first; homing or spread.
  spiral-nautilus:
    vague:
    - A shell that rolls round you, then opens.
    tip:
    - Shoot it while it is uncoiled. Pairs orbit in opposite
    - directions; aim at the crown.
  eel-swarm:
    vague:
    - An eel made of smaller eels.
    tip:
    - The head is vital; cut the body and the tail scatters. Beam or
    - piercing; aim at the gills.
  depth-hunter:
    vague:
    - A grey submarine drone, unmarked and unexplained.
    tip:
    - It rises in columns, firing slow homing torpedoes you can shoot
    - down. Anti-sub reaches it.
  relay-beacon:
    vague:
    - A red-gold mast on the sea floor, pulsing.
    tip:
    - No attack. Level 27 needs three of the four down; anti-ground
    - or anti-sub.
  siphon-pump:
    vague:
    - A pump draining the kelp farms.
    tip:
    - No attack. Break the five on the racks; torpedoes break them
    - fastest.
  spawning-reef:
    vague:
    - A coral tower that breeds fry.
    tip:
    - Soft, not hardened. Raze three of four to meet the secondary;
    - hit the iris.
  asteroid-mite:
    vague:
    - Little crawlers riding the drifting rocks.
    tip:
    - 'One hit each. They leap when you pass close: spread and area'
    - weapons.
  talon:
    vague:
    - Black and gold, fast, flying in wings.
    tip:
    - 'Its gold shield pops first: a shield-breaker empties it. Kill'
    - the striped leader and the wing scatters.
  wavering-stormhawk:
    vague:
    - A Stormhawk with a freshly painted crest.
    tip:
    - Do not fire on it. It will not fire on you, and hitting it
    - costs you the secondary.
  clamp-gun:
    vague:
    - A turret on each docking clamp.
    tip:
    - Four hold the tender; the clock stands while one stands. Anti-
    - ground; the EMP stuns it.
  sam-nest:
    vague:
    - A launcher on the hulls. It swings round to face you.
    tip:
    - Salvos of two slow homing missiles you can shoot down. Flares
    - turn them; anti-ground hits the nest.
  gilded-gunship:
    vague:
    - Heavy, slow, plated in gold at the front.
    tip:
    - Front hits do half, the two rear engines take double. Flank it;
    - shoot down its Darts.
  dart-drone:
    vague:
    - Black and gold darts, launched in streams from bays.
    tip:
    - One hit each. Spread and area weapons; kill the launcher to
    - stop the stream.
  rail-serpent:
    vague:
    - A train of armoured drone cars across the screen.
    tip:
    - Cut a car and the cars behind it die. The engine car is vital;
    - piercing or beam.
  minelayer:
    vague:
    - It comes up behind you and lays a line across the field.
    tip:
    - Every line has one gap, or shoot a mine to blow a stretch open.
    - Rear guns help.
  hornet:
    vague:
    - A boat at the top of the screen, firing red diamonds.
    tip:
    - 'Shoot the slow missiles down, or kill the boat first: the pod'
    - hatches. A shield-breaker helps.
  buzzsaw-drone:
    vague:
    - A blade that chases you, spins, and dashes.
    tip:
    - It spins up, then dashes in a straight line and ricochets.
    - Sidestep it; spread or area.
  shard-drone:
    vague:
    - Drones in threes and fours, joined by lines of energy.
    tip:
    - Shots pass through a link; killing a drone breaks its links.
    - The EMP drops them all.
  rail-bunker:
    vague:
    - A hardened bunker on the hulls.
    tip:
    - 'It locks a red line on you, then fires along it: leave the'
    - line. Only anti-ground breaks it.
  sentinel-tower:
    vague:
    - A tall emitter in the side galleries.
    tip:
    - Its arc sweep goes any direction; every third turns full
    - circle. Leave the marked reach.
  void-leech:
    vague:
    - A leech that drifts in behind and chases.
    tip:
    - It latches on and drains the generator, 2 MW each. Kill it
    - 'before it lands: rear or homing.'
  strider:
    vague:
    - A two-legged walker, in pairs.
    tip:
    - Destroy a leg and it staggers, then topples along a marked
    - line. Anti-ground on the legs.
  coilwyrm:
    vague:
    - A serpent that swirls across the screen, often back from the
    - rear.
    tip:
    - Cut it and the tail grows a new head, once. Piercing shots; hit
    - the teal crest.
  drill-rig:
    vague:
    - A drill collar boring toward the ocean.
    tip:
    - 'Hardened: bomb it or call an Airstrike before it drills'
    - through. Anti-ground only.
  hive-node:
    vague:
    - A teal-black mound grown into the ruins.
    tip:
    - 'Hardened: only anti-ground, the Airstrike and the Smart Bomb'
    - hurt it. Hit it with the iris open.
  ravager:
    vague:
    - A pack of hound-raptors on the ground.
    tip:
    - 'Mid-leap it is in the air and can touch you: sidestep the'
    - pounce. Hit the teal maw.
  fleet-stormhawk:
    vague:
    - The fleet's drop craft. Ours.
    tip:
    - Neutral and marked. Do not fire on them; they never fire
    - either.
  harvester:
    vague:
    - An uncrewed scoop skimming below us.
    tip:
    - It never fires or rams, and it is not counted as an enemy.
    - Homing missiles find it.
  chimera:
    vague:
    - A Talon with something grown through its seams.
    tip:
    - It heals a fifth a second once unhit. Burst damage or a held
    - beam; hit the seams.
  mirror-interceptor:
    vague:
    - Its mirror only guards the nose.
    tip:
    - A shield-breaker or EMP shatters the mirror; a held beam heats
    - it. Hit the open flanks.
  graft-turret:
    vague:
    - An Ascendancy turret with Vrell tissue grown through it.
    tip:
    - 'Destroyed, its root pulses for 5 s: kill the root or the turret'
    - regrows.
  harrow:
    vague:
    - A dart carrying a swollen sac, from every edge.
    tip:
    - It locks on, then rams; the sac bursts in a ring of 8 however
    - it dies. Kill it at range.
  cracking-tower:
    vague:
    - A refinery column with a flare cap burning.
    tip:
    - 'No attack. One that scrolls past alive fails the mission: anti-'
    - ground.
  pump-station:
    vague:
    - A pump housing on the pipeline racks.
    tip:
    - 'No attack. Cut six of the eight: anti-ground, a bomb each.'
bosses:
  gorgon-frigate:
    vague:
    - Three serpent heads on a bone-white bell.
    tip:
    - Kill the heads one by one, then the crown opens over the lime
    - core.
    phases:
    - '1 Three heads: they fire in turn; Skitter streams every 10 s.'
    - '2 Last head: enraged, faster bursts, a wider lash.'
    - '3 Core: the crown opens; rings, then a slow spiral.'
    - Phases end on the head count, not on a share of its HP.
  brood-carrier:
    vague:
    - A living carrier as long as the screen. It stops above you.
    tip:
    - Shoot the lime bay sacs while open, then the core. Piercing and
    - homing help.
    phases:
    - '1 Overhead: hull over you; bays launch Skitters, Needlers.'
    - 'Turn: 4 s invulnerable while it drops and turns broadside.'
    - '2 Broadside: head fans; one pair of sacs opens at a time.'
    - A sac takes damage only while open. After 70 s all open.
    - '3 Core: the iris opens; a spiral and a ring every 4 s.'
  harbour-kraken:
    vague:
    - A cephalopod round a platform. The arms come first.
    tip:
    - Hit the root that rears and glows; with the head up, hit its
    - eyes.
    phases:
    - '1 Arms: one telegraphed lane slams at a time; roots take x2.'
    - '2 Head up: eyes open 8 s; a 5-orb fan every 2.5 s, then a dive.'
    - '3 Living roots: two lanes slam at once, yours and a ship''s.'
    - A cut root ends its lane's slams for good.
  siege-spire:
    vague:
    - A citadel rooted under the canopy. Roots first.
    tip:
    - Roots, then the maw, then the core in the air. Homing and anti-
    - ground.
    phases:
    - '1 Roots: pods fire down their columns; mortars lob acid.'
    - '2 Maw: it opens and launches a Wraith every 8 s, spits fans.'
    - '3 Free spire: it tears loose and flies; sweeps and rings.'
    - Destroyed roots stay dead.
  revenant-walker:
    vague:
    - A grey walker crossing the yard in passes.
    tip:
    - Kill the shoulder pods; hit the reactor vents when they open.
    - Never stay behind it.
    phases:
    - '1 Stride: pods fire salvos of 3 in turn; flamer at the rear.'
    - '2 Hunt: passes in your lane; rail lance once pods are gone.'
    - '3 Overheat: vents stay open (x2); it turns round, flaming.'
  dust-colossus:
    vague:
    - Something the size of a colony, under the sand.
    tip:
    - Hit the lime gullet while the mouth is open, and keep moving.
    phases:
    - '1 Circling: breaches front, left, right, rear; rings of 12.'
    - '2 Hunting: it follows you; three vents rise with each breach.'
    - '3 Anywhere: a marker under you; leave it before it erupts.'
    - Suction pulls you in and it bites; the mouth is the weak spot.
  abyssal-maw:
    vague:
    - A serpent coiled round the hatchery's vent.
    tip:
    - Gill sacs, then the jaw; in the last phase hit the machinery in
    - its spine.
    phases:
    - '1 Coiled: sacs breathe rings in turn; jaw fans; Eel Swarms.'
    - '2 Tightening: fan walls with one gap; coil sweeps between them.'
    - Below half it dives once and lunges up a marked column.
    - '3 Implants: jaw shut; hit each implant while open (4 s).'
  iron-sovereign:
    vague:
    - A station seen from above, three rings turning.
    tip:
    - Batteries fire only inside their arc. Lock a ring by killing
    - all its batteries.
    phases:
    - '1-3 Rings: lock all three; the survivors turn faster each time.'
    - Piercing shots take batteries that line up in a column.
    - '4 Core: shutters open, shield up; a random attack each time.'
    - The bar shows the whole station's HP, batteries and core.
  honour-guard:
    vague:
    - Three gold aces, flying as one.
    tip:
    - Take the leader first. Every attack is told 0.8 s ahead; deaths
    - make the rest fiercer.
    phases:
    - 'Harker (top): sniper lines with a double tap.'
    - 'Vesper (middle): loops and spirals; joins after 20 s or at 2/3.'
    - 'Kestrel (rear): feint dives that pull out; never rams.'
    - 'Each death: shorter rests and a new edge for the survivors.'
    - Never more than one telegraphed line or dive at a time.
weapons:
  pulse-cannon:
    note:
    - 'The starter: fast bolts straight ahead. Never wrong, rarely'
    - best.
  autocannon-pod:
    note:
    - Cheap, steady forward fire from a wing. Most pilots fit a pair.
  scatter-vulcan:
    note:
    - 'A widening fan: clears swarms, weak on one armoured hull.'
  lance-laser:
    note:
    - Slow, hard lances that pierce a whole line of enemies.
  bomb-rack:
    note:
    - Bombs on the ground below the wing. Never touches a flyer.
  hammer-mortar:
    note:
    - 'Shells that burst ahead: heavy on ground targets, hardened too.'
  micro-missile-pod:
    note:
    - Small homing missiles that curve out and in.
  swivel-gun:
    note:
    - A wing turret that aims at the nearest enemy, flanks and rear
    - first.
  torpedo-pod:
    note:
    - 'Torpedoes into the water: reaches submerged and naval targets.'
  hornet-launcher:
    note:
    - 'Front homing launcher: it finds targets on every hittable'
    - layer.
  light-drone-bay:
    note:
    - A drone circles you, fires ahead and soaks bullets until it
    - breaks.
  ion-beam:
    note:
    - A beam that burns the first thing in its path. Reaches high-
    - air; thirsty.
  deflector-pod:
    note:
    - 'No gun: a field that swallows bullets until its charges run'
    - out.
  rear-guard-drone-bay:
    note:
    - A drone trails you firing back, and soaks bullets from behind.
  harpoon-torpedoes:
    note:
    - Heavy torpedoes that keep full damage in water and reach the
    - sub layer.
  plasma-arc:
    note:
    - 'A short discharge that chains on: three targets at L1, six at'
    - L5.
  tesla-coil-pod:
    note:
    - A short arc that empties a hex shield at once and shatters
    - mirrors.
  tail-gun:
    note:
    - Straight bolts backward for what comes up behind you.
  fan-blaster:
    note:
    - 'A fan of shots angled back: covers the whole lower screen.'
  side-splitter:
    note:
    - 'Fires left and right at once: covers enemies holding at the'
    - edges.
  proximity-mines:
    note:
    - Mines dropped behind you that burst when an enemy gets close.
  rear-lance:
    note:
    - 'The Lance turned round: hard piercing shots to the rear.'
  depth-charges:
    note:
    - 'Tossed ahead, they sink and burst: hits everything near a'
    - swimmer.
  swarm-tail:
    note:
    - Micro-missiles out of the tail onto what is behind or beside
    - you.
specials:
  airstrike:
    note:
    - 'Two bombers sweep up the screen: hardest on ground and low-air.'
  smart-bomb:
    note:
    - Clears every enemy bullet and hurts everything on the screen.
  emp-burst:
    note:
    - Stuns machines, strips shields and mirrors. Bosses are never
    - stunned.
  orbital-lance:
    note:
    - A vertical beam that follows your position. Needs satellite
    - cover.
  shield-overcharge:
    note:
    - Doubles the shield for a few seconds, then cools down.
  sonar-pulse:
    note:
    - 'Pings the water: shows the sub layer and lets every weapon'
    - bite.
  decoy-flares:
    note:
    - Homing missiles and seekers chase the flares instead of you.
generators:
  mk-i:
    note:
    - The starter core. Unused power boosts shield regeneration.
  mk-ii:
    note:
    - More output for a second heavy mount; spare power still counts.
  mk-iii:
    note:
    - Room for a beam gun and a utility or two.
  mk-iv:
    note:
    - Carries a heavy loadout with the shield still regenerating
    - fast.
  mk-v:
    note:
    - 'Captured Helix Dynamics tech: the biggest core of Act 5.'
  mk-v-plus:
    note:
    - Captured Ascendancy tech, for loads even the Helix cannot
    - carry.
shields:
  mk-i:
    note:
    - 'The starter shield: soaks hits and refills after a short calm.'
  mk-ii:
    note:
    - A bigger buffer and a quicker refill.
  mk-iii:
    note:
    - A bigger buffer again; the middle of the road.
  mk-iv:
    note:
    - A heavy buffer for the long levels.
  mk-v:
    note:
    - 'The largest conventional shield: more power, more buffer.'
  reflex-shield:
    note:
    - Bullets it absorbs while strong cost half and fly back as
    - bolts.
plating:
  standard:
    note:
    - The hull as it left the yard. It never regenerates.
  composite-i:
    note:
    - More hull points. Armour never refills in a level.
  composite-ii:
    note:
    - More hull points for the longer Act 2 levels.
  composite-iii:
    note:
    - More hull points; costly to repair after a bad level.
  composite-iv:
    note:
    - A heavy plate for the Belt and what follows.
  composite-v:
    note:
    - The heaviest plating yet; mind the power and the repair bill.
engines:
  mk-i:
    note:
    - 'The starter engines: the ship''s top speed and little else.'
  mk-ii:
    note:
    - Quicker dodging for a little power.
  mk-iii:
    note:
    - Faster again; the draw rises with the speed.
  mk-iv:
    note:
    - The fastest engines, and the hungriest.
utilities:
  pickup-magnet:
    note:
    - 'Pulls pickups in from further off: fewer detours.'
  salvage-scanner:
    note:
    - More credits from salvage and crates; a glint marks secrets.
  targeting-computer:
    note:
    - Sharper homing, fading HP bars, brackets on open weak points.
  evasive-thrusters:
    note:
    - Double-tap a direction for a short invulnerable dash.
  auto-repair-nanites:
    note:
    - Mends armour slowly, up to half; a hit pauses it.
  pressure-hull:
    note:
    - Removes the drag under water; it does nothing in air.
  ascendancy-iff-spoofer:
    note:
    - Ascendancy turrets fire late, at where you were. Aircraft are
    - not fooled.
escort:
  rook:
    note:
    - 'Lt. Tanaka in his own Stormhawk: he dodges, covers one flank,'
    - takes his own damage.
  bulwark:
    note:
    - 'A heavy drone for the escort slot: it draws fire and guns the'
    - ships.
sensor-suite:
  note:
  - 'Better scans make better entries: each level shows more here.'
  varga:
  - Get one, Lancer. I can tell you much more with a proper suite.
concepts:
  shield-and-armour:
    title: Shield and armour
    after: 1
    picture: the HUD's ship panel
    lines:
    - The shield soaks every hit first and refills a moment after the
    - 'last one. Armour is the hull itself: it does not refill during'
    - a level. Armour patches and the hangar's repair mend it. At
    - zero armour the level is retried, and that attempt's credits
    - are lost.
  power:
    title: Power and the generator
    after: 1
    picture: the power bar
    lines:
    - The generator's output, in MW, is a budget for everything
    - fitted. Every weapon and module draws some of it, and the
    - loadout may not go over. Output you do not spend boosts the
    - shield's regeneration. The hangar's power dial shows what is
    - left.
  intel-and-sensors:
    title: Intel and sensors
    after: 1
    picture: the intel panel
    lines:
    - Before each level the hangar shows intel on what is ahead. The
    - 'sensor suite decides how much: none shows only the setting; L1'
    - adds attack directions and density; L2 the enemy types and the
    - boss; L3 the recommended traits, the wave strip and the
    - secrets. Easy adds one level. This databank reads the same
    - 'suite: see Ship, Sensor suite.'
  weapon-traits:
    title: Weapon traits
    after: 1
    picture: the trait chips
    lines:
    - Every weapon carries traits, and every enemy names the ones
    - that work on it. Forward, spread, rear and side say where the
    - shots go. Piercing, area and homing say how they hit. Beam,
    - anti-ground and anti-sub reach what others cannot. The shop
    - lights the traits a level recommends.
  layers:
    title: 'Layers: ground, air, high-air'
    after: 2
    picture: a Spine Turret
    lines:
    - Every unit flies on a layer. Air units are hit by every weapon.
    - Ground units are hit by every weapon too, and anti-ground shots
    - count double. High-air units are out of reach of ordinary
    - 'shots: only homing and beam weapons reach them. Bombs never'
    - touch a flyer.
  specials:
    title: Specials
    after: 4
    picture: the Airstrike icon
    lines:
    - One special slot, one button. Charge specials spend charges
    - bought in the hangar or found in a level. Cooldown specials
    - cost much and recharge by themselves. Some depend on the
    - 'setting: no airstrikes under the ice. The hangar intel warns of'
    - it.
  rook-and-escort:
    title: Rook and the escort
    after: 8
    picture: Rook's craft
    lines:
    - From Level 08 Lt. Tanaka flies beside you in the escort slot.
    - He picks his own targets, dodges and covers one flank; his gun
    - can be upgraded. He has his own armour, and the hangar repairs
    - it for a price. Shoot him down and he is out for the level.
  hardened-targets:
    title: Hardened targets
    after: 9
    picture: the Hive Node
    lines:
    - 'Some ground targets are hardened: ordinary shots glance off.'
    - Only anti-ground weapons, the Airstrike and the Smart Bomb hurt
    - them. The entry's advice says so in red. Bomb racks and mortars
    - are the usual answer.
  under-water:
    title: Under water and the sub layer
    after: 11
    picture: the Driftjelly
    lines:
    - 'Under water the ship drags and most guns lose damage: missiles'
    - lose 30 percent and the beam 80. Torpedoes and other anti-sub
    - weapons keep full damage. Submerged swimmers are on the sub
    - layer, which only anti-sub weapons reach.
  ascendancy:
    title: The Jovian Ascendancy
    after: 28
    picture: the cruisers
    lines:
    - A secessionist movement of the outer colonies, funded by Helix
    - Dynamics and led by Chairman Silas Vorne. It reopened the
    - Tether Gate to the Vrell, trading a way in for their biotech.
    - Its craft fly in black and gold, many of them crewed, often
    - shielded, and the war is no longer only against the Vrell.
  vacuum:
    title: Vacuum
    after: 29
    picture: the belt
    lines:
    - In vacuum there is no weather and no wind, and no water. Every
    - weapon still fires and hits as it does in air; there is no new
    - layer. A few specials are limited in a few places, and the
    - hangar intel says where. Drifting rock is scenery, and
    - sometimes a hazard.
  enemy-shields:
    title: Enemy shields
    after: 29
    picture: the hex shield
    lines:
    - A crewed Ascendancy craft may wear a hex shield over its hull.
    - Every weapon hits it, and the overflow goes on to the hull. It
    - refills after 2 s without a hit. A shield-breaker empties it at
    - once, and the EMP burst empties every shield on the screen.
  mirrors:
    title: Mirrors
    after: 37
    picture: the Mirror Interceptor
    lines:
    - A mirror covers a frontal arc. Shots into it come back as slow
    - enemy bullets; bombs and shells fall past it. A held beam heats
    - it until it breaks, and a shield-breaker or the EMP shatters it
    - at once. The flanks and rear are always open.
  three-way-war:
    title: The three-way war
    after: 37
    picture: the hybrids
    lines:
    - 'At Aurelia the Vrell turn on the Ascendancy: they were only'
    - ever a door. Some Vrell now hunt Ascendancy craft, which still
    - fire on you. A hunter's bullets can hit its prey, and a prey
    - unit the Vrell kill pays nothing. The hybrids, Ascendancy hulls
    - grown through with Vrell tissue, serve neither side.
