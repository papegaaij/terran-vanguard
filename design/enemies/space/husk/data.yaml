# Husk stat block at medium: rendered into README.md. Schema: ../../../tech/architecture/schemas-units/README.md
# M11 part D, step D2 (Level 46): the approved stat block (round 84, Q4 a, A.3 a) as data. New in it (flown from step
# CD1): `movement.line_drift` (a straight drift along its wave's `lines` at 20–40 px/s, entering unwarned and leaving
# through the far edge; a 10–25°/s spin, presentation only) and `crack` (at 50 % of its HP a 0.5 s tell, then its
# `shards` fan once; a level's `crack_cue` cracks every Husk on the screen in turn). Its death ring is part A's
# `death-burst`. A `medium` unit at its first level (L46, reference 184): 150 HP, no beam-era factor.
