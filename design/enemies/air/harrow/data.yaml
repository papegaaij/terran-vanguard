# Harrow stat block at medium: rendered into README.md. Schema: ../../../tech/architecture/schemas-units/README.md
# M10 part D, step D2 (Level 38): the approved stat block (round 72) as data. New in it (flown from step D1): the dash
# variant of the Buzzsaw's `dash` (a chase of a seeded 1.5-2.5 s, `chase: [least, most]`; the bearing locked at the
# tell's end, `lock: tell-end`; one straight ram out through the far edge, `after: out`: no bounce, one dash, no slow)
# and part A's `death-burst` on contact (the ring of 8 on every death on the screen, turned to put the ship between two
# bullets, 0.25 s of grace after a ram). Contact `small` 10 (destroyed by the impact). HP 8 base: the beam era's ×2
# flies it at 16.
name: Harrow
