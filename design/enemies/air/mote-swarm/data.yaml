# Mote Swarm stat block at medium (one mote; a swarm is a wave of them): rendered into README.md.
# Schema: ../../../tech/architecture/README.md#data-file-schemas
# M5 part D (Level 10; user decision D8 = a of 2026-10-08: real flocking): the flock is flown by the
# simulation.
name: Mote Swarm
faction: Vrell
layer: air
tier: tiny
size: [16, 16]    # sprite px, each mote
hitbox: [10, 10]
parts: single
orientation: 16 angles
hp: 1
armour: none
speed: 200        # px/s, the flock's cruise
movement:
  path: {speed: 200}   # the leader point flies the wave's authored route (`paths`, with its `loop_back`)
  flock:
    separation: 18    # px kept between members
    radius: 48        # px: the neighbourhood the rules look at
    alignment: 0.5    # weights of the three rules and of the pull toward the leader point (first values)
    cohesion: 0.3
    leader: 0.6
    speed: 200        # px/s cruise
    dive_speed: 260   # px/s after a loop-back
    turn_rate: 360    # °/s
    max: 24           # members at most (≤ 576 pair checks a step)
attacks: []       # contact only
formations:
  - {name: swarm, size: [6, 24]}
  - {name: pursuit, size: [8, 12]}   # M7 part G: Level 20's pursuing swarm, 10 on entry (easy 8, hard 12 by the formation lever) plus its refills
weak_points: []
drops: []
pursuit:   # M7 part G (Level 20, The pursuit swarm; first values approved in round 36 Q.20): the `pursuit` formation's defaults; a wave's `pursuit` block may change them
  band: [50, 150]     # px below the top edge: the leader point's band (behind the ship once the scroll is reversed)
  lag: 90             # px/s: the leader follows the ship's x this fast sideways
  lunge_every: 6      # s from one lunge's tell to the next
  tell: 0.8           # s: the flock contracts into a ball, brightens, a rising hum
  ball: 60            # px across, the contracted flock
  dive: 240           # px/s straight down the ship's lane (no homing)
  overshoot: 140      # px below where the ship was at the tell's start
  climb: 200          # px/s back to the band
  refill: 3           # motes joining from the top edge (easy 2, hard 4 by the formation lever), while the flock has room
  refill_every: 10    # s
  break_speed: 200    # px/s: at its break-off the leader climbs off the top edge, the members follow alive
difficulty:
  easy: {pursuit: {lunge_every: 8, tell: 1.2}}
  hard: {pursuit: {lunge_every: 4.5}}
seekers_ignore: true   # M7 part G (user decision 2026-10-20, "Homing ignores motes"): no homing shot, turret or Rook picks a mote as a target; direct fire (the rear guns against the pursuit) still hits
traits: [spread, area, rear]
bounty: 2
first_level: 10
notes:
  speed: (flock cruise), 260 px/s diving after a loop-back
  movement: '`flock` (separation 18 px, alignment, cohesion) round a leader point that flies the wave''s authored route at {movement.path.speed} px/s (`path`): it swirls in front, exits at the bottom-left or bottom-right, re-enters from the bottom 1.5 s later (the edge warning 3 s ahead, starting while it exits) and dives up through the player''s lane'
  attack: '`none` — contact (damage `{tier}` = {contact_damage} per mote; destroyed by the impact)'
  formations: '(a wave of motes; base 20, easy 16, hard 24 by the formation lever; Level 10 flies smaller ones too)'
  weak_points: (dies in one hit)
  bounty: ' per mote; a swarm of 20 pays 40'
  death: '`tiny` ember puff'
  used_in: returns in Act 3 (L20, as the pursuing swarm)
  difficulty: 'flock size via the global formation lever; hard: two loop-backs (level data); the pursuit (Level 20): easy a lunge every 8 s with a 1.2 s tell, hard every 4.5 s'
