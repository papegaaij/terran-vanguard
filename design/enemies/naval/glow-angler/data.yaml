# Glow Angler stat block at medium: rendered into README.md. Schema: ../../../tech/architecture/README.md#data-file-schemas
# M8 part F, step F2 (Level 26): the approved stat block (round 48) as data. New in it: the `lunge` movement (it hangs
# drifting by its lure; the ship within `trigger` px sets off a dive at where the ship was, ending `stop_short` px short
# of it or after `seconds`, its ring there, a retreat, then the drift again; flown from step F1 (`Lunging`), mapped in
# step F2), whose `ring` attack is the lunge's, not a gun (its `interval` the re-arm after the ring). Defaults of the gap
# check (m8f-gaps.md §5 F2, pending the user's review in round 55): the trigger is one distance test from the body (the
# lure, at most 48 px from it, lies inside it, so touching the lure needs no test of its own); the dive aims at the
# ship's position at the trigger; the retreat 1.5 s; the re-arm 5 s after the ring.
name: Glow Angler
faction: Vrell
layer: air        # the play plane under water
tier: small
size: [40, 32]    # sprite px: the body (a stalk of 36 px and a 12 px lure drawn over it)
hitbox: [30, 24]
parts: single (the lure is drawn, not a part)
orientation: 16 angles
hp: 14            # × 2 in the beam era by level number: 28 at L26
armour: none
speed: 20         # px/s: its drift with the water
movement:
  drift: {speed: 20}      # px/s with the water (a field's current), between lunges
  lunge:
    trigger: 130          # px from its centre to the ship's (the lure inside it)
    speed: 220            # px/s, the dive
    seconds: 0.6          # s at most
    stop_short: 60        # px short of where the ship was at the trigger
    retreat_speed: 100    # px/s, away from the ship
    retreat_seconds: 1.5  # s, then it drifts again
attacks:
  - pattern: ring
    name: lure-ring
    bullet: small
    count: 8
    speed: 100            # px/s base (× 0.7 under water)
    interval: 5           # s: it re-arms this long after its ring
    notes:
      text: 'one `{pattern}` of {count} (`{bullet}` = {damage}, {speed} px/s base) at the end of the lunge; it re-arms {interval} s after the ring; the lure itself does no damage'
formations:
  - {name: field, size: [4, 8]}
weak_points:
  - {name: the lure and the glowing eye}
drops: []
traits: [spread, homing]
bounty: 14
first_level: 26
difficulty:
  easy: {lunge: {trigger: 100}, attacks: {lure-ring: {count: 6}}}
  hard: {lunge: {trigger: 160}, attacks: {lure-ring: {count: 10}}}
notes:
  layer: ' (the play plane under water)'
  size: (the body; a stalk of 36 px and a 12 px lure)
  orientation: (toward the ship during a lunge)
  speed: '(its drift); lunge {movement.lunge.speed} px/s'
  movement: '`drift` hanging in the dark with the water; when the ship is within {movement.lunge.trigger} px (the lure lies inside that, so touching it counts), it `dive`s at where the ship was for at most {movement.lunge.seconds} s, stopping {movement.lunge.stop_short} px short, fires and retreats at {movement.lunge.retreat_speed} px/s for {movement.lunge.retreat_seconds} s'
  formations: (scattered over a dark area; a few sparse fields of singletons)
  weak_points: (drawn only)
  death: '`small` flash that blows out the lure; the stalk stays lit for 1 s then goes dark'
  used_in: L27 (the vent glow makes them a lighter threat)
  difficulty: 'easy: trigger 100 px, ring of 6; hard: trigger 160 px, ring of 10'
