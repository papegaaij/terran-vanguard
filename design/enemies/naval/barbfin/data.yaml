# Barbfin stat block at medium: rendered into README.md. Schema: ../../../tech/architecture/README.md#data-file-schemas
# M8 part D, step D2 (Level 24): the approved stat block (round 48) as data, the Needler's as its template. New in it: the
# hover's `above_ship` (flown from step D1, mapped in step D3): it stops a seeded 90–200 px above the ship's y at the
# moment it stops, drifts 6 px/s while it holds and turns toward the ship (32 angles). As an Abyss Ray's escort it is held
# until the Ray's rise and fans out from it (gap check m8d-gaps.md §5 D3). HP: the beam era's ×2 only, not
# `small_act_hp` (gap check D5); M8 AW (step AW2): 12 → 26 (52 at L24, two of the reworked harpoon's L3 hits).
