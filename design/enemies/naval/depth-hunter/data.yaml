# Depth Hunter stat block at medium: rendered into README.md. Schema: ../../../tech/architecture/schemas-units/README.md
# M8 part G, step G2 (Level 27): the approved stat block (round 48) as data, step G1's stand-in (VentKeysTest) as its
# template. New in it (flown from step G1): the hover's `y` band with a `drift` (it holds at its depth, its facing turned
# up the screen), the `column` from the rear (up from the bottom edge, unit i of n at the band's min + i ÷ (n − 1) of its
# span) and the non-boss `homing` attack `aim: facing` (each volley one torpedo launched along its facing, at most 8 in
# flight). HP 120 at its first level (Level 27, no act factor). No wreck on death (gap check m8g-gaps.md §5 G3: the
# hull-code wreck is a placed prop); the torpedo bursts on the ship, Rook and the Bulwark (§5 G4).
