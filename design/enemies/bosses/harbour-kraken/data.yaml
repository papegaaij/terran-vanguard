# Harbour Kraken stat block and boss script at medium: the stat block is rendered into README.md.
# Schema: ../../../tech/architecture/schemas-units/README.md
# M5 part E, step E2c (Level 11's mid-boss; user decisions E5 = a, E6 = a and E7 = a of 2026-10-08):
# an arena boss. It has no descent: it is anchored to Platform Tiamat (a backdrop piece of the level),
# scrolls in with it and engages when the scroll halts in its arena. All offsets are px from the
# platform's centre (its centre is the boss's), dx right, dy up, as assets/pivots/harbour-kraken.json
# gives them (y down there): the head 216 px below the centre (round 33: in open water off the deck's
# south edge, not under it), the eyes, the slam arms' roots.
# Round 40 (proposal 3a of the Act 2 playtest, approved by the user 2026-10-18; the art round 40 A.a): four
# rooted one-lane arms; everything moved 124 px up the screen (the platform's centre 46 px above the top
# edge), the roots always hittable at the mantle's rim (y 210 at the halt, block `r40_a` of the pivots).
name: Harbour Kraken
faction: Vrell
layer: ground       # the sea's surface; each part has its own current layer (`sub` under the water)
tier: huge
size: [344, 424]    # sprite px: the grip overlay and the head in front of it (the arms laid along the lanes reach further)
hitbox: [208, 152]  # Platform Tiamat's deck (no armour: shots fly over it); the lanes run from the roots' lower edge down
parts: multi
part_list:  # offset [dx, dy] px from the platform's centre; each part's `layer` is the one it starts on
  - name: head
    offset: [0, -216]       # its top (the crown's foam) clear of the deck's south edge (y -76)
    hitbox: [130, 200]      # the mantle; its lower edge is the beak, where the fans leave
    hp: 3400                # round 40: 1700 -> 3400 (proposal 1400, re-measured: the head in open view fought 26-36 s; pending the user's review)
    kind: vital
    bounty: 200             # step WB: 144 -> 200 with Level 11's scale 0.6 -> 0.43, so it pays what it did
    attack: beak-fan
    multiplier: 0.5         # the mantle
    layer: sub
    spots:                  # the lime eyes: px from the head's centre
      - {name: left eye, offset: [-41.5, -52.5], hitbox: [28, 28], multiplier: 2, while: open}
      - {name: right eye, offset: [41.5, -52.5], hitbox: [28, 28], multiplier: 2, while: open}
  # round 40: the four arm roots in their sockets at the mantle's rim (y 210 at the halt), over lanes 1-4
  - {name: root 1, offset: [-180, -256], hitbox: [40, 40], hp: 200, kind: destroyable, bounty: 25, layer: ground}
  - {name: root 2, offset: [-86, -256], hitbox: [40, 40], hp: 200, kind: destroyable, bounty: 25, layer: ground}
  - {name: root 3, offset: [86, -256], hitbox: [40, 40], hp: 200, kind: destroyable, bounty: 25, layer: ground}
  - {name: root 4, offset: [180, -256], hitbox: [40, 40], hp: 200, kind: destroyable, bounty: 25, layer: ground}
chains:  # the slam arms, one per root: laid along its lane from the root's lower edge down while it slams (at rest under the water, not drawn)
  - {name: arm 1, from: [-34.6, -326.6], to: root 1, segments: 13, hitbox: [30, 30], lag: 0.1, bend: 0, motion: slam}
  - {name: arm 2, from: [-12.4, -333], to: root 2, segments: 13, hitbox: [30, 30], lag: 0.1, bend: 0, motion: slam}
  - {name: arm 3, from: [12.4, -333], to: root 3, segments: 13, hitbox: [30, 30], lag: 0.1, bend: 0, motion: slam}
  - {name: arm 4, from: [34.6, -326.6], to: root 4, segments: 13, hitbox: [30, 30], lag: 0.1, bend: 0, motion: slam}
orientation: 32 angles
hp: 4200            # the parts' sum (round 40: 2400 -> 4200)
armour: 'submerged head: only `anti-sub` and the Smart Bomb ([layer rules](../../README.md#layer-rules)); surfaced head: mantle ×0.5, eyes ×2 while open; the roots always on the surface, ×2 while their arm is raised'
speed: 0            # anchored: it scrolls in with the platform and stays where the scroll halts
movement:
  anchored: {y: -46}   # the platform's centre, px below the top edge when the scroll halts (round 33: 110 -> 78; round 40: 78 -> -46, the deck at y -122-30, the head centre at 170, the roots at 210)
attacks:
  - pattern: fan
    name: beak-fan
    bullet: medium
    count: 5            # round 40: 7 -> 5
    spread: 80          # °; round 40: 70 -> 80 (≈ 70 px gaps at the ship band)
    interval: 2.5       # s between fans while the eyes are open (the first one a glow after they open); round 40: 2 -> 2.5
    speed: 120          # round 40: 140 -> 120
    notes:
      text: 'a {count}-orb `{pattern}` from the beak (spread {spread}°, {speed} px/s, `{bullet}` = {damage}) every {interval} s while the eyes are open, each after a 0.8 s crimson beak glow'
formations:
  - {name: solo set piece}
weak_points:
  - {name: lime eyes, multiplier: 2}
drops: []
traits: [anti-sub, anti-ground, forward]
bounty: 300         # the parts' sum (each root 1/12, the head 2/3): ≈ 15 % of budget(11) once paid (216 until step WB, at Level 11's scale of 0.6)
first_level: 11
difficulty:
  hard: {telegraph: 1.1, lanes: 3}   # the lane telegraph 1.1 s (round 40: 0.8 -> 1.1 with medium's 1.0 -> 1.4); phase 3 volleys slam three lanes
boss:
  kind: mid-boss
  bar_name: HARBOUR KRAKEN
  par: 55           # s from the boss bar appearing to the kill: the Boss rush bonus (the measured fight, E6 = a; round 40: 60 -> 55, the autopilot's 54.5 / 58.2 s)
  lanes:            # four lanes of 120 px below the roots, lane 1 at the left edge (round 40: one rooted arm a lane)
    count: 4
    width: 120
    arms: {root 1: [1], root 2: [2], root 3: [3], root 4: [4]}
    rooted: true    # cutting a root ends its lane's slams for good
    raised: 2       # a root takes ×2 while its arm is raised (telegraph to sink: the tell)
  slam:
    telegraph: 1.4  # s of the red churn along the lane (the root rearing and glowing) before the arm rises; round 40: 1.0 -> 1.4
    rise: 0.5       # s the arm rises base-to-tip out of the water (on `ground` from here)
    awash: 1.5      # s it lies awash along the lane after the impact (hittable)
    sink: 0.6       # s it sinks back under the water (`sub`)
    damage: heavy   # the impact, once per slam, on the ship and Rook in the lane; a convoy ship there takes a hit
    splash: {count: 6, speed: 120, bullet: small}   # bullets from along the arm, out to either side in turn
    choose: alternate   # the ship's lane and the lane of the convoy ship nearest the ship's x in turn (only lanes whose root lives)
    volley: 2       # lanes a phase-3 volley slams (round 40, four rooted arms: the ship's lane and a convoy ship's; hard's hook 3)
  phases:
    - name: Arms
      until: {parts: [root 1, root 2, root 3, root 4], left: 2, seconds: 25}   # two roots cut, or 25 s
      slamming: chain   # one at a time: the next telegraph when the arm has sunk
      delay: 1          # s from the halt to the first telegraph
    - name: Head up
      until: {parts: [head], below: 0.4}
      surface: {part: head, rise: 2, open: 8, dive: 1.5, glow: 0.8}
      attacks: [beak-fan]
      slamming: after_dive
      release: {enemy: driftjelly, count: 6, formation: field, lanes: [1, 4], on: first-surface}
    - name: Living roots
      until: {parts: [head], left: 0}
      surface: {part: head, rise: 2, stay: true, glow: 0.8}
      attacks: [beak-fan]
      slamming: {mode: volley, every: 4}   # the living roots: the ship's lane and a ship's lane
      delay: 1          # s from the phase's start to its first volley
      drop: shield cell
notes:
  layer: ' (the sea''s surface); each part''s **current layer**: `sub` while submerged, `ground` while surfaced; the slam arms are `ground` from their rise until they sink; the four roots always `ground` (round 40)'
  size: '(the grip overlay and the head: the mantle with the arm roots ≈ 250 px long, 130 px wide); the hitbox is Platform Tiamat''s deck (a backdrop piece; no armour: shots fly over it)'
  parts: 'head/mantle (`vital`; the lime eyes a weak spot on it, ×2 while open), four arm roots (`destroyable`, `ground`, one over each lane at the mantle''s rim; each root''s slam arm a runtime chain of 13 segments, E7 = a, round 40), the gripping arms (a drawn overlay on the platform)'
  orientation: (slam-arm segments; the head pre-rendered surfacing frames)
  hp: head 3,400 (×0.5 on the mantle, ×2 on the open eyes; round 40 re-measured from the proposal's 1,400 to keep the ≈ 60 s fight, E6 = a); root 200 each (×2 while its arm is raised); total
  speed: (anchored)
  movement: 'anchored: it scrolls in with the platform (invulnerable, without its bar) and engages when the scroll halts, the platform''s centre at y {movement.anchored.y}; the head surfaces and dives, the rooted arms slam (see *Phases* and *Lanes and slams*)'
  attack_prefix: 'see *Phases*; the slams: telegraph {boss.slam.telegraph} s, rise {boss.slam.rise} s, impact `heavy` = 10 on the ship and Rook in the lane plus 6 `small` splash bullets ({boss.slam.splash.speed} px/s), awash {boss.slam.awash} s, sink {boss.slam.sink} s; '
  formations: (a Driftjelly field released in the arena)
  weak_points: (only while open)
  bounty: ' (roots 25 each, head 200; paid × 1.6 × Level 11''s `bounty_scale` of 0.43: 207, 15 % of budget(11) = 1,377)'
  death: '`huge` water-surface variant: the head sinks in a churning foam ring, the gripping arms slide off the platform, spray, credit shower'
  used_in: mid-boss of L11 only
  difficulty: 'hard: lane telegraph 1.1 s; phase 3 slams three lanes'
