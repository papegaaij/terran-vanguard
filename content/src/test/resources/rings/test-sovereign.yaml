# exposed in the last phase), the outer ring (radius 200, 6°/s clockwise) with 6 SAM batteries, the middle ring (140,
# 10°/s counter-clockwise) with 4 rail batteries, the inner ring (85) stepping 120° in 4 s, holding 4 s (tell 0.4 s)
# with 3 laser batteries; the batteries' attacks taken from the SAM Nest, the Rail Bunker and the Sentinel Tower.
